}

function phaseTransitionForDay(dayId) {
  const phase = phaseForDay(dayId);
  if (!phase || Number(dayId) !== phase.endDay) return null;
  const next = COURSE_PHASES.find(item => item.id === phase.id + 1) || null;
  return { phase, next };
}

function todayKey(date = new Date(), timeZone) {
  const formatter = new Intl.DateTimeFormat('en-US', {
    year: 'numeric', month: '2-digit', day: '2-digit', ...(timeZone ? { timeZone } : {})
  });
  const parts = Object.fromEntries(formatter.formatToParts(date).filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function keyToUtcMs(key) {
  const [y, m, d] = key.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function daysBetweenKeys(a, b) {
  if (!a || !b) return 0;
  return Math.round((keyToUtcMs(b) - keyToUtcMs(a)) / DAY_MS);
}

function markStudyActivity(state, now = new Date()) {
  const key = todayKey(now);
  const dates = new Set(state.activityDates || []);
  dates.add(key);
  state.activityDates = [...dates].sort();
  state.lastStudyDate = key;
  state.longestStreak = Math.max(Number(state.longestStreak || 0), calculateLongestStreak(state.activityDates));
  return key;
}

function calendarStatus(state, now = new Date()) {
  const today = todayKey(now);
  const dates = [...new Set(state.activityDates || state.dailyHistory?.map(x => x.date) || [])].sort();
  const lastStudyDate = state.lastStudyDate || dates.at(-1) || null;
  const gap = lastStudyDate ? Math.max(0, daysBetweenKeys(lastStudyDate, today)) : 0;
  const studiedToday = dates.includes(today);
  const daysMissed = lastStudyDate && !studiedToday ? Math.max(0, gap - 1) : 0;
  return {
    today,
    studiedToday,
    lastStudyDate,
    daysMissed,
    currentStreak: calculateCurrentStreak(dates, today),
    longestStreak: Math.max(Number(state.longestStreak || 0), calculateLongestStreak(dates))
  };
}

function calculateCurrentStreak(dates, today) {
  const unique = [...new Set(dates)].sort();
  if (!unique.length) return 0;
  const set = new Set(unique);
  let cursor = today;
  if (!set.has(cursor)) {
    const yesterday = shiftKey(today, -1);
    if (!set.has(yesterday)) return 0;
    cursor = yesterday;
  }
  let count = 0;
  while (set.has(cursor)) {
    count++;
    cursor = shiftKey(cursor, -1);
  }
  return count;
}

function calculateLongestStreak(dates) {
  const unique = [...new Set(dates)].sort();
  if (!unique.length) return 0;
  let longest = 1;
  let current = 1;
  for (let i = 1; i < unique.length; i++) {
    if (daysBetweenKeys(unique[i - 1], unique[i]) === 1) current++;
    else current = 1;
    longest = Math.max(longest, current);
  }
  return longest;
}

function shiftKey(key, amount) {
  const ms = keyToUtcMs(key) + amount * DAY_MS;
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
}

function nextUnlockedDay(state) {
  const completed = new Set(state.completedDays);
  return curriculum.find(day => !completed.has(day.id))?.id ?? curriculum.length;
}

function isDayUnlocked(dayId, state) {
  if (dayId === 1) return true;
  return state.completedDays.includes(dayId - 1) || state.completedDays.includes(dayId);
}

function defaultSkillSchedule(dueAt = null) {
  return {
    stabilityDays: 1,
    difficulty: 0.35,
    successfulReviews: 0,
    successfulReviewDays: [],
    lapses: 0,
    lastReviewedAt: null,
    dueAt
  };
}

function getPhraseProgress(state, phraseId) {
  const existing = state.phraseProgress[phraseId];
  const base = {
    phraseId,
    seen: false,
    firstSeenAt: null,
    stage: 0,
    dueAt: null,
    repetitions: 0,
    mistakes: 0,
    reading: 0,
    listening: 0,
    production: 0,
    lastReviewedAt: null,
    reviewDays: [],
    skillSchedule: null,
    consecutiveMistakes: 0,
    consecutiveCorrect: 0,
    recoveryCount: 0,
    recoverySuccesses: 0,
    lastOutcome: null,
    hardSince: null,
    nearMisses: 0,
    nearMissFocusCounts: {},
    nearMissHistory: [],
    nearMissRecoveryStreak: {},
    lastNearMissFocus: null
  };
  if (!existing) return base;
  const merged = { ...base, ...existing };
  if (!merged.skillSchedule) {
    merged.skillSchedule = Object.fromEntries(SKILLS.map(skill => [skill, defaultSkillSchedule(existing.dueAt || null)]));
  } else {
    merged.skillSchedule = Object.fromEntries(SKILLS.map(skill => {
      const rawSkill = merged.skillSchedule[skill] || {};
      const legacyReviewedDay = rawSkill.lastReviewedAt ? dateKeyFromIso(rawSkill.lastReviewedAt) : null;
      const explicitDays = Array.isArray(rawSkill.successfulReviewDays) ? rawSkill.successfulReviewDays.filter(isDateKey) : [];
      const successfulReviewDays = [...new Set(explicitDays.length ? explicitDays : (Number(rawSkill.successfulReviews || 0) > 0 && legacyReviewedDay ? [legacyReviewedDay] : []))].sort();
      return [skill, {
        ...defaultSkillSchedule(existing.dueAt || null),
        ...rawSkill,
        successfulReviewDays,
        successfulReviews: successfulReviewDays.length
      }];
    }));
  }
  return merged;
}

function skillDue(progress, skill) {
  return progress.skillSchedule?.[skill]?.dueAt || progress.dueAt || null;
}

function refreshPhraseDue(progress) {
  const dues = SKILLS.map(skill => skillDue(progress, skill)).filter(Boolean).map(x => new Date(x).getTime()).filter(Number.isFinite);
  progress.dueAt = dues.length ? new Date(Math.min(...dues)).toISOString() : null;
  return progress;
}

function dueReviews(state, now = new Date()) {
  return allPhrases
    .filter(phrase => {
      const progress = getPhraseProgress(state, phrase.id);
      return progress.seen && progress.dueAt && new Date(progress.dueAt) <= now;
    })
    .sort((a, b) => reviewPriority(getPhraseProgress(state, b.id), now) - reviewPriority(getPhraseProgress(state, a.id), now));
}

function reviewPriority(progress, now) {
  const dueSkills = SKILLS.map(skill => ({ skill, due: skillDue(progress, skill), value: progress[skill] || 0 }))
    .filter(x => x.due && new Date(x.due) <= now);
  const overdueDays = dueSkills.length ? Math.max(...dueSkills.map(x => Math.max(0, (now - new Date(x.due)) / DAY_MS))) : 0;
  const weakest = Math.min(...SKILLS.map(skill => progress[skill] || 0));
  const lapseRate = progress.repetitions ? progress.mistakes / progress.repetitions : 0;
  return overdueDays * 4 + (1 - weakest) * 3 + lapseRate * 2;
}

function difficultyScore(progress) {
  const p = progress || {};
  const reps = Math.max(0, Number(p.repetitions || 0));
  const mistakes = Math.max(0, Number(p.mistakes || 0));
  const nearMisses = Math.max(0, Number(p.nearMisses || 0));
  const lapseRate = reps ? (mistakes + nearMisses * 0.4) / reps : 0;
  const weakest = Math.min(...SKILLS.map(skill => Number(p[skill] || 0)));
  const skillDifficulties = SKILLS.map(skill => Number(p.skillSchedule?.[skill]?.difficulty ?? 0.35));
  const scheduleDifficulty = skillDifficulties.reduce((a, b) => a + b, 0) / skillDifficulties.length;
  const streakPenalty = Math.min(1, Number(p.consecutiveMistakes || 0) / 2);
  return clamp(lapseRate * 0.4 + (1 - weakest) * 0.25 + scheduleDifficulty * 0.22 + streakPenalty * 0.13, 0, 1);
}

function isDifficultPhrase(progress) {
  const p = progress || {};
  const reps = Number(p.repetitions || 0);
  if (reps < 2) return false;
  const lapseRate = (Number(p.mistakes || 0) + Number(p.nearMisses || 0) * 0.4) / Math.max(1, reps);
  const weakest = Math.min(...SKILLS.map(skill => Number(p[skill] || 0)));
  const maxLapses = Math.max(...SKILLS.map(skill => Number(p.skillSchedule?.[skill]?.lapses || 0)));
  const attemptedSkills = SKILLS.filter(skill => p.skillSchedule?.[skill]?.lastReviewedAt || Number(p[skill] || 0) > 0);
  const weakestAttempted = attemptedSkills.length ? Math.min(...attemptedSkills.map(skill => Number(p[skill] || 0))) : 1;
  const struggleEvidence = Number(p.mistakes || 0) > 0 || Number(p.nearMisses || 0) > 0 || maxLapses > 0 || Number(p.consecutiveMistakes || 0) > 0;
  return Number(p.consecutiveMistakes || 0) >= 2 ||
    (reps >= 3 && lapseRate >= 0.35) ||
    (struggleEvidence && attemptedSkills.length >= 2 && reps >= 5 && weakestAttempted < 0.28) ||
    maxLapses >= 2 ||
    (reps >= 4 && struggleEvidence && difficultyScore(p) >= 0.68);
}

function difficultPhrases(state) {
  return allPhrases
    .filter(phrase => {
      const progress = getPhraseProgress(state, phrase.id);
      return progress.seen && isDifficultPhrase(progress);
    })
    .sort((a, b) => difficultyScore(getPhraseProgress(state, b.id)) - difficultyScore(getPhraseProgress(state, a.id)));
}

function hardPracticePhrases(state, now = new Date(), limit = 6) {
  const today = todayKey(now);
  const dueIds = new Set(dueReviews(state, now).map(p => p.id));
  return difficultPhrases(state)
    .filter(phrase => {
      const progress = getPhraseProgress(state, phrase.id);
      const lastDay = progress.lastReviewedAt ? todayKey(new Date(progress.lastReviewedAt)) : null;
      return !dueIds.has(phrase.id) && lastDay !== today;
    })
    .slice(0, limit);
}


function patternFamilyProgress(state) {
  const groups = new Map();
  for (const phrase of allPhrases) {
    if (!isReusablePattern(phrase.pattern)) continue;
    if (!groups.has(phrase.pattern)) groups.set(phrase.pattern, []);
    groups.get(phrase.pattern).push(phrase);
  }

  return [...groups.entries()].map(([pattern, phrases]) => {
    const meta = familyMeta(pattern);
    const seen = phrases.filter(phrase => getPhraseProgress(state, phrase.id).seen);
    const mastered = seen.filter(phrase => isMastered(getPhraseProgress(state, phrase.id))).length;
    const avgMastery = seen.length
      ? seen.reduce((sum, phrase) => sum + mastery(getPhraseProgress(state, phrase.id)), 0) / seen.length
      : 0;
    const discovered = seen.length >= 2;
    const status = !discovered ? 'locked' : seen.length >= 4 && avgMastery >= 0.62 ? 'strong' : avgMastery >= 0.32 ? 'learning' : 'new';
    return {
      pattern,
      title: meta?.title || pattern,
      meaning: meta?.meaning || '',
      prompt: meta?.prompt || '',
      priority: Number(meta?.priority || 0),
      total: phrases.length,
      seen: seen.length,
      mastered,
      avgMastery,
      discovered,
      status,
      examples: seen.slice(0, 4).map(phrase => phrase.id),
      transfer: getFamilyTransferProgress(state, pattern),
      transferStatus: transferStatus(getFamilyTransferProgress(state, pattern))
    };
  }).sort((a, b) => {
    if (a.discovered !== b.discovered) return a.discovered ? -1 : 1;
    if (b.seen !== a.seen) return b.seen - a.seen;
    if (b.priority !== a.priority) return b.priority - a.priority;
    return a.title.localeCompare(b.title);
  });
}

function discoveredPatternFamilies(state) {
  return patternFamilyProgress(state).filter(family => family.discovered);
}


function getFamilyTransferProgress(state, pattern) {
  const current = state.familyTransfers?.[pattern] || {};
  return {
    pattern,
    attempts: Number(current.attempts || 0),
    remembered: Number(current.remembered || 0),
    almost: Number(current.almost || 0),
    forgot: Number(current.forgot || 0),
    lastPracticedDate: current.lastPracticedDate || null,
    lastRating: current.lastRating || null,
    usedVariantIds: Array.isArray(current.usedVariantIds) ? [...new Set(current.usedVariantIds)] : []
  };
}

function transferStatus(progress) {
  const attempts = Number(progress.attempts || 0);
  const remembered = Number(progress.remembered || 0);
  const effective = remembered + Number(progress.almost || 0) * 0.45;
  const rate = attempts ? effective / attempts : 0;
  if (!attempts) return 'untested';
  if (attempts >= 2 && remembered >= 2 && rate >= 0.62) return 'proven';
  return 'building';
}

function transferablePatternFamilies(state, now = new Date()) {
  const today = todayKey(now);
  return patternFamilyProgress(state)
    .filter(family => family.discovered && family.seen >= 3 && family.avgMastery >= 0.18 && familyVariations(family.pattern).length)
    .map(family => {
      const transfer = getFamilyTransferProgress(state, family.pattern);
      return { ...family, transfer, transferStatus: transferStatus(transfer) };
    })
    .filter(family => family.transfer.lastPracticedDate !== today)
    .sort((a, b) => {
      if (a.transfer.attempts !== b.transfer.attempts) return a.transfer.attempts - b.transfer.attempts;
      if (a.transferStatus !== b.transferStatus) return a.transferStatus === 'untested' ? -1 : 1;
      if (b.priority !== a.priority) return b.priority - a.priority;
      return b.avgMastery - a.avgMastery;
    });
}

function nextVariationForFamily(state, family) {
  const bank = familyVariations(family.pattern);
  if (!bank.length) return null;
  const transfer = getFamilyTransferProgress(state, family.pattern);
  const used = new Set(transfer.usedVariantIds);
  const fresh = bank.find(variation => !used.has(variation.id));
  const variation = fresh || bank[transfer.attempts % bank.length];
  return variation ? {
    type: 'variation',
    pattern: family.pattern,
    familyTitle: family.title,
    variationId: variation.id,
    english: variation.english,
    portuguese: variation.portuguese,
    situation: variation.situation
  } : null;
}

function buildFamilyVariationItems(state, now = new Date(), limit = 2) {
  return transferablePatternFamilies(state, now)
    .slice(0, Math.max(0, limit))
    .map(family => nextVariationForFamily(state, family))
    .filter(Boolean);
}

function recordVariation(state, item, rating, now = new Date()) {
  if (!item || item.type !== 'variation' || !item.pattern || !item.variationId) return null;
  if (!['remembered','almost','forgot'].includes(rating)) return null;
  markStudyActivity(state, now);
  if (!state.familyTransfers || typeof state.familyTransfers !== 'object') state.familyTransfers = {};
  const current = getFamilyTransferProgress(state, item.pattern);
  const updated = {
    ...current,
    attempts: current.attempts + 1,
    remembered: current.remembered + (rating === 'remembered' ? 1 : 0),
    almost: current.almost + (rating === 'almost' ? 1 : 0),
    forgot: current.forgot + (rating === 'forgot' ? 1 : 0),
    lastPracticedDate: todayKey(now),
    lastRating: rating,
    usedVariantIds: [...new Set([...current.usedVariantIds, item.variationId])].slice(-12)
  };
  state.familyTransfers[item.pattern] = updated;
  state.xp += rating === 'remembered' ? 6 : rating === 'almost' ? 3 : 1;
  return { ...updated, transferStatus: transferStatus(updated) };
}

function patternDiscoveryForBlock(block, usedPatterns = new Set()) {
  const groups = new Map();
  for (const phrase of block) {
    if (!isReusablePattern(phrase.pattern) || usedPatterns.has(phrase.pattern)) continue;
    if (!groups.has(phrase.pattern)) groups.set(phrase.pattern, []);
    groups.get(phrase.pattern).push(phrase);
  }
  const candidates = [...groups.entries()]
    .filter(([, phrases]) => phrases.length >= 3)
    .map(([pattern, phrases]) => ({ pattern, phrases, meta: familyMeta(pattern) }))
    .sort((a, b) => b.phrases.length - a.phrases.length || Number(b.meta?.priority || 0) - Number(a.meta?.priority || 0));
  const best = candidates[0];
  if (!best) return null;
  return {
    type: 'pattern',
    pattern: best.pattern,
    title: best.meta.title,
    meaning: best.meta.meaning,
    prompt: best.meta.prompt,
    phraseIds: best.phrases.slice(0, 4).map(phrase => phrase.id)
  };
}

function recentLearningSignal(state, limit = 4) {
  const history = (Array.isArray(state?.dailyHistory) ? state.dailyHistory : []).filter(Boolean).slice(-Math.max(1, limit));
  const totals = { attempts: 0, correct: 0, almost: 0, wrong: 0 };
  const skills = Object.fromEntries(SKILLS.map(skill => [skill, { weighted: 0, weight: 0, score: null }]));

  history.forEach((entry, index) => {
    const recencyWeight = (index + 1) / history.length;
    const attempts = Number(entry.correct || 0) + Number(entry.almost || 0) + Number(entry.wrong || 0);
    totals.attempts += attempts;
    totals.correct += Number(entry.correct || 0);
    totals.almost += Number(entry.almost || 0);
    totals.wrong += Number(entry.wrong || 0);
    for (const skill of SKILLS) {
      const summary = entry.skillSummary?.[skill];
      if (!summary || !Number.isFinite(Number(summary.score)) || Number(summary.attempts || 0) <= 0) continue;
      const weight = Math.max(1, Number(summary.attempts || 0)) * recencyWeight;
      skills[skill].weighted += Number(summary.score) / 100 * weight;
      skills[skill].weight += weight;
    }
  });

  for (const skill of SKILLS) {
    skills[skill].score = skills[skill].weight ? skills[skill].weighted / skills[skill].weight : null;
  }
  const overall = totals.attempts ? (totals.correct + totals.almost * 0.5) / totals.attempts : null;
  return { overall, totals, skills, sessions: history.length };
}

function adaptiveSessionProfile(state, now = new Date()) {
  const seen = allPhrases.filter(phrase => getPhraseProgress(state, phrase.id).seen);
  const recent = recentLearningSignal(state, 4);
  const skillProfiles = {};

  for (const skill of SKILLS) {
    let scoreSum = 0;
    let scored = 0;
    let due = 0;
    let weak = 0;
    let recurring = 0;
    for (const phrase of seen) {
      const progress = getPhraseProgress(state, phrase.id);
      const value = Number(progress[skill] || 0);
      scoreSum += value;
      scored++;
      if (value < 0.45) weak++;
      const skillDate = skillDue(progress, skill);
      if (skillDate && new Date(skillDate) <= now) due++;
      if (recurringNearMissPattern(progress, skill)) recurring++;
    }
    const average = scored ? scoreSum / scored : 0;
    const recentScore = recent.skills[skill].score;
    const duePressure = Math.min(1, due / Math.max(8, Math.round(seen.length * 0.18) || 8));
    const weakPressure = Math.min(1, weak / Math.max(8, Math.round(seen.length * 0.22) || 8));
    const recurringPressure = Math.min(1, recurring / 4);
    const recentPressure = recentScore == null ? 0.35 : 1 - recentScore;
    const need = seen.length < 6
      ? (skill === 'production' ? 0.58 : skill === 'listening' ? 0.52 : 0.42)
      : clamp((1 - average) * 0.34 + duePressure * 0.25 + weakPressure * 0.15 + recurringPressure * 0.16 + recentPressure * 0.10, 0, 1);
    skillProfiles[skill] = { skill, average, due, weak, recurring, recentScore, need };
  }

  const ordered = Object.values(skillProfiles).sort((a, b) => b.need - a.need);
  const focus = ordered[0] || skillProfiles.production;
  const labels = { reading: 'Leitura', listening: 'Listening', production: 'Produção' };
  const reasons = [];
  if (focus.recurring) reasons.push(`${focus.recurring} ${focus.recurring === 1 ? 'dificuldade recorrente' : 'dificuldades recorrentes'}`);
  if (focus.due) reasons.push(`${focus.due} revisões dessa habilidade vencidas`);
  if (focus.recentScore != null && focus.recentScore < 0.72) reasons.push(`desempenho recente de ${Math.round(focus.recentScore * 100)}%`);
  if (!reasons.length && !seen.length) reasons.push(focus.skill === 'production' ? 'prioridade inicial para recuperar frases sem depender de pistas' : 'prioridade inicial da jornada');
  if (!reasons.length && focus.average < 0.62) reasons.push(`base atual em ${Math.round(focus.average * 100)}%`);
  if (!reasons.length) reasons.push('é a habilidade com maior espaço para consolidar');

  const recurringTotal = Object.values(skillProfiles).reduce((sum, item) => sum + item.recurring, 0);
  return {
    focusSkill: focus.skill,
    focusLabel: labels[focus.skill],
    focusNeed: focus.need,
    focusReason: reasons.slice(0, 2).join(' · '),
    skillProfiles,
    recent,
    recurringTotal,
    seenCount: seen.length
  };
}

function isOptionalPracticeMode(mode) {
  return ['hard-practice','free-review'].includes(mode);
}

function primarySessionCompletedToday(state, now = new Date()) {
  const today = todayKey(now);
  return (Array.isArray(state?.dailyHistory) ? state.dailyHistory : [])
    .some(entry => entry?.date === today && !isOptionalPracticeMode(entry?.mode));
}

function freeReviewSessionsToday(state, now = new Date()) {
  const today = todayKey(now);
  return (Array.isArray(state?.dailyHistory) ? state.dailyHistory : [])
    .filter(entry => entry?.date === today && entry?.mode === 'free-review').length;
}

function dailyNewLoad(state, now = new Date()) {
  const date = todayKey(now);
  // Conta a data real da primeira exposição de cada frase. Assim uma sessão que
  // começou ontem e terminou hoje não joga todas as frases no orçamento de hoje.
  const introduced = allPhrases.reduce((sum, phrase) => {
    const progress = getPhraseProgress(state, phrase.id);
    const firstDay = progress.firstSeenAt ? dateKeyFromIso(progress.firstSeenAt) : null;
    return sum + (progress.seen && firstDay === date ? 1 : 0);
  }, 0);
  const entries = (Array.isArray(state?.dailyHistory) ? state.dailyHistory : [])
    .filter(entry => !isOptionalPracticeMode(entry?.mode) && (entry?.newGoalDate || entry?.date) === date);
  const caps = entries.map(entry => Number(entry?.newGoal)).filter(Number.isFinite).map(value => clamp(value, 0, 40));
  const lockedCap = caps.length ? Math.min(...caps) : null;
  return { date, introduced, lockedCap };
}

function adaptiveNewPhraseGoal(state, now = new Date(), profile = adaptiveSessionProfile(state, now), reviewLoad = reviewPressure(state, now)) {
  const due = reviewLoad.count;
  const pressure = reviewLoad.pressure;
  const hard = difficultPhrases(state).length;
  const calendar = calendarStatus(state, now);
  let goal = 40;
  const reasons = [];

  // V0.9.6 — não reduzimos conteúdo novo só porque muitas frases acabaram de vencer.
  // A pressão pondera atraso, dificuldade e estabilidade: uma revisão forte recém-vencida
  // pesa menos que uma frase frágil, recorrente ou vários dias atrasada.
  if (pressure >= 150) { goal = 0; reasons.push('pressão crítica de revisão'); }
  else if (pressure >= 115) { goal = 10; reasons.push('pressão muito alta de revisão'); }
  else if (pressure >= 80) { goal = 20; reasons.push('memória pedindo mais consolidação'); }
  else if (pressure >= 50) { goal = 30; reasons.push('revisões relevantes acima do ritmo normal'); }

  if (hard >= 30 && goal > 10) { goal = 10; reasons.push('muitas frases difíceis'); }
  else if (hard >= 20 && goal > 20) { goal = 20; reasons.push('frases difíceis acumuladas'); }
  else if (hard >= 12 && goal > 30) { goal = 30; reasons.push('reforço necessário'); }

  if (calendar.daysMissed >= 7 && goal > 0) { goal = 0; reasons.push('retomada após pausa longa'); }
  else if (calendar.daysMissed >= 4 && goal > 10) { goal = 10; reasons.push('retomada gradual'); }
  else if (calendar.daysMissed >= 2 && goal > 20) { goal = 20; reasons.push('ritmo sendo recuperado'); }
  else if (calendar.daysMissed >= 1 && goal > 30) { goal = 30; reasons.push('um dia fora do ritmo'); }

  const recent = profile?.recent?.overall;
  if (recent != null && recent < 0.55 && goal > 20) { goal = 20; reasons.push('retenção recente pediu menos conteúdo novo'); }
  else if (recent != null && recent < 0.68 && goal > 30) { goal = 30; reasons.push('retenção recente ainda instável'); }

  if (profile?.recurringTotal >= 12 && goal > 20) { goal = 20; reasons.push('erros recorrentes em consolidação'); }
  else if (profile?.recurringTotal >= 6 && goal > 30) { goal = 30; reasons.push('alguns erros recorrentes ativos'); }

  return { goal, reason: reasons[0] || 'memória em dia para avançar', reasons };
}

function adaptiveReviewPriority(progress, now, focusSkill = null) {
  let score = reviewPriority(progress, now);
  if (!focusSkill || !SKILLS.includes(focusSkill)) return score;
  const due = skillDue(progress, focusSkill);
  if (due && new Date(due) <= now) score += 3.2;
  score += (1 - Number(progress[focusSkill] || 0)) * 2.2;
  if (recurringNearMissPattern(progress, focusSkill)) score += 3.4;
  return score;
}

function adaptiveReviewQueue(state, now = new Date(), focusSkill = null) {
  return dueReviews(state, now).sort((a, b) =>
    adaptiveReviewPriority(getPhraseProgress(state, b.id), now, focusSkill) -
    adaptiveReviewPriority(getPhraseProgress(state, a.id), now, focusSkill)
  );
}


// V0.9.6 — carga de revisão ponderada. Contagem bruta fazia frases fortes recém-vencidas
// travarem o avanço como se fossem lapsos urgentes. O motor agora mede necessidade real.
function reviewLoadWeight(progress, now = new Date()) {
  if (!progress?.seen || !progress.dueAt || new Date(progress.dueAt) > now) return 0;
  const overdueDays = Math.max(0, (now - new Date(progress.dueAt)) / DAY_MS);
  const memory = mastery(progress);
  let weight = memory >= 0.76 ? 0.28 : memory >= 0.58 ? 0.38 : memory >= 0.35 ? 0.55 : 0.78;
  if (overdueDays >= 7) weight = Math.max(weight, 1.30);
  else if (overdueDays >= 4) weight = Math.max(weight, 1.05);
  else if (overdueDays >= 2) weight += 0.22;
  if (isDifficultPhrase(progress)) weight += 0.32;
  if (SKILLS.some(skill => recurringNearMissPattern(progress, skill))) weight += 0.24;
  return clamp(weight, 0.20, 1.60);
}

function reviewPressure(state, now = new Date()) {
  const due = dueReviews(state, now);
  let pressure = 0;
  let urgent = 0;
  for (const phrase of due) {
    const weight = reviewLoadWeight(getPhraseProgress(state, phrase.id), now);
    pressure += weight;
    if (weight >= 0.95) urgent++;
  }
  return { count: due.length, pressure: Number(pressure.toFixed(1)), urgent };
}

function sessionPlan(state, dayId = nextUnlockedDay(state), now = new Date()) {
  const day = curriculum.find(item => item.id === dayId);
  const reviewLoad = reviewPressure(state, now);
  const due = reviewLoad.count;
  const pressure = reviewLoad.pressure;
  const calendar = calendarStatus(state, now);
  const baseAdaptation = adaptiveSessionProfile(state, now);
  const handoff = activeNextSessionBrief(state, now);
  const handoffLabels = { reading:'Leitura', listening:'Listening', production:'Produção' };
  const adaptation = handoff && handoff.mode !== 'advance' && SKILLS.includes(handoff.focusSkill)
    ? { ...baseAdaptation, focusSkill:handoff.focusSkill, focusLabel:handoffLabels[handoff.focusSkill], focusReason:`continuidade da última sessão · ${handoff.reason}` }
    : baseAdaptation;
  const dayLoad = dailyNewLoad(state, now);
  if (!day) return { newGoal: 0, due, reviewCount: 0, reviewCap: 0, hardCount: 0, hardLimit: 0, estimatedMinutes: 0, remaining: 0, mode: 'normal', calendar, adaptation, dayLoad };
  const remaining = day.phrases.filter(p => !getPhraseProgress(state, p.id).seen).length;
  const newDecision = adaptiveNewPhraseGoal(state, now, adaptation, reviewLoad);
  const dailyCap = dayLoad.lockedCap == null ? newDecision.goal : Math.min(dayLoad.lockedCap, newDecision.goal);
  const availableNewToday = Math.max(0, dailyCap - dayLoad.introduced);
  const newGoal = Math.min(availableNewToday, remaining);
  const dailyCapReached = dayLoad.lockedCap != null && remaining > 0 && availableNewToday <= 0;
  const difficultCount = difficultPhrases(state).length;
  const mode = dailyCapReached
    ? 'daily-complete'
    : newGoal === 0 && remaining > 0 && (pressure >= 80 || calendar.daysMissed >= 7 || difficultCount >= 30)
      ? 'consolidation'
      : calendar.daysMissed >= 2 || pressure > 40 ? 'recovery'
        : calendar.daysMissed === 1 || pressure > 22 ? 'catchup'
          : 'normal';

  // Quando o motor corta frases novas, o tempo liberado vira capacidade de revisão.
  // Isso evita ciclos em que a fila cresce mesmo durante dias de consolidação.
  const reviewCap = mode === 'consolidation' ? 90 : mode === 'recovery' ? 75 : mode === 'catchup' ? 60 : 48;
  const reviewCount = Math.min(due, reviewCap);
  const hardLimit = mode === 'consolidation' ? 6 : mode === 'recovery' ? 5 : 4;
  const hardCount = hardPracticePhrases(state, now, hardLimit).length;
  const blockCount = newGoal ? Math.ceil(newGoal / BLOCK_SIZE) : 0;
  const rawMinutes = newGoal * 0.42 + reviewCount * 0.16 + hardCount * 0.22 + blockCount * 0.55;
  const estimatedMinutes = rawMinutes > 0 ? Math.max(5, Math.round(rawMinutes)) : 0;
  const loadLabel = mode === 'daily-complete' ? 'META DO DIA' : mode === 'consolidation' ? 'CONSOLIDAR' : mode === 'recovery' ? 'RETOMAR' : mode === 'catchup' ? 'EQUILIBRAR' : 'AVANÇAR';
  const dailyReason = dailyCapReached
    ? `teto de ${dailyCap} ${dailyCap === 1 ? 'frase nova' : 'frases novas'} já concluído hoje`
    : newDecision.reason;
  return {
    newGoal, due, reviewCount, reviewCap, hardCount, hardLimit, estimatedMinutes, remaining, mode, calendar,
    adaptation, focusSkill: adaptation.focusSkill, focusLabel: adaptation.focusLabel, focusReason: adaptation.focusReason,
    newGoalReason: dailyReason, loadLabel,
    dailyNewCap: dailyCap, newIntroducedToday: dayLoad.introduced, dailyCapReached, dayLoad, handoff,
    reviewPressure: pressure, urgentReviewCount: reviewLoad.urgent
  };
}

function sessionBlockRhythm(dayId, blockIndex = 0) {
  const day = Math.max(1, Number(dayId || 1));
  const block = Math.max(0, Number(blockIndex || 0));
  // Nos três primeiros dias evitamos o foco mais agressivo de memória. Depois,
  // cinco ritmos se revezam para que blocos e dias não sigam sempre a mesma ordem.
  const pool = day <= 3 ? [0, 1, 2, 4] : [0, 1, 2, 3, 4];
  const start = (day * 2 - 2) % pool.length;
  const step = pool.length === 4 ? 1 : 2;
  const index = pool[(start + block * step) % pool.length];
  return { ...BLOCK_RHYTHMS[index] };
}

function adaptiveSessionBlockRhythm(dayId, blockIndex = 0, focusSkill = null) {
  const day = Math.max(1, Number(dayId || 1));
  const pools = {
    listening: ['ear', 'mixed', 'real', 'ear'],
    production: ['build', 'memory', 'real', 'build'],
    reading: ['real', 'mixed', 'build', 'real']
  };
  let ids = pools[focusSkill] || [];
  if (day <= 3) ids = ids.filter(id => id !== 'memory');
  if (!ids.length) return sessionBlockRhythm(dayId, blockIndex);
  const id = ids[Math.max(0, Number(blockIndex || 0)) % ids.length];
  return { ...(BLOCK_RHYTHMS.find(item => item.id === id) || sessionBlockRhythm(dayId, blockIndex)), adaptiveFocus: focusSkill };
}

function adaptiveDailyChallengeProfile(dayId, focusSkill = null) {
  if (focusSkill === 'listening') return { id: 'adaptive-ear', eyebrow: 'FOCO ADAPTATIVO · LISTENING', title: 'Feche pelo ouvido', body: 'O motor detectou que listening merece mais espaço hoje. Termine ouvindo antes de depender do texto.', types: ['listening', 'listening', 'production'] };
  if (focusSkill === 'production') return { id: 'adaptive-build', eyebrow: 'FOCO ADAPTATIVO · PRODUÇÃO', title: 'Feche recuperando', body: 'O fechamento exige mais recuperação mental para fortalecer a produção sem pistas.', types: ['production', 'context', 'production'] };
  if (focusSkill === 'reading') return { id: 'adaptive-meaning', eyebrow: 'FOCO ADAPTATIVO · LEITURA', title: 'Feche consolidando sentido', body: 'O fechamento reforça reconhecimento de significado antes de voltar à produção.', types: ['meaning', 'context', 'production'] };

    { id: 'real', eyebrow: 'VIDA REAL', title: 'Leve para uma situação', body: 'O fechamento prioriza contexto: entenda a situação e recupere a resposta útil.', types: ['context', 'production', 'listening'] }
  ];

function sessionExerciseMix(session) {
  const mix = { meaning: 0, production: 0, context: 0, cloze: 0, listening: 0, total: 0 };
  for (const item of session?.items || []) {
    if (!item || !['meaning','production','context','cloze','listening','recall','listening-recall'].includes(item.type)) continue;
    const type = item.type === 'recall' ? (item.sourceType || 'production') : item.type === 'listening-recall' ? 'listening' : item.type;
    if (type in mix) mix[type] += 1;
    mix.total += 1;
  }
  return mix;
}


// V0.9.1 — o plano deixa de ser estático depois que a sessão começa.
// O motor só altera itens que ainda não foram vistos e nunca aumenta o teto de novas.
function liveSessionSignal(session, windowSize = 8) {
  const rows = (session?.outcomes || []).filter(entry => entry && entry.reviewKind !== 'recovery').slice(-Math.max(4, windowSize));
  const skills = Object.fromEntries(SKILLS.map(skill => [skill, { attempts:0, points:0, score:null }]));
  let points = 0;
  let wrong = 0;
  let almost = 0;
  for (const entry of rows) {
    const value = entry.outcome === 'correct' ? 1 : entry.outcome === 'almost' ? 0.5 : 0;
    points += value;
    if (entry.outcome === 'wrong') wrong++;
    if (entry.outcome === 'almost') almost++;
    if (entry.skill && skills[entry.skill]) {
      skills[entry.skill].attempts++;
      skills[entry.skill].points += value;
    }
  }
  for (const data of Object.values(skills)) data.score = data.attempts ? data.points / data.attempts : null;
  const candidates = Object.entries(skills).filter(([,data]) => data.attempts >= 2 && data.score != null).sort((a,b) => a[1].score - b[1].score);
  const weakestSkill = candidates[0]?.[0] || session?.adaptiveFocus || 'production';
  return {
    attempts: rows.length,
    score: rows.length ? points / rows.length : null,
    wrong,
    almost,
    wrongRate: rows.length ? wrong / rows.length : 0,
    skills,
    weakestSkill
  };
}

function liveTargetType(mode, focusSkill, item, offset = 0) {
  if (mode === 'challenge') {
    if (focusSkill === 'listening') return offset % 3 === 2 ? 'production' : 'listening';
    if (focusSkill === 'reading') return offset % 3 === 2 ? 'production' : 'context';
    return offset % 3 === 2 ? 'listening' : 'production';
  }
  // Apoio sem abandonar a habilidade que está dando trabalho.
  if (focusSkill === 'listening') return offset % 3 === 2 ? 'meaning' : 'listening';
  if (focusSkill === 'reading') return offset % 3 === 2 ? 'listening' : 'meaning';
  return offset % 3 === 2 ? 'listening' : 'cloze';
}

function rebuildLiveExercise(session, appState, index, targetType, mode, focusSkill) {
  const old = session?.items?.[index];
  if (!old?.phraseId || !['immediate','mini','challenge'].includes(old.reviewKind)) return false;
  const phrase = getPhrase(old.phraseId);
  if (!phrase) return false;
  const isReview = old.reviewKind !== 'immediate';
  const rebuilt = makeExercise(phrase, appState, 9000 + index + Number(session.outcomes?.length || 0) * 13, isReview, targetType, old.reviewKind);
  const keep = {};
  for (const key of ['blockNumber','blockTotal','blockFocus','blockFocusLabel','blockFocusTitle','blockFocusDescription','blockIcon','challengeFocus']) {
    if (old[key] !== undefined) keep[key] = old[key];
  }
  session.items[index] = { ...rebuilt, ...keep, liveAdjustedMode: mode, liveAdjustedFocus: focusSkill };
  return true;
}

function retargetUpcomingExercises(session, appState, mode, focusSkill, limit = 8) {
  if (!session?.items?.length) return 0;
  let changed = 0;
  for (let i = session.index + 1; i < session.items.length && changed < limit; i++) {
    const item = session.items[i];
    if (!item?.phraseId || !['immediate','mini','challenge'].includes(item.reviewKind)) continue;
    // Desafio maior atua principalmente em revisões; não torna a apresentação de uma
    // frase recém-vista agressiva só porque o aluno começou bem.
    if (mode === 'challenge' && item.reviewKind === 'immediate') continue;
    const type = liveTargetType(mode, focusSkill, item, changed);
    if (rebuildLiveExercise(session, appState, i, type, mode, focusSkill)) changed++;
  }
  return changed;
}

function futureNewBlockNumbers(session) {
  const set = new Set();
  for (let i = session.index + 1; i < (session.items || []).length; i++) {
    const item = session.items[i];
    if (item?.type === 'intro' && Number(item.blockNumber)) set.add(Number(item.blockNumber));
  }
  return [...set].sort((a,b) => a-b);
}

function deferLastFutureBlock(session) {
  const future = futureNewBlockNumbers(session);
  if (!future.length) return null;
  const blockNumber = future.at(-1);
  const phraseIds = new Set((session.items || []).filter((item, index) => index > session.index && item?.type === 'intro' && Number(item.blockNumber) === blockNumber).map(item => item.phraseId));
  if (!phraseIds.size) return null;

  session.items = session.items.filter((item, index) => {
    if (index <= session.index) return true;
    if (Number(item?.blockNumber) === blockNumber) return false;
    if (item?.reviewKind === 'challenge' && phraseIds.has(item.phraseId)) return false;
    return true;
  });

  session.newCount = (session.items || []).filter(item => item?.type === 'intro').length;
  session.goal = Math.min(Number(session.goal ?? session.newCount), session.newCount);
  const remainingBlocks = [...new Set((session.items || []).filter(item => item?.type === 'intro' && Number(item.blockNumber)).map(item => Number(item.blockNumber)))].sort((a,b) => a-b);
  const blockTotal = Math.max(1, remainingBlocks.length);
  for (const item of session.items || []) {
    if (!Number(item?.blockNumber)) continue;
    item.blockTotal = blockTotal;
    if (item.type === 'checkpoint' && item.id?.startsWith('block-')) item.title = `${item.blockNumber}º bloco de ${blockTotal}`;
  }
  if (session.pacing) {
    session.pacing.stopPoints = blockTotal;
    session.pacing.challengeCount = (session.items || []).filter(item => item?.reviewKind === 'challenge').length;
  }
  session.estimatedMinutes = Math.max(5, Math.round(Number(session.newCount || 0) * .42 + Number(session.reviewCount || 0) * .16 + Number(session.hardCount || 0) * .22 + blockTotal * .55));
  return { blockNumber, phraseCount: phraseIds.size };
}

function applyLiveSessionAdaptation(session, appState) {
  if (!session || isOptionalPracticeMode(session.mode) || !Array.isArray(session.outcomes)) return null;
  const signal = liveSessionSignal(session, 8);
  if (signal.attempts < 6) return null;

  const live = session.liveAdaptation && typeof session.liveAdaptation === 'object'
    ? session.liveAdaptation
    : { mode:'steady', focusSkill:session.adaptiveFocus || 'production', changes:[], deferredBlocks:[], lastEvaluatedOutcome:0, lastLoadChangeOutcome:0 };
  const outcomeCount = session.outcomes.length;
  if (outcomeCount - Number(live.lastEvaluatedOutcome || 0) < 4) return live;
  live.lastEvaluatedOutcome = outcomeCount;

  let mode = 'steady';
  if (signal.score < 0.45 && signal.wrong >= 2) mode = 'slowdown';
  else if (signal.score < 0.68 || signal.wrongRate >= 0.30 || signal.almost + signal.wrong >= 3) mode = 'support';
  else if (signal.attempts >= 8 && signal.score >= 0.90 && signal.wrong === 0) mode = 'challenge';

  const focusSkill = signal.weakestSkill || session.adaptiveFocus || 'production';
  const labels = { reading:'Leitura', listening:'Listening', production:'Produção' };
  let detail = '';
  let loadChange = null;

  if (mode === 'slowdown') {
    retargetUpcomingExercises(session, appState, 'support', focusSkill, 10);
    if (outcomeCount - Number(live.lastLoadChangeOutcome || 0) >= 6) {
      loadChange = deferLastFutureBlock(session);
      if (loadChange) {
        live.lastLoadChangeOutcome = outcomeCount;
        live.deferredBlocks = [...new Set([...(live.deferredBlocks || []), loadChange.blockNumber])];
      }
    }
    detail = loadChange
      ? `Retenção recente em ${Math.round(signal.score * 100)}%. O bloco ${loadChange.blockNumber} foi adiado e as próximas questões terão mais apoio.`
      : `Retenção recente em ${Math.round(signal.score * 100)}%. O próximo trecho ganhou mais apoio em ${labels[focusSkill].toLowerCase()}.`;
  } else if (mode === 'support') {
    retargetUpcomingExercises(session, appState, mode, focusSkill, 8);
    detail = `Retenção recente em ${Math.round(signal.score * 100)}%. As próximas questões recebem mais apoio em ${labels[focusSkill].toLowerCase()}.`;
  } else if (mode === 'challenge') {
    retargetUpcomingExercises(session, appState, mode, focusSkill, 6);
    detail = `Retenção recente em ${Math.round(signal.score * 100)}%. Mantemos a carga e aumentamos a recuperação ativa nas próximas revisões.`;
  } else {
    detail = `Retenção recente em ${Math.round(signal.score * 100)}%. O plano atual continua adequado.`;
  }

  const changed = live.mode !== mode || live.focusSkill !== focusSkill || Boolean(loadChange);
  live.mode = mode;
  live.focusSkill = focusSkill;
  live.score = signal.score;
  live.reason = detail;
  live.changedAtOutcome = outcomeCount;
  live.changedAtIndex = session.index;
  live.lastSignal = { attempts:signal.attempts, score:signal.score, wrong:signal.wrong, almost:signal.almost };
  if (changed) {
    live.changes = [...(live.changes || []), { atOutcome:outcomeCount, mode, focusSkill, score:Number(signal.score.toFixed(3)), deferredBlock:loadChange?.blockNumber || null }].slice(-12);
  }
  session.liveAdaptation = live;
  return live;
}

function liveAdaptationBanner(session) {
  const live = session?.liveAdaptation;
  if (!live || !['support','slowdown','challenge'].includes(live.mode)) return '';
  if (Number(session.index || 0) - Number(live.changedAtIndex || 0) > 10) return '';
  const labels = { reading:'Leitura', listening:'Listening', production:'Produção' };
  const meta = live.mode === 'slowdown'
    ? ['RITMO REDUZIDO','↘',`${session.newCount || 0} novas`]
    : live.mode === 'support'
      ? ['APOIO AO VIVO','◎',labels[live.focusSkill] || 'Apoio']
      : ['DESAFIO AO VIVO','↗',labels[live.focusSkill] || 'Ativo'];
  return `<div class="live-adapt-strip ${live.mode}"><span>${meta[1]}</span><div><small>${meta[0]}</small><b>A sessão se ajustou ao que acabou de acontecer.</b><p>${escapeHtml(live.reason || '')}</p></div><em>${escapeHtml(meta[2])}</em></div>`;
}


// V0.9.2 — fecha a sessão confirmando apenas o que terminou instável.
function sessionClosureSignal(session) {
  const rows = (session?.outcomes || []).filter(entry => entry?.phraseId && !['recovery','exit'].includes(entry.reviewKind));
  if (rows.length < 6 || isOptionalPracticeMode(session?.mode)) return { needed:false, count:0, reason:'', focusSkill:session?.adaptiveFocus || 'production' };
  const recent = rows.slice(-6);
  const points = recent.reduce((sum, entry) => sum + (entry.outcome === 'correct' ? 1 : entry.outcome === 'almost' ? .5 : 0), 0);
  const recentScore = recent.length ? points / recent.length : 1;
  const recentWeak = recent.filter(entry => entry.outcome !== 'correct').length;
  const totalWrong = rows.filter(entry => entry.outcome === 'wrong').length;
  const totalAlmost = rows.filter(entry => entry.outcome === 'almost').length;
  const endingBadly = recentScore < .67 || recentWeak >= 3;
  const liveMode = session?.liveAdaptation?.mode || 'steady';
  const adaptedWeak = ['support','slowdown'].includes(liveMode);
  const uncertain = totalWrong + totalAlmost * .65;
  let count = 0;
  if (endingBadly || totalWrong >= 3 || liveMode === 'slowdown') count = 3;
  else if (uncertain >= 2 || adaptedWeak) count = 2;
  else if (totalWrong >= 1 || totalAlmost >= 2) count = 1;
  const skillRows = Object.entries(sessionSkillBreakdown(session)).filter(([,data]) => data.attempts > 0).sort((a,b) => (a[1].score ?? 100) - (b[1].score ?? 100));
  const focusSkill = skillRows[0]?.[0] || session?.adaptiveFocus || 'production';
  const reason = count === 3
    ? 'A sessão terminou com sinais de instabilidade. Vamos confirmar três pontos antes de encerrar.'
    : count === 2
      ? 'Houve alguns erros ou quase-acertos relevantes. Duas confirmações são suficientes.'
      : count === 1
        ? 'Só um ponto ficou pendente. Uma confirmação curta fecha a sessão.'
        : 'A sessão terminou estável; não é necessário adicionar confirmação.';
  return { needed:count > 0, count, reason, focusSkill, recentScore, totalWrong, totalAlmost };
}

function sessionClosureCandidates(session, appState, limit = 3) {
  // Recuperação bem-sucedida dentro da sessão reduz fortemente a prioridade:
  // o fechamento serve para pendências abertas, não para repetir algo recém-resolvido.
  const rows = (session?.outcomes || []).filter(entry => entry?.phraseId && entry.reviewKind !== 'exit');
  const byPhrase = new Map();
  rows.forEach((entry, index) => {
    const bucket = byPhrase.get(entry.phraseId) || { phraseId:entry.phraseId, score:0, lastOutcome:null, lastSkill:null, lastIndex:-1, recovered:false };
    if (entry.reviewKind === 'recovery') {
      bucket.score += entry.outcome === 'correct' ? -4.2 : entry.outcome === 'almost' ? -.8 : 2.2;
      if (entry.outcome === 'correct') bucket.recovered = true;
    } else {
      bucket.score += entry.outcome === 'wrong' ? 4 : entry.outcome === 'almost' ? 2.4 : -.45;
      bucket.lastOutcome = entry.outcome;
      bucket.recovered = false;
    }
    bucket.lastSkill = entry.skill || bucket.lastSkill;
    bucket.lastIndex = index;
    byPhrase.set(entry.phraseId, bucket);
  });
  const weakest = sessionClosureSignal(session).focusSkill;
  return [...byPhrase.values()].map(bucket => {
    const phrase = getPhrase(bucket.phraseId);
    if (!phrase) return null;
    const progress = getPhraseProgress(appState, bucket.phraseId);
    let score = bucket.score;
    if (!bucket.recovered && bucket.lastOutcome === 'wrong') score += 2.2;
    else if (!bucket.recovered && bucket.lastOutcome === 'almost') score += 1.2;
    score += difficultyScore(progress) * 1.5;
    if (bucket.lastSkill === weakest) score += .8;
    if (recurringNearMissPattern(progress, bucket.lastSkill || undefined)) score += 1.1;
    return { ...bucket, phrase, score };
  }).filter(item => item && item.score >= 1.6).sort((a,b) => b.score - a.score || b.lastIndex - a.lastIndex).slice(0, Math.max(0, limit));
}

function ensureSessionClosure(session, appState) {
  if (!session || session.closurePrepared) return false;
  session.closurePrepared = true;
  const signal = sessionClosureSignal(session);
  session.closureReason = signal.reason;
  session.closureFocusSkill = signal.focusSkill;
  if (!signal.needed) {
    session.closureCount = 0;
    return false;
  }
  const candidates = sessionClosureCandidates(session, appState, signal.count);
  if (!candidates.length) {
    session.closureCount = 0;
    return false;
  }
  session.closureCount = candidates.length;
  session.closurePhraseIds = candidates.map(item => item.phrase.id);
  session.items.push(checkpoint('session-checkout', 'Só mais uma confirmação', signal.reason, 'FECHAMENTO INTELIGENTE', { checkoutCount:candidates.length, checkoutFocus:signal.focusSkill }));
  candidates.forEach((candidate, index) => {
    const progress = getPhraseProgress(appState, candidate.phrase.id);
    const preferred = candidate.lastSkill === 'listening' ? 'listening' : candidate.lastSkill === 'reading' ? 'meaning' : candidate.lastSkill === 'production' ? 'production' : recommendedExerciseType(progress);
    const exercise = makeExercise(candidate.phrase, appState, 11000 + index + Number(session.outcomes?.length || 0) * 7, true, preferred, 'exit');
    session.items.push({ ...exercise, checkout:true, checkoutOrder:index + 1, checkoutTotal:candidates.length });
  });
  return true;
}

function sessionClosureSummary(session) {
  const rows = (session?.outcomes || []).filter(entry => entry?.reviewKind === 'exit');
  const correct = rows.filter(entry => entry.outcome === 'correct').length;
  const almost = rows.filter(entry => entry.outcome === 'almost').length;
  const wrong = rows.filter(entry => entry.outcome === 'wrong').length;
  return { attempts:rows.length, correct, almost, wrong, score:rows.length ? Math.round((correct + almost * .5) / rows.length * 100) : null };
}

// V0.9.3 — transforma o resultado de uma sessão em contexto útil para a próxima.
function sessionContinuityCandidates(session, appState, limit = 3) {
  const rows = (session?.outcomes || []).filter(entry => entry?.phraseId);
  const byPhrase = new Map();
  rows.forEach((entry, index) => {
    const bucket = byPhrase.get(entry.phraseId) || { phraseId:entry.phraseId, lastOutcome:null, lastSkill:null, lastIndex:-1, score:0 };
    const weight = entry.reviewKind === 'exit' ? 1.35 : entry.reviewKind === 'recovery' ? 1.15 : 1;
    bucket.score += entry.outcome === 'wrong' ? 3.4 * weight : entry.outcome === 'almost' ? 1.8 * weight : -1.35 * weight;
    bucket.lastOutcome = entry.outcome;
    bucket.lastSkill = entry.skill || bucket.lastSkill;
    bucket.lastIndex = index;
    byPhrase.set(entry.phraseId, bucket);
  });
  return [...byPhrase.values()].map(bucket => {
    const phrase = getPhrase(bucket.phraseId);
    if (!phrase) return null;
    const progress = getPhraseProgress(appState, bucket.phraseId);
    const recurring = Boolean(recurringNearMissPattern(progress, bucket.lastSkill || undefined));
    const difficult = isDifficultPhrase(progress);
    let score = bucket.score + difficultyScore(progress) * 1.2 + (recurring ? 1.7 : 0) + (difficult ? 1.1 : 0);
    if (bucket.lastOutcome === 'correct' && !recurring && !difficult) score -= 2.2;
    return { ...bucket, phrase, recurring, difficult, score };
  }).filter(item => item && item.score >= 1.3)
    .sort((a,b) => b.score - a.score || b.lastIndex - a.lastIndex)
    .slice(0, Math.max(0, limit));
}

function buildNextSessionBrief(appState, session, now = new Date()) {
  if (!session) return null;
  const skills = sessionSkillBreakdown(session);
  const tested = Object.entries(skills).filter(([,value]) => Number(value?.attempts || 0) > 0);
  const weakest = tested.sort((a,b) => (a[1].score ?? 100) - (b[1].score ?? 100))[0];
  const focusSkill = weakest?.[0] || session.liveAdaptation?.focusSkill || session.adaptiveFocus || 'production';
  const focusLabel = {reading:'Leitura',listening:'Listening',production:'Produção'}[focusSkill] || 'Produção';
  const total = Number(session.correct || 0) + Number(session.almost || 0) + Number(session.wrong || 0);
  const score = total ? Math.round((Number(session.correct || 0) + Number(session.almost || 0) * .5) / total * 100) : 100;
  const closure = sessionClosureSummary(session);
  const candidates = sessionContinuityCandidates(session, appState, 3);
  const weakSignals = Number(session.wrong || 0) + Number(session.almost || 0) * .55;
  const slowed = session.liveAdaptation?.mode === 'slowdown';
  let mode = 'advance';
  if (slowed || closure.wrong > 0 || score < 68 || candidates.length >= 3) mode = 'review-first';
  else if (closure.almost > 0 || Number(session.almost || 0) >= 2 || weakSignals >= 2 || score < 84 || candidates.length) mode = 'balanced';
  const label = mode === 'review-first' ? 'COMEÇAR REVISANDO' : mode === 'balanced' ? 'EQUILIBRAR PRIMEIRO' : 'PODE AVANÇAR';
  const reason = mode === 'review-first'
    ? `${focusLabel} terminou como a habilidade mais sensível. O motor vai procurar revisões vencidas desse foco antes de aumentar a exigência.`
    : mode === 'balanced'
      ? `${focusLabel} ainda merece atenção, mas não há sinal para travar o avanço. A próxima sessão mistura revisão e conteúdo novo conforme o SRS.`
      : `A sessão terminou estável. O motor pode avançar e só puxará revisões quando a memória realmente pedir.`;
  return sanitizeNextSessionBrief({
    mode, label, focusSkill, focusLabel, reason,
    priorityPhraseIds:candidates.map(item => item.phrase.id),
    sourceDate:todayKey(now), sourceSessionId:session.id || null, createdAt:now.toISOString(), score
  });
}

function continuityCard(brief, options = {}) {
  const safe = sanitizeNextSessionBrief(brief);
  if (!safe) return '';
  const icons = { 'review-first':'↻', balanced:'◎', advance:'→' };
  const phraseLabels = safe.priorityPhraseIds.map(id => getPhrase(id)?.english).filter(Boolean).slice(0, 3);
  const heading = options.summary ? 'Como a próxima sessão deve começar' : 'A última sessão deixou um caminho pronto';
  return `<section class="continuity-card ${safe.mode}"><span>${icons[safe.mode] || '→'}</span><div><small>PRÓXIMA SESSÃO</small><h3>${escapeHtml(safe.label)} · ${escapeHtml(safe.focusLabel)}</h3><p>${escapeHtml(safe.reason)}</p>${phraseLabels.length ? `<div class="continuity-phrases">${phraseLabels.map(text => `<b>${escapeHtml(text)}</b>`).join('')}</div>` : ''}${options.summary ? `<p style="margin-top:8px">${escapeHtml(heading)}. As frases acima são prioridade de memória, não repetição obrigatória.</p>` : ''}</div><em>${safe.score == null ? safe.focusLabel : `${safe.score}%`}</em></section>`;
}

function buildSession(state, dayId = nextUnlockedDay(state), now = new Date()) {
  const day = curriculum.find(item => item.id === dayId);
  if (!day) return null;
  const firstJourneySession = !allPhrases.some(phrase => getPhraseProgress(state, phrase.id).seen);

  const plan = sessionPlan(state, dayId, now);
  const reviewPhrases = adaptiveReviewQueue(state, now, plan.focusSkill)
    .filter(p => p.dayId < dayId || state.completedDays.includes(dayId) || getPhraseProgress(state, p.id).seen)
    .slice(0, plan.reviewCount);

  const unseen = day.phrases.filter(p => !getPhraseProgress(state, p.id).seen);
  const selected = unseen.slice(0, plan.newGoal);
  const items = [];

  if (reviewPhrases.length) {
    const title = plan.mode === 'consolidation' ? 'Hoje é dia de consolidar' : plan.mode === 'recovery' ? 'Sessão de recuperação' : 'Revisão antes das novas frases';
    const body = plan.mode === 'consolidation'
      ? `${reviewPhrases.length} revisões entram antes de qualquer conteúdo novo. O foco principal será ${plan.focusLabel.toLowerCase()}.`
      : plan.mode === 'recovery'
        ? `${reviewPhrases.length} frases têm prioridade. Vamos recuperar a memória com mais espaço para ${plan.focusLabel.toLowerCase()}.`
        : `${reviewPhrases.length} frases chegaram na hora de voltar. Hoje o motor vai favorecer ${plan.focusLabel.toLowerCase()}.`;
    items.push(checkpoint('review-start', title, body, plan.mode === 'consolidation' ? 'CONSOLIDAÇÃO ADAPTATIVA' : plan.mode === 'recovery' ? 'RECUPERANDO O RITMO' : 'REVISÃO PROGRAMADA', { adaptiveFocus: plan.focusSkill }));
    reviewPhrases.forEach((phrase, index) => {
      items.push(makeExercise(phrase, state, index + 500, true, recommendedExerciseType(getPhraseProgress(state, phrase.id), now), 'scheduled'));
    });
  }

  const reviewIds = new Set(reviewPhrases.map(p => p.id));
  const hardPhrases = hardPracticePhrases(state, now, plan.hardLimit).filter(p => !reviewIds.has(p.id));
  if (hardPhrases.length) {
    items.push(checkpoint('hard-focus', 'Frases que estão dando trabalho', `${hardPhrases.length} frases ganharam um reforço curto. Elas não serão repetidas em loop: fazemos uma tentativa focada e seguimos.`, 'REFORÇO INTELIGENTE'));
    hardPhrases.forEach((phrase, index) => {
      items.push(makeExercise(phrase, state, 1700 + index, true, recommendedExerciseType(getPhraseProgress(state, phrase.id), now), 'hard'));
    });
  }

  const blocks = chunk(selected, BLOCK_SIZE);
  const sessionPatterns = new Set();
  let patternDiscoveries = 0;
  blocks.forEach((block, blockIndex) => {
    const blockNumber = blockIndex + 1;
    const blockTitle = day.blocks?.[blockIndex] || `Bloco ${blockNumber}`;
    const rhythm = adaptiveSessionBlockRhythm(dayId, blockIndex, plan.focusSkill);
    const rhythmMeta = {
      blockFocus: rhythm.id,
      blockFocusLabel: rhythm.label,
      blockFocusTitle: rhythm.title,
      blockFocusDescription: rhythm.description,
      blockIcon: rhythm.icon
    };
    items.push(checkpoint(
      `block-${blockNumber}`,
      `${blockNumber}º bloco de ${blocks.length}`,
      `${block.length} frases novas · ${blockTitle}`,
      'NOVAS FRASES',
      { blockNumber, blockTotal: blocks.length, ...rhythmMeta }
    ));

    block.forEach((phrase, index) => {
      items.push({ type: 'intro', phraseId: phrase.id, blockNumber, ...rhythmMeta });
      const forcedType = rhythm.types[index % rhythm.types.length];
      items.push({ ...makeExercise(phrase, state, blockIndex * 100 + index, false, forcedType, 'immediate'), blockNumber, ...rhythmMeta });
    });

    const miniSet = block.filter((_, index) => rhythm.miniIndexes.includes(index)).slice(0, 3);
    if (miniSet.length) {
      items.push(checkpoint(
        `mini-${blockNumber}`,
        rhythm.miniTitle,
        rhythm.miniBody,
        `FIXAÇÃO · ${rhythm.label}`,
        { blockNumber, blockTotal: blocks.length, ...rhythmMeta }
      ));
      miniSet.forEach((phrase, index) => {
        const forcedType = rhythm.miniTypes[index % rhythm.miniTypes.length];
        items.push({ ...makeExercise(phrase, state, 800 + blockIndex * 20 + index, true, forcedType, 'mini'), blockNumber, ...rhythmMeta });
      });
    }

    if (patternDiscoveries < 1) {
      const discovery = patternDiscoveryForBlock(block, sessionPatterns);
      if (discovery) {
        items.push({ ...discovery, blockNumber, ...rhythmMeta });
        sessionPatterns.add(discovery.pattern);
        patternDiscoveries++;
      }
    }
  });

  const variationItems = ['consolidation','daily-complete'].includes(plan.mode) ? [] : buildFamilyVariationItems(state, now, 1);
  if (variationItems.length) {
    items.push(checkpoint('family-transfer', 'Use o molde em algo novo', `${variationItems.length} variações curadas vão testar se você consegue reutilizar famílias que já conhece. Elas não contam como frases novas do curso.`, 'TRANSFERÊNCIA'));
    items.push(...variationItems);
  }

  if (selected.length) {
    // Um representante por bloco: o desafio final confirma a sessão sem repetir
    // dez frases que já passaram por recuperação imediata e mini-revisão.
    const challengeSet = blocks.map(block => block[Math.min(block.length - 1, 7)]).filter(Boolean).slice(0, 4);
    if (challengeSet.length) {
      const challenge = adaptiveDailyChallengeProfile(dayId, plan.focusSkill);
      items.push(checkpoint('daily-challenge', challenge.title, challenge.body, challenge.eyebrow, { challengeFocus: challenge.id }));
      challengeSet.forEach((phrase, index) => {
        const forcedType = challenge.types[index % challenge.types.length];
        items.push({ ...makeExercise(phrase, state, 1200 + index, true, forcedType, 'challenge'), challengeFocus: challenge.id });
      });
    }
  }

  if (!items.length && state.completedDays.includes(dayId)) {
    weakestPractice(state, 20).forEach((phrase, index) => items.push(makeExercise(phrase, state, 1600 + index, true, recommendedExerciseType(getPhraseProgress(state, phrase.id), now), 'practice')));
  }

  return {
    id: `${todayKey(now)}-day-${dayId}-${now.getTime()}`,
    dayId,
    startedAt: now.toISOString(),
    studyDate: todayKey(now),
    index: 0,
    correct: 0,
    wrong: 0,
    almost: 0,
    items,
    newCount: selected.length,
    reviewCount: reviewPhrases.length,
    hardCount: hardPhrases.length,
    patternCount: patternDiscoveries,
    sessionRhythms: blocks.map((_, index) => adaptiveSessionBlockRhythm(dayId, index, plan.focusSkill).id),
    challengeFocus: selected.length ? adaptiveDailyChallengeProfile(dayId, plan.focusSkill).id : null,
    pacing: {
      miniReviewPerBlock: 3,
      challengeCount: selected.length ? Math.min(blocks.length, 4) : 0,
      patternLimit: 1,
      variationLimit: 1,
      stopPoints: blocks.length
    },
    variationCount: variationItems.length,
    variationRemembered: 0,
    variationAlmost: 0,
    variationForgot: 0,
    recoveryCount: 0,
    recovered: 0,
    outcomes: [],
    currentStreak: 0,
    bestStreak: 0,
    xpStart: Number(state.xp || 0),
    achievementIdsStart: unlockedAchievementIds(state, now),
    recoveryScheduled: {},
    goal: plan.newGoal,
    estimatedMinutes: plan.estimatedMinutes,
    mode: plan.mode,
    daysMissedAtStart: plan.calendar.daysMissed,
    adaptiveFocus: plan.focusSkill,
    adaptiveFocusLabel: plan.focusLabel,
    adaptiveFocusReason: plan.focusReason,
    adaptiveLoad: plan.loadLabel,
    adaptiveNewGoalReason: plan.newGoalReason,
    continuitySource: plan.handoff ? { mode:plan.handoff.mode, focusSkill:plan.handoff.focusSkill, sourceDate:plan.handoff.sourceDate, sourceSessionId:plan.handoff.sourceSessionId, priorityPhraseIds:[...(plan.handoff.priorityPhraseIds || [])] } : null,
    liveAdaptation: { mode:'steady', focusSkill:plan.focusSkill, score:null, reason:'', changes:[], deferredBlocks:[], lastEvaluatedOutcome:0, lastLoadChangeOutcome:0, changedAtOutcome:0, changedAtIndex:0 },
    dayTotal: day.phrases.length,
    startedSeen: day.phrases.length - unseen.length,
    firstJourneySession
  };
}

function checkpoint(id, title, body, eyebrow, extra = {}) { return { type: 'checkpoint', id, title, body, eyebrow, ...extra }; }
function chunk(items, size) { const out = []; for (let index = 0; index < items.length; index += size) out.push(items.slice(index, index + size)); return out; }

function weakestPractice(state, limit) {
  return allPhrases.filter(p => getPhraseProgress(state, p.id).seen).sort((a, b) => mastery(getPhraseProgress(state, a.id)) - mastery(getPhraseProgress(state, b.id))).slice(0, limit);
}

// V0.8.4 — transforma memória de erro em escolha de exercício.
function focusSegmentForAdaptiveReview(phrase, focus) {
  const english = String(phrase?.english || '').trim();
  const explicit = String(focus?.spotlight || '').trim();
  if (!english) return null;
  if (explicit && english.toLowerCase().includes(explicit.toLowerCase())) return explicit;

  const words = englishWords(english);
  if (!words.length) return null;
  if (['start','frame'].includes(focus?.id)) return words.slice(0, Math.min(3, words.length)).join(' ');
  if (['ending','complement'].includes(focus?.id)) return words.slice(Math.max(0, words.length - Math.min(2, words.length))).join(' ');
  if (['middle','verb','keyword','sound'].includes(focus?.id)) return clozeAnswer(english);
  return null;
}

function maskAdaptiveSegment(phrase, focus) {
  const english = String(phrase?.english || '').trim();
  const segment = focusSegmentForAdaptiveReview(phrase, focus);
  if (!english || !segment) return null;
  const index = english.toLowerCase().indexOf(segment.toLowerCase());
  if (index < 0) return null;
  return `${english.slice(0, index)}_____ ${english.slice(index + segment.length)}`.replace(/\s+([?.!,])/g, '$1').replace(/\s{2,}/g, ' ').trim();
}

function targetedAdaptiveClozeAnswer(phrase, focus) {
  const segment = focusSegmentForAdaptiveReview(phrase, focus);
  if (!segment) return null;
  const words = englishWords(segment);
  if (words.length !== 1) return null;
  return segment;
}

function targetedAdaptiveClozeChoices(phrase, focus, seed = 0) {
  const answer = targetedAdaptiveClozeAnswer(phrase, focus);
  if (!answer) return [];
  const targetClass = clozeWordClass(answer);
  const picked = [];
  const seen = new Set([normalizeChoice(answer)]);
  for (const candidate of rankedDistractorCandidates(phrase, 'production', seed + 83)) {
    const value = clozeAnswer(candidate.english);
    if (!value || !clozeClassCompatible(targetClass, clozeWordClass(value))) continue;
    const key = normalizeChoice(value);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    picked.push(value);
    if (picked.length === 3) break;
  }
  return shuffle([answer, ...picked], seed + 1084);
}

function adaptiveReviewPlan(phrase, progress, kind = 'scheduled', seed = 0) {
  if (!['scheduled','practice','hard','exit'].includes(kind)) return null;
  const recurring = recurringNearMissPattern(progress);
  const focus = recurring || (progress?.lastOutcome === 'almost' ? progress?.lastNearMissFocus : null);
  if (!focus?.skill) return null;

  if (focus.skill === 'listening') {
    const slowFirst = focus.id === 'sound';
    return {
      focus,
      type: 'listening',
      mode: slowFirst ? 'slow-first-listening' : 'focused-listening',
      title: slowFirst ? 'Desmontar o som antes de voltar à velocidade normal' : 'Ouvir procurando o ponto que costuma escapar',
      instruction: slowFirst
        ? 'Nesta revisão, o primeiro áudio vem devagar para deixar o trecho recorrente audível. Depois confirme em velocidade normal antes de revelar.'
        : focus.id === 'ending' || focus.id === 'complement'
          ? 'Escute a frase inteira, mas mantenha a atenção no final. Não tente traduzir cada palavra.'
          : focus.id === 'start' || focus.id === 'frame'
            ? 'Agarre o começo como um bloco. Quando o início ficar claro, deixe o restante completar a ideia.'
            : 'Procure primeiro a palavra ou o trecho que costuma sumir no áudio; depois reconstrua a mensagem completa.'
    };
  }

  if (focus.skill === 'production') {
    if (['middle','verb','keyword'].includes(focus.id)) {
      const answer = targetedAdaptiveClozeAnswer(phrase, focus);
      const choices = answer ? targetedAdaptiveClozeChoices(phrase, focus, seed) : [];
      if (answer && choices.length >= 3) {
        return {
          focus,
          type: 'cloze',
          mode: 'targeted-cloze',
          answer,
          choices,
          maskedPrompt: maskAdaptiveSegment(phrase, focus),
          title: 'Lacuna focada no ponto que está falhando',
          instruction: 'Em vez de testar a frase inteira de novo, esta rodada isola a palavra que apareceu repetidamente como dificuldade.'
        };
      }
    }

    const maskedPrompt = maskAdaptiveSegment(phrase, focus);
    return {
      focus,
      type: 'production',
      mode: ['start','frame'].includes(focus.id) ? 'masked-start-recall' : ['ending','complement'].includes(focus.id) ? 'masked-end-recall' : 'focused-recall',
      maskedPrompt,
      title: ['start','frame'].includes(focus.id)
        ? 'Recupere primeiro o começo que costuma travar'
        : ['ending','complement'].includes(focus.id)
          ? 'Complete mentalmente o trecho que costuma faltar'
          : 'Produza a frase usando o ponto recorrente como âncora',
      instruction: maskedPrompt
        ? 'A parte marcada foi escondida de propósito. Complete-a mentalmente e depois tente dizer a frase inteira antes de revelar.'
        : 'Tente recuperar a frase inteira, concentrando-se primeiro no ponto que se repetiu nas tentativas anteriores.'
    };
  }

  if (focus.skill === 'reading') {
    return {
      focus,
      type: 'meaning',
      mode: 'focused-meaning',
      title: 'Reconhecimento de significado com contraste',
      instruction: 'Esta revisão volta ao significado porque foi aí que a confusão apareceu. Leia a frase como um bloco antes de escolher.'
    };
  }
  return null;
}

function phraseCalibration(progress, now = new Date()) {
  const p = progress || {};
  const reps = Math.max(0, Number(p.repetitions || 0));
  const days = new Set((p.reviewDays || []).filter(isDateKey)).size;
  const attemptedSkills = SKILLS.filter(skill => p.skillSchedule?.[skill]?.lastReviewedAt || Number(p[skill] || 0) > 0);
  const weakestAttempted = attemptedSkills.length ? Math.min(...attemptedSkills.map(skill => Number(p[skill] || 0))) : 0;
  const recurring = Boolean(recurringNearMissPattern(p, 'production') || recurringNearMissPattern(p, 'listening'));
  const recentStruggle = p.lastOutcome === 'wrong' || p.lastOutcome === 'almost' || Number(p.consecutiveMistakes || 0) > 0;
  const hard = isDifficultPhrase(p);
  const overall = mastery(p);

  // Domínio comprovado usa verificação ativa: reconhecimento fácil deixa de ser a prova principal.
  if (isMastered(p, now)) {
    return { id: 'verification', label: 'verificação', support: 0, active: true };
  }

  // Primeira tentativa e dificuldades recentes recebem apoio; isso vale em qualquer dia do curso.
  if (reps === 0 || hard || recurring || recentStruggle || (reps >= 2 && attemptedSkills.length && weakestAttempted < 0.24)) {
    return { id: 'guided', label: 'guiado', support: 2, active: false };
  }

  // Frase forte em mais de um dia: aumenta recuperação ativa antes de chegar ao domínio formal.
  if (overall >= 0.56 && days >= 2 && Number(p.production || 0) >= 0.40 && Number(p.listening || 0) >= 0.36) {
    return { id: 'active', label: 'ativo', support: 0, active: true };
  }

  return { id: 'standard', label: 'padrão', support: 1, active: false };
}

function verificationExerciseType(progress, now = new Date(), seed = 0) {
  const candidates = ['production', 'listening'].map(skill => {
    const due = skillDue(progress, skill);
    return {
      skill,
      overdue: due && new Date(due) <= now ? 1 : 0,
      dueAt: due ? new Date(due).getTime() : Infinity,
      score: Number(progress?.[skill] || 0),
      tie: pseudo(`${skill}:${seed}`)
    };
  });
  candidates.sort((a, b) => b.overdue - a.overdue || a.dueAt - b.dueAt || a.score - b.score || a.tie - b.tie);
  return candidates[0]?.skill || (Math.abs(seed) % 2 ? 'listening' : 'production');
}

function calibrateReviewType(progress, type, reviewKind, seed = 0, now = new Date()) {
  const calibration = phraseCalibration(progress, now);
  if (!['scheduled','practice','hard','exit'].includes(reviewKind)) return { type, calibration };

  // Uma frase realmente dominada é verificada por produção ou listening, não por reconhecimento fácil.
  if (calibration.id === 'verification') {
    if (type === 'listening') return { type: 'listening', calibration };
    if (['production','context','cloze'].includes(type)) return { type: 'production', calibration };
    return { type: verificationExerciseType(progress, now, seed), calibration };
  }
  return { type, calibration };
}

function recommendedExerciseType(progress, now = new Date()) {
  const recurring = recurringNearMissPattern(progress);
  const nearMissSkill = recurring?.skill || (progress?.lastOutcome === 'almost' ? progress?.lastNearMissFocus?.skill : null);
  if (SKILLS.includes(nearMissSkill)) {
    const due = skillDue(progress, nearMissSkill);
    if (!due || new Date(due) <= now) {
      if (nearMissSkill === 'listening') return 'listening';
      if (nearMissSkill === 'production') return 'production';
      return 'meaning';
    }
  }
  const candidates = SKILLS.map(skill => ({
    skill,
    score: progress[skill] || 0,
    due: skillDue(progress, skill)
  }));
  const overdue = candidates.filter(x => x.due && new Date(x.due) <= now).sort((a, b) => new Date(a.due) - new Date(b.due) || a.score - b.score);
  const chosen = overdue[0] || candidates.sort((a, b) => a.score - b.score)[0];
  if (chosen.skill === 'listening') return 'listening';
  if (chosen.skill === 'production') return 'production';
  return 'meaning';
}

function shouldUseRecall(phrase, progress, reviewKind = 'immediate', seed = 0, sourceType = 'production') {
  if (!['production', 'context'].includes(sourceType)) return false;
  if (reviewKind === 'recovery') return false;
  if (reviewKind === 'exit') return true;
  if (['scheduled','practice','hard'].includes(reviewKind) && recurringNearMissPattern(progress, 'production')) return true;
  if (['scheduled','practice','hard'].includes(reviewKind) && progress?.lastOutcome === 'almost' && progress?.lastNearMissFocus?.skill === 'production') return true;

  const calibration = phraseCalibration(progress);
  const reps = Number(progress?.repetitions || 0);
  const production = Number(progress?.production || 0);

  if (calibration.id === 'guided') return false;
  if (calibration.id === 'active' || calibration.id === 'verification') return true;

  // No nível padrão, a ajuda cai gradualmente conforme a própria frase acumula evidência.
  if (['scheduled','practice','hard'].includes(reviewKind)) return reps >= 2 || production >= 0.25;
  if (reviewKind === 'challenge') return seed % 2 === 0;
  if (reviewKind === 'mini') return seed % 3 === 0;
  return false;
}

function shouldUseListeningRecall(phrase, progress, reviewKind = 'immediate', seed = 0) {
  if (reviewKind === 'recovery') return false;
  if (reviewKind === 'exit') return true;
  if (['scheduled','practice','hard'].includes(reviewKind) && recurringNearMissPattern(progress, 'listening')) return true;
  if (['scheduled','practice','hard'].includes(reviewKind) && progress?.lastOutcome === 'almost' && progress?.lastNearMissFocus?.skill === 'listening') return true;

  const calibration = phraseCalibration(progress);
  const reps = Number(progress?.repetitions || 0);
  const listening = Number(progress?.listening || 0);

  if (calibration.id === 'guided') return false;
  if (calibration.id === 'active' || calibration.id === 'verification') return true;
  if (['scheduled','practice','hard'].includes(reviewKind)) return reps >= 3 || listening >= 0.30;
  if (reviewKind === 'challenge') return seed % 2 === 1;
  if (reviewKind === 'mini') return seed % 3 === 1;
  return false;
}

function makeExercise(phrase, state, seed = 0, isReview = false, forcedType = null, reviewKind = null) {
  const canonical = phraseById[phrase.id] || phrase;
  const progress = getPhraseProgress(state, canonical.id);
  const types = ['meaning', 'production', 'context', 'cloze', 'listening'];
  const kind = reviewKind || (isReview ? 'scheduled' : 'immediate');
  const recurringFocus = recurringNearMissPattern(progress);
  const adaptive = adaptiveReviewPlan(canonical, progress, kind, seed);
  const nearMissSkill = recurringFocus?.skill || (progress.lastOutcome === 'almost' ? progress.lastNearMissFocus?.skill : null);
  const nearMissType = ['scheduled','practice','hard','exit'].includes(kind)
    ? nearMissSkill === 'listening' ? 'listening' : nearMissSkill === 'production' ? 'production' : nearMissSkill === 'reading' ? 'meaning' : null
    : null;
  let type = adaptive?.type || forcedType || nearMissType || (isReview ? recommendedExerciseType(progress) : types[seed % types.length]);
  if (type === 'reading') type = 'meaning';
  const calibrated = adaptive ? { type, calibration: phraseCalibration(progress) } : calibrateReviewType(progress, type, kind, seed);
  type = calibrated.type;
  const calibration = calibrated.calibration;
  // Só gera exercício de contexto quando o conteúdo tem uma situação específica e utilizável.
  if (type === 'context' && canonical.contextQuality !== 'specific') type = 'meaning';
  if (type === 'cloze' && !adaptive?.answer && !clozeIsUseful(canonical.english)) type = ['production','context','meaning'][Math.abs(seed) % 3];
  // Se o dispositivo não oferece saída de voz, listening não vira um botão morto.
  // A mesma frase é treinada em produção, preservando o SRS e o andamento da sessão.
  if (['listening','listening-recall'].includes(type) && !audioOutputAvailable()) type = 'production';

  const sourceType = type;
  if (sourceType === 'listening' && (adaptive?.focus?.skill === 'listening' || shouldUseListeningRecall(canonical, progress, kind, seed))) {
    type = 'listening-recall';
  } else if (adaptive?.focus?.skill === 'production' && adaptive?.type === 'production') {
    type = 'recall';
  } else if (shouldUseRecall(canonical, progress, kind, seed, sourceType)) {
    type = 'recall';
  }

  let noChoices = ['recall','listening-recall'].includes(type);
  let choices = noChoices ? [] : (adaptive?.mode === 'targeted-cloze' ? [...(adaptive.choices || [])] : buildChoices(canonical, type, seed));
  // Uma lacuna com só uma alternativa plausível vira reconhecimento disfarçado.
  // Nesses casos é melhor pedir a frase inteira em produção guiada do que inventar palavras sem encaixe.
  if (type === 'cloze' && choices.length < 3) {
    type = 'recall';
    noChoices = true;
    choices = [];
  }
  const focusHint = ['scheduled','practice','hard'].includes(kind)
    ? (recurringFocus || (progress.lastOutcome === 'almost' ? progress.lastNearMissFocus : null))
    : null;
  return {
    type,
    sourceType: noChoices ? sourceType : null,
    phraseId: canonical.id,
    choices,
    answer: adaptive?.mode === 'targeted-cloze' && type === 'cloze' ? adaptive.answer : answerFor(canonical, type),
    isReview,
    reviewKind: kind,
    focusHint,
    adaptiveMode: adaptive?.mode || null,
    adaptiveTitle: adaptive?.title || null,
    adaptiveInstruction: adaptive?.instruction || null,
    adaptiveMaskedPrompt: adaptive?.maskedPrompt || null,
    calibrationLevel: calibration?.id || 'standard'
  };
}

function answerFor(phrase, type) {
  if (type === 'meaning' || type === 'listening' || type === 'listening-recall') return phrase.portuguese;
  if (type === 'production' || type === 'context' || type === 'recall') return phrase.english;
  if (type === 'cloze') return clozeAnswer(phrase.english);
  return phrase.portuguese;
}

function buildChoices(phrase, type, seed) {
  const canonical = phraseById[phrase.id] || phrase;

  if (type === 'cloze') {
    const right = clozeAnswer(canonical.english);
    const targetClass = clozeWordClass(right);
    const targetSlot = clozeSlotType(canonical.english);
    const picked = [];
    const seen = new Set([normalizeChoice(right)]);
    const ranked = rankedDistractorCandidates(canonical, 'production', seed);

    for (const candidate of ranked) {
      const value = clozeAnswer(candidate.english);
      if (!clozeClassCompatible(targetClass, clozeWordClass(value))) continue;
      if (!clozeSlotCompatible(targetSlot, clozeSlotType(candidate.english))) continue;
      if (clozeFrameCompatibility(canonical.english, candidate.english) < 0.55) continue;
      const key = normalizeChoice(value);
      if (!key || seen.has(key)) continue;
      seen.add(key);
      picked.push(value);
      if (picked.length === 3) break;
    }

    // Melhor ter três opções gramaticalmente plausíveis do que quatro com uma absurda.
    // Se a busca estrita não conseguir nem dois distratores, relaxamos apenas o encaixe,
    // mantendo classe da palavra e compatibilidade do trecho depois da lacuna.
    if (picked.length < 2) {
      const targetFrame = clozeFrame(canonical.english);
      for (const candidate of ranked) {
        const value = clozeAnswer(candidate.english);
        if (!clozeClassCompatible(targetClass, clozeWordClass(value))) continue;
        if (!clozeSlotCompatible(targetSlot, clozeSlotType(candidate.english))) continue;
        const candidateFrame = clozeFrame(candidate.english);
        const suffixOverlap = (!targetFrame.suffix.length && !candidateFrame.suffix.length) ? 1 : jaccard(targetFrame.suffix, candidateFrame.suffix);
        if (targetFrame.suffix.length && suffixOverlap === 0) continue;
        if (clozeFrameCompatibility(canonical.english, candidate.english) < 0.38) continue;
        const key = normalizeChoice(value);
        if (!key || seen.has(key)) continue;
        seen.add(key);
        picked.push(value);
        if (picked.length === 2) break;
      }
    }
    return shuffle([right, ...picked], seed + 11);
  }

  const right = (type === 'meaning' || type === 'listening') ? canonical.portuguese : canonical.english;
  const picked = [];
  const seen = new Set([normalizeChoice(right)]);
  for (const candidate of rankedDistractorCandidates(canonical, type, seed)) {
    const value = (type === 'meaning' || type === 'listening') ? candidate.portuguese : candidate.english;
    const key = normalizeChoice(value);
    if (!key || seen.has(key)) continue;
    seen.add(key);
    picked.push(value);
    if (picked.length === 3) break;
  }
  return shuffle([right, ...picked], seed + 7);
}

const EN_DISTRACTOR_STOPWORDS = new Set([
  'i','you','he','she','we','they','it','me','him','her','us','them','my','your','his','our','their',
  'a','an','the','this','that','these','those','to','of','for','in','on','at','by','with','from','and','or','but',
  'am','is','are','was','were','be','been','being','do','does','did','have','has','had',
  'can','could','will','would','should','may','might','must','what','where','when','why','who','which','how',
  "don't","doesn't","didn't","can't","couldn't","won't","wouldn't","shouldn't","isn't","aren't","wasn't","weren't","haven't","hasn't"
]);
const PT_DISTRACTOR_STOPWORDS = new Set([
  'eu','voce','voces','ele','ela','nos','eles','elas','me','te','se','o','a','os','as','um','uma','uns','umas',
