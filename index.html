    return `
      <div class="today-intro adaptive-${escapeHtml(adaptive.kind)}">
        <div class="kicker">${escapeHtml(formatDate())}</div>
        <h1 class="page-title">${escapeHtml(adaptive.title)}</h1>
        <p class="page-subtitle">${escapeHtml(adaptive.subtitle)}</p>
      </div>

      <section class="focus-card section ${done ? 'complete' : ''}">
        <div class="focus-card-top">
          <div class="focus-eyebrow"><span class="focus-dot"></span>A Única Coisa</div>
          <div class="focus-age">${escapeHtml(focusCycleLabel(goal))}</div>
        </div>
        <div class="focus-symbol">${escapeHtml(goal.emoji || '🎯')}</div>
        <h2 class="focus-title">${escapeHtml(goal.title)}</h2>
        <div class="focus-divider"></div>
        <div class="focus-action-label">O que move esse objetivo</div>
        <p class="focus-one-thing">${escapeHtml(goal.oneThing)}</p>
        ${todayFocusControl(goal)}
        <button type="button" class="action-btn check-action ${done ? 'done' : ''}" data-action="toggle-checkin" data-goal-id="${goal.id}">
          <span class="check-circle">${done ? '✓' : ''}</span>
          <span>${done ? 'Feito por hoje' : (currentDailyAction(goal.id) ? 'Concluir ação de hoje' : 'Fiz minha Única Coisa hoje')}</span>
        </button>
        ${done ? '<p class="completion-note">O essencial de hoje já foi feito. O resto é extra.</p>' : ''}
        ${focusContextDisclosure(goal)}
      </section>

      ${adaptiveHomeCue(goal, adaptive)}
      ${weeklyReviewCard(goal) || contextualInsightCard(goal)}
      ${compactRhythmPanel(goal)}

      ${others.length ? `
        <section class="section other-goals-section">
          <div class="section-head"><h3 class="section-title">Também importa</h3><button class="text-btn" data-tab="life">Ver todos</button></div>
          <div class="goal-list">${others.map(g => goalCard(g, false)).join('')}</div>
        </section>
      ` : ''}
    `;
  }

  function weekStrip(goalId) {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const key = dateMinus(i);
      const [y,m,d] = key.split('-').map(Number);
      const dayName = new Intl.DateTimeFormat('pt-BR', { weekday: 'short' }).format(new Date(y,m-1,d)).replace('.', '');
      days.push(`<div class="day-wrap" title="${formatShortDate(key)}"><div class="day-name">${escapeHtml(dayName.slice(0,3))}</div><div class="day-dot ${isDone(goalId,key) ? 'done' : ''} ${i === 0 ? 'today' : ''}">${d}</div></div>`);
    }
    return `<div class="calendar-row">${days.join('')}</div>`;
  }

  function renderLife() {
    const main = activeGoal();
    const others = state.goals.filter(g => g.id !== state.activeGoalId);
    const later = [...(state.laterGoals || [])].sort((a,b) => String(b.deferredAt || '').localeCompare(String(a.deferredAt || '')));
    const completed = [...(state.completedGoals || [])].sort((a,b) => String(b.completedAt || '').localeCompare(String(a.completedAt || '')));
    return `
      <div class="kicker">Seus objetivos</div>
      <h1 class="page-title">Minha Vida</h1>
      <p class="page-subtitle">O que está ativo merece atenção agora. O que está em Depois continua importante, mas não compete pelo seu foco.</p>

      ${main ? `
      <section class="section">
        <div class="section-head"><h3 class="section-title">Foco principal</h3><span class="section-note">A Única Coisa</span></div>
        <div class="goal-list">${goalCard(main, true)}</div>
      </section>` : state.goals.length ? `<section class="next-focus-banner section"><div><span class="kicker">Entre focos</span><h3>Escolha conscientemente o que ocupa o centro agora.</h3><p>Os objetivos ativos continuam disponíveis, mas nenhum foi promovido automaticamente.</p></div></section>` : ''}

      <section class="section">
        <div class="section-head"><div><h3 class="section-title">${main ? 'Outros ativos' : 'Ativos'}</h3><span class="section-note">${others.length} ${others.length === 1 ? (main ? 'além do foco principal' : 'objetivo disponível agora') : (main ? 'além do foco principal' : 'objetivos disponíveis agora')}</span></div><button class="text-btn" data-action="open-add">+ Adicionar</button></div>
        ${others.length
          ? `<div class="goal-list two-col">${others.map(g => goalCard(g, false)).join('')}</div>`
          : (main ? '<div class="empty"><strong>Só existe um objetivo ativo.</strong>Os demais podem ficar em Depois até realmente merecerem atenção.</div>' : '<div class="empty"><strong>Nenhum objetivo ativo.</strong>Traga algo de Depois ou comece um novo capítulo quando fizer sentido.</div>')}
      </section>

      <section class="section later-goals-section">
        <div class="section-head"><div><h3 class="section-title">Depois</h3><span class="section-note">importante, mas fora do radar agora</span></div><span class="later-count">${later.length}</span></div>
        ${later.length ? `<div class="later-goal-list">${later.map(laterGoalCard).join('')}</div>` : '<div class="empty quiet-empty"><strong>Nada esperando.</strong>Se um objetivo importa, mas não merece energia agora, guarde-o aqui.</div>'}
      </section>

      ${completed.length ? `<section class="section completed-goals-section"><div class="section-head"><div><h3 class="section-title">Concluídos</h3><span class="section-note">capítulos encerrados</span></div><span class="later-count">${completed.length}</span></div><div class="completed-goal-list">${completed.map(completedGoalCard).join('')}</div></section>` : ''}
    `;
  }

  function laterGoalCard(goal) {
    const when = goal.deferredAt ? `Em espera desde ${formatShortDate(goal.deferredAt)}` : 'Guardado para depois';
    return `<button type="button" class="later-goal-card" data-action="open-goal" data-goal-id="${goal.id}"><div class="later-goal-icon">${escapeHtml(goal.emoji || '🎯')}</div><div class="later-goal-copy"><span>Depois</span><strong>${escapeHtml(goal.title)}</strong><small>${escapeHtml(goal.oneThing)}</small><em>${escapeHtml(when)} · abrir →</em></div></button>`;
  }

  function completedGoalCard(goal) {
    return `<button type="button" class="completed-goal-card" data-action="open-goal" data-goal-id="${goal.id}"><div class="completed-goal-check">✓</div><div class="completed-goal-copy"><span>${escapeHtml(goal.emoji || '🎯')} Capítulo concluído</span><strong>${escapeHtml(goal.title)}</strong><small>${goal.completedAt ? `Concluído em ${formatShortDate(goal.completedAt)}` : 'Objetivo concluído'} · abrir →</small></div></button>`;
  }

  function goalCard(goal, main) {
    const context = main
      ? (focusCycleInfo(goal) ? focusCycleLabel(goal) : 'Foco principal')
      : frequencyLabel(goal.frequency);
    return `
      <button type="button" class="goal-card ${main ? 'main' : ''}" data-action="open-goal" data-goal-id="${goal.id}">
        <div class="goal-top">
          <div class="goal-icon">${escapeHtml(goal.emoji || '🎯')}</div>
          <div class="goal-copy">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <div class="goal-name">${escapeHtml(goal.title)}</div>
              ${main ? '<span class="badge">Foco principal</span>' : ''}
            </div>
            <div class="goal-one">${escapeHtml(goal.oneThing)}</div>
          </div>
        </div>
        <div class="goal-meta goal-meta-quiet"><span>${escapeHtml(context)}</span><span>abrir →</span></div>
      </button>
    `;
  }

  function monthKeyFromDate(date = new Date()) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
  }

  function shiftMonthKey(baseKey, delta) {
    const [y,m] = String(baseKey).split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1, 12);
    return monthKeyFromDate(d);
  }

  function monthBounds(monthKey) {
    const [y,m] = String(monthKey).split('-').map(Number);
    const start = localDateKey(new Date(y, m - 1, 1, 12));
    const last = localDateKey(new Date(y, m, 0, 12));
    const today = localDateKey();
    return { start, end: monthKey === monthKeyFromDate() && today < last ? today : last, fullEnd: last };
  }

  function formatMonthLabel(monthKey) {
    const [y,m] = String(monthKey).split('-').map(Number);
    return new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(new Date(y, m - 1, 1, 12));
  }

  function earliestJourneyDate() {
    const dates = [];
    allGoals().forEach(goal => {
      if (goal.createdAt) dates.push(goal.createdAt);
      if (goal.completedAt) dates.push(goal.completedAt);
      if (goal.focusStartedAt) dates.push(goal.focusStartedAt);
    });
    state.focusHistory.forEach(item => { if (item.startedAt) dates.push(item.startedAt); if (item.endedAt) dates.push(item.endedAt); });
    state.focusCycles.forEach(item => { if (item.startedAt) dates.push(item.startedAt); if (item.endedAt) dates.push(item.endedAt); });
    state.milestoneHistory.forEach(item => { if (item.completedAt) dates.push(item.completedAt); });
    state.reviews.forEach(item => { if (item.date) dates.push(item.date); });
    state.weeklyFocuses.forEach(item => { if (item.weekStart) dates.push(item.weekStart); });
    Object.values(state.checkIns || {}).forEach(map => Object.keys(map || {}).forEach(key => dates.push(key)));
    return dates.filter(Boolean).sort()[0] || localDateKey();
  }

  function monthDistanceFromCurrent(monthKey) {
    const [cy,cm] = monthKeyFromDate().split('-').map(Number);
    const [y,m] = String(monthKey).split('-').map(Number);
    return Math.max(0, (cy - y) * 12 + (cm - m));
  }

  function focusSegmentsForMonth(monthKey) {
    const { start, end } = monthBounds(monthKey);
    const raw = [];
    state.focusHistory.forEach(item => {
      if (!item.goalId || !item.startedAt || !item.endedAt) return;
      const historicalEnd = addDaysKey(item.endedAt, -1);
      const segStart = String(item.startedAt) > start ? item.startedAt : start;
      const segEnd = String(historicalEnd) < end ? historicalEnd : end;
      if (String(segEnd) >= String(segStart)) raw.push({ goalId: item.goalId, start: segStart, end: segEnd });
    });
    const current = activeGoal();
    if (current) {
      const startedAt = current.focusStartedAt || current.createdAt;
      if (startedAt) {
        const segStart = String(startedAt) > start ? startedAt : start;
        if (String(end) >= String(segStart)) raw.push({ goalId: current.id, start: segStart, end });
      }
    }
    return raw;
  }

  function uniqueDateKeysForSegments(segments) {
    const keys = new Set();
    segments.forEach(segment => {
      let cursor = dateFromKey(segment.start);
      const end = dateFromKey(segment.end);
      while (cursor <= end) {
        keys.add(localDateKey(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }
    });
    return [...keys].sort();
  }

  function focusStatsForSegments(goal, segments) {
    if (!goal || !segments.length) return { done: 0, expected: 0, percentage: 0 };
    const dates = uniqueDateKeysForSegments(segments);
    if (goal.frequency === 'weekly') {
      const weeks = new Set(dates.map(weekStartKey));
      let done = 0;
      weeks.forEach(week => { if (hasCheckInDuringWeek(goal.id, week)) done += 1; });
      const expected = weeks.size;
      return { done, expected, percentage: expected ? Math.round((done / expected) * 100) : 0 };
    }
    const eligible = dates.filter(key => goal.frequency !== 'weekdays' || isWeekdayKey(key));
    const done = eligible.filter(key => isDone(goal.id, key)).length;
    const expected = eligible.length;
    return { done, expected, percentage: expected ? Math.round((done / expected) * 100) : 0 };
  }

  function monthlySummary(monthKey) {
    const { start, end } = monthBounds(monthKey);
    const segments = focusSegmentsForMonth(monthKey);
    const daysByGoal = new Map();
    segments.forEach(segment => {
      const days = uniqueDateKeysForSegments([segment]).length;
      daysByGoal.set(segment.goalId, (daysByGoal.get(segment.goalId) || 0) + days);
    });
    const dominantEntry = [...daysByGoal.entries()].sort((a,b) => b[1] - a[1])[0] || null;
    const primaryGoal = dominantEntry ? goalById(dominantEntry[0]) : null;
    const primarySegments = primaryGoal ? segments.filter(segment => segment.goalId === primaryGoal.id) : [];
    const stats = focusStatsForSegments(primaryGoal, primarySegments);
    const milestones = state.milestoneHistory.filter(item => item.completedAt >= start && item.completedAt <= end);
    const weeklyPlans = state.weeklyFocuses.filter(item => item.weekStart >= start && item.weekStart <= end);
    const reviews = state.reviews.filter(item => item.date >= start && item.date <= end);
    const switches = state.focusHistory.filter(item => item.endedAt >= start && item.endedAt <= end);
    const lastSwitch = [...switches].sort((a,b) => String(b.endedAt).localeCompare(String(a.endedAt)))[0] || null;
    const totalFocusDays = [...daysByGoal.values()].reduce((sum, value) => sum + value, 0);
    return {
      monthKey,
      start,
      end,
      current: monthKey === monthKeyFromDate(),
      primaryGoal,
      primaryDays: dominantEntry?.[1] || 0,
      totalFocusDays,
      stats,
      milestones,
      weeklyPlans,
      reviews,
      switches,
      lastSwitch
    };
  }

  function monthlySummaryCard(summary) {
    if (!summary.primaryGoal && !summary.milestones.length && !summary.weeklyPlans.length && !summary.switches.length) {
      return `<article class="month-summary-card month-summary-card--empty"><div class="month-summary-empty-mark">○</div><div><strong>Este mês ainda não tem história suficiente.</strong><p>Quando houver foco, ações, semanas planejadas ou marcos, o resumo aparecerá aqui automaticamente.</p></div></article>`;
    }
    const goal = summary.primaryGoal;
    const evidence = goal && summary.stats.expected
      ? `${summary.stats.percentage}% de consistência · ${summary.stats.done}/${summary.stats.expected} ${summary.stats.expected === 1 ? 'execução prevista' : 'execuções previstas'}`
      : 'Ainda sem consistência suficiente para resumir';
    const focusShare = summary.totalFocusDays && summary.primaryDays ? Math.round((summary.primaryDays / summary.totalFocusDays) * 100) : 0;
    const milestoneCopy = summary.milestones.length
      ? summary.milestones.slice(0,2).map(item => `<li><span>◆</span><strong>${escapeHtml(item.title)}</strong></li>`).join('')
      : '';
    const changeCopy = summary.switches.length
      ? `${summary.switches.length} ${summary.switches.length === 1 ? 'mudança de prioridade' : 'mudanças de prioridade'}${summary.lastSwitch?.reason ? ` · ${escapeHtml(summary.lastSwitch.reason)}` : ''}`
      : 'Nenhuma mudança de prioridade registrada';
    return `<article class="month-summary-card">
      ${goal ? `<div class="month-summary-focus"><div class="month-summary-icon">${escapeHtml(goal.emoji || '🎯')}</div><div><span>Prioridade principal</span><h4>${escapeHtml(goal.title)}</h4><p>${summary.primaryDays} ${summary.primaryDays === 1 ? 'dia' : 'dias'} no centro${focusShare ? ` · ${focusShare}% do período com foco registrado` : ''}</p></div></div>` : ''}
      <div class="month-summary-evidence"><div><span>Ritmo do foco</span><strong>${escapeHtml(evidence)}</strong></div><div><span>Semanas com direção</span><strong>${summary.weeklyPlans.length}</strong></div></div>
      ${milestoneCopy ? `<div class="month-summary-milestones"><span>Marcos do mês</span><ul>${milestoneCopy}</ul>${summary.milestones.length > 2 ? `<small>+${summary.milestones.length - 2} ${summary.milestones.length - 2 === 1 ? 'outro marco' : 'outros marcos'}</small>` : ''}</div>` : ''}
      <div class="month-summary-change"><span>Mudanças de direção</span><strong>${changeCopy}</strong>${summary.reviews.length ? `<small>${summary.reviews.length} ${summary.reviews.length === 1 ? 'revisão semanal registrada' : 'revisões semanais registradas'}</small>` : ''}</div>
      <p class="month-summary-foot">Resumo gerado automaticamente a partir dos seus próprios registros.</p>
    </article>`;
  }

  function journeyEvents() {
    const events = [];

    allGoals().forEach(goal => {
      if (!goal.createdAt) return;
      events.push({
        id: `created-${goal.id}`,
        type: 'goal',
        date: goal.createdAt,
        goalId: goal.id,
        title: `${goal.emoji || '🎯'} ${goal.title}`,
        label: 'Objetivo criado',
        copy: `A primeira Única Coisa definida foi: ${goal.oneThing}`
      });
    });

    (state.completedGoals || []).forEach(goal => {
      if (!goal.completedAt) return;
      const stats = goal.completionStats || {};
      const evidence = [
        Number.isFinite(stats.totalDone) ? `${stats.totalDone} conclusões` : null,
        Number.isFinite(stats.milestones) && stats.milestones > 0 ? `${stats.milestones} ${stats.milestones === 1 ? 'marco' : 'marcos'}` : null
      ].filter(Boolean).join(' · ');
      events.push({
        id: `completed-${goal.id}-${goal.completedAt}`,
        type: 'completed',
        date: goal.completedAt,
        goalId: goal.id,
        title: `${goal.emoji || '🎯'} ${goal.title}`,
        label: 'Capítulo concluído',
        copy: `${goal.completionReflection || 'Este objetivo chegou ao fim.'}${evidence ? ` · ${evidence}.` : ''}`
      });
    });

    state.focusHistory.forEach((entry, index) => {
      const goal = goalById(entry.goalId);
      if (!goal || !entry.endedAt) return;
      events.push({
        id: `focus-${index}-${entry.goalId}-${entry.endedAt}`,
        type: 'focus',
        date: entry.endedAt,
        goalId: entry.goalId,
        title: `${goal.emoji || '🎯'} ${goal.title}`,
        label: 'Período de foco encerrado',
        copy: `${formatShortDate(entry.startedAt)} → ${formatShortDate(entry.endedAt)} · ${formatDuration(entry.startedAt, entry.endedAt)}. ${entry.reason ? `Mudança: ${entry.reason}.` : ''}`
      });
    });

    state.focusCycles.forEach(item => {
      const goal = goalById(item.goalId);
      if (!goal || !item.endedAt) return;
      const planned = item.plannedDays ? `${item.plannedDays} dias` : 'período definido';
      const summary = item.summary || null;
      const evidence = summary ? [
        `${summary.consistency}% de consistência`,
        `${summary.done}/${summary.expected} execuções`,
        summary.weeklyPlans ? `${summary.weeklyPlans} ${summary.weeklyPlans === 1 ? 'semana planejada' : 'semanas planejadas'}` : null,
        summary.milestones ? `${summary.milestones} ${summary.milestones === 1 ? 'marco alcançado' : 'marcos alcançados'}` : null
      ].filter(Boolean).join(' · ') : '';
      events.push({
        id: `cycle-${item.id}`,
        type: 'focus',
        date: item.endedAt,
        goalId: item.goalId,
        title: item.summary ? 'Balanço do ciclo' : focusOutcomeLabel(item.outcome),
        label: `Ciclo de foco · ${goal.emoji || '🎯'} ${goal.title}`,
        copy: `${planned} · ${formatShortDate(item.startedAt)} → ${formatShortDate(item.endedAt)}.${evidence ? ` ${evidence}.` : ''}${item.note ? ` Aprendizado: ${item.note}` : ''}`
      });
    });

    state.milestoneHistory.forEach(item => {
      const goal = goalById(item.goalId);
      if (!goal || !item.completedAt) return;
      const unit = item.unit ? ` ${item.unit}` : '';
      const metric = item.target ? ` · ${formatMetric(item.target)}${unit}` : '';
      events.push({
        id: `milestone-${item.id}`,
        type: 'milestone',
        date: item.completedAt,
        goalId: item.goalId,
        title: item.title,
        label: `Marco alcançado${goal ? ` · ${goal.emoji || '🎯'} ${goal.title}` : ''}`,
        copy: `Você transformou um objetivo grande em avanço concreto${metric}.`
      });
    });

    state.weeklyFocuses.forEach(item => {
      const goal = goalById(item.goalId);
      if (!goal || !item.weekStart || !item.text) return;
      events.push({
        id: `week-${item.id}`,
        type: 'plan',
        date: item.weekStart,
        goalId: item.goalId,
        title: item.text,
        label: `Foco da semana · ${goal.emoji || '🎯'} ${goal.title}`,
        copy: `${formatShortDate(item.weekStart)} → ${formatShortDate(weekEndKey(item.weekStart))}. Uma direção escolhida para aproximar o foco principal do marco.`
      });
    });

    state.reviews.forEach(review => {
      const goal = goalById(review.goalId);
      if (!goal || !review.date) return;
      const changed = review.decision === 'adjust' && review.previousOneThing !== review.newOneThing;
      events.push({
        id: `review-${review.id}`,
        type: 'review',
        date: review.date,
        goalId: review.goalId,
        title: changed ? 'A Única Coisa foi ajustada' : reviewDecisionLabel(review.decision),
        label: `Revisão semanal · ${goal.emoji || '🎯'} ${goal.title}`,
        copy: changed
          ? `De “${review.previousOneThing}” para “${review.newOneThing}”.${review.note ? ` ${review.note}` : ''}`
          : `${review.consistency}% de consistência na semana.${review.note ? ` ${review.note}` : ''}`
      });
    });

    return events.sort((a,b) => {
      const dateOrder = String(b.date).localeCompare(String(a.date));
      if (dateOrder) return dateOrder;
      const priority = { completed: 6, milestone: 5, focus: 4, plan: 3, review: 2, goal: 1 };
      return (priority[b.type] || 0) - (priority[a.type] || 0);
    });
  }

  function journeyEventCard(event) {
    const icons = { completed: '✓', focus: '◎', milestone: '◆', plan: '◇', review: '↻', goal: '＋' };
    return `<article class="journey-event journey-event--${event.type}">
      <div class="journey-event-mark" aria-hidden="true">${icons[event.type] || '•'}</div>
      <div class="journey-event-body">
        <div class="journey-event-meta"><span>${escapeHtml(event.label)}</span><time>${formatShortDate(event.date)}</time></div>
        <h3>${escapeHtml(event.title)}</h3>
        <p>${escapeHtml(event.copy)}</p>
      </div>
    </article>`;
  }

  function renderJourney() {
    const current = activeGoal();
    const filter = state.journeyFilter || 'all';
    const allEvents = journeyEvents();
    const events = filter === 'all' ? allEvents : allEvents.filter(event => event.type === filter);
    const currentMilestone = current ? milestoneProgress(current) : null;
    const milestonesReached = state.milestoneHistory.length;
    const filters = [['all','Tudo'],['completed','Concluídos'],['milestone','Marcos'],['focus','Focos'],['plan','Semanas'],['review','Revisões']];

    return `
      <div class="kicker">Seu caminho</div>
      <h1 class="page-title">Jornada</h1>
      <p class="page-subtitle">Uma memória das prioridades, conquistas e mudanças de direção que realmente marcaram seu caminho.</p>

      ${current ? `<section class="journey-chapter section">
        <div class="journey-chapter-top"><div><div class="kicker">Capítulo atual</div><span>${escapeHtml(focusCycleLabel(current))}</span></div><div class="journey-chapter-icon">${escapeHtml(current.emoji || '🎯')}</div></div>
        <h2>${escapeHtml(current.title)}</h2>
        <p>${escapeHtml(current.oneThing)}</p>
        ${(currentWeeklyFocus(current.id) || currentDailyAction(current.id)) ? `<div class="journey-now-grid">${currentWeeklyFocus(current.id) ? `<div><span>Esta semana</span><strong>${escapeHtml(currentWeeklyFocus(current.id).text)}</strong></div>` : ''}${currentDailyAction(current.id) ? `<div><span>Hoje</span><strong>${escapeHtml(currentDailyAction(current.id).text)}</strong></div>` : ''}</div>` : ''}
        ${current.milestone ? `<div class="journey-chapter-milestone"><span>Marco atual</span><strong>${escapeHtml(current.milestone)}</strong>${currentMilestone ? `<small>${currentMilestone.complete ? '✓ alcançado' : `${currentMilestone.percentage}% concluído`}</small>` : ''}</div>` : ''}
      </section>` : ''}

      ${(() => {
        const selectedMonthKey = shiftMonthKey(monthKeyFromDate(), -journeyMonthOffset);
        const summary = monthlySummary(selectedMonthKey);
        const maxOffset = monthDistanceFromCurrent(monthKeyFromDate(dateFromKey(earliestJourneyDate())));
        return `<section class="section">
          <div class="section-head month-summary-head"><div><h3 class="section-title">Resumo mensal</h3><span class="section-note">${summary.current ? 'mês em andamento' : 'mês concluído'}</span></div><div class="month-nav" role="group" aria-label="Navegar entre meses"><button type="button" class="month-nav-btn" data-journey-month="older" aria-label="Mês anterior" ${journeyMonthOffset >= maxOffset ? 'disabled' : ''}>←</button><strong>${escapeHtml(formatMonthLabel(selectedMonthKey))}</strong><button type="button" class="month-nav-btn" data-journey-month="newer" aria-label="Mês seguinte" ${journeyMonthOffset === 0 ? 'disabled' : ''}>→</button></div></div>
          ${monthlySummaryCard(summary)}
        </section>`;
      })()}

      <section class="section">
        <div class="section-head"><h3 class="section-title">Memória da jornada</h3><span class="section-note">${allEvents.length} registros · ${milestonesReached} marcos</span></div>
        <div class="journey-filters" role="group" aria-label="Filtrar jornada">
          ${filters.map(([id,label]) => `<button type="button" class="journey-filter ${filter===id?'active':''}" data-journey-filter="${id}">${label}</button>`).join('')}
        </div>
        ${events.length ? `<div class="journey-events">${events.map(journeyEventCard).join('')}</div>` : '<div class="empty"><strong>Nada aqui ainda.</strong>Os acontecimentos desse tipo aparecerão conforme sua jornada ganhar história.</div>'}
      </section>
    `;
  }

  function isStandaloneMode() {
    return Boolean(
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      window.navigator.standalone === true
    );
  }

  function isIosBrowser() {
    const ua = navigator.userAgent || '';
    const iOSDevice = /iPad|iPhone|iPod/.test(ua);
    const iPadDesktopMode = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    return iOSDevice || iPadDesktopMode;
  }

  function pwaStatus() {
    const served = location.protocol === 'http:' || location.protocol === 'https:';
    const standalone = isStandaloneMode();
    const ios = isIosBrowser();
    if (standalone) return { key: 'installed', label: 'Instalado', detail: 'Você está usando o Única Coisa como aplicativo.' };
    if (!served) return { key: 'portable', label: 'Modo portátil', detail: 'Para instalar no celular, use o projeto PWA servido por HTTPS ou localhost.' };
    if (deferredInstallPrompt) return { key: 'ready', label: 'Pronto para instalar', detail: 'Instale o app para abrir em uma janela própria e usar offline.' };
    if (ios) return { key: 'ios', label: 'Instalação manual', detail: 'No Safari: Compartilhar → Adicionar à Tela de Início.' };
    return { key: 'browser', label: 'Disponível pelo navegador', detail: 'Use a opção “Instalar app” ou “Adicionar à tela inicial” do navegador quando disponível.' };
  }

  function pwaSettingsCard() {
    const status = pwaStatus();
    const update = swUpdateReady;
    const installAction = status.key === 'ready'
      ? '<button type="button" class="action-btn pwa-primary" data-action="install-pwa">Instalar Única Coisa</button>'
      : '';
    const iosHint = status.key === 'ios'
      ? '<div class="pwa-steps"><span>1. Toque em <b>Compartilhar</b></span><span>2. Escolha <b>Adicionar à Tela de Início</b></span><span>3. Confirme <b>Adicionar</b></span></div>'
      : '';
    const portableHint = status.key === 'portable'
      ? '<p class="settings-hint">O arquivo único continua funcionando normalmente, mas service worker, instalação e atualização automática exigem a versão PWA.</p>'
      : '';
    const updateBlock = update
      ? '<div class="pwa-update"><div><strong>Atualização pronta</strong><span>Uma nova versão dos arquivos do app já foi baixada.</span></div><button type="button" class="secondary-btn" data-action="apply-pwa-update">Atualizar agora</button></div>'
      : '<div class="pwa-update quiet"><div><strong>Atualizações</strong><span>O app verifica novas versões quando é aberto e quando volta ao primeiro plano.</span></div></div>';
    return `
      <div class="pwa-card">
        <div class="pwa-status-row">
          <div class="pwa-app-icon" aria-hidden="true"><span></span></div>
          <div class="pwa-status-copy"><strong>${escapeHtml(status.label)}</strong><span>${escapeHtml(status.detail)}</span></div>
          <span class="pwa-status-badge ${status.key}">${status.key === 'installed' ? '✓ App' : 'PWA'}</span>
        </div>
        ${installAction}
        ${iosHint}
        ${portableHint}
        ${updateBlock}
        <div class="pwa-offline-note"><span aria-hidden="true">↯</span><div><strong>Funciona offline</strong><span>Depois do primeiro carregamento, o núcleo do app fica disponível sem internet.</span></div></div>
      </div>`;
  }

  function renderSettings() {
    const prefs = state.preferences || DEFAULT_STATE.preferences;
    const safety = readSafetyBackup();
    const lastExport = state.dataSafety?.lastExportedAt;
    const lastImport = state.dataSafety?.lastImportedAt;
    const themeLabel = ({ system: 'Seguir o aparelho', light: 'Claro', dark: 'Escuro' })[prefs.theme] || 'Seguir o aparelho';
    const weekLabel = prefs.weekStartsOn === 'sunday' ? 'Domingo' : 'Segunda-feira';
    const dateLabel = prefs.dateFormat === 'numeric' ? '01/10/2026' : '01 out 2026';
    return `
      <div class="kicker">Preferências</div>
      <h1 class="page-title">Configurações</h1>
      <p class="page-subtitle">Poucas escolhas, só as que ajudam o app a se adaptar a você sem desviar do foco.</p>

      <section class="section settings-section">
        <div class="section-head"><h3 class="section-title">Aparência</h3><span class="section-note">${escapeHtml(themeLabel)}</span></div>
        <div class="settings-card">
          <div class="setting-copy"><strong>Tema</strong><span>Escolha como o Única Coisa aparece no seu aparelho.</span></div>
          <div class="setting-choice-row" role="group" aria-label="Tema">
            ${[['system','Sistema'],['light','Claro'],['dark','Escuro']].map(([value,label]) => `<button type="button" class="setting-choice ${prefs.theme===value?'active':''}" data-setting-theme="${value}" aria-pressed="${prefs.theme===value}">${label}</button>`).join('')}
          </div>
        </div>
      </section>

      <section class="section settings-section">
        <div class="section-head"><h3 class="section-title">Tempo e calendário</h3></div>
        <div class="settings-card settings-stack">
          <label class="setting-select-row" for="setting-date-format"><span><strong>Formato das datas</strong><small>Exemplo: ${escapeHtml(dateLabel)}</small></span><select id="setting-date-format"><option value="written" ${prefs.dateFormat==='written'?'selected':''}>Por extenso</option><option value="numeric" ${prefs.dateFormat==='numeric'?'selected':''}>Numérico</option></select></label>
          <div class="settings-divider"></div>
          <label class="setting-select-row" for="setting-week-start"><span><strong>Início da semana</strong><small>Hoje: ${escapeHtml(weekLabel)}</small></span><select id="setting-week-start"><option value="monday" ${prefs.weekStartsOn==='monday'?'selected':''}>Segunda-feira</option><option value="sunday" ${prefs.weekStartsOn==='sunday'?'selected':''}>Domingo</option></select></label>
          <p class="settings-hint">Mudar o início da semana altera a semana atual e as próximas. Seu histórico já registrado continua preservado.</p>
        </div>
      </section>

      <section class="section settings-section">
        <div class="section-head"><h3 class="section-title">Aplicativo</h3><span class="section-note">instalação e offline</span></div>
        ${pwaSettingsCard()}
      </section>

      <section class="section settings-section">
        <div class="section-head"><h3 class="section-title">Seus dados</h3><span class="section-note">local-first</span></div>
        <div class="data-safety-card settings-data-card">
          <div class="data-safety-icon">↧</div>
          <div class="data-safety-copy">
            <h3>Sua jornada fica neste aparelho.</h3>
            <p>Faça backups para não depender de um único navegador ou celular.</p>
            <div class="data-safety-status">
              <span><b>Último backup</b>${escapeHtml(formatDateTime(lastExport))}</span>
              ${lastImport ? `<span><b>Última restauração</b>${escapeHtml(formatDateTime(lastImport))}</span>` : ''}
            </div>
            <div class="data-safety-actions">
              <button type="button" class="action-btn data-safety-primary" data-action="export-backup">Exportar backup</button>
              <button type="button" class="secondary-btn" data-action="open-import-backup">Restaurar backup</button>
              ${safety ? `<button type="button" class="text-btn data-safety-rollback" data-action="open-rollback-backup">Desfazer última restauração</button>` : ''}
            </div>
            <input id="backup-file-input" class="visually-hidden-file" type="file" accept=".json,application/json" />
          </div>
        </div>
      </section>

      <section class="section settings-section">
        <div class="section-head"><h3 class="section-title">Sobre</h3></div>
        <div class="settings-card about-card">
          <div class="about-mark brand-mark" aria-hidden="true"></div>
          <div><strong>Única Coisa <span>V${APP_VERSION}</span></strong><p>Transforme o que você quer da vida em uma prioridade e essa prioridade em uma ação de cada vez.</p><small>Sem conta e sem nuvem nesta versão. Seus dados permanecem no dispositivo até você exportá-los.</small></div>
        </div>
      </section>

      <section class="section settings-section danger-zone">
        <div class="section-head"><h3 class="section-title">Zona de segurança</h3></div>
        <div class="settings-card danger-card"><div class="setting-copy"><strong>Recomeçar do zero</strong><span>Apaga objetivos, histórico, backups locais e preferências deste aparelho.</span></div><button type="button" class="secondary-btn danger-btn" data-action="open-reset-data">Apagar todos os dados</button></div>
      </section>
    `;
  }

  function renderGoalDetail(goal) {
    if (!goal) {
      state.detailGoalId = null;
      return renderLife();
    }
    if (isCompletedGoal(goal.id)) return renderCompletedGoalDetail(goal);
    if (isLaterGoal(goal.id)) return renderLaterGoalDetail(goal);
    const main = goal.id === state.activeGoalId;
    const reviews = goalReviews(goal.id).slice(0, 3);
    const completedMilestones = completedMilestonesForGoal(goal.id).slice(0, 4);
    return `
      <button class="text-btn" type="button" data-action="close-detail">← Voltar</button>
      <div class="kicker">${main ? '⭐ Foco principal' : 'Objetivo'}</div>
      <h1 class="page-title">${escapeHtml(goal.emoji)} ${escapeHtml(goal.title)}</h1>
      <p class="page-subtitle">${escapeHtml(goal.success || 'Seu objetivo e a ação que mais contribui para alcançá-lo.')}</p>

      <section class="section goal-direction-card">
        <div class="goal-direction-label">Minha Única Coisa</div>
        <h2>${escapeHtml(goal.oneThing)}</h2>
        ${goal.milestone ? `<div class="goal-direction-milestone">${milestoneControl(goal)}</div>` : ''}
        ${main ? `<div class="goal-direction-now">${focusZoomControl(goal)}</div>` : ''}
        <details class="goal-detail-context">
          <summary><span><strong>Contexto e compromisso</strong><small>porquê, ritmo e período de foco</small></span><b aria-hidden="true">+</b></summary>
          <div class="goal-detail-context-body">
            ${goal.why ? `<div class="context-why"><span>Por que isso importa</span><p>${escapeHtml(goal.why)}</p></div>` : ''}
            <div class="context-meta"><span>Ritmo</span><strong>${escapeHtml(frequencyLabel(goal.frequency))}</strong></div>
            ${main ? focusCommitmentControl(goal) : ''}
          </div>
        </details>
      </section>

      <section class="section detail-rhythm-card">
        <div><span>Consistência</span><strong>${consistency(goal.id)}%</strong><small>últimos 30 dias</small></div>
        <div><span>Sequência</span><strong>🔥 ${streak(goal.id)}</strong><small>${streakUnit(goal, streak(goal.id))}</small></div>
        <div><span>Recorde</span><strong>${bestStreak(goal.id)}</strong><small>${streakUnit(goal, bestStreak(goal.id))}</small></div>
      </section>

      ${completedMilestones.length ? `<section class="section"><div class="section-head"><h3 class="section-title">Marcos alcançados</h3><span class="section-note">${completedMilestonesForGoal(goal.id).length} no total</span></div><div class="milestone-history">${completedMilestones.map(item => `<div class="milestone-history-item"><span class="milestone-history-check">✓</span><div><strong>${escapeHtml(item.title)}</strong><small>${formatShortDate(item.completedAt)}${item.target ? ` · ${formatMetric(item.target)}${item.unit ? ` ${escapeHtml(item.unit)}` : ''}` : ''}</small></div></div>`).join('')}</div></section>` : ''}

      ${reviews.length ? `<section class="section"><div class="section-head"><h3 class="section-title">Revisões recentes</h3><span class="section-note">${goalReviews(goal.id).length} no total</span></div><div class="review-history">${reviews.map(review => `<div class="review-history-item"><div><strong>${escapeHtml(reviewDecisionLabel(review.decision))}</strong><span>${formatShortDate(review.date)} · ${review.consistency}% de consistência na semana</span></div>${review.note ? `<p>${escapeHtml(review.note)}</p>` : ''}</div>`).join('')}</div></section>` : ''}

      ${main && reviewDue(goal) ? `<div class="inline-actions"><button type="button" class="secondary-btn" data-action="open-review" data-goal-id="${goal.id}">Fazer revisão semanal</button></div>` : ''}

      <div class="inline-actions goal-detail-actions">
        ${main ? '' : `<button type="button" class="secondary-btn" data-action="make-main" data-goal-id="${goal.id}">Tornar A Única Coisa</button>`}
        <button type="button" class="secondary-btn" data-action="edit-goal" data-goal-id="${goal.id}">Editar objetivo</button>
        <button type="button" class="secondary-btn later-action-btn" data-action="open-defer-goal" data-goal-id="${goal.id}">Mover para Depois</button>
        <button type="button" class="secondary-btn complete-goal-btn" data-action="open-complete-goal" data-goal-id="${goal.id}">✓ Concluir objetivo</button>
        ${state.goals.length > 1 ? `<button type="button" class="text-btn danger-btn" data-action="delete-goal" data-goal-id="${goal.id}">Excluir</button>` : ''}
      </div>
    `;
  }

  function renderLaterGoalDetail(goal) {
    const milestones = completedMilestonesForGoal(goal.id);
    return `
      <button class="text-btn" type="button" data-action="close-detail">← Voltar</button>
      <div class="kicker">Depois</div>
      <h1 class="page-title">${escapeHtml(goal.emoji || '🎯')} ${escapeHtml(goal.title)}</h1>
      <p class="page-subtitle">Este objetivo continua importante, mas está fora do seu radar ativo${goal.deferredAt ? ` desde ${formatShortDate(goal.deferredAt)}` : ''}.</p>

      <section class="section later-detail-hero">
        <span>Guardado sem competir por atenção</span>
        <h2>${escapeHtml(goal.oneThing)}</h2>
        ${goal.milestone ? `<div class="later-detail-milestone"><small>Marco preservado</small><strong>${escapeHtml(goal.milestone)}</strong>${milestoneProgress(goal) ? `<em>${milestoneProgress(goal).percentage}% registrado</em>` : ''}</div>` : ''}
        ${goal.why ? `<div class="later-detail-why"><small>Por que isso importa</small><p>${escapeHtml(goal.why)}</p></div>` : ''}
      </section>

      ${milestones.length ? `<section class="section"><div class="section-head"><h3 class="section-title">Histórico preservado</h3><span class="section-note">${milestones.length} ${milestones.length === 1 ? 'marco alcançado' : 'marcos alcançados'}</span></div></section>` : ''}

      <div class="inline-actions goal-detail-actions">
        <button type="button" class="action-btn" style="margin-top:0" data-action="reactivate-goal" data-goal-id="${goal.id}">Trazer para Ativos</button>
        <button type="button" class="secondary-btn" data-action="edit-goal" data-goal-id="${goal.id}">Editar objetivo</button>
        <button type="button" class="secondary-btn complete-goal-btn" data-action="open-complete-goal" data-goal-id="${goal.id}">✓ Concluir objetivo</button>
        <button type="button" class="text-btn danger-btn" data-action="delete-goal" data-goal-id="${goal.id}">Excluir</button>
      </div>
    `;
  }

  function renderCompletedGoalDetail(goal) {
    const stats = goal.completionStats || {};
    const milestones = completedMilestonesForGoal(goal.id);
    const duration = goal.createdAt && goal.completedAt ? formatDuration(goal.createdAt, goal.completedAt) : null;
    return `
      <button class="text-btn" type="button" data-action="close-detail">← Voltar</button>
      <div class="kicker">✓ Capítulo concluído</div>
      <h1 class="page-title">${escapeHtml(goal.emoji || '🎯')} ${escapeHtml(goal.title)}</h1>
      <p class="page-subtitle">Concluído em ${goal.completedAt ? formatShortDate(goal.completedAt) : 'data não registrada'}${duration ? ` · ${duration} desde a criação` : ''}.</p>

      <section class="completed-chapter-hero section">
        <div class="completed-chapter-mark">✓</div>
        <div><span>Reflexão final</span><blockquote>${escapeHtml(goal.completionReflection || 'Este objetivo foi concluído e permanece como parte da sua Jornada.')}</blockquote></div>
      </section>

      <section class="section completed-chapter-stats">
        <div><span>Conclusões</span><strong>${Number.isFinite(stats.totalDone) ? stats.totalDone : totalDone(goal.id)}</strong></div>
        <div><span>Melhor sequência</span><strong>${Number.isFinite(stats.bestStreak) ? stats.bestStreak : bestStreak(goal.id)}</strong></div>
        <div><span>Marcos</span><strong>${Number.isFinite(stats.milestones) ? stats.milestones : milestones.length}</strong></div>
      </section>

      <section class="section goal-direction-card completed-direction-card">
        <div class="goal-direction-label">A Única Coisa que moveu este objetivo</div>
        <h2>${escapeHtml(goal.oneThing)}</h2>
        ${goal.success ? `<div class="completed-success"><span>Como o sucesso foi definido</span><p>${escapeHtml(goal.success)}</p></div>` : ''}
        ${goal.why ? `<div class="completed-success"><span>Por que importava</span><p>${escapeHtml(goal.why)}</p></div>` : ''}
      </section>

      ${milestones.length ? `<section class="section"><div class="section-head"><h3 class="section-title">Marcos deste capítulo</h3><span class="section-note">${milestones.length} no total</span></div><div class="milestone-history">${milestones.slice(0,8).map(item => `<div class="milestone-history-item"><span class="milestone-history-check">✓</span><div><strong>${escapeHtml(item.title)}</strong><small>${formatShortDate(item.completedAt)}${item.target ? ` · ${formatMetric(item.target)}${item.unit ? ` ${escapeHtml(item.unit)}` : ''}` : ''}</small></div></div>`).join('')}</div></section>` : ''}
    `;
  }

  function frequencyLabel(value) {
    return ({ daily: 'Todos os dias', weekdays: 'Dias úteis', weekly: 'Semanalmente', custom: 'Ritmo personalizado' })[value] || 'Todos os dias';
  }

  function renderModal() {
    if (!state.modal) return '';
    if (state.modal.type === 'goal') return goalModal(state.modal.goalId ? goalById(state.modal.goalId) : null);
    if (state.modal.type === 'focus') return focusModal(goalById(state.modal.goalId));
    if (state.modal.type === 'focus-ritual') return focusRitualModal(goalById(state.modal.goalId));
    if (state.modal.type === 'focus-period') return focusPeriodModal(goalById(state.modal.goalId));
    if (state.modal.type === 'milestone') return milestoneModal(goalById(state.modal.goalId));
    if (state.modal.type === 'next-milestone') return nextMilestoneModal(goalById(state.modal.goalId));
    if (state.modal.type === 'review') return reviewModal(goalById(state.modal.goalId));
    if (state.modal.type === 'weekly-focus') return weeklyFocusModal(goalById(state.modal.goalId));
    if (state.modal.type === 'daily-action') return dailyActionModal(goalById(state.modal.goalId));
    if (state.modal.type === 'complete-goal') return completeGoalModal(goalById(state.modal.goalId));
    if (state.modal.type === 'defer-goal') return deferGoalModal(goalById(state.modal.goalId));
    if (state.modal.type === 'backup-import') return backupImportModal();
    if (state.modal.type === 'backup-rollback') return backupRollbackModal();
    if (state.modal.type === 'reset-data') return resetDataModal();
    return '';
  }

  function deferGoalModal(goal) {
    if (!goal || isLaterGoal(goal.id) || isCompletedGoal(goal.id)) return '';
    const main = goal.id === state.activeGoalId;
    return `
      <div class="overlay" data-action="overlay-close">
        <section class="sheet" role="dialog" aria-modal="true" data-sheet>
          <div class="kicker">Guardar para depois</div>
          <h2 class="sheet-title">Tirar ${escapeHtml(goal.emoji || '🎯')} ${escapeHtml(goal.title)} do radar ativo?</h2>
          <p class="sheet-subtitle">Nada será apagado. Check-ins, marcos, revisões e histórico continuam preservados. O objetivo apenas deixa de competir por atenção${main ? ' e deixa de ser A Única Coisa principal' : ''}.</p>
          <div class="later-modal-note"><span>Depois significa:</span><strong>“Isso importa — só não é para agora.”</strong></div>
          <div class="sheet-actions"><button class="secondary-btn" type="button" data-action="close-modal">Cancelar</button><button class="action-btn" style="margin-top:0" type="button" data-action="confirm-defer-goal" data-goal-id="${goal.id}">Mover para Depois</button></div>
        </section>
      </div>`;
  }

  function completeGoalModal(goal) {
    if (!goal || isCompletedGoal(goal.id)) return '';
    const progress = milestoneProgress(goal);
    const milestones = completedMilestonesForGoal(goal.id).length + (progress?.complete && !state.milestoneHistory.some(item => item.milestoneId === goal.milestoneId) ? 1 : 0);
    return `
      <div class="overlay" data-action="overlay-close">
        <section class="sheet completion-sheet" role="dialog" aria-modal="true" aria-labelledby="complete-goal-title" data-sheet>
          <div class="kicker">Encerrar um capítulo</div>
          <h2 class="sheet-title" id="complete-goal-title">Concluir ${escapeHtml(goal.emoji || '🎯')} ${escapeHtml(goal.title)}?</h2>
          <p class="sheet-subtitle">Isso não apaga nada. O objetivo sai da sua vida ativa e permanece na Jornada com todo o histórico construído até aqui.</p>
          <div class="completion-preview">
            <div><span>Conclusões</span><strong>${totalDone(goal.id)}</strong></div>
            <div><span>Marcos</span><strong>${milestones}</strong></div>
            <div><span>Desde</span><strong>${goal.createdAt ? formatShortDate(goal.createdAt) : '—'}</strong></div>
          </div>
          ${goal.milestone && !progress?.complete ? `<div class="completion-warning"><strong>Seu marco atual ainda não está marcado como alcançado.</strong><span>Você ainda pode concluir o objetivo se ele já cumpriu seu propósito.</span></div>` : ''}
          <form id="goal-completion-form" class="form-grid" data-goal-id="${goal.id}">
            <div class="field"><label for="completionReflection">O que este objetivo representou ou ensinou?</label><textarea id="completionReflection" name="reflection" maxlength="500" required placeholder="Ex.: aprendi que consistência pequena funcionou melhor do que tentar compensar tudo em um único dia."></textarea><small>Uma frase já basta. Essa reflexão ficará preservada no capítulo concluído.</small></div>
            <div id="goal-completion-error" class="error" hidden></div>
            <div class="sheet-actions"><button class="secondary-btn" type="button" data-action="close-modal">Ainda não</button><button class="action-btn" style="margin-top:0" type="submit">Concluir este objetivo</button></div>
          </form>
        </section>
      </div>`;
  }

  function backupImportModal() {
    const meta = state.modal?.backupMeta;
    if (!meta) return '';
    const s = meta.summary || { goals:0, checkIns:0, milestones:0, reviews:0, cycles:0 };
    return `
      <div class="overlay" data-action="overlay-close">
        <section class="sheet backup-sheet" role="dialog" aria-modal="true" aria-labelledby="backup-import-title" data-sheet>
          <div class="kicker">Restaurar backup</div>
          <h2 class="sheet-title" id="backup-import-title">Confira antes de substituir seus dados.</h2>
          <p class="sheet-subtitle">O arquivo parece válido. A restauração substituirá o conteúdo atual deste aparelho, mas criaremos uma cópia automática para você poder desfazer.</p>
          <div class="backup-file-summary">
            <div><span>Arquivo</span><strong>${escapeHtml(meta.filename || 'backup.json')}</strong></div>
            <div><span>Criado em</span><strong>${escapeHtml(formatDateTime(meta.createdAt))}</strong></div>
            <div><span>Versão do app</span><strong>V${escapeHtml(meta.appVersion || '?')}</strong></div>
          </div>
          <div class="backup-summary-grid">
            <div><strong>${s.goals}</strong><span>objetivos${s.laterGoals ? ` · ${s.laterGoals} em Depois` : ''}</span></div>
            <div><strong>${s.checkIns}</strong><span>conclusões</span></div>
            <div><strong>${s.milestones}</strong><span>marcos</span></div>
            <div><strong>${s.reviews}</strong><span>revisões</span></div>
          </div>
          <label class="backup-confirm-row"><input id="backup-import-confirm" type="checkbox" /> <span>Entendo que os dados atuais serão substituídos por este backup.</span></label>
          <div class="sheet-actions"><button class="secondary-btn" type="button" data-action="close-modal">Cancelar</button><button class="action-btn" style="margin-top:0" id="backup-import-submit" type="button" data-action="confirm-import-backup" disabled>Restaurar meus dados</button></div>
        </section>
      </div>
    `;
  }

  function backupRollbackModal() {
    const safety = readSafetyBackup();
    if (!safety) return '';
    const summary = backupSummary(safety.state || {});
    return `
      <div class="overlay" data-action="overlay-close">
        <section class="sheet backup-sheet" role="dialog" aria-modal="true" aria-labelledby="backup-rollback-title" data-sheet>
          <div class="kicker">Cópia de segurança automática</div>
          <h2 class="sheet-title" id="backup-rollback-title">Voltar ao estado anterior?</h2>
          <p class="sheet-subtitle">Antes da última restauração, o app guardou automaticamente seus dados anteriores neste aparelho.</p>
          <div class="backup-file-summary">
            <div><span>Cópia criada em</span><strong>${escapeHtml(formatDateTime(safety.createdAt))}</strong></div>
            <div><span>Conteúdo</span><strong>${summary.goals} objetivos · ${summary.checkIns} conclusões</strong></div>
          </div>
          <div class="backup-warning">Ao voltar, o estado atual também será guardado. Assim, você poderá desfazer novamente se mudar de ideia.</div>
          <div class="sheet-actions"><button class="secondary-btn" type="button" data-action="close-modal">Cancelar</button><button class="action-btn" style="margin-top:0" type="button" data-action="confirm-rollback-backup">Voltar ao estado anterior</button></div>
        </section>
      </div>
    `;
  }

  function resetDataModal() {
    return `
      <div class="overlay" data-action="overlay-close">
        <section class="sheet backup-sheet" role="dialog" aria-modal="true" aria-labelledby="reset-data-title" data-sheet>
          <div class="kicker">Apagar todos os dados</div>
          <h2 class="sheet-title" id="reset-data-title">Recomeçar realmente do zero?</h2>

    app.innerHTML = `

          <div class="onboarding-card">
            <div class="step-caption"><div class="step-dots">${steps.map((_,i)=>`<div class="step-dot ${i<=step?'active':''}"></div>`).join('')}</div><div class="step-count">${step+1}/${steps.length}</div></div>
