<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1e9" />
  <meta name="description" content="Única Coisa — clareza para escolher, executar e proteger o que mais importa." />
  <meta name="application-name" content="Única Coisa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Única Coisa" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
:root {
  color-scheme: light;
  --bg: #f4f1e9;
  --bg-elevated: #faf8f3;
  --surface: #ffffff;
  --surface-2: #ece8dd;
  --surface-3: #e4dfd2;
  --ink: #17231f;
  --text: #26312d;
  --muted: #727a74;
  --muted-2: #969b96;
  --line: #ddd8cc;
  --line-strong: #cec7b8;
  --accent: #1f4b3f;
  --accent-strong: #173a31;
  --accent-soft: #dce9e2;
  --accent-faint: #eef5f1;
  --gold: #a77735;
  --gold-soft: #f2e8d8;
  --danger: #9a4343;
  --danger-soft: #f8eaea;
  --success: #346e59;
  --shadow-sm: 0 4px 14px rgba(31, 39, 35, .05);
  --shadow-md: 0 14px 38px rgba(31, 39, 35, .08);
  --shadow-lg: 0 24px 70px rgba(20, 31, 27, .14);
  --radius-xl: 30px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 14px;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -170px, rgba(255,255,255,.9), transparent 360px),
    var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid rgba(31, 75, 63, .18);
  outline-offset: 3px;
}
::selection { background: var(--accent-soft); color: var(--ink); }

.app-shell {
  width: min(100%, 760px);
  margin: 0 auto;
  min-height: 100vh;
  padding: max(18px, env(safe-area-inset-top)) 18px calc(118px + env(safe-area-inset-bottom));
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-height: 52px;
  margin-bottom: 30px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.brand-mark {
  position: relative;
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border-radius: 14px;
  background: var(--accent);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.brand-mark::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 2px solid rgba(255,255,255,.42);
  border-radius: 50%;
}
.brand-mark::after {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: white;
  left: 16px;
  top: 16px;
  box-shadow: 10px -10px 0 -2px #d5b074;
}
.brand-text { min-width: 0; }
.brand-title { color: var(--ink); font-weight: 820; letter-spacing: -.035em; line-height: 1.05; }
.brand-subtitle { color: var(--muted); font-size: .76rem; margin-top: 4px; }
.icon-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(255,255,255,.66);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform .16s ease, background .16s ease, border-color .16s ease;
}
.icon-btn svg { width: 20px; height: 20px; display: block; }
.icon-btn:active { transform: scale(.96); }

.kicker {
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: .68rem;
  font-weight: 850;
  color: var(--accent);
}
.page-title {
  max-width: 690px;
  margin: 9px 0 8px;
  color: var(--ink);
  font-size: clamp(2rem, 8vw, 3.15rem);
  line-height: 1.01;
  letter-spacing: -.055em;
  text-wrap: balance;
}
.page-subtitle {
  max-width: 620px;
  color: var(--muted);
  line-height: 1.58;
  margin: 0;
  font-size: .98rem;
}

.today-intro { padding: 2px 2px 0; }
.today-intro .page-title { max-width: 540px; }

.hero,
.focus-card {
  position: relative;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  padding: 23px;
  box-shadow: var(--shadow-md);
}
.focus-card::before {
  content: "";
  position: absolute;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  right: -78px;
  top: -92px;
  border: 30px solid var(--accent-faint);
  pointer-events: none;
}
.focus-card.complete::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(52,110,89,.22);
}
.focus-card-top {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.focus-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--accent);
  font-size: .72rem;
  font-weight: 850;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.focus-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px var(--accent-soft);
}
.focus-age {
  color: var(--muted);
  font-size: .76rem;
  font-weight: 720;
}
.focus-symbol {
  position: relative;
  z-index: 1;
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  margin-top: 28px;
  border-radius: 17px;
  background: var(--surface-2);
  font-size: 1.55rem;
}
.hero-title,
.focus-title {
  position: relative;
  z-index: 1;
  max-width: 600px;
  margin: 15px 0 0;
  color: var(--ink);
  font-size: clamp(2.25rem, 10vw, 4.55rem);
  line-height: .94;
  letter-spacing: -.065em;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.focus-divider {
  height: 1px;
  margin: 24px 0 19px;
  background: var(--line);
}
.focus-action-label {
  color: var(--muted);
  font-size: .74rem;
  font-weight: 800;
  letter-spacing: .04em;
}
.hero-one-thing,
.focus-one-thing {
  max-width: 620px;
  margin: 7px 0 0;
  color: var(--text);
  font-size: 1.13rem;
  line-height: 1.47;
  font-weight: 650;
}
.milestone-chip {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 18px;
  padding: 12px 14px;
  border-radius: 15px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: .83rem;
  line-height: 1.4;
}
.milestone-chip svg { width: 18px; height: 18px; display: block; color: var(--accent); margin-top: 1px; }
.milestone-chip strong { color: var(--text); }
.hero-why { margin-top: 18px; }
.why-disclosure {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 4px;
}
.why-disclosure summary {
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  list-style: none;
  color: var(--muted);
  font-size: .82rem;
  font-weight: 760;
  cursor: pointer;
}
.why-disclosure summary::-webkit-details-marker { display: none; }
.why-disclosure summary::after { content: "+"; color: var(--accent); font-size: 1rem; }
.why-disclosure[open] summary::after { content: "–"; }
.why-disclosure p { margin: 2px 0 10px; color: var(--text); line-height: 1.55; font-size: .92rem; }

.action-btn {
  width: 100%;
  min-height: 56px;
  border: 0;
  border-radius: 17px;
  margin-top: 20px;
  padding: 14px 18px;
  background: var(--accent);
  color: white;
  font-weight: 820;
  letter-spacing: -.01em;
  box-shadow: 0 8px 18px rgba(31,75,63,.16);
  transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
}
.action-btn:active { transform: scale(.985); }
.action-btn:hover { background: var(--accent-strong); }
.action-btn.done {
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: none;
  border: 1px solid rgba(31,75,63,.16);
}
.check-action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.check-action .check-circle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 2px solid currentColor;
  font-size: .76rem;
  line-height: 1;
}
.completion-note {
  margin: 10px 0 0;
  text-align: center;
  color: var(--muted);
  font-size: .78rem;
}
.secondary-btn {
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 11px 15px;
  background: var(--surface);
  color: var(--text);
  font-weight: 760;
}
.text-btn {
  border: 0;
  background: transparent;
  color: var(--accent);
  padding: 8px 0;
  font-weight: 780;
}
.danger-btn { color: var(--danger); }

.progress-panel {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 18px;
  margin-top: 14px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 21px;
  background: rgba(255,255,255,.62);
}
.progress-ring {
  --progress: 0;
  width: 72px;
  height: 72px;
  position: relative;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--progress) * 1%), var(--surface-3) 0);
}
.progress-ring::before {
  content: "";
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--bg-elevated);
}
.progress-ring strong {
  position: absolute;
  color: var(--ink);
  font-size: .92rem;
  letter-spacing: -.03em;
}
.progress-copy { min-width: 0; }
.progress-title { color: var(--ink); font-weight: 820; letter-spacing: -.02em; }
.progress-caption { color: var(--muted); font-size: .76rem; margin-top: 3px; line-height: 1.35; }
.progress-mini-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 10px;
}
.progress-mini {
  display: flex;
  gap: 5px;
  align-items: baseline;
  color: var(--muted);
  font-size: .75rem;
}
.progress-mini b { color: var(--text); font-size: .88rem; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-top: 14px;
}
.stat {
  background: rgba(255,255,255,.7);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 14px;
  min-width: 0;
}
.stat-value { color: var(--ink); font-size: 1.25rem; font-weight: 850; letter-spacing: -.04em; }
.stat-label { margin-top: 4px; color: var(--muted); font-size: .73rem; line-height: 1.25; }

.section { margin-top: 30px; }
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
}
.section-title { margin: 0; color: var(--ink); font-size: 1.03rem; letter-spacing: -.025em; }
.section-note { color: var(--muted); font-size: .76rem; }

.week-panel {
  border: 1px solid var(--line);
  border-radius: 21px;
  background: rgba(255,255,255,.58);
  padding: 15px 13px 13px;
}
.calendar-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
}
.day-wrap { min-width: 0; text-align: center; }
.day-name { color: var(--muted); font-size: .65rem; font-weight: 760; text-transform: uppercase; margin-bottom: 7px; }
.day-dot {
  width: 100%;
  max-width: 42px;
  aspect-ratio: 1;
  margin: 0 auto;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--muted);
  font-size: .7rem;
  font-weight: 820;
  border: 1px solid transparent;
}
.day-dot.done { background: var(--accent); color: white; }
.day-dot.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.day-dot.done.today { border-color: var(--accent); }

.goal-list { display: grid; gap: 10px; }
.goal-card {
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(255,255,255,.74);
  padding: 16px;
  color: var(--text);
  transition: transform .15s ease, border-color .15s ease, background .15s ease;
}
.goal-card:active { transform: scale(.99); }
.goal-card.main {
  border-color: rgba(31,75,63,.3);
  background: linear-gradient(145deg, #ffffff 0%, #f3f8f5 100%);
  box-shadow: var(--shadow-sm);
}
.goal-top { display: flex; align-items: flex-start; gap: 12px; }
.goal-icon {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border-radius: 15px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 1.28rem;
}
.goal-card.main .goal-icon { background: var(--accent-soft); }
.goal-copy { min-width: 0; flex: 1; }
.goal-name { color: var(--ink); font-weight: 840; letter-spacing: -.028em; overflow-wrap: anywhere; }
.goal-one { color: var(--muted); margin-top: 5px; line-height: 1.42; font-size: .88rem; overflow-wrap: anywhere; }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  border-radius: 999px;
  padding: 3px 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .66rem;
  font-weight: 820;
  white-space: nowrap;
}
.goal-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 14px;
  color: var(--muted);
  font-size: .72rem;
  margin-top: 12px;
}
.empty {
  text-align: center;
  padding: 30px 18px;
  border: 1px dashed var(--line-strong);
  border-radius: 21px;
  color: var(--muted);
  background: rgba(255,255,255,.34);
}
.empty strong { color: var(--text); display: block; margin-bottom: 6px; }

.nav {
  position: fixed;
  left: 50%;
  bottom: max(11px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(calc(100% - 24px), 720px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  padding: 6px;
  border-radius: 22px;
  background: rgba(250,248,243,.92);
  border: 1px solid rgba(206,199,184,.85);
  box-shadow: 0 16px 45px rgba(24,34,30,.15);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  z-index: 20;
}
.nav button {
  min-height: 58px;
  border: 0;
  border-radius: 16px;
  background: transparent;
  color: var(--muted);
  font-weight: 760;
  font-size: .7rem;
  transition: background .15s ease, color .15s ease, transform .15s ease;
}
.nav button:active { transform: scale(.97); }
.nav button.active { background: var(--accent); color: white; }
.nav-icon {
  width: 20px;
  height: 20px;
  display: block;
  margin: 0 auto 3px;
}
.nav-icon svg { width: 100%; height: 100%; display: block; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 25, 21, .46);
  z-index: 50;
  display: grid;
  align-items: end;
  padding: 12px;
  backdrop-filter: blur(5px);
}
.sheet {
  position: relative;
  width: min(100%, 680px);
  margin: 0 auto;
  max-height: calc(100vh - 24px);
  overflow: auto;
  overscroll-behavior: contain;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 28px;
  padding: 28px 19px 20px;
  box-shadow: var(--shadow-lg);
}
.sheet::before {
  content: "";
  position: absolute;
  width: 42px;
  height: 4px;
  border-radius: 99px;
  left: 50%;
  top: 11px;
  transform: translateX(-50%);
  background: var(--line-strong);
}
.sheet-title { margin: 0; color: var(--ink); font-size: 1.55rem; line-height: 1.12; letter-spacing: -.045em; }
.sheet-subtitle { color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
.sheet-actions { display: flex; gap: 9px; margin-top: 19px; }
.sheet-actions > * { flex: 1; }

.form-grid { display: grid; gap: 15px; margin-top: 20px; }
.field label { display: block; color: var(--text); font-size: .78rem; font-weight: 800; margin-bottom: 7px; }
.field small { display: block; color: var(--muted); margin-top: 6px; line-height: 1.38; font-size: .76rem; }
.field input, .field textarea, .field select {
  width: 100%;
  min-height: 52px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface);
  color: var(--text);
  padding: 13px 14px;
  font-size: 16px;
  box-shadow: inset 0 1px 0 rgba(0,0,0,.015);
}
.field input::placeholder, .field textarea::placeholder { color: #a4a8a4; }
.field textarea { min-height: 98px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 88px 1fr; gap: 10px; }
.error {
  color: var(--danger);
  background: var(--danger-soft);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: .78rem;
  margin-top: 4px;
}
.error[hidden] { display: none; }

.onboarding {
  width: min(100%, 640px);
  margin: 0 auto;
  padding: 14px 0 38px;
}
.onboarding .brand { margin: 4px 2px 26px; }
.onboarding-card {
  position: relative;
  overflow: hidden;
  background: rgba(255,255,255,.82);
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 23px;
  box-shadow: var(--shadow-md);
}
.onboarding-card::after {
  content: "";
  position: absolute;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  right: -90px;
  top: -100px;
  border: 28px solid var(--accent-faint);
  pointer-events: none;
}
.step-caption {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 16px;
}
.step-count { color: var(--muted); font-size: .72rem; font-weight: 740; }
.step-dots { display: flex; gap: 6px; flex: 1; }
.step-dot { height: 4px; flex: 1; border-radius: 99px; background: var(--line); }
.step-dot.active { background: var(--accent); }
.choice-grid { display: grid; gap: 9px; margin-top: 16px; }
.choice {
  width: 100%;
  min-height: 50px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 12px 14px;
  background: var(--surface);
  color: var(--text);
  font-weight: 690;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
.choice:active { transform: scale(.99); }
.choice.active { border-color: rgba(31,75,63,.44); background: var(--accent-faint); color: var(--accent); }
.onboarding-preview {
  margin-top: 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  padding: 18px;
}
.onboarding-preview .focus-title { font-size: clamp(1.8rem, 10vw, 2.6rem); }

.timeline { display: grid; gap: 0; }
.timeline-item { display: grid; grid-template-columns: 18px 1fr; gap: 12px; }
.timeline-rail { position: relative; }
.timeline-rail::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 14px;
  bottom: -6px;
  width: 1px;
  background: var(--line-strong);
}
.timeline-item:last-child .timeline-rail::before { display: none; }
.timeline-dot {
  position: relative;
  width: 10px;
  height: 10px;
  margin: 6px 0 0 4px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.timeline-card {
  background: rgba(255,255,255,.66);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 15px;
  margin-bottom: 12px;
}
.timeline-date { color: var(--muted); font-size: .7rem; }
.timeline-title { margin-top: 5px; color: var(--ink); font-weight: 840; letter-spacing: -.02em; }
.timeline-copy { margin-top: 5px; color: var(--muted); font-size: .84rem; line-height: 1.43; }

.detail-grid { display: grid; gap: 10px; }
.detail-block {
  background: rgba(255,255,255,.7);
  border: 1px solid var(--line);
  border-radius: 19px;
  padding: 16px;
}
.detail-label { color: var(--muted); font-size: .68rem; font-weight: 820; text-transform: uppercase; letter-spacing: .1em; }
.detail-value { margin-top: 7px; color: var(--text); font-weight: 710; line-height: 1.46; overflow-wrap: anywhere; }
.inline-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 16px; }
.inline-actions > button { flex: 1 1 140px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(92px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(calc(100% - 32px), 520px);
  background: var(--ink);
  color: white;
  border-radius: 15px;
  padding: 13px 15px;
  text-align: center;
  z-index: 80;
  box-shadow: 0 14px 38px rgba(0,0,0,.2);
  animation: toast-in .2s ease-out;
  font-size: .86rem;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (hover: hover) and (pointer: fine) {
  .goal-card:hover { border-color: var(--line-strong); background: var(--surface); transform: translateY(-1px); }
  .icon-btn:hover { background: var(--surface); border-color: var(--line-strong); }
  .choice:hover { border-color: var(--line-strong); }
}

@media (min-width: 640px) {
  .app-shell { padding-top: 28px; }
  .topbar { margin-bottom: 38px; }
  .focus-card { padding: 30px; }
  .goal-list.two-col { grid-template-columns: 1fr 1fr; }
  .detail-grid { grid-template-columns: 1fr 1fr; }
  .overlay { align-items: center; padding: 24px; }
  .sheet { max-height: calc(100vh - 70px); padding: 32px 26px 24px; }
  .onboarding-card { padding: 30px; }
}

@media (max-width: 390px) {
  .app-shell { padding-left: 14px; padding-right: 14px; }
  .focus-card { padding: 20px; }
  .focus-title { font-size: 2.25rem; }
  .progress-panel { grid-template-columns: 64px 1fr; gap: 13px; padding: 14px; }
  .progress-ring { width: 64px; height: 64px; }
  .progress-ring::before { width: 50px; height: 50px; }
  .field-row { grid-template-columns: 78px 1fr; }
  .sheet-actions { flex-direction: column-reverse; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* V0.3 — marcos mensuráveis + revisão semanal */
.milestone-control {
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.milestone-edit {
  margin-left: auto;
  align-self: center;
  color: var(--accent);
  font-size: .74rem;
  font-weight: 820;
  white-space: nowrap;
}
.milestone-progress-card {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--bg-elevated);
  color: var(--text);
  transition: transform .15s ease, border-color .15s ease, background .15s ease;
}
.milestone-progress-card.compact { margin-top: 18px; }
.milestone-progress-card:active { transform: scale(.992); }
.milestone-progress-card.complete {
  border-color: rgba(52,110,89,.28);
  background: var(--accent-faint);
}
.milestone-progress-head,
.milestone-progress-foot {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: flex-start;
}
.milestone-progress-head > span { min-width: 0; }
.milestone-progress-head strong {
  display: block;
  color: var(--text);
  font-size: .77rem;
  letter-spacing: .01em;
}
.milestone-progress-head small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: .78rem;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.milestone-progress-head b {
  flex: 0 0 auto;
  color: var(--accent);
  font-size: .88rem;
}
.milestone-track {
  height: 7px;
  overflow: hidden;
  margin-top: 12px;
  border-radius: 999px;
  background: var(--surface-3);
}
.milestone-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
}
.milestone-progress-foot {
  margin-top: 8px;
  align-items: center;
  color: var(--muted);
  font-size: .7rem;
}
.milestone-progress-foot span:last-child { color: var(--accent); font-weight: 780; text-align: right; }

.review-callout {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 16px;
  border: 1px solid rgba(167,119,53,.22);
  border-radius: 21px;
  background: linear-gradient(145deg, rgba(255,255,255,.72), var(--gold-soft));
}
.review-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: rgba(167,119,53,.12);
  color: var(--gold);
  font-size: 1.25rem;
  font-weight: 800;
}
.review-copy { min-width: 0; }
.review-copy .kicker { color: var(--gold); }
.review-copy h3 {
  margin: 4px 0 3px;
  color: var(--ink);
  font-size: 1rem;
  letter-spacing: -.025em;
}
.review-copy p {
  margin: 0;
  color: var(--muted);
  font-size: .78rem;
  line-height: 1.42;
}
.review-copy p strong { color: var(--text); }
.review-btn {
  min-height: 42px;
  padding: 9px 12px;
  white-space: nowrap;
  background: rgba(255,255,255,.7);
}

.focus-chain {
  display: grid;
  gap: 7px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.58);
}
.chain-step {
  padding: 13px 14px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.chain-step span {
  display: block;
  color: var(--muted);
  font-size: .66rem;
  font-weight: 820;
  text-transform: uppercase;
  letter-spacing: .09em;
}
.chain-step strong {
  display: block;
  margin-top: 5px;
  color: var(--text);
  line-height: 1.4;
  font-size: .94rem;
}
.chain-step.milestone { background: var(--gold-soft); border-color: rgba(167,119,53,.16); }
.chain-step.primary { background: var(--accent-faint); border-color: rgba(31,75,63,.19); }
.chain-step.primary span,
.chain-step.primary strong { color: var(--accent); }
.chain-arrow {
  height: 15px;
  display: grid;
  place-items: center;
  color: var(--muted-2);
  line-height: 1;
  font-size: .8rem;
}

.milestone-measure-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.15fr;
  gap: 9px;
}
.milestone-modal-preview {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px 12px;
  align-items: center;
  margin-top: 18px;
  padding: 14px;
  border-radius: 17px;
  background: var(--accent-faint);
  border: 1px solid rgba(31,75,63,.14);
}
.milestone-modal-preview .milestone-track { grid-column: 1 / -1; margin-top: 0; }
.milestone-modal-preview strong { color: var(--accent); font-size: 1rem; }
.milestone-modal-preview > span { color: var(--muted); font-size: .76rem; text-align: right; }

.review-current {
  margin-top: 18px;
  padding: 14px 15px;
  border-radius: 17px;
  background: var(--accent-faint);
  border: 1px solid rgba(31,75,63,.15);
}
.review-current span {
  display: block;
  color: var(--accent);
  font-size: .65rem;
  font-weight: 840;
  text-transform: uppercase;
  letter-spacing: .1em;
}
.review-current strong {
  display: block;
  margin-top: 5px;
  color: var(--text);
  line-height: 1.4;
}
.review-choices { margin-top: 8px; }
.review-adjust[hidden] { display: none; }
.optional { color: var(--muted); font-weight: 600; }
.review-last {
  color: var(--muted);
  font-size: .74rem;
  line-height: 1.4;
  text-align: center;
}
.review-history { display: grid; gap: 9px; }
.review-history-item {
  padding: 14px 15px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: rgba(255,255,255,.62);
}
.review-history-item strong { display: block; color: var(--text); font-size: .85rem; }
.review-history-item span { display: block; margin-top: 3px; color: var(--muted); font-size: .71rem; }
.review-history-item p { margin: 9px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.45; }

@media (hover: hover) and (pointer: fine) {
  .milestone-progress-card:hover,
  .milestone-control:hover { border-color: var(--line-strong); background: var(--surface); }
}

@media (max-width: 520px) {
  .review-callout { grid-template-columns: 42px 1fr; }
  .review-btn { grid-column: 1 / -1; width: 100%; }
  .milestone-measure-grid { grid-template-columns: 1fr 1fr; }
  .milestone-measure-grid .field:last-child { grid-column: 1 / -1; }
}

/* V0.4 — Jornada viva + ciclos de marcos */
.journey-chapter {
  position: relative;
  overflow: hidden;
  padding: 22px;
  border: 1px solid rgba(31,75,63,.18);
  border-radius: 28px;
  background: linear-gradient(145deg, rgba(255,255,255,.92), var(--accent-faint));
  box-shadow: var(--shadow-sm);
}
.journey-chapter::after {
  content: "";
  position: absolute;
  width: 170px;
  height: 170px;
  right: -92px;
  top: -90px;
  border-radius: 50%;
  border: 28px solid rgba(31,75,63,.06);
  pointer-events: none;
}
.journey-chapter-top {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.journey-chapter-top > div:first-child > span {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: .75rem;
}
.journey-chapter-icon {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  flex: 0 0 50px;
  border-radius: 17px;
  background: var(--accent-soft);
  font-size: 1.45rem;
}
.journey-chapter h2 {
  position: relative;
  z-index: 1;
  margin: 18px 0 0;
  max-width: 560px;
  color: var(--ink);
  font-size: clamp(2rem, 8vw, 3.7rem);
  line-height: .98;
  letter-spacing: -.055em;
  text-wrap: balance;
}
.journey-chapter > p {
  position: relative;
  z-index: 1;
  max-width: 610px;
  margin: 11px 0 0;
  color: var(--text);
  font-size: 1rem;
  font-weight: 650;
  line-height: 1.48;
}
.journey-chapter-milestone {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3px 12px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid rgba(31,75,63,.13);
}
.journey-chapter-milestone span {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: .67rem;
  font-weight: 830;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.journey-chapter-milestone strong {
  color: var(--text);
  line-height: 1.35;
}
.journey-chapter-milestone small {
  color: var(--accent);
  font-weight: 780;
  white-space: nowrap;
}

.journey-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.journey-stat {
  min-width: 0;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255,255,255,.62);
}
.journey-stat span,
.journey-stat small {
  display: block;
  color: var(--muted);
  font-size: .68rem;
  line-height: 1.25;
}
.journey-stat strong {
  display: block;
  margin: 5px 0 1px;
  color: var(--ink);
  font-size: 1.55rem;
  letter-spacing: -.05em;
}

.journey-filters {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 1px 1px 10px;
  scrollbar-width: none;
}
.journey-filters::-webkit-scrollbar { display: none; }
.journey-filter {
  min-height: 40px;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 13px;
  background: rgba(255,255,255,.62);
  color: var(--muted);
  font-size: .76rem;
  font-weight: 780;
}
.journey-filter.active {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}
.journey-events { display: grid; gap: 10px; }
.journey-event {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 12px;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: rgba(255,255,255,.67);
}
.journey-event-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--surface-2);
  color: var(--muted);
  font-weight: 900;
}
.journey-event--focus .journey-event-mark { background: var(--accent-soft); color: var(--accent); }
.journey-event--milestone .journey-event-mark { background: var(--gold-soft); color: var(--gold); }
.journey-event--review .journey-event-mark { background: var(--surface-2); color: var(--text); }
.journey-event-body { min-width: 0; }
.journey-event-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: .67rem;
  line-height: 1.3;
}
.journey-event-meta span { font-weight: 780; }
.journey-event-meta time { white-space: nowrap; }
.journey-event h3 {
  margin: 5px 0 0;
  color: var(--ink);
  font-size: .94rem;
  letter-spacing: -.02em;
}
.journey-event p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: .8rem;
  line-height: 1.45;
}

.milestone-history { display: grid; gap: 9px; }
.milestone-history-item {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 11px;
  align-items: center;
  padding: 13px 14px;
  border: 1px solid rgba(167,119,53,.18);
  border-radius: 17px;
  background: linear-gradient(145deg, rgba(255,255,255,.7), rgba(242,232,216,.5));
}
.milestone-history-check {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--gold-soft);
  color: var(--gold);
  font-weight: 900;
}
.milestone-history-item strong { display: block; color: var(--text); font-size: .85rem; line-height: 1.35; }
.milestone-history-item small { display: block; margin-top: 3px; color: var(--muted); font-size: .71rem; }

.milestone-complete-panel,
.completed-before {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 18px;
  padding: 14px;
  border: 1px solid rgba(52,110,89,.18);
  border-radius: 17px;
  background: var(--accent-faint);
}
.milestone-complete-icon,
.completed-before > span {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 900;
}
.milestone-complete-panel strong,
.completed-before strong { display: block; color: var(--text); }
.milestone-complete-panel small,
.completed-before small { display: block; margin-top: 3px; color: var(--muted); font-size: .74rem; }

@media (hover: hover) and (pointer: fine) {
  .journey-filter:hover { border-color: var(--line-strong); color: var(--text); }
  .journey-filter.active:hover { border-color: var(--accent-strong); background: var(--accent-strong); color: white; }
}

@media (max-width: 420px) {
  .journey-chapter { padding: 19px; }
  .journey-stats-grid { gap: 7px; }
  .journey-stat { padding: 12px 10px; }
  .journey-stat strong { font-size: 1.3rem; }
  .journey-event { grid-template-columns: 38px 1fr; padding: 13px; gap: 10px; }
  .journey-event-mark { width: 38px; height: 38px; }
  .journey-event-meta { display: block; }
  .journey-event-meta time { display: block; margin-top: 2px; }
}

/* V0.5 — compromisso de foco */
.focus-period-setup,
.focus-period-card {
  width: 100%;
  margin-top: 16px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--bg-elevated);
  color: var(--text);
  text-align: left;
}
.focus-period-setup {
  min-height: 58px;
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 11px 13px;
}
.focus-period-setup > span:first-child {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--accent-faint);
  color: var(--accent);
  font-weight: 900;
}
.focus-period-setup strong { display: block; color: var(--text); font-size: .79rem; }
.focus-period-setup small { display: block; margin-top: 2px; color: var(--muted); font-size: .7rem; }
.focus-period-setup b { color: var(--accent); font-size: .9rem; }

.focus-period-card { padding: 13px 14px; }
.focus-period-card.due {
  border-color: rgba(167,119,53,.28);
  background: linear-gradient(145deg, rgba(255,255,255,.8), var(--gold-soft));
}
.focus-period-head,
.focus-period-foot {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.focus-period-head span { min-width: 0; }
.focus-period-head strong { display: block; color: var(--text); font-size: .8rem; }
.focus-period-head small { display: block; margin-top: 3px; color: var(--muted); font-size: .71rem; line-height: 1.35; }
.focus-period-head b { color: var(--accent); font-size: .85rem; flex: 0 0 auto; }
.focus-period-card.due .focus-period-head b { color: var(--gold); }
.focus-period-track {
  height: 6px;
  overflow: hidden;
  margin-top: 10px;
  border-radius: 999px;
  background: var(--surface-3);
}
.focus-period-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
}
.focus-period-card.due .focus-period-track span { background: var(--gold); }
.focus-period-foot {
  margin-top: 8px;
  align-items: center;
  color: var(--muted);
  font-size: .67rem;
}
.focus-period-foot span:last-child { color: var(--accent); font-weight: 780; text-align: right; }
.focus-period-card.due .focus-period-foot span:last-child { color: var(--gold); }

.focus-choice-group { margin-top: 20px; }
.focus-choice-group > label { margin-bottom: 8px; }
.focus-horizon-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.focus-horizon-choice { text-align: center; min-height: 52px; }
.focus-horizon-note {
  margin-top: 12px;
  padding: 12px 13px;
  border-radius: 14px;
  background: var(--accent-faint);
  color: var(--muted);
  font-size: .76rem;
  line-height: 1.45;
}
.onboarding-focus-period {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--accent);
  font-size: .78rem;
  font-weight: 790;
}

.focus-period-modal-summary {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  margin-top: 20px;
  padding: 15px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
}
.focus-period-modal-summary > div span {
  display: block;
  color: var(--accent);
  font-size: .67rem;
  font-weight: 830;
  text-transform: uppercase;
  letter-spacing: .08em;
}
.focus-period-modal-summary > div strong { display: block; margin-top: 4px; color: var(--text); }
.focus-period-modal-summary > b { color: var(--accent); align-self: center; }
.focus-period-modal-summary .focus-period-track { grid-column: 1 / -1; margin-top: 2px; }
.focus-period-modal-summary > small { grid-column: 1 / -1; color: var(--muted); font-size: .7rem; }
.focus-switch-btn { width: 100%; margin-top: 14px; }

@media (hover: hover) and (pointer: fine) {
  .focus-period-setup:hover,
  .focus-period-card:hover { border-color: var(--line-strong); background: var(--surface); }
  .focus-period-card.due:hover { border-color: rgba(167,119,53,.38); background: var(--gold-soft); }
}

@media (max-width: 360px) {
  .focus-horizon-grid { grid-template-columns: 1fr; }
}


/* V0.6 — zoom de foco: semana + hoje */
.focus-zoom {
  display: grid;
  gap: 8px;
  margin-top: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 19px;
  background: rgba(255,255,255,.46);
}
.focus-zoom-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px 2px;
}
.focus-zoom-head > span {
  color: var(--ink);
  font-size: .76rem;
  font-weight: 850;
  letter-spacing: -.01em;
}
.focus-zoom-head > small { color: var(--muted); font-size: .67rem; }
.focus-zoom-row {
  width: 100%;
  min-height: 62px;
  display: grid;
  grid-template-columns: 38px minmax(0,1fr) auto;
  gap: 11px;
  align-items: center;
  padding: 10px 12px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 15px;

/* V0.8 — polimento de experiência */
:root {

}

body {

}

.app-shell { max-width: 720px; }
.topbar { margin-bottom: 25px; }
.today-intro { padding-top: 0; }
.today-intro .page-title { margin-top: 7px; margin-bottom: 6px; }
.today-intro .page-subtitle { max-width: 520px; }
.section { margin-top: 25px; }

.focus-card {
  padding: 25px;
  border-color: rgba(206,199,184,.78);
  box-shadow: 0 16px 46px rgba(31,39,35,.07);
}
.focus-card::before {

  height: 174px;
  right: -78px;
  top: -92px;
  border-width: 25px;

}
.focus-symbol {
  width: 46px;
  height: 46px;
  margin-top: 24px;

}
.focus-title { margin-top: 13px; }
.focus-divider { margin: 22px 0 17px; }
.focus-one-thing { max-width: 560px; }

.today-focus {

  margin-top: 20px;

}

.today-focus-label {

  place-items: center;
  border-radius: 14px;
  background: var(--accent);

  font-weight: 900;
  letter-spacing: .055em;
  text-transform: uppercase;
}
.today-focus-copy { min-width: 0; }
.today-focus-copy small {
  display: block;
  color: var(--muted);
  font-size: .68rem;
  font-weight: 780;
  margin-bottom: 4px;
}
.today-focus-copy strong {
  display: block;
  color: var(--ink);
  font-size: .92rem;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.today-focus:not(.filled) .today-focus-copy strong { color: var(--accent); }
.today-focus-arrow { color: var(--accent); font-size: 1rem; font-weight: 900; }
.today-focus.complete {
  background: rgba(220,233,226,.64);

}
.today-focus.complete .today-focus-label { background: var(--success); }

.focus-card .action-btn { margin-top: 12px; }
.completion-note { margin-top: 9px; }

.focus-context-disclosure {
  margin-top: 18px;
  border-top: 1px solid var(--line);
}
.focus-context-disclosure > summary {
  min-height: 54px;

  align-items: center;
  justify-content: space-between;
  gap: 14px;
  list-style: none;

  color: var(--text);
}
.focus-context-disclosure > summary::-webkit-details-marker { display: none; }
.focus-context-disclosure > summary > span { min-width: 0; }
.focus-context-disclosure > summary strong {
  display: block;
  font-size: .78rem;
  letter-spacing: -.005em;
}
.focus-context-disclosure > summary small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: .69rem;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.focus-context-disclosure > summary b {
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--accent);
  font-size: 1rem;
  font-weight: 500;
  transition: transform .18s ease;
}
.focus-context-disclosure[open] > summary b { transform: rotate(45deg); }
.focus-context-body {
  display: grid;
  gap: 10px;
  padding: 3px 0 4px;
}
.focus-context-body .focus-zoom,
.focus-context-body .milestone-progress-card,
.focus-context-body .milestone-chip,
.focus-context-body .focus-period-setup,
.focus-context-body .focus-period-card { margin-top: 0; }
.context-why {
  padding: 13px 14px;
  border-radius: 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
}
.context-why span {
  color: var(--muted);
  font-size: .66rem;
  font-weight: 820;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.context-why p {
  margin: 5px 0 0;
  color: var(--text);
  font-size: .83rem;
  line-height: 1.45;
}

.progress-panel {
  margin-top: 13px;
  padding: 15px;
  border-color: rgba(206,199,184,.72);
  background: rgba(255,255,255,.48);
}
.progress-ring { width: 66px; height: 66px; }
.progress-ring::before { width: 52px; height: 52px; }
.progress-caption { max-width: 410px; }
.progress-mini-stats { gap: 6px 15px; margin-top: 9px; }

.week-panel {
  padding: 12px 10px 10px;
  border-color: rgba(206,199,184,.7);
  background: rgba(255,255,255,.42);
}
.day-dot { border-radius: 11px; }

.goal-card {
  padding: 15px;
  border-color: rgba(206,199,184,.75);
  box-shadow: none;
}
.goal-card.main {
  box-shadow: 0 8px 25px rgba(31,39,35,.045);
  background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(238,245,241,.72));
}
.goal-meta { margin-top: 10px; }

.nav {

}

.sheet {

}
.field input, .field textarea, .field select { border-color: rgba(206,199,184,.82); }
.field input:focus, .field textarea:focus, .field select:focus { border-color: rgba(31,75,63,.42); }

.toast {
  width: min(calc(100% - 28px), 480px);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: .82rem;
}

@media (hover:hover) and (pointer:fine) {
  .today-focus:hover { border-color: rgba(31,75,63,.3); background: rgba(238,245,241,.92); }

}

@media (max-width:390px) {
  .app-shell { padding-left: 13px; padding-right: 13px; }
  .topbar { margin-bottom: 22px; }
  .brand-subtitle { display: none; }

  .focus-symbol { width: 43px; height: 43px; margin-top: 20px; }
  .focus-title { font-size: clamp(2.15rem, 11vw, 3rem); }
  .today-focus { min-height: 68px; padding: 11px; gap: 10px; }
  .today-focus-label { width: 40px; height: 40px; }
  .focus-context-disclosure > summary small { max-width: 225px; }
  .progress-panel { grid-template-columns: 58px 1fr; gap: 12px; padding: 13px; }
  .progress-ring { width: 58px; height: 58px; }
  .progress-ring::before { width: 46px; height: 46px; }
  .progress-ring strong { font-size: .82rem; }
  .progress-mini-stats { gap: 5px 10px; }
  .progress-mini { font-size: .69rem; }
  .progress-mini b { font-size: .8rem; }
  .nav { width: calc(100% - 18px); bottom: max(8px, env(safe-area-inset-bottom)); }
  .nav button { min-height: 54px; }
}

/* V0.9 — segurança dos dados */
.data-safety-card {
  display: grid;
  grid-template-columns: 46px 1fr;
  gap: 14px;
  align-items: start;
  padding: 17px;
  border: 1px solid rgba(31,75,63,.14);
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(255,255,255,.7), rgba(238,245,241,.72));
}
.data-safety-icon {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 1.35rem;
  font-weight: 800;
}
.data-safety-copy { min-width: 0; }
.data-safety-copy h3 {
  margin: 5px 0 5px;
  color: var(--ink);
  font-size: 1rem;
  letter-spacing: -.025em;
}

}
.data-safety-status {

  gap: 8px 18px;
  margin-top: 13px;
  color: var(--muted);

}
.data-safety-status span { display: grid; gap: 2px; }
.data-safety-status b { color: var(--text); font-size: .68rem; }

  gap: 8px;
  align-items: center;
  margin-top: 14px;
}
.data-safety-actions .action-btn,
.data-safety-actions .secondary-btn { width: auto; margin-top: 0; min-height: 46px; }
.data-safety-primary { padding-left: 16px; padding-right: 16px; }
.data-safety-rollback { flex-basis: 100%; text-align: left; font-size: .76rem; padding: 5px 0 0; }
.visually-hidden-file {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0,0,0,0) !important;

.backup-sheet .sheet-subtitle strong { color: var(--text); }
.backup-file-summary {
  display: grid;

  align-items: baseline;
}
.backup-file-summary span {
  color: var(--muted);
  font-size: .7rem;
  font-weight: 760;
}
.backup-file-summary strong {

  font-size: .8rem;
  overflow-wrap: anywhere;

}
.backup-summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 10px;
}
.backup-summary-grid > div {
  min-width: 0;
  padding: 12px 8px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.58);
}
.backup-summary-grid strong {
  display: block;

.backup-summary-grid span {

.backup-confirm-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 16px;
  padding: 13px;
  border: 1px solid rgba(154,67,67,.16);
  border-radius: 15px;

  color: var(--text);
  font-size: .8rem;
  line-height: 1.42;

.backup-confirm-row input {
  width: 19px;
  height: 19px;

}
.backup-warning {
  margin-top: 14px;
  padding: 12px 13px;
  border-radius: 14px;
  background: var(--gold-soft);
  color: var(--text);

  line-height: 1.45;

@media (max-width: 480px) {
  .data-safety-card { grid-template-columns: 1fr; }
  .data-safety-icon { width: 42px; height: 42px; }

  .data-safety-actions .action-btn,
  .data-safety-actions .secondary-btn { width: 100%; }

.settings-section { scroll-margin-top: 18px; }

html[data-theme="dark"] {

  --surface-2: #29322e;
  --surface-3: #333d38;

  --muted-2: #7d8982;
  --line: #343e39;
  --line-strong: #46514b;
  --accent: #8dbba8;
  --accent-strong: #a9cdbc;
  --accent-soft: #263e34;
  --accent-faint: #1b3027;
  --gold: #d0a45f;
  --gold-soft: #342c20;

/* V0.11 — simplificação geral: menos superfícies, mesma profundidade */
.rhythm-card {
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.58);
}
.rhythm-card-top { display:flex; justify-content:space-between; gap:18px; align-items:flex-end; }
.rhythm-card-top > div:first-child { min-width:0; }
.rhythm-label { display:block; color:var(--muted); font-size:.69rem; font-weight:820; text-transform:uppercase; letter-spacing:.09em; }
.rhythm-card-top strong { display:block; margin-top:3px; color:var(--ink); font-size:1.75rem; letter-spacing:-.055em; line-height:1; }
.rhythm-card-top small { display:block; margin-top:5px; color:var(--muted); font-size:.72rem; }
.rhythm-streak { text-align:right; color:var(--muted); font-size:.72rem; }
.rhythm-streak b { display:block; color:var(--text); font-size:.92rem; }
.rhythm-week { margin-top:15px; padding-top:13px; border-top:1px solid var(--line); }
.rhythm-week > span { display:block; margin-bottom:9px; color:var(--muted); font-size:.7rem; font-weight:760; }
.rhythm-more { margin-top:8px; }
.rhythm-more summary { min-height:40px; display:flex; align-items:center; color:var(--muted); font-size:.75rem; font-weight:760; cursor:pointer; list-style:none; }
.rhythm-more summary::-webkit-details-marker { display:none; }
.rhythm-more summary::after { content:'+'; margin-left:auto; color:var(--accent); font-size:1rem; }
.rhythm-more[open] summary::after { content:'–'; }
.rhythm-more > div { display:flex; gap:18px; flex-wrap:wrap; padding:4px 0 3px; color:var(--muted); font-size:.74rem; }
.rhythm-more b { color:var(--text); }
.other-goals-section { margin-top:26px; }
.goal-meta-quiet { justify-content:space-between; }
.goal-meta-quiet span:last-child { color:var(--accent); font-weight:760; }

.goal-direction-card {
  padding:20px;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(255,255,255,.68);
}
.goal-direction-label { color:var(--accent); font-size:.69rem; font-weight:850; text-transform:uppercase; letter-spacing:.1em; }
.goal-direction-card > h2 { margin:7px 0 0; color:var(--ink); font-size:1.45rem; line-height:1.25; letter-spacing:-.035em; }
.goal-direction-milestone { margin-top:17px; }
.goal-direction-milestone .milestone-progress-card,
.goal-direction-milestone .milestone-chip { margin-top:0; }
.goal-direction-now { margin-top:14px; }
.goal-direction-now .focus-zoom { margin-top:0; background:transparent; border-color:var(--line); }
.goal-detail-context { margin-top:15px; border-top:1px solid var(--line); }
.goal-detail-context summary { min-height:48px; display:flex; align-items:center; gap:12px; list-style:none; cursor:pointer; }
.goal-detail-context summary::-webkit-details-marker { display:none; }
.goal-detail-context summary span { min-width:0; }
.goal-detail-context summary strong { display:block; color:var(--text); font-size:.8rem; }
.goal-detail-context summary small { display:block; margin-top:2px; color:var(--muted); font-size:.7rem; }
.goal-detail-context summary b { margin-left:auto; color:var(--accent); font-size:1rem; }
.goal-detail-context[open] summary b { transform:rotate(45deg); }
.goal-detail-context-body { display:grid; gap:11px; padding:3px 0 8px; }
.context-meta { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 13px; border-radius:15px; background:var(--bg-elevated); border:1px solid var(--line); }
.context-meta span { color:var(--muted); font-size:.73rem; }
.context-meta strong { color:var(--text); font-size:.82rem; text-align:right; }
.goal-detail-context-body .focus-period-card,
.goal-detail-context-body .focus-period-setup { margin-top:0; }
.detail-rhythm-card { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; padding:0; overflow:hidden; border:1px solid var(--line); border-radius:20px; background:var(--line); }
.detail-rhythm-card > div { min-width:0; padding:15px 13px; background:rgba(255,255,255,.7); }
.detail-rhythm-card span { display:block; color:var(--muted); font-size:.66rem; font-weight:760; }
.detail-rhythm-card strong { display:block; margin-top:4px; color:var(--ink); font-size:1.06rem; letter-spacing:-.03em; }
.detail-rhythm-card small { display:block; margin-top:3px; color:var(--muted); font-size:.67rem; }
.goal-detail-actions { margin-top:26px; align-items:center; }
.goal-detail-actions .danger-btn { flex:0 0 auto; padding-inline:8px; }

@media (max-width:390px) {

}


/* V0.12 — inteligência contextual sem IA */

}
.context-insight.positive {
  border-color:rgba(52,110,89,.2);
  background:linear-gradient(145deg, rgba(255,255,255,.6), var(--accent-faint));
}
.context-insight-mark {
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:rgba(167,119,53,.12);

@media (max-width:390px) {
  .context-insight { grid-template-columns:38px minmax(0,1fr); gap:11px; padding:14px; }

.month-summary-head {

}
.month-summary-head > div:first-child {

}
.month-summary-head .section-note {

}
.month-nav {

}
.month-nav-btn {

.month-summary-card {

}

.month-summary-empty-mark {
  width: 42px;

  border-radius: 14px;

  color: var(--text);

}

html[data-theme="dark"] .month-summary-card { background: rgba(29,37,33,.72); }
html[data-theme="dark"] .month-nav-btn { background: rgba(29,37,33,.78); }

@media (hover: hover) and (pointer: fine) {

}

@media (max-width: 520px) {

  .month-summary-evidence { grid-template-columns: 1fr; gap: 10px; }

.ritual-row span {

}
.ritual-priority strong {
  color: var(--accent);

/* V0.15 — conclusão de objetivos e capítulos encerrados */
.next-focus-empty,
.next-focus-banner {

.next-focus-empty { text-align: center; }
.next-focus-empty-mark {

}

.completed-goal-list { display: grid; gap: 10px; }

  text-align: left; border: 1px solid var(--line); border-radius: 19px; background: rgba(255,255,255,.52); padding: 14px 15px; color: var(--text);

.completed-goal-copy span { display:block; color: var(--accent); font-size:.66rem; font-weight:850; text-transform:uppercase; letter-spacing:.09em; }
.completed-goal-copy strong { display:block; margin-top:4px; color:var(--ink); font-size:.98rem; overflow-wrap:anywhere; }
.completed-goal-copy small { display:block; margin-top:4px; color:var(--muted); font-size:.73rem; }

.completion-preview { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px; }
.completion-preview > div { padding:13px 10px; border:1px solid var(--line); border-radius:15px; background:var(--surface); text-align:center; min-width:0; }
.completion-preview span { display:block; color:var(--muted); font-size:.66rem; }

  <title>Única Coisa — V0.19</title>
