  const plan = sessionPlan(state, day.id, now);
  const seenToday = daySeenCount(day, state);
  const remainingToday = Math.max(0, day.phrases.length - seenToday);
  const currentNew = completedAll ? 0 : Math.min(plan.newGoal, remainingToday);
  const hasSession = Boolean(state.activeSession?.items?.length);
  const hasActive = hasSession && state.activeSession.index < state.activeSession.items.length;
  const hasFinishedSession = hasSession && state.activeSession.index >= state.activeSession.items.length;
  const canStartSession = hasActive || hasFinishedSession || completedAll || plan.newGoal > 0 || plan.reviewCount > 0 || plan.hardCount > 0;
  const families = discoveredPatternFamilies(state);
  const provenFamilies = families.filter(family => family.transferStatus === 'proven').length;
  const recovery = recoveryBanner(plan, calendar);
  const achievements = achievementSummary(state, now);
  const recentAchievements = (state.recentAchievements || []).map(id => achievementById(id)).filter(Boolean);
  const sessionNew = hasSession ? Number(state.activeSession.newCount || 0) : currentNew;
  const sessionMinutes = hasSession
    ? state.activeSession.estimatedMinutes || Math.max(5, Math.round((state.activeSession.newCount || 0) * .42 + (state.activeSession.reviewCount || 0) * .16))
    : plan.estimatedMinutes;
  const focusTitle = s.difficult ? `${s.difficult} ${s.difficult === 1 ? 'frase precisa' : 'frases precisam'} de reforço` : focusMessage(s);
  const focusText = s.difficult
    ? 'O treino normal já vai puxar essas frases no momento certo. Se quiser, você também pode fazer um reforço curto agora.'
    : focusSubtext(s);
  const continuity = !hasSession ? activeNextSessionBrief(state, now) : null;

  return `
    <header class="topbar"><div class="brand-mark">E</div><div><b>English Journey</b><span>frases úteis · revisão inteligente</span></div><div class="xp-pill">${state.xp} XP</div>${accountTopButton()}</header>
    ${storageBanner()}
    ${interactionError ? `<section class="calendar-banner recovery"><div>!</div><div><small>SESSÃO RECUPERADA</small><h3>O curso evitou uma trava.</h3><p>${escapeHtml(interactionError)}</p></div></section>` : ''}
    ${recovery}
    ${recentAchievements.length ? recentAchievementBanner(recentAchievements) : ''}

    <section class="today-card">
      <div class="today-card-head"><div><small>${completedAll ? 'CURSO BASE CONCLUÍDO' : `FASE ${phaseForDay(day.id)?.id || 5} · DIA ${day.id} DE 30`}</small><span>${s.streak ? `🔥 ${s.streak} ${s.streak === 1 ? 'dia' : 'dias'}` : 'Comece sua sequência'}</span></div></div>
      <h1>${completedAll ? 'Consolidar o que já é seu.' : day.title}</h1>
      <p>${completedAll ? 'As 1.200 frases já entraram no ciclo. Agora o foco é retenção, listening e produção.' : day.subtitle}</p>
      <div class="today-plan">
        <span><b>${sessionNew}</b> novas</span>
        <span><b>${hasSession ? Number(state.activeSession.reviewCount || 0) : plan.reviewCount}</b> revisões</span>
        <span><b>~${sessionMinutes}</b> min</span>
      </div>
      ${canStartSession
        ? `<button class="primary big today-cta" data-start="${day.id}">${hasFinishedSession ? 'VER RESUMO DA SESSÃO' : hasActive ? sessionResumeLabel(state.activeSession) : completedAll ? 'TREINAR AGORA' : plan.mode === 'recovery' ? 'COMEÇAR RETOMADA' : plan.mode === 'daily-complete' ? 'REVISAR O QUE JÁ APRENDEU' : 'COMEÇAR SESSÃO'}</button>`
        : `<button class="secondary big today-cta" type="button" disabled>META DE NOVAS CONCLUÍDA HOJE</button>`}
      ${!hasSession ? todayGuidance(plan, continuity) : ''}
      ${!completedAll ? `<div class="today-progress"><div><span>${seenToday}/40 do dia</span><b>${Math.round(seenToday / 40 * 100)}%</b></div><div class="progress-track"><i style="width:${Math.round(seenToday / 40 * 100)}%"></i></div><small>${hasSession ? 'Seu ponto está salvo. Cada bloco concluído é um ponto seguro para pausar e continuar depois.' : plan.dailyCapReached ? `Você já concluiu o teto de ${plan.dailyNewCap} novas de hoje. Amanhã o motor recalcula a carga.` : plan.newGoal < 40 ? `Hoje a carga foi ajustada para até ${plan.newGoal} novas para proteger a retenção.` : 'Ritmo compacto: 4 blocos de até 10 frases, com ponto de pausa entre eles.'}</small></div>` : ''}
    </section>

    <section class="home-pulse" aria-label="Resumo rápido">
      <div><span>🔥</span><strong>${s.streak}</strong><small>sequência</small></div>
      <div><span>✓</span><strong>${s.mastered}</strong><small>dominadas</small></div>
      <div><span>⌘</span><strong>${provenFamilies}</strong><small>padrões provados</small></div>
    </section>
    ${achievementMilestoneStrip(achievements)}

    <section class="home-focus-card">
      <div class="home-focus-icon">${s.difficult ? '↻' : s.due ? '◎' : '→'}</div>
      <div><small>FOCO DE HOJE</small><h3>${escapeHtml(focusTitle)}</h3><p>${escapeHtml(focusText)}</p></div>
      ${s.difficult ? `<button class="ghost" data-hard-practice>REFORÇO CURTO</button>` : `<button class="ghost" data-nav="stats">VER PROGRESSO</button>`}
    </section>
  `;
}


function sessionResumeLabel(session) {
  if (!session?.items?.length) return 'CONTINUAR SESSÃO';
  const block = activeLessonBlock(session);
  const total = Math.max(0, ...session.items.map(item => Number(item?.blockTotal || item?.blockNumber || 0)));
  if (block && total) return `CONTINUAR · BLOCO ${block}/${total}`;
  const item = session.items[session.index];
  if (item?.id === 'daily-challenge' || item?.reviewKind === 'challenge') return 'CONTINUAR · DESAFIO FINAL';
  if (item?.id === 'review-start' || item?.reviewKind === 'scheduled') return 'CONTINUAR · REVISÕES';
  return 'CONTINUAR SESSÃO';
}


function recentAchievementBanner(items) {
  const first = items[0];
  const extra = items.length > 1 ? ` +${items.length - 1}` : '';
  return `<section class="achievement-unlock-banner"><div class="achievement-unlock-icon">${first.icon}</div><div><small>NOVO MARCO${extra}</small><h3>${escapeHtml(first.title)}</h3><p>${escapeHtml(first.description)}</p></div><div class="achievement-unlock-actions"><button class="ghost" data-nav="achievements">VER</button><button class="achievement-dismiss" data-dismiss-achievements aria-label="Fechar">×</button></div></section>`;
}

function achievementMilestoneStrip(summary) {
  const next = summary?.next;
  if (!next) return `<section class="milestone-strip complete"><span>★</span><div><small>CONQUISTAS</small><h3>Todos os marcos desta jornada foram alcançados.</h3><p>${summary?.unlocked || 0}/${summary?.total || 0} concluídos</p></div><button class="ghost" data-nav="achievements">VER</button></section>`;
  return `<section class="milestone-strip"><span>${next.icon}</span><div><small>PRÓXIMO MARCO · ${summary.unlocked}/${summary.total}</small><h3>${escapeHtml(next.title)}</h3><div class="milestone-track"><i style="width:${next.progress}%"></i></div><p>${next.current}/${next.target} ${escapeHtml(next.unit)} · ${next.progress}%</p></div><button class="ghost" data-nav="achievements">VER</button></section>`;
}

function listeningStageCard(dayId) {
  const stage = dayId <= 10
    ? { label: 'LISTENING GUIADO', title: 'Ouça com apoio visual', text: 'Você ainda recebe alternativas e pode comparar áudio normal e devagar.' }
    : dayId <= 20
      ? { label: 'LISTENING ATIVO', title: 'Parte do texto começa a desaparecer', text: 'Alguns exercícios pedem que você entenda o áudio antes de revelar a frase.' }
      : { label: 'LISTENING SEM TEXTO', title: 'Entender primeiro, revelar depois', text: 'O curso passa a priorizar compreensão auditiva sem alternativas nos exercícios de listening.' };
  return `<section class="listening-stage-card"><div class="listening-stage-icon">♪</div><div><small>${stage.label}</small><h3>${stage.title}</h3><p>${stage.text}</p></div></section>`;
}


function familyStageCard() {
  const families = discoveredPatternFamilies(state);
  if (!families.length) return '';
  const strong = families.filter(family => family.status === 'strong').length;
  const proven = families.filter(family => family.transferStatus === 'proven').length;
  const top = families[0];
  return `<section class="family-stage-card"><div class="family-stage-icon">⌘</div><div><small>FAMÍLIAS DE FRASES</small><h3>${families.length} padrões descobertos · ${proven} provados em variações</h3><p>Você já encontrou ${top.title}. Agora o curso também testa se você consegue usar o molde em frases que nunca decorou.</p></div><button class="ghost" data-nav="library">VER</button></section>`;
}

function storageBanner() {
  if (persistenceRecoveryNotice) {
    return `<section class="storage-banner"><div>↻</div><div><small>PROGRESSO RECUPERADO</small><p>${escapeHtml(persistenceRecoveryNotice)} O curso já criou uma nova cópia válida.</p></div></section>`;
  }
  const mode = getStorageMode();
  if (mode === 'local' && persistenceSaveFailures === 0) return '';
  const text = mode === 'session'
    ? 'O navegador está salvando o progresso apenas nesta sessão. Evite limpar os dados da aba antes de terminar.'
    : mode === 'tab'
      ? 'O navegador bloqueou o armazenamento permanente. O curso mantém uma cópia nesta aba; fechar a aba pode remover esse progresso.'
      : 'O navegador bloqueou o armazenamento persistente. O progresso desta aba está apenas em memória e pode ser perdido ao fechar a página.';
  return `<section class="storage-banner"><div>ⓘ</div><div><small>MODO COMPATIBILIDADE</small><p>${text}</p></div></section>`;
}

function adaptivePlanStrip(plan) {
  if (!plan?.adaptation) return '';
  const icon = plan.focusSkill === 'listening' ? '♪' : plan.focusSkill === 'production' ? '→' : '◎';
  const cls = plan.mode === 'consolidation' || plan.mode === 'daily-complete' ? 'consolidation' : ['recovery','catchup'].includes(plan.mode) ? 'pressure' : '';
  const goalText = plan.dailyCapReached ? `${plan.newIntroducedToday}/${plan.dailyNewCap} novas hoje` : plan.newGoal === 0 ? 'sem novas hoje' : `${plan.newGoal} novas máx.`;
  return `<div class="adaptive-plan-strip ${cls}"><span>${icon}</span><div><small>MOTOR ADAPTATIVO · ${escapeHtml(plan.loadLabel || 'AVANÇAR')}</small><b>Mais foco em ${escapeHtml(plan.focusLabel || 'produção')}</b><p>${escapeHtml(plan.dailyCapReached ? plan.newGoalReason : (plan.focusReason || plan.newGoalReason || ''))}</p></div><em>${escapeHtml(goalText)}</em></div>`;
}


function todayGuidance(plan, continuity) {
  const brief = sanitizeNextSessionBrief(continuity);
  const focus = brief?.focusLabel || plan?.focusLabel || 'Produção';
  const focusSkill = brief?.focusSkill || plan?.focusSkill || 'production';
  const icon = brief?.mode === 'review-first' ? '↻' : brief?.mode === 'balanced' ? '◎' : focusSkill === 'listening' ? '♪' : focusSkill === 'reading' ? '◎' : '→';
  const cls = brief?.mode || (['recovery','catchup'].includes(plan?.mode) ? 'pressure' : 'advance');
  const title = brief?.label
    ? `${brief.label} · ${focus}`
    : plan?.mode === 'consolidation' ? `Consolidar · ${focus}`
      : plan?.mode === 'daily-complete' ? 'Meta de novas concluída'
        : `Avançar com foco em ${focus}`;
  const reason = brief?.reason || plan?.focusReason || plan?.newGoalReason || 'O motor montou a sessão usando seu histórico recente.';
  const load = plan?.dailyCapReached ? `${plan.newIntroducedToday}/${plan.dailyNewCap} novas hoje` : plan?.newGoal === 0 ? 'sem novas' : `até ${plan?.newGoal ?? 0} novas`;
  const details = [
    plan?.reviewCount != null ? `${plan.reviewCount} revisões previstas` : null,
    plan?.hardCount ? `${plan.hardCount} difíceis` : null,
    plan?.loadLabel ? `ritmo: ${String(plan.loadLabel).toLowerCase()}` : null
  ].filter(Boolean).join(' · ');
  return `<section class="today-guidance ${escapeHtml(cls)}"><div class="today-guidance-head"><span>${icon}</span><div><small>PRÓXIMO PASSO</small><b>${escapeHtml(title)}</b></div><em>${escapeHtml(load)}</em></div><p>${escapeHtml(reason)}</p>${details ? `<details class="today-plan-details"><summary>Como o plano foi montado</summary><p>${escapeHtml(details)}. A carga pode mudar durante a sessão se sua retenção pedir.</p></details>` : ''}</section>`;
}

function recoveryBanner(plan, calendar) {
  if (!calendar.lastStudyDate || calendar.studiedToday) return '';
  if (calendar.daysMissed === 0) {
    return `<section class="calendar-banner calm"><div>↻</div><div><small>DE VOLTA NO DIA CERTO</small><h3>Seu progresso está em dia.</h3><p>As revisões vencidas entram antes das novas frases.</p></div></section>`;
  }
  const missed = calendar.daysMissed;
  const label = missed === 1 ? '1 dia sem praticar' : `${missed} dias sem praticar`;
  return `<section class="calendar-banner ${['recovery','consolidation'].includes(plan.mode) ? 'recovery' : ''}"><div>⏱</div><div><small>RETOMADA INTELIGENTE</small><h3>${label}</h3><p>${plan.due} revisões estão pendentes. ${plan.newGoal === 0 ? 'Hoje o motor vai consolidar a memória sem adicionar frases novas.' : `Hoje o limite será ${plan.newGoal} novas frases até a memória voltar ao ritmo.`}</p></div></section>`;
}

function weekDots(state) {
  const done = new Set(state.activityDates || []);
  const out = [];
  const now = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = todayKey(d);
    out.push(`<i class="${done.has(key) ? 'done' : ''}" title="${key}"></i>`);
  }
  return out.join('');
}

function focusMessage(s) {
  if (!s.studied) return 'Comece pequeno e apareça amanhã de novo.';
  const skills = [['listening', s.listening], ['produção', s.production], ['leitura', s.reading]].sort((a, b) => a[1] - b[1]);
  return `${capitalize(skills[0][0])} é sua habilidade com mais espaço para crescer.`;
}
function focusSubtext(s) {
  if (!s.studied) return 'O curso começa com frases curtas e frequentes para criar uma base de recuperação rápida.';
  return s.difficult ? `${s.difficult} frase${s.difficult === 1 ? '' : 's'} está${s.difficult === 1 ? '' : 'ão'} em reforço. Erros voltam uma vez dentro da sessão e depois entram no espaçamento normal.` : 'As próximas revisões priorizam automaticamente a habilidade mais fraca de cada frase.';
}

function metric(value, label) {
  return `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`;
}

function journeyView() {
  const phases = coursePhaseProgress(state);
  const current = currentCoursePhase(state);
  const completedCount = state.completedDays.length;
  const coursePct = Math.round(completedCount / curriculum.length * 100);
  const currentDay = nextUnlockedDay(state);
  return `
    ${pageHeader('Jornada', 'Cinco fases com um objetivo claro: sair de frases isoladas para inglês cada vez mais reutilizável.')}
    <section class="course-overview journey-overview">
      <div><small>${completedCount >= 30 ? 'PRIMEIRO CICLO CONCLUÍDO' : `FASE ${current?.id || 5} DE 5 · ${escapeHtml(current?.title || 'Inglês em uso')}`}</small><h2>${completedCount}/30 dias do curso concluídos</h2><p>${completedCount >= 30 ? 'Agora o curso continua vivo pelas revisões, listening, produção e transferência.' : escapeHtml(current?.goal || 'Continue avançando no seu ritmo.')}</p></div>
      <div class="course-ring"><strong>${coursePct}%</strong></div>
    </section>
    <section class="phase-map" aria-label="Mapa das cinco fases">
      ${phases.map(phase => {
        const status = phase.completedDays >= phase.days ? 'complete' : phase.id === current?.id ? 'current' : phase.id < (current?.id || 1) ? 'complete' : 'future';
        return `<div class="phase-map-step ${status}"><span>${status === 'complete' ? '✓' : phase.id}</span><div><small>FASE ${phase.id}</small><b>${escapeHtml(phase.title)}</b></div></div>`;
      }).join('')}
    </section>
    <div class="phase-list">
      ${phases.map(phase => journeyPhaseCard(phase, current?.id, currentDay)).join('')}
    </div>
    <section class="pattern-card journey-goal"><span>✦</span><div><small>AO FINAL DO PRIMEIRO CICLO</small><h3>Você não terá apenas 1.200 frases vistas: terá blocos de linguagem conectados por listening, produção, padrões e revisão espaçada.</h3><p>O objetivo não é terminar rápido. É fazer cada fase sobreviver na memória enquanto a próxima entra.</p></div></section>
  `;
}

function journeyPhaseCard(phase, currentPhaseId, currentDay) {
  const days = curriculum.filter(day => day.id >= phase.startDay && day.id <= phase.endDay);
  const complete = phase.completedDays >= phase.days;
  const current = phase.id === currentPhaseId && !complete;
  const future = phase.id > currentPhaseId;
  const pct = Math.round(phase.completedDays / Math.max(1, phase.days) * 100);
  const status = complete ? 'CONCLUÍDA' : current ? 'FASE ATUAL' : 'VEM DEPOIS';
  const statusCopy = complete ? 'Base conquistada' : current ? `${phase.completedDays}/${phase.days} dias concluídos` : `Dias ${phase.startDay}–${phase.endDay}`;
  return `<section class="journey-phase ${complete ? 'complete' : current ? 'current' : 'future'}">
    <header class="phase-identity">
      <div class="phase-symbol">${phase.icon}</div>
      <div class="phase-identity-copy"><small>FASE ${phase.id} · ${status}</small><h2>${escapeHtml(phase.title)}</h2><p>${escapeHtml(phase.subtitle)}</p></div>
      <div class="phase-status"><strong>${pct}%</strong><span>${statusCopy}</span></div>
    </header>
    <div class="phase-purpose"><div><small>OBJETIVO</small><p>${escapeHtml(phase.goal)}</p></div><div><small>O QUE VOCÊ PASSA A FAZER</small><p>${escapeHtml(phase.outcome)}</p></div></div>
    <div class="phase-progress-track"><i style="width:${pct}%"></i></div>
    <div class="journey-list">
      ${days.map(day => journeyCard(day, currentDay)).join('')}
    </div>
  </section>`;
}

function journeyCard(day, currentDay = nextUnlockedDay(state)) {
  const unlocked = isDayUnlocked(day.id, state);
  const complete = state.completedDays.includes(day.id);
  const seen = daySeenCount(day, state);
  const progress = dayProgress(day, state);
  const inProgress = !complete && seen > 0;
  const current = !complete && unlocked && day.id === currentDay;
  const label = complete ? 'CONCLUÍDO' : inProgress ? 'EM ANDAMENTO' : current ? 'PRÓXIMO' : unlocked ? 'DISPONÍVEL' : 'BLOQUEADO';
  return `<article class="journey-card ${!unlocked ? 'locked' : ''} ${current ? 'active-day' : ''}">
    <div class="day-node ${complete ? 'complete' : current || inProgress ? 'current' : ''}">${complete ? '✓' : unlocked ? day.id : '🔒'}</div>
    <div class="journey-copy"><div class="journey-day-meta"><small>DIA ${day.id} · ${seen}/40 FRASES</small><span>${label}</span></div><h3>${escapeHtml(day.title)}</h3><p>${escapeHtml(day.subtitle)}</p>
      <div class="progress-track"><i style="width:${progress}%"></i></div><span class="progress-label">${progress}% de domínio</span>
    </div>
    ${unlocked && !complete ? `<button class="ghost round" data-start="${day.id}" aria-label="Abrir Dia ${day.id}">›</button>` : ''}
  </article>`;
}

function libraryView() {
  const items = allPhrases.filter(p => getPhraseProgress(state, p.id).seen);
  const families = patternFamilyProgress(state).filter(family => family.discovered);
  return `
    ${pageHeader('Minhas frases', 'Frases aprendidas e os padrões que começam a se repetir.')}
    ${families.length ? `<section class="family-library"><header class="section-head compact"><div><small>FAMÍLIAS DESCOBERTAS</small><h2>${families.length} moldes reutilizáveis</h2></div><span>${families.filter(f => f.status === 'strong').length} fortes</span></header><div class="family-grid">${families.map(family => familyLibraryCard(family)).join('')}</div></section>` : ''}
    <header class="section-head compact phrase-library-head"><div><small>SUAS FRASES</small><h2>${items.length} frases encontradas</h2></div></header>
    ${items.length ? `<div class="phrase-list">${items.map(phrase => {
      const p = getPhraseProgress(state, phrase.id);
      const hard = isDifficultPhrase(p);
      const mastered = isMastered(p);
      const missing = !hard && !mastered ? masteryMissing(p).join(' + ') : '';
      return `<article class="phrase-row ${hard ? 'hard' : ''}">
        <button type="button" class="audio-mini" data-audio="${phrase.id}" aria-label="Ouvir ${escapeHtml(phrase.english)}">🔊</button>
        <div><h3>${escapeHtml(phrase.english)}</h3><p>${escapeHtml(phrase.portuguese)}</p><small>${hard ? `⚠ reforço · ${Math.round(difficultyScore(p) * 100)}% dificuldade` : mastered ? `✓ domínio comprovado · ${new Set(p.reviewDays || []).size} dias de contato` : `${Math.round(mastery(p) * 100)}% base · falta ${escapeHtml(missing || 'mais evidência')}`}</small></div>
        <span class="status-dot ${hard ? 'hard' : mastered ? 'strong' : mastery(p) >= .35 ? 'learning' : ''}"></span>
      </article>`;
    }).join('')}</div>` : emptyState('Sua biblioteca ainda está vazia.', 'Conclua o primeiro dia e suas frases aparecerão aqui.')}
  `;
}

function familyLibraryCard(family) {
  const examples = (family.examples || []).map(id => getPhrase(id)).filter(Boolean).slice(0, 3);
  const pct = Math.round(family.avgMastery * 100);
  const label = family.status === 'strong' ? 'FORTE' : family.status === 'learning' ? 'APRENDENDO' : 'DESCOBERTO';
  return `<article class="family-library-card ${family.status}">
    <div class="family-card-top"><span>⌘</span><small>${label}</small></div>
    <h3>${escapeHtml(family.title)}</h3>
    <p>${escapeHtml(family.meaning)}</p>
    <div class="family-examples">${examples.map(phrase => `<span>${escapeHtml(phrase.english)}</span>`).join('')}</div>
    <div class="family-progress"><div><i style="width:${pct}%"></i></div><small>${family.seen}/${family.total} vistas · ${pct}% domínio médio</small></div>
    <div class="family-transfer-line ${family.transferStatus}"><span>${family.transferStatus === 'proven' ? '✓' : '↗'}</span><small>${family.transferStatus === 'proven' ? `Transferência provada · ${family.transfer.remembered}/${family.transfer.attempts} novas recuperadas` : family.transfer.attempts ? `Transferência em treino · ${family.transfer.remembered}/${family.transfer.attempts} lembradas` : 'Transferência ainda não testada'}</small></div>
  </article>`;
}

}

function lessonView() {
  let session = state.activeSession;
  if (session) restoreTransientSessionUi(session);
  if (!session) {
    const dayId = nextUnlockedDay(state);
    session = buildSession(state, dayId);
    state.activeSession = session;
    saveState(state);
  }
  if (!session || !session.items.length) return emptyState('Nenhuma sessão disponível.', 'Volte para a jornada e escolha um dia desbloqueado.');
  if (session.index >= session.items.length) {
    const appendedClosure = ensureSessionClosure(session, state);
    if (!appendedClosure) return summaryView(session);
    saveState(state);
  }
  const item = session.items[session.index];
  if (!item || !['checkpoint','pattern','variation','intro','recovery','meaning','production','listening','listening-recall','context','cloze','recall'].includes(item.type)) {
    state.activeSession = null;
    saveState(state);
    interactionError = 'Uma etapa incompatível da sessão anterior foi descartada.';
    return homeView();
  }
  const phrase = item.phraseId ? getPhrase(item.phraseId) : null;
  if (!['checkpoint','pattern','variation'].includes(item.type) && !phrase) {
    state.activeSession = null;
    saveState(state);
    interactionError = 'Uma frase inválida da sessão anterior foi descartada.';
    return homeView();
  }
  const pct = Math.round(session.index / session.items.length * 100);
  const stage = lessonStage(session, item);

  return `
    <header class="lesson-top"><button type="button" data-exit aria-label="Pausar sessão e voltar para Hoje">×</button><div class="lesson-progress" role="progressbar" aria-label="Progresso da sessão" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="lesson-right"><span aria-label="Etapa ${session.index + 1} de ${session.items.length}">${session.index + 1}/${session.items.length}</span>${Number(session.currentStreak || 0) >= 2 ? `<b class="lesson-streak">🔥 ${session.currentStreak}</b>` : ''}</div></header>
    ${stage ? `<div class="lesson-stage"><b>${escapeHtml(stage.primary)}</b><span>${escapeHtml(stage.secondary)}</span></div>` : ''}

    <section class="lesson-card-wrap">
      ${item.type === 'checkpoint' ? checkpointCard(item, session) : item.type === 'pattern' ? patternDiscoveryCard(item) : item.type === 'variation' ? variationCard(item) : item.type === 'intro' ? introCard(phrase) : item.type === 'recovery' ? recoveryCard(item, phrase) : exerciseCard(item, phrase)}
    </section>

  `;
}

function lessonStage(session, item) {
  if (!session || !item) return null;
  if (item.id === 'review-start' || item.reviewKind === 'scheduled') return { primary: 'REVISÃO', secondary: `${session.reviewCount || 0} programadas` };
  if (item.id === 'hard-focus' || item.id === 'hard-practice' || item.reviewKind === 'hard') return { primary: 'REFORÇO', secondary: `${session.hardCount || 0} difíceis` };
  if (item.id === 'family-transfer' || item.type === 'variation') return { primary: 'TRANSFERÊNCIA', secondary: `${session.variationCount || 0} variações` };
  if (item.id === 'session-checkout' || item.reviewKind === 'exit') return { primary: 'FECHAMENTO', secondary: `${session.closureCount || 0} confirmações` };
  if (item.id === 'daily-challenge' || item.reviewKind === 'challenge') return { primary: 'DESAFIO FINAL', secondary: 'consolidação' };
  const blockNumber = Number(item.blockNumber || activeLessonBlock(session));
  if (!blockNumber) return { primary: 'SESSÃO', secondary: `${session.index + 1}/${session.items.length}` };
  const blockTotal = Math.max(1, ...session.items.map(x => Number(x?.blockTotal || x?.blockNumber || 0)));
  if (item.id?.startsWith('mini-') || item.reviewKind === 'mini') return { primary: `BLOCO ${blockNumber}/${blockTotal}`, secondary: `${item.blockFocusLabel ? `${item.blockFocusLabel} · ` : ''}mini revisão` };
  if (item.type === 'pattern') return { primary: `BLOCO ${blockNumber}/${blockTotal}`, secondary: `${item.blockFocusLabel ? `${item.blockFocusLabel} · ` : ''}padrão` };
  const intros = session.items.filter(x => x?.type === 'intro' && Number(x.blockNumber) === blockNumber);
  const phraseId = item.phraseId || null;
  const phraseIndex = phraseId ? intros.findIndex(x => x.phraseId === phraseId) : -1;
  const focus = item.blockFocusLabel ? `${item.blockFocusLabel} · ` : '';
  return { primary: `BLOCO ${blockNumber}/${blockTotal}`, secondary: phraseIndex >= 0 ? `${focus}frase ${phraseIndex + 1}/${intros.length}` : `${focus}em andamento` };
}

function activeLessonBlock(session) {
  for (let i = Math.min(session.index, session.items.length - 1); i >= 0; i--) {
    const n = Number(session.items[i]?.blockNumber || 0);
    if (n) return n;
  }
  return 0;
}

function checkpointCard(item, session) {
  const recap = item.id?.startsWith('mini-') && item.blockNumber ? blockRecap(session, item.blockNumber) : '';
  const isBlockStart = item.id?.startsWith('block-');

  const icon = item.id?.startsWith('mini-') ? '↻' : item.id === 'session-checkout' ? '✓' : item.id === 'daily-challenge' ? '◆' : item.id === 'review-start' ? '⏱' : item.id === 'hard-focus' || item.id === 'hard-practice' ? '↻' : item.blockIcon || '10';
  return `<article class="checkpoint-card ${item.id?.startsWith('mini-') ? 'block-complete' : ''} ${item.blockFocus ? `focus-${escapeHtml(item.blockFocus)}` : ''}">
    ${item.id?.startsWith('mini-') ? `<div class="checkpoint-status">✓ BLOCO ${item.blockNumber} CONCLUÍDO</div>` : ''}

    <small>${escapeHtml(item.eyebrow || 'PRÓXIMA ETAPA')}</small>
    <h1>${escapeHtml(item.title)}</h1>
    <p>${escapeHtml(item.body)}</p>

    ${focus}

    ${recap}
    ${item.blockNumber ? `<div class="block-dots">${Array.from({length:item.blockTotal}, (_,i) => `<i class="${i < item.blockNumber ? 'done' : ''}"></i>`).join('')}</div>` : ''}
    <button type="button" class="primary big" data-checkpoint-next>CONTINUAR</button>
    ${item.id?.startsWith('mini-') ? `<button type="button" class="ghost big pause-session" data-pause-session>PAUSAR POR AQUI</button><small class="pause-note">Seu progresso já está salvo. Você continua exatamente daqui.</small>` : ''}

function reviewFocusStrip(item) {
  const focus = item?.focusHint;
  if (!focus?.label) return '';
  const skill = focus.skill === 'listening' ? 'LISTENING' : focus.skill === 'production' ? 'PRODUÇÃO' : 'LEITURA';
  const recurring = Boolean(focus.recurring);
  const repeats = Math.max(2, Number(focus.recurrenceCount || 2));
  const eyebrow = recurring ? `PADRÃO RECORRENTE · ${skill}` : `FOCO DA ÚLTIMA VEZ · ${skill}`;
  const text = recurring
    ? `Este mesmo ponto apareceu ${repeats} vezes recentemente. O sistema vai insistir nesta habilidade até você mostrar recuperação consistente.`
    : 'Na última tentativa ficou por pouco. Use este ponto como âncora, sem revelar a resposta antes.';
  return `<div class="review-focus-strip ${recurring ? 'recurring' : ''}"><span>${recurring ? '↻' : '◎'}</span><div><small>${eyebrow}${recurring ? `<span class="recurrence-pill">${repeats}x</span>` : ''}</small><b>${escapeHtml(focus.label)}</b><p>${escapeHtml(text)}</p></div></div>`;
}

function nearMissDiagnosisPanel(pending, phrase, mode) {
  const listening = mode === 'listening';
  const suggestion = pending?.suggestedFocus || nearMissFocus(phrase, listening ? 'listening' : 'production');
  return `<div class="near-miss-diagnosis ${listening ? 'listening-diagnosis' : ''}">
    <small>${listening ? 'PARTE DO ÁUDIO' : 'QUASE LEMBREI'} · DIAGNÓSTICO RÁPIDO</small>
    <h3>Onde você sentiu que travou?</h3>
    <p>Um toque basta. Isso não adiciona outra questão: só deixa a próxima revisão mais precisa.</p>
    <div class="near-miss-part-grid">
      <button type="button" class="near-miss-part" data-near-miss-focus="start"><b>${listening ? 'COMEÇO' : 'COMEÇO'}</b><span>${listening ? 'perdi as primeiras palavras' : 'não consegui puxar a frase'}</span></button>
      <button type="button" class="near-miss-part" data-near-miss-focus="middle"><b>${listening ? 'SOM / PALAVRA' : 'MEIO / PALAVRA'}</b><span>${listening ? 'um pedaço ficou embolado' : 'travei no verbo ou complemento'}</span></button>
      <button type="button" class="near-miss-part" data-near-miss-focus="end"><b>FINAL</b><span>${listening ? 'entendi, mas perdi o fim' : 'sabia o começo, faltou fechar'}</span></button>
      <button type="button" class="near-miss-part auto" data-near-miss-focus="auto"><b>NÃO SEI EXATAMENTE</b><span>usar o foco sugerido: ${escapeHtml(suggestion?.label || 'parte mais útil')}</span></button>
    </div>
  </div>`;
}

function nearMissFlowPanel(pending, phrase, mode) {
  if (!pending) return '';
  if (pending.stage === 'diagnose' || !pending.focus) return nearMissDiagnosisPanel(pending, phrase, mode);
  return nearMissCoachPanel(pending, phrase, mode);
}

function nearMissCoachPanel(pending, phrase, mode) {
  const focus = pending?.focus;
  if (!focus) return '';
  const listening = mode === 'listening';
  const sourceLabel = focus.source === 'self-report' ? 'FOCO QUE VOCÊ MARCOU' : 'FOCO SUGERIDO';
  return `<div class="near-miss-coach ${listening ? 'listening-coach' : ''}">
    <div class="near-miss-coach-head"><span>≈</span><div><small>QUASE · ${sourceLabel}</small><h3>${escapeHtml(focus.label)}</h3></div></div>
    <div class="near-miss-spotlight">${escapeHtml(focus.spotlight || phrase.english)}</div>
    <p>${escapeHtml(focus.hint || 'Use este trecho como âncora na próxima tentativa.')}</p>
    ${listening ? `<div class="audio-inline-actions"><button class="audio-main compact-audio" data-audio="${phrase.id}" data-audio-speed="normal">🔊 ouvir normal</button><button class="audio-speed-pill" data-audio="${phrase.id}" data-audio-speed="slow">🐢 devagar</button></div>` : ''}
    <div class="near-miss-confirm"><span>✓</span>${focus.source === 'self-report' ? 'Esse ponto foi escolhido por você e será priorizado na próxima revisão.' : 'Você deixou o sistema escolher; este é o melhor foco automático disponível para esta frase.'}</div>
    <button type="button" class="primary" data-near-miss-next>CONTINUAR</button>
  </div>`;
}

function adaptiveStrategyBanner(item) {
  if (!item?.adaptiveTitle) return '';
  const label = item.adaptiveMode === 'targeted-cloze' ? 'LACUNA FOCADA'
    : item.adaptiveMode === 'slow-first-listening' ? 'LISTENING RECONSTRUÍDO'
      : item.adaptiveMode === 'focused-listening' ? 'LISTENING FOCADO'
        : item.adaptiveMode?.includes('masked') ? 'RECUPERAÇÃO FOCADA'
          : 'REVISÃO ADAPTATIVA';
  return `<div class="adaptive-strategy"><span>↳</span><div><small>${label}</small><b>${escapeHtml(item.adaptiveTitle)}</b><p>${escapeHtml(item.adaptiveInstruction || '')}</p></div></div>`;
}

function exerciseCard(item, phrase) {
  if (item.type === 'recall') return recallCard(item, phrase);
  if (item.type === 'listening-recall') return listeningRecallCard(item, phrase);

  const title = {
    meaning: 'O que essa frase significa?',
    production: 'Qual frase expressa esta ideia?',
    listening: 'Escute e escolha o significado.',
    context: 'O que você diria nessa situação?',
    cloze: 'Complete a frase.'
  }[item.type];
  let prompt = '';
  if (item.type === 'meaning') prompt = `<div class="prompt-main">${escapeHtml(phrase.english)}</div>`;
  if (item.type === 'production') prompt = `<div class="prompt-main pt">${escapeHtml(phrase.portuguese)}</div>`;
  if (item.type === 'context') prompt = `<div class="context-large">${escapeHtml(phrase.context)}</div>`;
  if (item.type === 'cloze') prompt = `<div class="prompt-main">${escapeHtml(item.adaptiveMaskedPrompt || clozePrompt(phrase))}</div>`;
  if (item.type === 'listening') prompt = `<div class="audio-speed-row"><button class="listen-button" data-audio="${phrase.id}" data-audio-speed="normal"><span>🔊</span><b>OUVIR NORMAL</b><small>velocidade natural</small></button><button class="audio-speed-secondary" data-audio="${phrase.id}" data-audio-speed="slow">🐢 OUVIR DEVAGAR</button></div>`;

  return `<article class="exercise-card ${feedback ? 'has-feedback' : ''}">
    <small>${item.reviewKind === 'recovery' ? 'TENTE DE NOVO' : item.reviewKind === 'hard' ? 'FOCO EM DIFICULDADE' : item.isReview ? 'REVISÃO' : item.reviewKind === 'immediate' ? 'AGORA TENTE LEMBRAR' : 'PRÁTICA'}</small>
    <h2>${title}</h2>
    ${reviewFocusStrip(item)}
    ${adaptiveStrategyBanner(item)}
    ${prompt}
    <div class="choices">${item.choices.map((choice, idx) => {
      const stateClass = feedback ? (choice === item.answer ? 'correct-choice' : choice === feedback.choice ? 'wrong-choice' : '') : '';
      return `<button class="choice ${stateClass}" data-choice="${encodeURIComponent(choice)}" ${feedback ? 'disabled' : ''}><span>${String.fromCharCode(65 + idx)}</span>${escapeHtml(choice)}</button>`;
    }).join('')}</div>
  </article>`;
}

function recallCard(item, phrase) {
  const fromContext = item.sourceType === 'context';
  const cue = fromContext ? phrase.context : phrase.portuguese;
  const cueLabel = fromContext ? 'SITUAÇÃO' : 'IDEIA EM PORTUGUÊS';
  const promptTitle = fromContext ? 'O que você diria em inglês?' : 'Tente dizer esta frase em inglês.';
  const pending = pendingNearMissFor(item);
  const revealed = recallRevealed || Boolean(pending);

  return `<article class="recall-card ${revealed ? 'revealed' : ''}">
    <small>RECUPERAÇÃO MENTAL · SEM ALTERNATIVAS</small>
    <h2>${promptTitle}</h2>
    ${reviewFocusStrip(item)}
    ${adaptiveStrategyBanner(item)}
    <div class="recall-cue"><span>${cueLabel}</span><p>${escapeHtml(cue)}</p></div>
    ${item.adaptiveMaskedPrompt ? `<div class="adaptive-mask"><small>TRECHO-ALVO ESCONDIDO</small><b>${escapeHtml(item.adaptiveMaskedPrompt)}</b><p>Complete o espaço mentalmente; depois tente reconstruir a frase inteira.</p></div>` : ''}
    ${!revealed ? `
      <div class="recall-instruction"><b>${item.adaptiveMaskedPrompt ? 'Complete o trecho antes de tocar.' : 'Pense na frase antes de tocar.'}</b><p>${item.adaptiveMaskedPrompt ? 'O foco é corrigir o pedaço recorrente sem transformar a revisão em múltipla escolha.' : 'Não precisa falar nem digitar. Tente montar a frase inteira na cabeça.'}</p></div>
      <button type="button" class="primary big" data-recall-reveal>MOSTRAR RESPOSTA</button>
    ` : `
      <div class="recall-answer">
        <small>RESPOSTA</small>
        <h1>${escapeHtml(phrase.english)}</h1>
        <div class="audio-inline-actions"><button class="audio-main compact-audio" data-audio="${phrase.id}" data-audio-speed="normal">🔊</button><button class="audio-speed-pill" data-audio="${phrase.id}" data-audio-speed="slow">🐢 devagar</button></div>
      </div>
      ${pending ? nearMissFlowPanel(pending, phrase, 'production') : `<div class="recall-rating"><p>Como foi antes de revelar?</p>
        <button type="button" class="recall-rate remembered" data-recall-rate="remembered"><strong>LEMBREI</strong><span>veio inteira ou quase automática</span></button>
        <button type="button" class="recall-rate almost" data-recall-rate="almost"><strong>QUASE</strong><span>lembrei a ideia, mas travei em uma parte</span></button>
        <button type="button" class="recall-rate forgot" data-recall-rate="forgot"><strong>NÃO LEMBREI</strong><span>não consegui recuperar a frase</span></button>
      </div>`}
    `}
  </article>`;
}

function listeningRecallCard(item, phrase) {
  const pending = pendingNearMissFor(item);
  const revealed = listeningRevealed || Boolean(pending);
  return `<article class="listening-recall-card ${revealed ? 'revealed' : ''}">
    <small>LISTENING ATIVO · SEM TEXTO</small>
    <h2>Entenda a frase só pelo áudio.</h2>
    ${reviewFocusStrip(item)}
    ${adaptiveStrategyBanner(item)}
    <div class="listening-focus">
      <div class="listening-icon">♪</div>
      <p>${item.adaptiveMode === 'slow-first-listening' ? 'Comece devagar para isolar o som que está escapando. Depois ouça em velocidade natural antes de revelar.' : item.adaptiveMode === 'focused-listening' ? 'Ouça em velocidade natural procurando especificamente o ponto recorrente indicado acima.' : 'Ouça primeiro em velocidade natural. Use o modo devagar apenas se precisar.'}</p>
      <div class="audio-speed-row">
        ${item.adaptiveMode === 'slow-first-listening' ? `
          <button class="listen-button" data-audio="${phrase.id}" data-audio-speed="slow"><span>🐢</span><b>OUVIR DEVAGAR</b><small>primeira passada desta revisão</small></button>
          <button class="audio-speed-secondary" data-audio="${phrase.id}" data-audio-speed="normal">🔊 CONFIRMAR NORMAL</button>
        ` : `
          <button class="listen-button" data-audio="${phrase.id}" data-audio-speed="normal"><span>🔊</span><b>OUVIR NORMAL</b><small>primeira escolha</small></button>
          <button class="audio-speed-secondary" data-audio="${phrase.id}" data-audio-speed="slow">🐢 OUVIR DEVAGAR</button>
        `}
      </div>
    </div>
    ${!revealed ? `
      <div class="recall-instruction"><b>Não procure traduzir palavra por palavra.</b><p>Tente captar a ideia completa do que foi dito.</p></div>
      <button type="button" class="primary big" data-listening-reveal>MOSTRAR O QUE FOI DITO</button>
    ` : `
      <div class="listening-answer">
        <small>VOCÊ OUVIU</small>
        <h1>${escapeHtml(phrase.english)}</h1>
        <p>${escapeHtml(phrase.portuguese)}</p>
      </div>
      ${pending ? nearMissFlowPanel(pending, phrase, 'listening') : `<div class="recall-rating"><p>Quanto você entendeu antes de revelar?</p>
        <button type="button" class="recall-rate remembered" data-listening-rate="remembered"><strong>ENTENDI</strong><span>captei a frase e a ideia sem precisar do texto</span></button>
        <button type="button" class="recall-rate almost" data-listening-rate="almost"><strong>PARTE</strong><span>entendi a ideia, mas perdi alguma palavra</span></button>
        <button type="button" class="recall-rate forgot" data-listening-rate="forgot"><strong>NÃO ENTENDI</strong><span>o áudio ainda não ficou claro para mim</span></button>
      </div>`}
    `}
    <div class="voice-note">Voz usada: ${escapeHtml(voiceLabel())}</div>
  </article>`;
}

function feedbackPanel(item) {
  const recovery = item.reviewKind === 'recovery';
  const streak = Number(state.activeSession?.currentStreak || 0);
  const correctText = recovery ? 'Fixada por agora. Ela volta depois para confirmar.' : streak >= 3 ? `${streak} respostas certas seguidas.` : 'Resposta recuperada.';
  const wrongText = recovery ? `Resposta: ${escapeHtml(item.answer)} · ela volta cedo, sem loop.` : `Resposta: ${escapeHtml(item.answer)} · o motor vai trazê-la de volta.`;
  const phrase = getPhrase(item.phraseId);
  const lesson = !feedback.correct && phrase ? mistakeFeedback(item, phrase, feedback.choice) : null;
  return `<aside role="status" aria-live="polite" class="feedback ${feedback.correct ? 'correct' : 'wrong'} ${lesson ? 'has-lesson' : ''}">
    <div class="feedback-icon">${feedback.correct ? '✓' : '↻'}</div>
    <div class="feedback-copy"><strong>${feedback.correct ? recovery ? 'Recuperada' : 'Boa!' : 'Guarde esta'}</strong><p>${feedback.correct ? correctText : wrongText}</p>${lesson ? `<div class="feedback-lesson"><small>${escapeHtml(lesson.title)}</small><p>${escapeHtml(lesson.text)}</p></div>` : ''}</div>
    <button type="button" class="primary" data-next>CONTINUAR</button>
  </aside>`;
}

function summaryView(session) {
  const day = curriculum.find(d => d.id === session.dayId);
  const total = Number(session.correct || 0) + Number(session.almost || 0) + Number(session.wrong || 0);
  const accuracy = total ? Math.round((Number(session.correct || 0) + Number(session.almost || 0) * .5) / total * 100) : 100;
  const seenNow = daySeenCount(day, state);
  const dayFinished = seenNow >= day.phrases.length;
  const hardPractice = session.mode === 'hard-practice';
  const summaryLabel = hardPractice ? 'TREINO DE DIFICULDADES CONCLUÍDO' : dayFinished ? `DIA ${session.dayId} COMPLETO` : 'SESSÃO CONCLUÍDA';
  const summaryTitle = hardPractice ? `${session.hardCount || total} frases treinadas.` : dayFinished ? '40 frases apresentadas.' : `${session.newCount} novas frases trabalhadas.`;
  const summaryCopy = hardPractice ? 'Você trabalhou apenas frases detectadas como difíceis. Elas voltam conforme a memória pedir, sem substituir o estudo normal.' : dayFinished ? 'Agora essas frases entram no ciclo de revisão e voltarão em momentos diferentes conforme seu desempenho.' : `Você avançou para ${seenNow}/40 frases deste dia. O restante continua disponível na próxima sessão.`;
  const skills = sessionSkillBreakdown(session);
  const insight = sessionLearningInsight(session);
  const xpEarned = Math.max(0, Number(state.xp || 0) - Number(session.xpStart || 0));
  const bestStreak = Number(session.bestStreak || 0);
  const rhythms = (session.items || []).filter(item => item?.id?.startsWith('block-') && item.blockFocusLabel).map(item => item.blockFocusLabel);
  const mix = sessionExerciseMix(session);
  const nextBrief = buildNextSessionBrief(state, session, new Date());
  const closure = sessionClosureSummary(session);
  const analysis = `
    ${rhythms.length ? `<section class="session-rhythm-summary"><small>RITMO DE HOJE</small><div>${rhythms.map((label, index) => `<span><i>${index + 1}</i>${escapeHtml(label)}</span>`).join('')}</div><p>${mix.total} exercícios essenciais nesta sessão · mini-revisões e desafio final foram mantidos curtos para evitar repetição.</p></section>` : ''}
    <section class="session-skill-summary"><div class="session-summary-head"><small>HABILIDADES NESTA SESSÃO</small><h3>Como você recuperou importa mais do que apenas acertar.</h3></div>${sessionSkillCard('Leitura', skills.reading)}${sessionSkillCard('Listening', skills.listening)}${sessionSkillCard('Produção', skills.production)}</section>
    ${session.liveAdaptation?.changes?.length ? `<section class="live-session-summary"><small>ADAPTAÇÃO DURANTE A SESSÃO</small><h3>${session.liveAdaptation.deferredBlocks?.length ? `${session.liveAdaptation.deferredBlocks.length} bloco${session.liveAdaptation.deferredBlocks.length === 1 ? '' : 's'} adiado${session.liveAdaptation.deferredBlocks.length === 1 ? '' : 's'} para proteger a retenção.` : 'O nível das próximas revisões mudou enquanto você estudava.'}</h3><p>${escapeHtml(session.liveAdaptation.reason || 'O motor reagiu ao desempenho recente sem aumentar sua carga de frases novas.')}</p></section>` : ''}
    ${closure.attempts ? `<section class="checkout-summary"><small>FECHAMENTO INTELIGENTE</small><h3>${closure.correct}/${closure.attempts} confirmações completas${closure.almost ? ` · ${closure.almost} quase` : ''}.</h3><p>${closure.wrong ? 'O que ainda falhou já ficou agendado para voltar cedo; não vamos prolongar a sessão agora.' : 'O fechamento confirmou os pontos frágeis sem acrescentar novas frases à carga do dia.'}</p></section>` : ''}
    ${session.recoveryCount ? `<p class="recovery-summary">↻ ${session.recovered || 0}/${session.recoveryCount} reforços recuperados nesta sessão. Os demais voltam cedo, sem repetição infinita.</p>` : ''}
    ${session.variationCount ? `<p class="transfer-summary">↗ Transferência: ${session.variationRemembered || 0} consegui · ${session.variationAlmost || 0} quase · ${session.variationForgot || 0} não consegui. Essas variações não contam como frases novas.</p>` : ''}`;
  return `<section class="summary">
    <div class="summary-badge">✓</div><small>${summaryLabel}</small><h1>${summaryTitle}</h1><p>${summaryCopy}</p>
    <div class="summary-grid ${session.almost ? 'four' : ''}">${metric(session.correct, 'acertos')}${session.almost ? metric(session.almost, 'quase') : ''}${metric(session.wrong, 'erros')}${metric(`${accuracy}%`, 'retenção')}</div>
    <div class="session-reward-row"><span>+${xpEarned} XP</span>${bestStreak >= 2 ? `<span>🔥 melhor sequência: ${bestStreak}</span>` : ''}<span>${session.reviewCount || 0} revisões</span></div>
    <section class="session-insight"><span>◎</span><div><small>O MAIS IMPORTANTE</small><h3>${escapeHtml(insight.title)}</h3><p>${escapeHtml(insight.text)}</p></div></section>
    ${nextBrief ? `<div class="continuity-summary summary-primary-next">${continuityCard(nextBrief, { summary:true })}</div>` : `<section class="next-review-card summary-primary-next"><small>PRÓXIMO PASSO</small><h3>${session.wrong || session.almost ? 'O que deu trabalho volta mais cedo.' : 'As frases fortes ganham mais espaço.'}</h3><p>${session.wrong || session.almost ? 'Erros e quase-acertos já influenciaram o agendamento. Você não precisa decidir o que revisar amanhã.' : 'O motor aumenta gradualmente o intervalo das frases recuperadas com segurança.'}</p></section>`}
    <details class="session-analysis"><summary>Ver análise completa da sessão</summary><div class="session-analysis-body">${analysis}</div></details>
    ${dayFinished && phaseTransitionForDay(session.dayId) ? phaseTransitionCard(phaseTransitionForDay(session.dayId)) : ''}
    <section class="pattern-card"><span>✦</span><div><small>${day.pattern.title}</small><h3>${day.pattern.body}</h3></div></section>
    <button class="primary big" data-finish>VOLTAR PARA HOJE</button>
  </section>`;
}

function phaseTransitionCard(transition) {
  if (!transition?.phase) return '';
  const phase = transition.phase;
  const next = transition.next;
  return `<section class="phase-transition-card">
    <div class="phase-transition-icon">${phase.icon}</div>
    <div><small>FASE ${phase.id} CONCLUÍDA</small><h2>${escapeHtml(phase.title)} virou base.</h2><p>${escapeHtml(phase.outcome)}</p>${next ? `<div class="phase-next"><span>PRÓXIMA FASE</span><b>Fase ${next.id} · ${escapeHtml(next.title)}</b><p>${escapeHtml(next.goal)}</p></div>` : `<div class="phase-next"><span>PRIMEIRO CICLO COMPLETO</span><b>Agora o avanço acontece pela consolidação.</b><p>Revisões, listening, produção e transferência continuam fortalecendo o que você construiu.</p></div>`}</div>
  </section>`;
}

function sessionSkillCard(label, data) {
  const score = data?.score == null ? '—' : `${data.score}%`;
  const detail = data?.attempts ? `${data.correct} acertos · ${data.almost} quase · ${data.wrong} erros` : 'não testada nesta sessão';
  const width = data?.score == null ? 0 : data.score;
  return `<div class="session-skill-row"><div><b>${label}</b><span>${detail}</span></div><strong>${score}</strong><div class="session-skill-track"><i style="width:${width}%"></i></div></div>`;
}

function pageHeader(title, subtitle) {
  return `<header class="page-header"><button type="button" data-nav="home" aria-label="Voltar para Hoje">‹</button><div><h1>${title}</h1><p>${subtitle}</p></div></header>`;
}

function emptyState(title, text) {
  return `<section class="empty"><div>◎</div><h2>${title}</h2><p>${text}</p><button class="primary" data-nav="home">Voltar para hoje</button></section>`;
}

async function handleDocumentClick(event) {
  const target = event.target;
  const el = target instanceof Element ? target.closest('button') : null;
  if (!el || el.disabled) return;

  try {
    interactionError = null;

    if (el.hasAttribute('data-cloud-save-config')) {
      const url = document.querySelector('[data-cloud-config-url]')?.value || '';
      const key = document.querySelector('[data-cloud-config-key]')?.value || '';
      if (!saveCloudConfigLocal(url, key)) {
        cloudRuntime.error = 'Confira a Project URL e a chave pública do Supabase.';
        return render();
      }
      location.reload();
      return;
    }
    if (el.hasAttribute('data-cloud-clear-config')) {
      if (cloudRuntime.user) await cloudSignOut();
      clearCloudConfigLocal();
      location.reload();
      return;
    }
    if (el.hasAttribute('data-auth-signin') || el.hasAttribute('data-auth-signup')) {
      const email = String(document.querySelector('[data-auth-email]')?.value || '').trim();
      const password = String(document.querySelector('[data-auth-password]')?.value || '');
      if (!email || password.length < 6) {
        cloudRuntime.error = 'Digite um e-mail válido e uma senha com pelo menos 6 caracteres.';
        return render();
      }
      if (el.hasAttribute('data-auth-signin')) await cloudSignIn(email, password);
      else await cloudSignUp(email, password);
      return;
    }
    if (el.hasAttribute('data-auth-google')) { await cloudGoogleSignIn(); return; }
    if (el.hasAttribute('data-auth-signout')) { await cloudSignOut(); return; }
    if (el.hasAttribute('data-cloud-sync-now')) { await reconcileWithCloud('manual-button'); return; }
    if (el.hasAttribute('data-cloud-use-local')) { await cloudUseLocal(); return; }
    if (el.hasAttribute('data-cloud-use-remote')) { await cloudUseRemote(); return; }
    if (el.hasAttribute('data-pwa-install')) { await promptInstallEnglishJourney(); return; }
    if (el.hasAttribute('data-pwa-update')) { await activatePwaUpdate(); return; }
    if (el.hasAttribute('data-create-checkpoint')) {
      const saved = saveProgressCheckpoint('manual', state);
      cloudRuntime.message = saved ? 'Ponto seguro criado neste dispositivo.' : 'Não foi possível criar o ponto seguro.';
      render();
      return;
    }
    if (el.dataset.restoreCheckpoint) {
      const checkpoints = readProgressCheckpoints();
      const chosen = checkpoints.find(item => item.id === el.dataset.restoreCheckpoint);
      if (!chosen) { interactionError = 'Este ponto seguro não está mais disponível.'; render(); return; }
      const summary = chosen.summary || progressEvidence(chosen.state);
      const ok = confirm(`Restaurar este ponto?\n\n${summary.completedDays || 0}/30 dias · ${summary.seenPhrases || 0} frases · ${summary.xp || 0} XP\n\nO progresso atual será substituído, mas continuará disponível nos checkpoints recentes.`);
      if (!ok) return;
      saveProgressCheckpoint('manual', state);
      if (!restoreProgressCheckpoint(chosen)) { interactionError = 'Não foi possível restaurar este ponto seguro.'; render(); return; }
      navigate('home');
      return;
    }
    if (el.hasAttribute('data-onboarding-start')) {
      state.onboardingDone = true;
      saveState(state);
      return startDay(1);
    }
    if (el.dataset.nav) {
      if (el.dataset.nav === 'achievements' && state.recentAchievements?.length) { state.recentAchievements = []; saveState(state); }
      return navigate(el.dataset.nav);
    }
    if (el.hasAttribute('data-dismiss-achievements')) { state.recentAchievements = []; saveState(state); return render(); }
    if (el.dataset.start) return startDay(Number(el.dataset.start));
    if (el.hasAttribute('data-hard-practice')) return startHardPractice();

    if (el.hasAttribute('data-variation-audio')) {
      const item = state.activeSession?.items?.[state.activeSession?.index];
      const speed = el.dataset.variationSpeed || 'normal';
      if (item?.type === 'variation' && item.english) speak(item.english, { slow: speed === 'slow' });
      return;
    }

    if (el.dataset.audio) {
      const phrase = getPhrase(el.dataset.audio);
      const speed = el.dataset.audioSpeed || (state.settings.slowAudio ? 'slow' : 'normal');
      if (phrase) speak(phrase.english, { slow: speed === 'slow' });
      return;
    }

    if (el.hasAttribute('data-intro-next')) {
      el.disabled = true;
      return onIntroNext();
    }
    if (el.hasAttribute('data-checkpoint-next')) {
      el.disabled = true;
      return onCheckpointNext();
    }
    if (el.hasAttribute('data-recovery-next')) {
      el.disabled = true;
      return onRecoveryNext();
    }
    if (el.hasAttribute('data-recall-reveal')) return onRecallReveal();
    if (el.dataset.recallRate) return onRecallRate(el.dataset.recallRate);
    if (el.hasAttribute('data-listening-reveal')) return onListeningReveal();
    if (el.dataset.listeningRate) return onListeningRate(el.dataset.listeningRate);
    if (el.dataset.nearMissFocus) return onNearMissFocus(el.dataset.nearMissFocus);
    if (el.hasAttribute('data-near-miss-next')) return onNearMissNext();
    if (el.hasAttribute('data-variation-reveal')) return onVariationReveal();
    if (el.dataset.variationRate) return onVariationRate(el.dataset.variationRate);
    if (el.dataset.choice !== undefined) return onChoice(decodeURIComponent(el.dataset.choice));
    if (el.hasAttribute('data-next')) return onNext();
    if (el.hasAttribute('data-pause-session')) return pauseSession();
    if (el.hasAttribute('data-exit')) return pauseSession();
    if (el.hasAttribute('data-finish')) return finishSession();
    if (el.hasAttribute('data-reset')) {
      if (confirm('Reiniciar todo o progresso? Esta ação apaga o histórico de estudo salvo neste navegador.')) {
        state = resetState();
        feedback = null;
        render();
      }
    }
  } catch (error) {
    console.error('Falha de interação:', error);
    interactionError = 'Uma ação falhou, mas o progresso em memória foi preservado. Tente novamente.';
    el.disabled = false;
    render();
  }
}

function afterRender() {
  const item = state.activeSession?.items?.[state.activeSession?.index];
  if (route === 'lesson' && ['listening','listening-recall'].includes(item?.type) && !feedback && !listeningRevealed && !state.activeSession?.pendingNearMiss) {
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => {
      const phrase = getPhrase(item.phraseId);
      if (phrase) {
        try { speak(phrase.english, { slow: item?.adaptiveMode === 'slow-first-listening' }); } catch (error) { console.warn('Áudio indisponível:', error); }
      }
    }, 350);
  }
}

function startDay(dayId) {
  if (!RELEASE_INTEGRITY.ok) { interactionError = 'Novas sessões foram bloqueadas porque esta cópia do curso falhou na verificação de integridade.'; render(); return; }
  if (state.activeSession?.items?.length && state.activeSession.index <= state.activeSession.items.length) {
    saveState(state);
    navigate('lesson');
    return;
  }
  if (!isDayUnlocked(dayId, state)) return;
  // A sessão é montada antes de marcar a atividade de hoje para que o motor
  // ainda enxergue corretamente quantos dias se passaram desde o último estudo.
  const session = buildSession(state, dayId);
  if (!session || !Array.isArray(session.items)) return;
  state.activeSession = session;
  saveState(state);
  navigate('lesson');
}

function startHardPractice() {
  if (!RELEASE_INTEGRITY.ok) { interactionError = 'O reforço foi bloqueado porque esta cópia do curso falhou na verificação de integridade.'; render(); return; }
  const session = buildDifficultPracticeSession(state, new Date(), 15);
  if (!session) return;
  state.activeSession = session;
  saveState(state);
  navigate('lesson');
}

function onRecoveryNext() {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || item?.type !== 'recovery') return recoverSession('O reforço atual estava inconsistente e foi reconstruído.');
  session.index = Math.min(session.index + 1, session.items.length);
  session.pendingFeedback = null;
  session.revealState = null;
  saveState(state);
  feedback = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onCheckpointNext() {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session?.items?.length || !item) return navigate('home');
  session.index = Math.min(session.index + 1, session.items.length);
  session.pendingFeedback = null;
  session.revealState = null;
  saveState(state);
  feedback = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onIntroNext() {
  const session = state.activeSession;
  const item = session?.items?.[session.index];
  if (!session || !item) return navigate('home');

  // Proteção para sessões antigas/migradas: só registra introdução quando o item é válido.
  if (item.type === 'intro' && item.phraseId && getPhrase(item.phraseId)) {
    recordIntro(state, item.phraseId);

    // V0.4.3: sessões antigas podiam abrir um exercício de significado que
    // mostrava exatamente a mesma frase logo após o clique. O índice avançava,
    // mas visualmente parecia que o botão não tinha funcionado. Reparamos esse
    // próximo item em tempo real para preservar até sessões já salvas.
    const nextIndex = session.index + 1;
    const nextItem = session.items[nextIndex];
    if (nextItem?.phraseId === item.phraseId && nextItem.reviewKind === 'immediate' && nextItem.type === 'meaning' && !nextItem.liveAdjustedMode) {
      const phrase = getPhrase(item.phraseId);
      session.items[nextIndex] = makeExercise(phrase, state, 2400 + nextIndex, false, 'production', 'immediate');
    }
  }

  session.index = Math.min(session.index + 1, session.items.length);
  session.pendingFeedback = null;
  session.revealState = null;
  saveState(state);
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onRecallReveal() {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || item?.type !== 'recall') return recoverSession('O exercício de recuperação mental estava inconsistente e foi reconstruído.');
  recallRevealed = true;
  session.revealState = { index: session.index, type: 'recall' };
  saveState(state, 'recall-revealed');
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onRecallRate(rating) {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || item?.type !== 'recall' || !recallRevealed) return recoverSession('A autoavaliação de memória estava inconsistente e foi reconstruída.');
  if (!['remembered','almost','forgot'].includes(rating)) return;

  const phrase = getPhrase(item.phraseId);
  const suggestedFocus = rating === 'almost' && phrase ? nearMissFocus(phrase, 'production') : null;
  // V0.8.2: em "quase", o SRS registra o resultado primeiro e espera um toque do aluno
  // antes de decidir qual pedaço deve guiar a próxima revisão.
  recordRecall(state, item, rating, new Date());
  recordSessionOutcome(session, item, rating === 'remembered' ? 'correct' : rating === 'almost' ? 'almost' : 'wrong');
  if (rating === 'remembered') {
    session.correct = Number(session.correct || 0) + 1;
  } else if (rating === 'almost') {
    session.almost = Number(session.almost || 0) + 1;
    session.pendingNearMiss = { phraseId: item.phraseId, itemType: item.type, stage: 'diagnose', skill: 'production', suggestedFocus, focus: null };
    saveState(state);
    render();
    requestAnimationFrame(() => window.scrollTo(0, 0));
    return;
  } else {
    session.wrong = Number(session.wrong || 0) + 1;
    session.pendingNearMiss = null;
    scheduleRecovery(session, state, item, new Date());
  }

  session.index = Math.min(session.index + 1, session.items.length);
  session.pendingNearMiss = null;
  session.revealState = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  feedback = null;
  saveState(state);
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onListeningReveal() {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || item?.type !== 'listening-recall') return recoverSession('O exercício de listening estava inconsistente e foi reconstruído.');
  listeningRevealed = true;
  session.revealState = { index: session.index, type: 'listening-recall' };
  saveState(state, 'listening-revealed');
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onListeningRate(rating) {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || item?.type !== 'listening-recall' || !listeningRevealed) return recoverSession('A autoavaliação de listening estava inconsistente e foi reconstruída.');
  if (!['remembered','almost','forgot'].includes(rating)) return;

  const phrase = getPhrase(item.phraseId);
  const suggestedFocus = rating === 'almost' && phrase ? nearMissFocus(phrase, 'listening') : null;
  recordRecall(state, item, rating, new Date());
  recordSessionOutcome(session, item, rating === 'remembered' ? 'correct' : rating === 'almost' ? 'almost' : 'wrong');
  if (rating === 'remembered') {
    session.correct = Number(session.correct || 0) + 1;
  } else if (rating === 'almost') {
    session.almost = Number(session.almost || 0) + 1;
    session.pendingNearMiss = { phraseId: item.phraseId, itemType: item.type, stage: 'diagnose', skill: 'listening', suggestedFocus, focus: null };
    saveState(state);
    render();
    requestAnimationFrame(() => window.scrollTo(0, 0));
    return;
  } else {
    session.wrong = Number(session.wrong || 0) + 1;
    session.pendingNearMiss = null;
    scheduleRecovery(session, state, item, new Date());
  }

  session.index = Math.min(session.index + 1, session.items.length);
  session.pendingNearMiss = null;
  session.revealState = null;
  listeningRevealed = false;
  recallRevealed = false;
  variationRevealed = false;
  feedback = null;
  saveState(state);
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onNearMissFocus(part) {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  const pending = session?.pendingNearMiss;
  if (!session || !item || !pending || pending.phraseId !== item.phraseId || pending.itemType !== item.type) {
    return recoverSession('O diagnóstico do quase-acerto estava inconsistente e foi reconstruído.');
  }
  if (!['start','middle','end','auto'].includes(part)) return;
  const phrase = getPhrase(item.phraseId);
  if (!phrase) return recoverSession('A frase deste diagnóstico não foi encontrada.');
  const skill = pending.skill || (item.type === 'listening-recall' ? 'listening' : 'production');
  const focus = selfReportedNearMissFocus(phrase, skill, part);
  const stored = saveNearMissFocus(state, item.phraseId, focus, new Date());
  session.pendingNearMiss = { ...pending, stage: 'coach', focus: stored || focus, selectedPart: part };
  saveState(state);
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onNearMissNext() {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  const pending = session?.pendingNearMiss;
  if (!session || !item || !pending || pending.phraseId !== item.phraseId || pending.itemType !== item.type) {
    return recoverSession('O feedback de quase-acerto estava inconsistente e foi reconstruído.');
  }
  session.pendingNearMiss = null;
  session.revealState = null;
  session.index = Math.min(session.index + 1, session.items.length);
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  feedback = null;
  saveState(state);
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}


function onVariationReveal() {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || item?.type !== 'variation') return recoverSession('O exercício de transferência estava inconsistente e foi reconstruído.');
  variationRevealed = true;
  session.revealState = { index: session.index, type: 'variation' };
  saveState(state, 'variation-revealed');
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onVariationRate(rating) {
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || item?.type !== 'variation' || !variationRevealed) return recoverSession('A autoavaliação de transferência estava inconsistente e foi reconstruída.');
  if (!['remembered','almost','forgot'].includes(rating)) return;

  recordVariation(state, item, rating);
  if (rating === 'remembered') session.variationRemembered = Number(session.variationRemembered || 0) + 1;
  else if (rating === 'almost') session.variationAlmost = Number(session.variationAlmost || 0) + 1;
  else session.variationForgot = Number(session.variationForgot || 0) + 1;

  session.index = Math.min(session.index + 1, session.items.length);
  session.revealState = null;
  variationRevealed = false;
  recallRevealed = false;
  listeningRevealed = false;
  feedback = null;
  saveState(state);
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function onChoice(choice) {
  if (feedback) return;
  const session = state.activeSession;
  const item = session?.items?.[session?.index];
  if (!session || !item || !Array.isArray(item.choices)) return recoverSession('O exercício atual estava incompleto e foi reconstruído.');
  const correct = choice === item.answer;
  feedback = { correct, choice };
  session.pendingFeedback = { index: session.index, correct, choice, at: new Date().toISOString() };
  recordAnswer(state, item, correct);
  recordSessionOutcome(session, item, correct ? 'correct' : 'wrong');
  if (correct) {
    session.correct = Number(session.correct || 0) + 1;
    if (item.reviewKind === 'recovery') session.recovered = Number(session.recovered || 0) + 1;
  } else {
    session.wrong = Number(session.wrong || 0) + 1;
    scheduleRecovery(session, state, item, new Date());
  }
  saveState(state);
  render();
}

function onNext() {
  const session = state.activeSession;
  if (!session?.items?.length) return navigate('home');
  session.pendingFeedback = null;
  session.revealState = null;
  feedback = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  session.index = Math.min(session.index + 1, session.items.length);
  saveState(state);
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}


function pauseSession() {
  const session = state.activeSession;
  if (!session) return navigate('home');
  session.pausedAt = new Date().toISOString();
  session.pauseCount = Number(session.pauseCount || 0) + 1;
  saveState(state, 'pause');
  saveProgressCheckpoint('session-pause', state);
  feedback = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  navigate('home');
}

function finishSession() {
  const session = state.activeSession;
  if (!session) return navigate('home');
  const beforeCompletion = clone(state);
  const dayId = Number(session.dayId || 0);
  completeDay(state, session);
  const saved = saveState(state, 'day-complete');
  const guarded = persistCompletionGuard(state);
  const dayWasCompleted = state.completedDays.includes(dayId);
  const durable = !dayWasCompleted || hasPersistedDayCompletion(dayId);

  if ((!saved && !guarded) || !durable) {
    state = beforeCompletion;
    interactionError = 'Não consegui confirmar a gravação do Dia concluído. Seu progresso da sessão foi preservado; tente novamente com armazenamento disponível.';
    persistenceRecoveryNotice = 'A conclusão não foi descartada porque o armazenamento não confirmou a gravação.';
    render();
    return;
  }

  saveProgressCheckpoint('day-complete', state);
  feedback = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  navigate('home');
}

function recoverSession(message) {
  interactionError = message;
  feedback = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  state.activeSession = null;
  saveState(state);
  navigate('home');
}

function escapeHtml(text) {
  return String(text).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function capitalize(v) { return v.charAt(0).toUpperCase() + v.slice(1); }

// V1.1.6 — sincronização multi-dispositivo + histórico restaurável + diagnóstico.
window.EnglishJourneySync = Object.freeze({
  schemaVersion: SYNC_SCHEMA_VERSION,
  deviceId: CURRENT_DEVICE_ID,
  envelope: () => createSyncEnvelope(state),
  compare: compareSyncEnvelopes,
  restoreState: stateFromSyncEnvelope,
  meta: () => ({ ...state.syncMeta }),
  syncNow: () => reconcileWithCloud('external'),
  cloudStatus: () => ({ ...cloudRuntime, client: undefined, session: undefined, authSubscription: undefined, syncTimer: undefined, reconcilePromise: undefined }),
  persistence: () => ({ mode: getStorageMode(), saveFailures: persistenceSaveFailures, persistedAt: state?._persistedAt || null, completedDays: [...(state?.completedDays || [])], seenPhrases: Object.values(state?.phraseProgress || {}).filter(progress => progress?.seen).length, guardAvailable: Boolean(safeGet('localStorage', COMPLETION_GUARD_KEY) || safeGet('sessionStorage', COMPLETION_GUARD_KEY)), checkpoints: readProgressCheckpoints().map(entry => ({ id:entry.id, at:entry.at, reason:entry.reason, summary:entry.summary })) }),
  markAccepted: (revision) => { markSyncAccepted(state, revision); saveState(state, 'sync-ack'); return createSyncEnvelope(state); }
});

render();
initializeCloud();
registerEnglishJourneyPwa();
</script>
