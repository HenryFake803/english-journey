<body>
  <div id="app"></div>
  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'unica-coisa-v01';
  const SAFETY_BACKUP_KEY = 'unica-coisa-safety-backup-v1';
  const BACKUP_FORMAT_VERSION = 1;
  const APP_VERSION = '0.19';
  const app = document.getElementById('app');
  let toastTimer = null;
  let journeyMonthOffset = 0;
  let deferredInstallPrompt = null;
  let swRegistration = null;
  let swUpdateReady = false;
  let reloadForUpdate = false;

  const DEFAULT_STATE = {
    version: 13,
    goals: [],
    laterGoals: [],
    completedGoals: [],
    checkIns: {},
    focusHistory: [],
    focusCycles: [],
    milestoneHistory: [],
    reviews: [],
    weeklyFocuses: [],
    dailyActions: [],
    insightDismissals: {},
    activeGoalId: null,
    focusSelectionPending: false,
    activeTab: 'today',
    journeyFilter: 'all',
    onboardingStep: 0,
    onboardingDraft: {
      title: '', why: '', success: '', oneThing: '', frequency: 'daily', emoji: '🎯', milestone: '',
      milestoneCurrent: '', milestoneTarget: '', milestoneUnit: '', focusHorizonDays: 30
    },
    modal: null,
    detailGoalId: null,
    dataSafety: { lastExportedAt: null, lastImportedAt: null },
    preferences: { theme: 'system', dateFormat: 'written', weekStartsOn: 'monday' }
  };

  let state = loadState();

  function isRecord(value) {
    return Boolean(value && typeof value === 'object' && !Array.isArray(value));
  }

  function sanitizeRecordArray(value) {
    return Array.isArray(value) ? value.filter(isRecord) : [];
  }

  function isSafeGoalId(value) {
    return typeof value === 'string' && /^[A-Za-z0-9_-]{1,128}$/.test(value.trim());
  }

  function sanitizeGoalBuckets(parsed) {
    const seen = new Set();
    const sanitize = value => {
      const result = [];
      for (const goal of Array.isArray(value) ? value : []) {
        if (!isRecord(goal)) continue;
        const id = typeof goal.id === 'string' ? goal.id.trim() : '';
        if (!isSafeGoalId(id) || seen.has(id)) continue;
        seen.add(id);
        result.push({ ...goal, id });
      }
      return result;
    };
    return {
      goals: sanitize(parsed.goals),
      laterGoals: sanitize(parsed.laterGoals),
      completedGoals: sanitize(parsed.completedGoals)
    };
  }

  function sanitizeCheckIns(value) {
    if (!isRecord(value)) return {};
    const clean = {};
    Object.entries(value).forEach(([goalId, dates]) => {
      if (!isRecord(dates)) return;
      clean[goalId] = { ...dates };
    });
    return clean;
  }

  function normalizeState(parsed) {
    if (!isRecord(parsed)) return structuredClone(DEFAULT_STATE);
    const goalBuckets = sanitizeGoalBuckets(parsed);
    const migrated = {
      ...structuredClone(DEFAULT_STATE),
      ...parsed,
      version: 13,
      goals: goalBuckets.goals,
      laterGoals: goalBuckets.laterGoals,
      completedGoals: goalBuckets.completedGoals,
      checkIns: sanitizeCheckIns(parsed.checkIns),
      focusHistory: sanitizeRecordArray(parsed.focusHistory),
      focusCycles: sanitizeRecordArray(parsed.focusCycles),
      milestoneHistory: sanitizeRecordArray(parsed.milestoneHistory),
      reviews: sanitizeRecordArray(parsed.reviews),
      weeklyFocuses: sanitizeRecordArray(parsed.weeklyFocuses),
      dailyActions: sanitizeRecordArray(parsed.dailyActions),
      insightDismissals: parsed.insightDismissals && typeof parsed.insightDismissals === 'object' && !Array.isArray(parsed.insightDismissals) ? parsed.insightDismissals : {},
      onboardingDraft: { ...DEFAULT_STATE.onboardingDraft, ...(parsed.onboardingDraft || {}) },
      dataSafety: { ...DEFAULT_STATE.dataSafety, ...(parsed.dataSafety || {}) },
      preferences: { ...DEFAULT_STATE.preferences, ...(parsed.preferences || {}) },
      focusSelectionPending: Boolean(parsed.focusSelectionPending),
      activeTab: 'today',
      journeyFilter: 'all',
      modal: null,
      detailGoalId: null
    };
    migrated.goals = migrated.goals.map(goal => ({
      ...goal,
      milestoneCurrent: normalizeStoredNumber(goal.milestoneCurrent),
      milestoneTarget: normalizeStoredNumber(goal.milestoneTarget),
      milestoneUnit: goal.milestoneUnit || '',
      milestoneCompletedAt: goal.milestoneCompletedAt || null,
      milestoneId: goal.milestoneId || (goal.milestone ? `legacy-${goal.id}` : null),
      milestoneStartedAt: goal.milestoneStartedAt || goal.createdAt || null,
      focusHorizonDays: normalizeStoredNumber(goal.focusHorizonDays),
      focusCommitmentStartedAt: goal.focusCommitmentStartedAt || null,
      focusTargetEndAt: goal.focusTargetEndAt || null,
      focusCycleMilestoneStartCurrent: normalizeStoredNumber(goal.focusCycleMilestoneStartCurrent),
      focusCycleMilestoneId: goal.focusCycleMilestoneId || null,
      focusCycleStartSnapshot: goal.focusCycleStartSnapshot && typeof goal.focusCycleStartSnapshot === 'object' ? goal.focusCycleStartSnapshot : null
    }));
    migrated.laterGoals = migrated.laterGoals.map(goal => ({
      ...goal,
      deferredAt: goal.deferredAt || goal.updatedAt || goal.createdAt || null,
      deferredReason: goal.deferredReason || '',
      milestoneCurrent: normalizeStoredNumber(goal.milestoneCurrent),
      milestoneTarget: normalizeStoredNumber(goal.milestoneTarget),
      milestoneUnit: goal.milestoneUnit || '',
      milestoneCompletedAt: goal.milestoneCompletedAt || null,
      milestoneId: goal.milestoneId || (goal.milestone ? `legacy-${goal.id}` : null),
      milestoneStartedAt: goal.milestoneStartedAt || goal.createdAt || null,
      focusHorizonDays: null,
      focusCommitmentStartedAt: null,
      focusTargetEndAt: null,
      focusCycleMilestoneStartCurrent: null,
      focusCycleMilestoneId: null,
      focusCycleStartSnapshot: null,
      focusStartedAt: null
    }));
    migrated.completedGoals = migrated.completedGoals.map(goal => ({
      ...goal,
      completedAt: goal.completedAt || goal.updatedAt || goal.createdAt || null,
      completionReflection: goal.completionReflection || '',
      completionStats: goal.completionStats && typeof goal.completionStats === 'object' ? goal.completionStats : null,
      milestoneCurrent: normalizeStoredNumber(goal.milestoneCurrent),
      milestoneTarget: normalizeStoredNumber(goal.milestoneTarget),
      milestoneUnit: goal.milestoneUnit || '',
      milestoneCompletedAt: goal.milestoneCompletedAt || null,
      milestoneId: goal.milestoneId || (goal.milestone ? `legacy-${goal.id}` : null),
      milestoneStartedAt: goal.milestoneStartedAt || goal.createdAt || null
    }));
    migrated.goals.forEach(goal => {
      if (!goal.milestone || !goal.milestoneCompletedAt || !goal.milestoneId) return;
      const exists = migrated.milestoneHistory.some(item => item.milestoneId === goal.milestoneId);
      if (!exists) {
        migrated.milestoneHistory.push({
          id: `history-${goal.milestoneId}`,
          milestoneId: goal.milestoneId,
          goalId: goal.id,
          title: goal.milestone,
          current: goal.milestoneCurrent,
          target: goal.milestoneTarget,
          unit: goal.milestoneUnit || '',
          startedAt: goal.milestoneStartedAt || goal.createdAt || goal.milestoneCompletedAt,
          completedAt: goal.milestoneCompletedAt
        });
      }
    });
    const activeIdIsValid = Boolean(migrated.activeGoalId && migrated.goals.some(goal => goal.id === migrated.activeGoalId));
    if (!activeIdIsValid) migrated.activeGoalId = null;
    if (migrated.goals.length && !migrated.activeGoalId && !migrated.focusSelectionPending) {
      migrated.activeGoalId = migrated.goals[0].id;
    }
    if (!migrated.goals.length) {
      migrated.activeGoalId = null;
      migrated.focusSelectionPending = false;
    }
    return migrated;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(DEFAULT_STATE);
      return normalizeState(JSON.parse(raw));
    } catch {
      return structuredClone(DEFAULT_STATE);
    }
  }

  function normalizeStoredNumber(value) {
    if (value === '' || value === null || value === undefined) return null;
    const number = Number(value);
    return Number.isFinite(number) && number >= 0 ? number : null;
  }

  function parseOptionalNumber(value) {
    if (value === '' || value === null || value === undefined) return null;
    const normalized = String(value).trim().replace(',', '.');
    if (!normalized) return null;
    const number = Number(normalized);
    return Number.isFinite(number) && number >= 0 ? number : null;
  }

  function serializableStateSnapshot(source = state) {
    return { ...source, modal: null, detailGoalId: null, activeTab: 'today', journeyFilter: 'all' };
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializableStateSnapshot()));
      return true;
    } catch (error) {
      console.warn('Única Coisa: não foi possível persistir o estado.', error);
      const canNotify = typeof window !== 'undefined' && !window.__UC_TEST_MODE__ && typeof document !== 'undefined' && document.body;
      if (canNotify) showToast('Não foi possível salvar no aparelho. Exporte um backup e libere espaço de armazenamento.');
      return false;
    }
  }

  function uid() {
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  }

  function localDateKey(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function dateMinus(days) {
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - days);
    return localDateKey(d);
  }

  function formatDate(date = new Date()) {
    if (state.preferences?.dateFormat === 'numeric') {
      const weekday = new Intl.DateTimeFormat('pt-BR', { weekday: 'long' }).format(date);
      const numeric = new Intl.DateTimeFormat('pt-BR').format(date);
      return `${weekday}, ${numeric}`;
    }
    return new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }).format(date);
  }

  function formatShortDate(dateKey) {
    const [y,m,d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    if (state.preferences?.dateFormat === 'numeric') return new Intl.DateTimeFormat('pt-BR').format(date);
    return new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
  }

  function resolvedTheme() {
    const preference = state.preferences?.theme || 'system';
    if (preference === 'light' || preference === 'dark') return preference;
    return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyPreferences() {
    const theme = resolvedTheme();
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#141a17' : '#f4f1e9');
  }


  function focusDurationLabel(goal) {
    const start = goal?.focusStartedAt || goal?.createdAt;
    if (!start) return 'foco atual';
    const [sy, sm, sd] = start.split('-').map(Number);
    const [ey, em, ed] = localDateKey().split('-').map(Number);
    const startDate = new Date(sy, sm - 1, sd, 12);
    const endDate = new Date(ey, em - 1, ed, 12);
    const days = Math.max(0, Math.round((endDate - startDate) / 86400000));
    if (days === 0) return 'começou hoje';
    if (days === 1) return 'foco há 1 dia';
    return `foco há ${days} dias`;
  }

  function uiIcon(name) {
    const paths = {
      plus: '<path d="M12 5v14M5 12h14"/>',
      today: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>',
      life: '<path d="M5 6.5h14v11H5z"/><path d="M8 6.5V4h8v2.5M8.5 11h7M8.5 14h5"/>',
      journey: '<path d="M5 18c2.2-5.2 4.4-7.8 7-7.8 2.9 0 3.3 3.6 6.7 3.6"/><path d="M16.5 11.3 19 13.8l-2.5 2.5"/>',
      check: '<path d="m7.3 12.3 3 3 6.4-7"/>',
      target: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.3"/>',
      flag: '<path d="M6.5 20V5.2c3.8-2.2 7.2 2 11-.2v8c-3.8 2.2-7.2-2-11 .2"/>',
      arrow: '<path d="M5 12h13M14 8l4 4-4 4"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7.7 7.7 0 0 0-.1-1.2l2-1.5-2-3.4-2.5 1a8.2 8.2 0 0 0-2-1.2L14 3h-4l-.4 2.7a8.2 8.2 0 0 0-2 1.2l-2.5-1-2 3.4 2 1.5A7.7 7.7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.5-1a8.2 8.2 0 0 0 2 1.2L10 21h4l.4-2.7a8.2 8.2 0 0 0 2-1.2l2.5 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/>',
      back: '<path d="m15 18-6-6 6-6"/>'
    };
    return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name] || paths.target}</svg>`;
  }

  function escapeHtml(value = '') {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function allGoals() {
    return [...state.goals, ...(state.laterGoals || []), ...(state.completedGoals || [])];
  }

  function goalById(id) {
    return state.goals.find(g => g.id === id) || (state.laterGoals || []).find(g => g.id === id) || (state.completedGoals || []).find(g => g.id === id) || null;
  }

  function isCompletedGoal(goalId) {
    return Boolean((state.completedGoals || []).some(goal => goal.id === goalId));
  }

  function isLaterGoal(goalId) {
    return Boolean((state.laterGoals || []).some(goal => goal.id === goalId));
  }

  function activeGoal() {
    if (!state.activeGoalId) return null;
    return state.goals.find(g => g.id === state.activeGoalId) || null;
  }

  function checkInMap(goalId) {
    if (!state.checkIns[goalId]) state.checkIns[goalId] = {};
    return state.checkIns[goalId];
  }

  function isDone(goalId, dateKey = localDateKey()) {
    return Boolean(state.checkIns[goalId]?.[dateKey]);
  }

  function dateFromKey(dateKey) {
    const [y,m,d] = String(dateKey).split('-').map(Number);
    return new Date(y, m - 1, d, 12);
  }

  function daysBetween(startKey, endKey = localDateKey()) {
    if (!startKey || !endKey) return 0;
    return Math.max(0, Math.round((dateFromKey(endKey) - dateFromKey(startKey)) / 86400000));
  }


  function addDaysKey(dateKey, delta) {
    const d = dateFromKey(dateKey);
    d.setDate(d.getDate() + delta);
    return localDateKey(d);
  }

  function focusTargetDate(startKey, days) {
    const safeDays = Math.max(1, Math.round(Number(days) || 1));
    return addDaysKey(startKey, safeDays - 1);
  }

  function focusCycleInfo(goal, todayKey = localDateKey()) {
    const days = normalizeStoredNumber(goal?.focusHorizonDays);
    const startedAt = goal?.focusCommitmentStartedAt;
    if (!days || !startedAt) return null;
    const plannedDays = Math.max(1, Math.round(days));
    const endAt = goal.focusTargetEndAt || focusTargetDate(startedAt, plannedDays);
    const elapsedRaw = daysBetween(startedAt, todayKey) + 1;
    const day = Math.max(1, Math.min(plannedDays, elapsedRaw));
    const remaining = Math.max(0, plannedDays - day);
    const percentage = Math.max(0, Math.min(100, Math.round((day / plannedDays) * 100)));
    const due = String(todayKey) >= String(endAt);
    return { plannedDays, startedAt, endAt, day, remaining, percentage, due };
  }

  function focusCycleLabel(goal) {
    const cycle = focusCycleInfo(goal);
    if (!cycle) return focusDurationLabel(goal);
    if (cycle.due) return `ciclo de ${cycle.plannedDays} dias completo`;
    return `dia ${cycle.day} de ${cycle.plannedDays}`;
  }

  function makeFocusCycleSnapshot(goal, horizonDays = goal?.focusHorizonDays, startKey = localDateKey()) {
    if (!goal) return null;
    return {
      startedAt: startKey,
      horizonDays: Number(horizonDays) > 0 ? Math.round(Number(horizonDays)) : null,
      title: goal.title || '',
      emoji: goal.emoji || '🎯',
      why: goal.why || '',
      success: goal.success || '',
      oneThing: goal.oneThing || '',
      milestone: goal.milestone || '',
      milestoneCurrent: normalizeStoredNumber(goal.milestoneCurrent),
      milestoneTarget: normalizeStoredNumber(goal.milestoneTarget),
      milestoneUnit: goal.milestoneUnit || ''
    };
  }

  function setFocusCommitment(goal, horizonDays, startKey = localDateKey()) {
    if (!goal) return null;
    const days = Number(horizonDays);
    if (!Number.isFinite(days) || days <= 0) {
      goal.focusHorizonDays = null;
      goal.focusCommitmentStartedAt = null;
      goal.focusTargetEndAt = null;
      goal.focusCycleMilestoneStartCurrent = null;
      goal.focusCycleMilestoneId = null;
      goal.focusCycleStartSnapshot = null;
      return null;
    }
    const plannedDays = Math.max(1, Math.round(days));
    goal.focusHorizonDays = plannedDays;
    goal.focusCommitmentStartedAt = startKey;
    goal.focusTargetEndAt = focusTargetDate(startKey, plannedDays);
    goal.focusCycleMilestoneStartCurrent = normalizeStoredNumber(goal.milestoneCurrent);
    goal.focusCycleMilestoneId = goal.milestoneId || null;
    goal.focusCycleStartSnapshot = makeFocusCycleSnapshot(goal, plannedDays, startKey);
    return focusCycleInfo(goal, startKey);
  }

  function recordFocusCycle(goal, endedAt = localDateKey(), outcome = 'completed', note = '') {
    const cycle = focusCycleInfo(goal, endedAt);
    if (!goal || !goal.focusHorizonDays || !goal.focusCommitmentStartedAt) return null;
    const duplicate = state.focusCycles.find(item => item.goalId === goal.id && item.startedAt === goal.focusCommitmentStartedAt && item.endedAt === endedAt && item.outcome === outcome);
    if (duplicate) return duplicate;
    const plannedEndAt = goal.focusTargetEndAt || focusTargetDate(goal.focusCommitmentStartedAt, goal.focusHorizonDays);
    const summaryEndAt = String(endedAt) > String(plannedEndAt) ? plannedEndAt : endedAt;
    const summary = focusCycleSummary(goal, goal.focusCommitmentStartedAt, summaryEndAt);
    const item = {
      id: `cycle-${uid()}`,
      goalId: goal.id,
      startedAt: goal.focusCommitmentStartedAt,
      plannedEndAt,
      endedAt,
      plannedDays: Math.round(Number(goal.focusHorizonDays) || 0),
      outcome,
      note: String(note || '').trim(),
      startSnapshot: goal.focusCycleStartSnapshot ? structuredClone(goal.focusCycleStartSnapshot) : null,
      summary
    };
    state.focusCycles.push(item);
    return item;
  }

  function renewFocusCommitment(goal, horizonDays, outcome = 'renewed', note = '') {
    if (!goal) return null;
    if (goal.focusHorizonDays && goal.focusCommitmentStartedAt) recordFocusCycle(goal, localDateKey(), outcome, note);
    return setFocusCommitment(goal, horizonDays, localDateKey());
  }

  function focusOutcomeLabel(outcome) {
    return ({ renewed: 'Ciclo renovado', switched: 'Foco redirecionado', redefined: 'Período redefinido', completed: 'Ciclo concluído', 'goal-completed': 'Objetivo concluído', deferred: 'Objetivo movido para Depois' })[outcome] || 'Ciclo encerrado';
  }

  function isWeekdayKey(dateKey) {
    const day = dateFromKey(dateKey).getDay();
    return day !== 0 && day !== 6;
  }

  function previousDateKey(dateKey, weekdaysOnly = false) {
    const d = dateFromKey(dateKey);
    do d.setDate(d.getDate() - 1);
    while (weekdaysOnly && (d.getDay() === 0 || d.getDay() === 6));
    return localDateKey(d);
  }

  function periodStats(goal, days = 30) {
    if (!goal) return { done: 0, expected: 0, percentage: 0 };
    if (goal.frequency === 'weekly') {
      const blocks = Math.max(1, Math.ceil(days / 7));
      let done = 0;
      for (let block = 0; block < blocks; block++) {
        let hit = false;
        const start = block * 7;
        const end = Math.min(days, start + 7);
        for (let i = start; i < end; i++) {
          if (isDone(goal.id, dateMinus(i))) { hit = true; break; }
        }
        if (hit) done += 1;
      }
      return { done, expected: blocks, percentage: Math.round((done / blocks) * 100) };
    }

    let done = 0;
    let expected = 0;
    for (let i = 0; i < days; i++) {
      const key = dateMinus(i);
      if (goal.frequency === 'weekdays' && !isWeekdayKey(key)) continue;
      expected += 1;
      if (isDone(goal.id, key)) done += 1;
    }
    const percentage = expected ? Math.round((done / expected) * 100) : 0;
    return { done, expected, percentage };
  }


  function periodStatsRange(goal, startKey, endKey) {
    if (!goal || !startKey || !endKey || String(endKey) < String(startKey)) return { done: 0, expected: 0, percentage: 0 };
    if (goal.frequency === 'weekly') {
      const weeks = new Set();
      let cursor = dateFromKey(startKey);
      const end = dateFromKey(endKey);
      while (cursor <= end) {
        weeks.add(weekStartKey(localDateKey(cursor)));
        cursor.setDate(cursor.getDate() + 1);
      }
      let done = 0;
      for (const week of weeks) if (hasCheckInDuringWeek(goal.id, week)) done += 1;
      const expected = weeks.size;
      return { done, expected, percentage: expected ? Math.round((done / expected) * 100) : 0 };
    }
    let done = 0;
    let expected = 0;
    let cursor = dateFromKey(startKey);
    const end = dateFromKey(endKey);
    while (cursor <= end) {
      const key = localDateKey(cursor);
      if (goal.frequency !== 'weekdays' || isWeekdayKey(key)) {
        expected += 1;
        if (isDone(goal.id, key)) done += 1;
      }
      cursor.setDate(cursor.getDate() + 1);
    }
    return { done, expected, percentage: expected ? Math.round((done / expected) * 100) : 0 };
  }

  function focusCycleSummary(goal, startKey, endKey) {
    const stats = periodStatsRange(goal, startKey, endKey);
    const weeklyPlans = state.weeklyFocuses.filter(item => item.goalId === goal.id && item.weekStart >= startKey && item.weekStart <= endKey).length;
    const reviews = state.reviews.filter(item => item.goalId === goal.id && item.date >= startKey && item.date <= endKey).length;
    const milestones = state.milestoneHistory.filter(item => item.goalId === goal.id && item.completedAt >= startKey && item.completedAt <= endKey).length;
    const baseline = normalizeStoredNumber(goal.focusCycleMilestoneStartCurrent);
    const current = normalizeStoredNumber(goal.milestoneCurrent);
    const sameMilestone = Boolean(goal.focusCycleMilestoneId && goal.milestoneId && goal.focusCycleMilestoneId === goal.milestoneId);
    const milestoneDelta = sameMilestone && baseline !== null && current !== null ? current - baseline : null;
    return {
      done: stats.done,
      expected: stats.expected,
      consistency: stats.percentage,
      weeklyPlans,
      reviews,
      milestones,
      milestoneDelta,
      milestoneUnit: sameMilestone ? (goal.milestoneUnit || '') : ''
    };
  }

  function streak(goalId) {
    const goal = goalById(goalId);
    if (!goal) return 0;
    if (goal.frequency === 'weekly') return weeklyStreak(goalId);
    const weekdaysOnly = goal.frequency === 'weekdays';
    let key = localDateKey();
    if (weekdaysOnly && !isWeekdayKey(key)) {
      while (!isWeekdayKey(key)) key = previousDateKey(key, false);
    }
    if (!isDone(goalId, key)) key = previousDateKey(key, weekdaysOnly);
    let count = 0;
    for (let i = 0; i < 3660; i++) {
      if (!isDone(goalId, key)) break;
      count += 1;
      key = previousDateKey(key, weekdaysOnly);
    }
    return count;
  }

  function weekStartKey(dateKey) {
    const d = dateFromKey(dateKey);
    const day = d.getDay();
    const startsSunday = state.preferences?.weekStartsOn === 'sunday';
    const diff = startsSunday ? -day : (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    return localDateKey(d);
  }


  function weekEndKey(mondayKey) {
    return addDaysKey(mondayKey, 6);
  }

  function currentWeeklyFocus(goalId, dateKey = localDateKey()) {
    const start = weekStartKey(dateKey);
    return state.weeklyFocuses.find(item => item.goalId === goalId && item.weekStart === start) || null;
  }

  function currentDailyAction(goalId, dateKey = localDateKey()) {
    return state.dailyActions.find(item => item.goalId === goalId && item.date === dateKey) || null;
  }

  function weekRangeLabel(dateKey = localDateKey()) {
    const start = weekStartKey(dateKey);
    const end = weekEndKey(start);
    const startDate = dateFromKey(start);
    const endDate = dateFromKey(end);
    const fmt = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: 'short' });
    return `${fmt.format(startDate)} → ${fmt.format(endDate)}`;
  }

  function focusZoomControl(goal, includeToday = true) {
    if (!goal || goal.id !== state.activeGoalId) return '';
    const weekly = currentWeeklyFocus(goal.id);
    const daily = currentDailyAction(goal.id);
    return `<section class="focus-zoom" aria-label="Do grande ao agora">
      <div class="focus-zoom-head"><span>Do grande ao agora</span><small>uma direção por vez</small></div>
      <button type="button" class="focus-zoom-row ${weekly ? 'filled' : ''}" data-action="open-weekly-focus" data-goal-id="${goal.id}">
        <span class="focus-zoom-badge">SEM</span><span><small>Única Coisa da semana</small><strong>${escapeHtml(weekly?.text || 'Definir o foco desta semana')}</strong></span><b>→</b>
      </button>
      ${includeToday ? `<button type="button" class="focus-zoom-row today ${daily ? 'filled' : ''}" data-action="open-daily-action" data-goal-id="${goal.id}">
        <span class="focus-zoom-badge">HOJ</span><span><small>Ação concreta de hoje</small><strong>${escapeHtml(daily?.text || 'Escolher uma ação para hoje')}</strong></span><b>→</b>
      </button>` : ''}
    </section>`;
  }

  function todayFocusControl(goal) {
    if (!goal || goal.id !== state.activeGoalId) return '';
    const daily = currentDailyAction(goal.id);
    const done = isDone(goal.id);
    return `<button type="button" class="today-focus ${daily ? 'filled' : ''} ${done ? 'complete' : ''}" data-action="open-daily-action" data-goal-id="${goal.id}">
      <span class="today-focus-label">Hoje</span>
      <span class="today-focus-copy"><small>${daily ? 'Sua ação concreta' : 'Torne o foco executável'}</small><strong>${escapeHtml(daily?.text || 'Escolher a única ação de hoje')}</strong></span>
      <span class="today-focus-arrow">${done ? '✓' : '→'}</span>
    </button>`;
  }

  function focusContextDisclosure(goal) {
    if (!goal || goal.id !== state.activeGoalId) return '';
    const weekly = currentWeeklyFocus(goal.id);
    const progress = milestoneProgress(goal);
    const cycle = focusCycleInfo(goal);
    const summaryBits = [weekly ? 'semana definida' : null, progress ? `${progress.percentage}% do marco` : null, cycle ? focusCycleLabel(goal) : null].filter(Boolean);
    return `<details class="focus-context-disclosure">
      <summary><span><strong>Direção e contexto</strong><small>${escapeHtml(summaryBits.join(' · ') || 'semana, marco e compromisso')}</small></span><b aria-hidden="true">+</b></summary>
      <div class="focus-context-body">
        ${focusZoomControl(goal, false)}
        ${milestoneControl(goal, true)}
        ${focusCommitmentControl(goal)}
        ${goal.why ? `<div class="context-why"><span>Por que isso importa</span><p>${escapeHtml(goal.why)}</p></div>` : ''}
      </div>
    </details>`;
  }

  function hasCheckInDuringWeek(goalId, mondayKey) {
    const start = dateFromKey(mondayKey);
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      if (isDone(goalId, localDateKey(d))) return true;
    }
    return false;
  }

  function weeklyStreak(goalId) {
    let week = weekStartKey(localDateKey());
    if (!hasCheckInDuringWeek(goalId, week)) {
      const prev = dateFromKey(week);
      prev.setDate(prev.getDate() - 7);
      week = localDateKey(prev);
    }
    let count = 0;
    for (let i = 0; i < 520; i++) {
      if (!hasCheckInDuringWeek(goalId, week)) break;
      count += 1;
      const prev = dateFromKey(week);
      prev.setDate(prev.getDate() - 7);
      week = localDateKey(prev);
    }
    return count;
  }

  function bestStreak(goalId) {
    const goal = goalById(goalId);
    const dates = Object.keys(state.checkIns[goalId] || {}).filter(k => state.checkIns[goalId][k]).sort();
    if (!goal || !dates.length) return 0;
    if (goal.frequency === 'weekly') {
      const weeks = [...new Set(dates.map(weekStartKey))].sort();
      let best = 1, current = 1;
      for (let i = 1; i < weeks.length; i++) {
        const expected = dateFromKey(weeks[i-1]);
        expected.setDate(expected.getDate() + 7);
        if (localDateKey(expected) === weeks[i]) current += 1;
        else current = 1;
        best = Math.max(best, current);
      }
      return best;
    }

    const weekdaysOnly = goal.frequency === 'weekdays';
    const done = new Set(dates);
    let cursor = dateFromKey(dates[0]);
    const last = dateFromKey(dates[dates.length - 1]);
    let best = 0, current = 0;
    while (cursor <= last) {
      const key = localDateKey(cursor);
      const eligible = !weekdaysOnly || isWeekdayKey(key);
      if (eligible) {
        if (done.has(key)) current += 1;
        else current = 0;
        best = Math.max(best, current);
      }
      cursor.setDate(cursor.getDate() + 1);
    }
    return best;
  }

  function consistency(goalId, days = 30) {
    return periodStats(goalById(goalId), days).percentage;
  }

  function streakUnit(goal, count = 2) {
    if (goal?.frequency === 'weekly') return count === 1 ? 'semana' : 'semanas';
    if (goal?.frequency === 'weekdays') return count === 1 ? 'dia útil' : 'dias úteis';
    return count === 1 ? 'dia' : 'dias';
  }

  function totalDone(goalId) {
    return Object.values(state.checkIns[goalId] || {}).filter(Boolean).length;
  }

  function milestoneProgress(goal) {
    const target = normalizeStoredNumber(goal?.milestoneTarget);
    const current = normalizeStoredNumber(goal?.milestoneCurrent) ?? 0;
    if (!target || target <= 0) return null;
    return {
      current,
      target,
      unit: goal?.milestoneUnit || '',
      percentage: Math.max(0, Math.min(100, Math.round((current / target) * 100))),
      complete: current >= target
    };
  }

  function completedMilestonesForGoal(goalId) {
    return state.milestoneHistory
      .filter(item => item.goalId === goalId)
      .sort((a,b) => String(b.completedAt || '').localeCompare(String(a.completedAt || '')));
  }

  function recordMilestoneCompletion(goal, completedAt = localDateKey()) {
    const progress = milestoneProgress(goal);
    if (!goal?.milestone || !progress?.complete) return null;
    if (!goal.milestoneId) goal.milestoneId = `milestone-${uid()}`;
    const existing = state.milestoneHistory.find(item => item.milestoneId === goal.milestoneId);
    if (existing) return existing;
    const item = {
      id: uid(),
      milestoneId: goal.milestoneId,
      goalId: goal.id,
      title: goal.milestone,
      current: progress.current,
      target: progress.target,
      unit: progress.unit || '',
      startedAt: goal.milestoneStartedAt || goal.createdAt || completedAt,
      completedAt
    };
    state.milestoneHistory.push(item);
    return item;
  }

  function startNextMilestone(goal, data, today = localDateKey()) {
    if (!goal) return null;
    const previous = milestoneProgress(goal);
    if (previous?.complete) recordMilestoneCompletion(goal, goal.milestoneCompletedAt || today);
    goal.milestone = data.milestone;
    goal.milestoneCurrent = data.current ?? 0;
    goal.milestoneTarget = data.target;
    goal.milestoneUnit = data.unit || '';
    goal.milestoneId = `milestone-${uid()}`;
    goal.milestoneStartedAt = today;
    goal.milestoneCompletedAt = null;
    goal.updatedAt = today;
    const progress = milestoneProgress(goal);
    if (progress?.complete) {
      goal.milestoneCompletedAt = today;
      recordMilestoneCompletion(goal, today);
    }
    return progress;
  }

  function formatDuration(startKey, endKey = localDateKey()) {
    const days = daysBetween(startKey, endKey);
    if (days === 0) return 'menos de 1 dia';
    if (days === 1) return '1 dia';
    return `${days} dias`;
  }

  function formatMetric(value) {
    return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(Number(value) || 0);
  }

  function goalReviews(goalId) {
    return state.reviews.filter(review => review.goalId === goalId).sort((a,b) => b.date.localeCompare(a.date));
  }

  function latestReview(goalId) {
    return goalReviews(goalId)[0] || null;
  }

  function reviewDue(goal) {
    if (!goal || goal.id !== state.activeGoalId) return false;
    const last = latestReview(goal.id);
    const anchor = last?.date || goal.focusStartedAt || goal.createdAt;
    return Boolean(anchor && daysBetween(anchor) >= 7);
  }

  function reviewDecisionLabel(decision) {
    return ({ keep: 'Manter a Única Coisa', adjust: 'Ajustar a Única Coisa', uncertain: 'Observar por mais uma semana' })[decision] || 'Revisão concluída';
  }

  function milestoneControl(goal, compact = false) {
    if (!goal?.milestone) return '';
    const progress = milestoneProgress(goal);
    if (!progress) {
      return `<button type="button" class="milestone-chip milestone-control" data-action="open-milestone" data-goal-id="${goal.id}"><span>${uiIcon('flag')}</span><span><strong>Marco atual</strong><br>${escapeHtml(goal.milestone)}</span><span class="milestone-edit">medir →</span></button>`;
    }
    const unit = progress.unit ? ` ${escapeHtml(progress.unit)}` : '';
    return `<button type="button" class="milestone-progress-card ${compact ? 'compact' : ''} ${progress.complete ? 'complete' : ''}" data-action="${progress.complete ? 'open-next-milestone' : 'open-milestone'}" data-goal-id="${goal.id}">
      <div class="milestone-progress-head"><span><strong>Marco atual</strong><small>${escapeHtml(goal.milestone)}</small></span><b>${progress.complete ? '✓' : `${progress.percentage}%`}</b></div>
      <div class="milestone-track"><span style="width:${progress.percentage}%"></span></div>
      <div class="milestone-progress-foot"><span>${formatMetric(progress.current)} / ${formatMetric(progress.target)}${unit}</span><span>${progress.complete ? 'Alcançado · definir próximo →' : 'Atualizar progresso →'}</span></div>
    </button>`;
  }

  function focusCommitmentControl(goal) {
    const cycle = focusCycleInfo(goal);
    if (!cycle) {
      return `<button type="button" class="focus-period-setup" data-action="open-focus-period" data-goal-id="${goal.id}"><span>◎</span><span><strong>Proteger este foco por um período</strong><small>Opcional · 30, 60 ou 90 dias</small></span><b>→</b></button>`;
    }
    const stateLabel = cycle.due ? 'Ciclo concluído · revisar' : `${cycle.remaining} ${cycle.remaining === 1 ? 'dia restante' : 'dias restantes'}`;
    return `<button type="button" class="focus-period-card ${cycle.due ? 'due' : ''}" data-action="open-focus-period" data-goal-id="${goal.id}">
      <div class="focus-period-head"><span><strong>${cycle.due ? 'Ciclo de foco completo' : `Dia ${cycle.day} de ${cycle.plannedDays}`}</strong><small>${cycle.due ? `Você protegeu este foco por ${cycle.plannedDays} dias.` : `até ${formatShortDate(cycle.endAt)}`}</small></span><b>${cycle.due ? '↻' : `${cycle.percentage}%`}</b></div>
      <div class="focus-period-track"><span style="width:${cycle.percentage}%"></span></div>
      <div class="focus-period-foot"><span>Compromisso de foco</span><span>${stateLabel} →</span></div>
    </button>`;
  }

  function weeklyReviewCard(goal) {
    if (!reviewDue(goal)) return '';
    const stats = periodStats(goal, 7);
    const rhythm = stats.expected ? `${stats.done} de ${stats.expected} previstas` : `${stats.done} conclusões`;
    return `<section class="review-callout section">
      <div class="review-icon">↻</div>
      <div class="review-copy"><div class="kicker">Revisão semanal</div><h3>Ainda é a coisa certa?</h3><p>Nos últimos 7 dias: <strong>${rhythm}</strong>. Revise a estratégia sem transformar seu objetivo em uma lista de tarefas.</p></div>
      <button type="button" class="secondary-btn review-btn" data-action="open-review" data-goal-id="${goal.id}">Fazer revisão</button>
    </section>`;
  }


  function insightKey(goalId, type) {
    return `${goalId}:${type}`;
  }

  function insightSuppressed(goalId, type, cooldownDays = 7) {
    const dismissedAt = state.insightDismissals?.[insightKey(goalId, type)];
    const allDismissedAt = state.insightDismissals?.[insightKey(goalId, 'all')];
    const typeHidden = Boolean(dismissedAt && daysBetween(dismissedAt) < cooldownDays);
    const allHidden = Boolean(allDismissedAt && daysBetween(allDismissedAt) < 7);
    return typeHidden || allHidden;
  }

  function focusChangesInWindow(days = 30) {
    const cutoff = dateMinus(Math.max(0, days - 1));
    return state.focusHistory.filter(item => item.endedAt && item.endedAt >= cutoff).length;
  }

  function completedWeekStarts(count = 8) {
    const current = weekStartKey(localDateKey());
    const weeks = [];
    let cursor = addDaysKey(current, -7);
    for (let i = 0; i < count; i++) {
      weeks.push(cursor);
      cursor = addDaysKey(cursor, -7);
    }
    return weeks;
  }

  function weeklyPlanningPattern(goal, weeksBack = 8) {
    const groups = { planned: { done: 0, expected: 0, weeks: 0 }, unplanned: { done: 0, expected: 0, weeks: 0 } };
    for (const start of completedWeekStarts(weeksBack)) {
      const end = weekEndKey(start);
      const stats = periodStatsRange(goal, start, end);
      if (!stats.expected) continue;
      const planned = state.weeklyFocuses.some(item => item.goalId === goal.id && [addDaysKey(start, -1), start, addDaysKey(start, 1)].includes(item.weekStart) && String(item.text || '').trim());
      const group = planned ? groups.planned : groups.unplanned;
      group.done += stats.done;
      group.expected += stats.expected;
      group.weeks += 1;
    }
    for (const group of Object.values(groups)) {
      group.percentage = group.expected ? Math.round((group.done / group.expected) * 100) : 0;
    }
    return groups;
  }

  function contextualInsight(goal) {
    if (!goal || goal.id !== state.activeGoalId) return null;
    const recentReview = latestReview(goal.id);
    if (recentReview?.date && daysBetween(recentReview.date) < 2) return null;
    const focusAge = daysBetween(goal.focusStartedAt || goal.createdAt || localDateKey());

    const changes = focusChangesInWindow(30);
    if (changes >= 3 && !insightSuppressed(goal.id, 'focus-changes', 14)) {
      return {
        type: 'focus-changes', tone: 'reflect', kicker: 'Padrão percebido',
        title: 'Seu foco mudou algumas vezes recentemente.',
        copy: `Foram ${changes} mudanças de prioridade nos últimos 30 dias. Isso pode refletir mudanças reais; vale olhar a sequência antes do próximo movimento.`,
        actionLabel: 'Ver minha Jornada', actionTab: 'journey', cooldownDays: 14
      };
    }

    const windowDays = goal.frequency === 'weekly' ? 28 : 14;
    const recent = periodStats(goal, windowDays);
    if (focusAge >= windowDays && recent.expected >= 4 && recent.percentage <= 40 && !insightSuppressed(goal.id, 'low-consistency', 7)) {
      return {
        type: 'low-consistency', tone: 'reflect', kicker: 'Vale observar',
        title: 'Talvez a sua Única Coisa mereça um ajuste.',
        copy: `Nas últimas ${windowDays === 28 ? '4 semanas' : '2 semanas'}, você concluiu ${recent.done} de ${recent.expected} oportunidades (${recent.percentage}%). Talvez o tamanho, o ritmo ou o formato da ação esteja difícil de sustentar.`,
        actionLabel: 'Revisar estratégia', action: 'open-review', cooldownDays: 7
      };
    }

    const pattern = weeklyPlanningPattern(goal, 8);
    const advantage = pattern.planned.percentage - pattern.unplanned.percentage;
    if (pattern.planned.weeks >= 2 && pattern.unplanned.weeks >= 2 && advantage >= 15 && pattern.planned.percentage >= 60 && !insightSuppressed(goal.id, 'weekly-planning', 14)) {
      const hasCurrentPlan = Boolean(currentWeeklyFocus(goal.id));
      return {
        type: 'weekly-planning', tone: 'positive', kicker: 'Seu histórico sugere',
        title: 'Planejar a semana parece ajudar você.',
        copy: `Nas semanas com uma direção definida, sua execução foi ${pattern.planned.percentage}%. Nas semanas sem plano, ${pattern.unplanned.percentage}%.`,
        actionLabel: hasCurrentPlan ? null : 'Planejar esta semana', action: hasCurrentPlan ? null : 'open-weekly-focus', cooldownDays: 14
      };
    }

    return null;
  }

  function contextualInsightCard(goal) {
    const insight = contextualInsight(goal);
    if (!insight) return '';
    const action = insight.actionLabel
      ? (insight.actionTab
          ? `<button type="button" class="secondary-btn insight-action" data-tab="${insight.actionTab}">${escapeHtml(insight.actionLabel)}</button>`
          : `<button type="button" class="secondary-btn insight-action" data-action="${insight.action}" data-goal-id="${goal.id}">${escapeHtml(insight.actionLabel)}</button>`)
      : '';
    return `<section class="context-insight ${insight.tone === 'positive' ? 'positive' : ''} section" data-insight-type="${insight.type}">
      <div class="context-insight-mark" aria-hidden="true">${insight.tone === 'positive' ? '↗' : '◌'}</div>
      <div class="context-insight-copy"><div class="kicker">${escapeHtml(insight.kicker)}</div><h3>${escapeHtml(insight.title)}</h3><p>${escapeHtml(insight.copy)}</p>
        <div class="context-insight-actions">${action}<button type="button" class="text-btn insight-dismiss" data-action="dismiss-insight" data-goal-id="${goal.id}" data-insight-type="${insight.type}">Agora não</button></div>
      </div>
    </section>`;
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.textContent = message;
    document.body.appendChild(el);
    toastTimer = setTimeout(() => el.remove(), 2200);
  }

  function backupSummary(sourceState) {
    const checkIns = Object.values(sourceState.checkIns || {}).reduce((sum, goalMap) => {
      if (!goalMap || typeof goalMap !== 'object') return sum;
      return sum + Object.values(goalMap).filter(Boolean).length;
    }, 0);
    return {
      goals: (Array.isArray(sourceState.goals) ? sourceState.goals.length : 0) + (Array.isArray(sourceState.laterGoals) ? sourceState.laterGoals.length : 0) + (Array.isArray(sourceState.completedGoals) ? sourceState.completedGoals.length : 0),
      laterGoals: Array.isArray(sourceState.laterGoals) ? sourceState.laterGoals.length : 0,
      completedGoals: Array.isArray(sourceState.completedGoals) ? sourceState.completedGoals.length : 0,
      checkIns,
      milestones: Array.isArray(sourceState.milestoneHistory) ? sourceState.milestoneHistory.length : 0,
      reviews: Array.isArray(sourceState.reviews) ? sourceState.reviews.length : 0,
      cycles: Array.isArray(sourceState.focusCycles) ? sourceState.focusCycles.length : 0
    };
  }

  function formatDateTime(value) {
    if (!value) return 'ainda não feito';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'data indisponível';
    const options = state.preferences?.dateFormat === 'numeric'
      ? { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }
      : { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
    return new Intl.DateTimeFormat('pt-BR', options).format(date);
  }

  function readSafetyBackup() {
    try {
      const raw = localStorage.getItem(SAFETY_BACKUP_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || !parsed.state) return null;
      return parsed;
    } catch {
      return null;
    }
  }

  function writeSafetyBackup(snapshot, reason) {
    try {
      localStorage.setItem(SAFETY_BACKUP_KEY, JSON.stringify({
        createdAt: new Date().toISOString(),
        reason,
        state: snapshot
      }));
      return true;
    } catch (error) {
      console.warn('Única Coisa: não foi possível criar a cópia de segurança.', error);
      showToast('Sem espaço para criar a cópia de segurança. Libere armazenamento antes de restaurar um backup.');
      return false;
    }
  }

  function createBackupPayload() {
    return {
      app: 'unica-coisa',
      formatVersion: BACKUP_FORMAT_VERSION,
      appVersion: APP_VERSION,
      createdAt: new Date().toISOString(),
      state: serializableStateSnapshot()
    };
  }

  function validateBackupPayload(payload) {
    if (!payload || typeof payload !== 'object' || Array.isArray(payload)) throw new Error('Este arquivo não é um backup válido.');
    if (payload.app !== 'unica-coisa') throw new Error('Este arquivo não pertence ao Única Coisa.');
    if (payload.formatVersion !== BACKUP_FORMAT_VERSION) throw new Error('A versão deste backup não é compatível com o app atual.');
    if (!payload.state || typeof payload.state !== 'object' || Array.isArray(payload.state)) throw new Error('O backup não contém dados restauráveis.');
    if (!Array.isArray(payload.state.goals)) throw new Error('A lista de objetivos do backup está corrompida.');
    if (payload.state.laterGoals !== undefined && !Array.isArray(payload.state.laterGoals)) throw new Error('A lista de objetivos para Depois do backup está corrompida.');
    if (payload.state.completedGoals !== undefined && !Array.isArray(payload.state.completedGoals)) throw new Error('A lista de capítulos concluídos do backup está corrompida.');
    if (!payload.state.checkIns || typeof payload.state.checkIns !== 'object' || Array.isArray(payload.state.checkIns)) throw new Error('Os registros de progresso do backup estão corrompidos.');
    const allBackupGoals = [...payload.state.goals, ...(payload.state.laterGoals || []), ...(payload.state.completedGoals || [])];
    if (allBackupGoals.some(goal => !isRecord(goal) || !isSafeGoalId(goal.id))) throw new Error('O backup contém um objetivo com identificador inválido.');
    const ids = allBackupGoals.map(goal => goal.id.trim());
    if (new Set(ids).size !== ids.length) throw new Error('O backup contém objetivos duplicados.');
    return normalizeState(payload.state);
  }

  function exportBackup() {
    const now = new Date().toISOString();
    state.dataSafety = { ...DEFAULT_STATE.dataSafety, ...(state.dataSafety || {}), lastExportedAt: now };
    saveState();
    const payload = createBackupPayload();
    payload.createdAt = now;
    payload.state.dataSafety.lastExportedAt = now;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `unica-coisa-backup-${localDateKey()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    render();
    showToast('Backup exportado. Guarde o arquivo em um lugar seguro.');
  }

  async function prepareBackupImport(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('Esse arquivo é grande demais para ser um backup do app.');
      return;
    }
    try {
      const payload = JSON.parse(await file.text());
      const normalized = validateBackupPayload(payload);
      state.modal = {
        type: 'backup-import',
        backupState: normalized,
        backupMeta: {
          createdAt: payload.createdAt || null,
          appVersion: payload.appVersion || 'desconhecida',
          filename: file.name || 'backup.json',
          summary: backupSummary(normalized)
        }
      };
      render();
    } catch (error) {
      showToast(error?.message || 'Não foi possível ler esse backup.');
    }
  }

  function importPreparedBackup() {
    const prepared = state.modal?.backupState;
    if (!prepared) return;
    const currentSnapshot = serializableStateSnapshot();
    if (!writeSafetyBackup(currentSnapshot, 'before-import')) return;
    const restored = normalizeState(prepared);
    restored.dataSafety = { ...DEFAULT_STATE.dataSafety, ...(restored.dataSafety || {}), lastImportedAt: new Date().toISOString() };
    const previousState = state;
    state = restored;
    if (!saveState()) {
      state = previousState;
      render();
      showToast('A restauração não foi aplicada porque o aparelho não conseguiu salvar os novos dados.');
      return;
    }
    render();
    showToast('Backup restaurado. Seus dados anteriores ficaram guardados para desfazer.');
  }

  function restoreSafetyBackup() {
    const safety = readSafetyBackup();
    if (!safety?.state) return;
    const currentSnapshot = serializableStateSnapshot();
    const restored = normalizeState(safety.state);
    if (!writeSafetyBackup(currentSnapshot, 'rollback-swap')) return;
    const previousState = state;
    state = restored;
    if (!saveState()) {
      state = previousState;
      render();
      showToast('Não foi possível concluir a restauração porque o aparelho não conseguiu salvar os dados.');
      return;
    }
    render();
    showToast('Estado anterior restaurado. A versão substituída ficou disponível para desfazer novamente.');
  }

  function backupCenterSection() {
    const safety = readSafetyBackup();
    const lastExport = state.dataSafety?.lastExportedAt;
    const lastImport = state.dataSafety?.lastImportedAt;
    return `<section class="data-safety-card section" aria-labelledby="data-safety-title">
      <div class="data-safety-icon" aria-hidden="true">◇</div>
      <div class="data-safety-copy">
        <div class="kicker">Segurança dos dados</div>
        <h3 id="data-safety-title">Sua jornada também merece um backup.</h3>
        <p>Os dados continuam no seu aparelho. Exporte uma cópia para poder recuperar tudo caso troque de celular ou limpe o navegador.</p>
        <div class="data-safety-status">
          <span><b>Último backup</b>${escapeHtml(formatDateTime(lastExport))}</span>
          ${lastImport ? `<span><b>Última restauração</b>${escapeHtml(formatDateTime(lastImport))}</span>` : ''}
        </div>
        <div class="data-safety-actions">
          <button type="button" class="action-btn data-safety-primary" data-action="export-backup">Exportar backup</button>
          <button type="button" class="secondary-btn" data-action="open-import-backup">Restaurar backup</button>
          ${safety ? `<button type="button" class="text-btn data-safety-rollback" data-action="open-rollback-backup">Desfazer última restauração</button>` : ''}
        </div>
        <input id="backup-file-input" class="visually-hidden-file" type="file" accept=".json,application/json" />
      </div>
    </section>`;
  }

  function render() {
    applyPreferences();
    if (!state.goals.length && !(state.laterGoals || []).length && !(state.completedGoals || []).length) {
      renderOnboarding();
      return;
    }

    app.innerHTML = `
      <main class="app-shell">
        ${topbar()}
        <section id="view">${renderView()}</section>
      </main>
      ${bottomNav()}
      ${renderModal()}
    `;
    bindMainEvents();
  }

  function topbar() {
    const subtitles = { today: 'Foco de hoje', life: 'Seus objetivos', journey: 'Seu caminho', settings: 'Preferências' };
    const settings = state.activeTab === 'settings';
    return `
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-text">
            <div class="brand-title">Única Coisa</div>
            <div class="brand-subtitle">${subtitles[state.activeTab] || 'Clareza antes de produtividade'}</div>
          </div>
        </div>
        <div class="topbar-actions">
          ${settings
            ? `<button class="icon-btn" type="button" data-action="close-settings" aria-label="Voltar">${uiIcon('back')}</button>`
            : `<button class="icon-btn" type="button" data-action="open-add" aria-label="Adicionar objetivo">${uiIcon('plus')}</button><button class="icon-btn" type="button" data-action="open-settings" aria-label="Configurações">${uiIcon('settings')}</button>`}
        </div>

  function renderView() {
    if (state.activeTab === 'settings') return renderSettings();

    if (state.activeTab === 'life') return renderLife();

  function compactRhythmPanel(goal) {
    const currentStreak = streak(goal.id);
    const currentConsistency = consistency(goal.id);
    const total = totalDone(goal.id);
    const best = bestStreak(goal.id);
    return `<section class="rhythm-card section" aria-label="Ritmo recente">
      <div class="rhythm-card-top">
        <div><span class="rhythm-label">Ritmo</span><strong>${currentConsistency}%</strong><small>nos últimos 30 dias</small></div>
        <div class="rhythm-streak"><b>🔥 ${currentStreak}</b><span>${streakUnit(goal, currentStreak)}</span></div>
      </div>
      <div class="rhythm-week"><span>Últimos 7 dias</span>${weekStrip(goal.id)}</div>
      <details class="rhythm-more">
        <summary>Ver detalhes do ritmo</summary>
        <div><span><b>${total}</b> conclusões</span><span><b>${best}</b> melhor sequência</span></div>
      </details>
    </section>`;
  }


  function homeAdaptiveContext(goal, now = new Date()) {
    const todayKey = localDateKey(now);
    const done = isDone(goal?.id, todayKey);
    const daily = goal ? currentDailyAction(goal.id, todayKey) : null;
    const weekly = goal ? currentWeeklyFocus(goal.id, todayKey) : null;
    const cycle = goal ? focusCycleInfo(goal, todayKey) : null;
    const weekEnd = weekEndKey(weekStartKey(todayKey));
    const daysToWeekEnd = daysBetween(todayKey, weekEnd);
    const hour = now.getHours();

    if (cycle?.due) {
      const endsToday = cycle.endAt === todayKey;
      return {
        kind: 'cycle-due',
        title: endsToday && !done ? 'Último dia deste ciclo.' : 'Seu ciclo chegou ao fim.',
        subtitle: endsToday && !done
          ? 'Faça o essencial de hoje e depois olhe para o período inteiro antes de decidir o próximo passo.'
          : 'Antes de renovar ou mudar de direção, veja o que este período realmente mostrou.',
        cue: { label: 'Ciclo de foco', text: `Compromisso de ${cycle.plannedDays} dias pronto para balanço.`, action: 'open-focus-period', actionLabel: 'Fazer balanço' }
      };
    }

    if (cycle && cycle.remaining <= 2) {
      return {
        kind: 'cycle-ending',
        title: 'Reta final deste ciclo.',
        subtitle: `Faltam ${cycle.remaining} ${cycle.remaining === 1 ? 'dia' : 'dias'}. Não aumente a lista agora — termine fazendo bem o essencial.`,
        cue: { label: 'Reta final', text: `Dia ${cycle.day} de ${cycle.plannedDays}.`, action: 'open-focus-period', actionLabel: 'Ver ciclo' }
      };
    }

    if (done) {
      const weekEnding = daysToWeekEnd <= 1;
      return {
        kind: weekEnding ? 'done-week-ending' : 'done',
        title: 'O essencial já foi feito.',
        subtitle: weekEnding
          ? 'Sua parte de hoje está concluída. A semana também está terminando — observe o que funcionou antes de começar outra.'
          : 'Você cumpriu o que ocupava o centro hoje. O resto é extra.',
        cue: null
      };
    }

    if (daysToWeekEnd <= 1) {
      return {
        kind: 'week-ending',
        title: 'Feche a semana com clareza.',
        subtitle: weekly
          ? 'Volte à direção que você escolheu para esta semana e faça apenas o que ainda importa hoje.'
          : 'A semana está terminando. Não tente compensar tudo de uma vez — escolha uma única ação que ainda vale a pena.',
        cue: null
      };
    }

    if (hour < 12) {
      return {
        kind: 'morning',
        title: 'Comece pelo essencial.',
        subtitle: daily ? 'Sua ação de hoje já está definida. Faça isso antes de deixar o resto do dia tomar espaço.' : 'Antes do resto do dia ganhar espaço, transforme sua prioridade em uma ação concreta.',
        cue: null
      };
    }

    if (hour < 18) {
      return {
        kind: 'afternoon',
        title: 'Volte ao que importa.',
        subtitle: daily ? 'O dia já está em movimento. Retome a ação que você escolheu como essencial.' : 'Ainda há tempo para dar uma forma concreta ao que mais importa hoje.',
        cue: null
      };
    }

    return {
      kind: 'evening',
      title: 'Feche o dia com uma coisa.',
      subtitle: daily ? 'Não tente recuperar o dia inteiro. Faça a ação que você escolheu e encerre com clareza.' : 'Se ainda houver algo a fazer hoje, reduza a uma única ação que realmente move seu objetivo.',
      cue: null
    };
  }

  function adaptiveHomeCue(goal, context) {
    if (!goal || !context?.cue) return '';
    return `<section class="adaptive-home-cue ${escapeHtml(context.kind)}">
      <div><span>${escapeHtml(context.cue.label)}</span><strong>${escapeHtml(context.cue.text)}</strong></div>
      <button type="button" class="secondary-btn" data-action="${escapeHtml(context.cue.action)}" data-goal-id="${goal.id}">${escapeHtml(context.cue.actionLabel)}</button>
    </section>`;
  }

  function renderToday() {
    const goal = activeGoal();
    if (!goal) return `<div class="today-intro"><div class="kicker">${escapeHtml(formatDate())}</div><h1 class="page-title">O centro está livre por enquanto.</h1><p class="page-subtitle">Antes de seguir, escolha conscientemente qual objetivo ativo merece se tornar A Única Coisa agora.</p></div><section class="next-focus-empty section"><div class="next-focus-empty-mark">◎</div><h2>Qual será A Única Coisa agora?</h2><p>Nada foi escolhido automaticamente. Seus objetivos ativos e os que ficaram para Depois continuam organizados em Minha Vida.</p><button type="button" class="action-btn" data-tab="life">Abrir Minha Vida</button></section>`;
