  // --------- V1.6: Supabase Auth (link por e-mail) + banco de dados RLS ---------
  // As funções abaixo mantêm o armazenamento local como fonte de segurança;
  // o servidor une revisões de forma atômica e nunca apaga progresso já concluído.
  const cloud = {configured:false,status:'not-configured',detail:'',user:null,client:null,
    busy:false,requested:false,initialized:false,generation:0,settingsStamp:''};
  const CONFIG = window.ENGLISH_DAILY_SUPABASE_CONFIG || {};
  const accountStoreKey = uid => `${STORE_KEY}:uid:${uid}`;
  const validDate = v => typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const earlyDate = (a,b) => validDate(a)&&validDate(b)?(a<b?a:b):(validDate(a)?a:(validDate(b)?b:null));
  const validDay = x => Number.isInteger(Number(x)) && Number(x)>=1 && Number(x)<=DAYS.length;
  function cleanDay(r){
    if(!r||typeof r!=='object'||!validDate(r.studiedAt))return null;
    const reviews={};for(const n of INTERVALS){const v=r.reviews?.[String(n)];if(validDate(v))reviews[String(n)]=v;}
    return {studiedAt:r.studiedAt,reviews};
  }
  function mergeDay(a,b){
    a=cleanDay(a);b=cleanDay(b);if(!a)return b;if(!b)return a;
    const reviews={...a.reviews};for(const n of INTERVALS){const k=String(n);const v=earlyDate(reviews[k],b.reviews[k]);if(v)reviews[k]=v;}
    return {studiedAt:earlyDate(a.studiedAt,b.studiedAt),reviews};
  }
  function diffDay(local,remote){
    local=cleanDay(local);remote=cleanDay(remote);if(!local)return null;
    if(!remote)return local;
    const patch={},reviews={};if(local.studiedAt<remote.studiedAt)patch.studiedAt=local.studiedAt;
    for(const n of INTERVALS){const k=String(n),a=local.reviews[k],b=remote.reviews[k];if(a&&(!b||a<b))reviews[k]=a;}
    if(Object.keys(reviews).length)patch.reviews=reviews;
    return Object.keys(patch).length?patch:null;
  }
  function cloudErr(e){
    const code=String(e?.code||e?.status||'');
    if(code==='23505')return 'Houve conflito ao gravar dados. Tente sincronizar novamente.';
    if(code==='42501'||code==='403')return 'Acesso ao banco negado. Confira as permissões RLS do projeto Supabase.';
    if(code==='429')return 'Muitas solicitações. Aguarde um pouco e tente novamente.';
    return String(e?.message||'Não consegui me conectar ao banco. Seus dados continuam salvos neste aparelho.');
  }
  function markCloud(status,detail=''){
    cloud.status=status;cloud.detail=detail;
    const pill=app.querySelector('[data-sync-indicator]');if(pill)pill.textContent=cloudLabel();
    if(state.view==='stats'||state.view==='home')render();
  }
  function cloudLabel(){return !cloud.configured?'Local':!cloud.user?'Sem conta':cloud.status==='synced'?'Sincronizado':cloud.status==='syncing'?'Sincronizando…':cloud.status==='offline'?'Sem internet':cloud.status==='error'?'Verificar conexão':'Conectado';}
  function mergeGuestOnce(uid){
    const marker=`english-daily-v16-guest-merged:${uid}`;
    if(localStorage.getItem(marker))return;
    const guest=load(STORE_KEY);
    for(const [id,r] of Object.entries(guest.days||{})){
      if(!validDay(id))continue;const combined=mergeDay(progress.days[id],r);if(combined)progress.days[id]=combined;
    }
    for(const [id,v] of Object.entries(guest.voiceStats||{})){
      if(!validDay(id))continue;const previous=progress.voiceStats?.[id];const count=Math.max(0,Number(previous?.count)||0,Number(v?.count)||0);
      if(count)progress.voiceStats[id]={count,lastAt:earlyDate(previous?.lastAt,v?.lastAt)||localDate()};
    }
    if(!localStorage.getItem(accountStoreKey(uid))){
      progress.rate=guest.rate;progress.pauseSeconds=guest.pauseSeconds;progress.pronMode=guest.pronMode;
    }
    localStorage.setItem(marker,'1');persist();
  }
  function mergeServerRow(row){
    const reviews={};for(const i of INTERVALS){const x=row['review_'+i];if(validDate(x))reviews[String(i)]=x;}
    return validDate(row.studied_at)?{studiedAt:row.studied_at,reviews}:null;
  }
  function mergeServerRows(rows){
    let changed=false;
    for(const row of rows){if(!validDay(row.day_id))continue;const id=String(row.day_id);
      const record=mergeServerRow(row);
      if(record){const merged=mergeDay(progress.days[id],record);
        if(JSON.stringify(merged)!==JSON.stringify(progress.days[id])){progress.days[id]=merged;changed=true;}}
      const local=progress.voiceStats?.[id];const count=Math.max(0,Math.floor(Number(row.voice_count)||0));
      if(count>Number(local?.count||0)){
        progress.voiceStats[id]={count,lastAt:validDate(row.last_voice_at)?row.last_voice_at:localDate()};changed=true;
      }
    }
    if(changed){persist();if(['home','stats','reviews','library','day'].includes(state.view))render();}
  }
  function makeServerPayload(id){
    const day=cleanDay(progress.days[id]);const voice=progress.voiceStats?.[id];
    return {p_day_id:Number(id),p_studied_at:day?.studiedAt||null,p_review_1:day?.reviews?.['1']||null,
      p_review_7:day?.reviews?.['7']||null,p_review_15:day?.reviews?.['15']||null,p_review_30:day?.reviews?.['30']||null,
      p_voice_count:Math.max(0,Math.floor(Number(voice?.count)||0)),p_last_voice_at:validDate(voice?.lastAt)?voice.lastAt:null};
  }
  async function reconcilePreferences(){
    const uid=cloud.user?.id;if(!uid)return;
    const {data,error}=await cloud.client.from('english_daily_settings').select('rate,pause_seconds,pron_mode,updated_at').eq('user_id',uid).maybeSingle();
    if(error)throw error;
    const localKey=`english-daily-v16-settings-at:${uid}`;
    let localAt=localStorage.getItem(localKey)||'';
    if(data?.updated_at && data.updated_at>=localAt){
      if([.7,.88,1,1.15].includes(Number(data.rate)))progress.rate=Number(data.rate);
      if([3,5,8].includes(Number(data.pause_seconds)))progress.pauseSeconds=Number(data.pause_seconds);
      if(PRON_MODES.includes(data.pron_mode))progress.pronMode=data.pron_mode;
      localStorage.setItem(localKey,data.updated_at);persist();if(state.view==='stats'||state.view==='day')render();return;
    }
    const stamp=localAt||new Date().toISOString();
    const {error:saveError}=await cloud.client.from('english_daily_settings').upsert({user_id:uid,rate:progress.rate,
      pause_seconds:progress.pauseSeconds,pron_mode:progress.pronMode,updated_at:stamp},{onConflict:'user_id'});
    if(saveError)throw saveError;
    localStorage.setItem(localKey,stamp);
  }
  async function cloudSync(){
    if(!cloud.configured||!cloud.client||!cloud.user)return;
    if(!navigator.onLine){markCloud('offline','Seu progresso está salvo neste dispositivo e será enviado quando voltar a internet.');return;}
    if(cloud.busy){cloud.requested=true;return;}
    cloud.busy=true;cloud.requested=false;const gen=cloud.generation,uid=cloud.user.id;
    markCloud('syncing');
    try{
      const {data,error}=await cloud.client.from('english_daily_progress')
        .select('day_id,studied_at,review_1,review_7,review_15,review_30,voice_count,last_voice_at')
        .eq('user_id',uid);
      if(error)throw error;if(gen!==cloud.generation)return;
      mergeServerRows(data||[]);
      const remote=new Map((data||[]).map(x=>[String(x.day_id),x]));
      for(const id of new Set([...Object.keys(progress.days||{}),...Object.keys(progress.voiceStats||{})])){
        if(!validDay(id))continue;
        const payload=makeServerPayload(id),row=remote.get(String(id));
        const dirty=payload.p_studied_at||payload.p_voice_count;
        if(!dirty)continue;
        const r=mergeServerRow(row||{});
        const changed=diffDay(progress.days[id],r)||(payload.p_voice_count>(Number(row?.voice_count)||0));
        if(!changed)continue;
        const {error:saveError}=await cloud.client.rpc('merge_english_daily_day',payload);
        if(saveError)throw saveError;
        if(gen!==cloud.generation)return;
      }
      await reconcilePreferences();
      if(gen!==cloud.generation)return;
      // Recarrega depois da gravação para refletir progresso feito no outro dispositivo.
      const {data:fresh,error:freshError}=await cloud.client.from('english_daily_progress')
        .select('day_id,studied_at,review_1,review_7,review_15,review_30,voice_count,last_voice_at').eq('user_id',uid);
      if(freshError)throw freshError;if(gen!==cloud.generation)return;
      mergeServerRows(fresh||[]);markCloud('synced','Dados atualizados.');
    }catch(e){if(gen===cloud.generation)markCloud(navigator.onLine?'error':'offline',cloudErr(e));}
    finally{
      if(gen===cloud.generation){cloud.busy=false;if(cloud.requested){cloud.requested=false;setTimeout(cloudSync,500);}}
    }
  }
  function syncLocalDay(){if(cloud.user)cloudSync();}
  function syncVoiceCount(){if(cloud.user)cloudSync();}
  function syncSettings(){
    if(!cloud.user)return;
    try{localStorage.setItem(`english-daily-v16-settings-at:${cloud.user.id}`,new Date().toISOString());}catch{}
    cloudSync();
  }
  function onCloudUser(user){
    const prior=cloud.user?.id||null;if(prior===user?.id&&cloud.initialized)return;
    cloud.generation++;cloud.busy=false;cloud.requested=false;cloud.user=user||null;cloud.initialized=true;
    if(!user){progress=load(STORE_KEY);markCloud('signed-out');render();return;}
    progress=load(accountStoreKey(user.id));mergeGuestOnce(user.id);persist();render();cloudSync();
  }
  async function initCloud(){
    cloud.configured=Boolean(/^https:\/\/[a-z0-9.-]+\.supabase\.co\/?$/.test(String(CONFIG.url||'')) &&
      typeof CONFIG.publishableKey==='string' && CONFIG.publishableKey.length>10);
    if(!cloud.configured){markCloud('not-configured','Configure URL e chave publicável do Supabase para habilitar sincronização.');return;}
    if(location.protocol==='file:'){markCloud('error','Para usar login por e-mail, publique em HTTPS ou teste em localhost.');return;}
    try{
      markCloud('syncing','Carregando autenticação…');
      const sdk=await new Promise((resolve,reject)=>{
        if(window.supabase?.createClient){resolve(window.supabase);return;}
        const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js';
        script.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(new Error('Biblioteca não carregou'));
        script.onerror=()=>reject(new Error('Não foi possível carregar a biblioteca Supabase'));document.head.appendChild(script);
      });
      cloud.client=sdk.createClient(CONFIG.url,CONFIG.publishableKey,{
        auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}
      });
      cloud.client.auth.onAuthStateChange((_event,session)=>{onCloudUser(session?.user||null);});
      window.addEventListener('focus',()=>{if(cloud.user)cloudSync();});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.user)cloudSync();});
      window.setInterval(()=>{if(cloud.user&&!document.hidden&&navigator.onLine)cloudSync();},60000);
    }catch(e){markCloud('error',cloudErr(e));}
  }
  async function cloudSignIn(){
    if(!cloud.configured||!cloud.client){go('stats');toast('Para habilitar a conta, configure o Supabase e publique o site em HTTPS.');return;}
    const email=app.querySelector('#cloud-email')?.value?.trim();
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('Digite um e-mail válido.');return;}
    try{
      const redirectTo=location.origin+location.pathname;
      const {error}=await cloud.client.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo}});
      if(error)throw error;
      toast('Enviamos o link de acesso para seu e-mail. Abra-o neste mesmo navegador.');
    }catch(e){markCloud('error',cloudErr(e));toast(cloudErr(e));}
  }
  async function cloudSignOut(){
    if(!cloud.client)return;
    try{const {error}=await cloud.client.auth.signOut();if(error)throw error;
      toast('Você saiu da conta. Seus dados locais continuam preservados.');}
    catch(e){markCloud('error',cloudErr(e));}
  }

  // ------------------------------------------------------------------------

  function done(id){return Boolean(progress.days[id]?.studiedAt);}
  function studiedCount(){return DAYS.filter(d=>done(d.id)).length;}
  function nextDay(){return DAYS.find(d=>!done(d.id))||null;}
  function allReviews(){const out=[];const today=localDate();for(const d of DAYS){const rec=progress.days[d.id];if(!rec?.studiedAt)continue;for(const offset of INTERVALS){const due=plusDays(rec.studiedAt,offset);if(due<=today&&!rec.reviews?.[String(offset)])out.push({dayId:d.id,offset,due,overdue:dayDistance(today,due)});}}return out.sort((a,b)=>a.due.localeCompare(b.due)||a.dayId-b.dayId);}
  function totalReviews(){return Object.values(progress.days).reduce((n,r)=>n+Object.keys(r.reviews||{}).length,0);}
  function activityMap(){const map={};for(const r of Object.values(progress.days)){if(r.studiedAt)map[r.studiedAt]=(map[r.studiedAt]||0)+1;for(const v of Object.values(r.reviews||{})){const date=typeof v==='string'?v:v?.completedAt;if(date)map[date]=(map[date]||0)+1;}}return map;}
  function streak(){const log=activityMap(),today=localDate();let d=log[today]?today:plusDays(today,-1),count=0;while(log[d]){count++;d=plusDays(d,-1);}return count;}

  function layout(body){const pct=studiedCount()/Math.max(DAYS.length,1)*100;return `<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">Ed.</div><div><strong>English Daily</strong><small>ESTUDE NO SEU RITMO</small></div></div><div class="nav-section-label">SEU ESPAÇO</div><nav class="nav" aria-label="Navegação">${navButton('home','Visão geral','home')}${navButton('library','Biblioteca','book')}${navButton('voice','Conversação','mic')}${navButton('reviews','Revisões','repeat')}${navButton('stats','Meu progresso','chart')}</nav><div class="sidebar-bottom"><div class="side-progress"><div class="small-top">JORNADA DE APRENDIZADO</div><strong>${studiedCount()} / ${DAYS.length} dias</strong><div class="mini-progress"><span style="width:${pct}%"></span></div><small>${Math.round(pct)}% dos dias estudados</small></div><div class="side-footer">Feito para aprender de verdade ✦</div></div></aside><main class="main"><div class="main-inner"><header class="topbar"><div class="eyebrow">UM POUCO MELHOR A CADA DIA</div><div class="topbar-right"><div class="date-pill">${esc(prettyToday())}</div><button type="button" class="cloud-header" data-action="go" data-view="stats" aria-label="Abrir conta e progresso">${ico('cloud')} <span data-sync-indicator>${esc(cloudLabel())}</span></button><div class="avatar" aria-label="Perfil">${cloud.user?esc((cloud.user.email||'ED').slice(0,2).toUpperCase()):'ED'}</div></div></header>${body}</div></main><nav class="mobile-nav" aria-label="Navegação inferior">${mobileNav('home','Hoje','home')}${mobileNav('library','Biblioteca','book')}${mobileNav('voice','Conversar','mic')}${mobileNav('reviews','Revisões','repeat')}${mobileNav('stats','Progresso','chart')}</nav></div>${state.modal?modalMarkup():''}${state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:''}`;}

  function homepage(){const due=allReviews(),newDay=nextDay(),studied=studiedCount();return `<section class="hero"><div class="hero-copy"><div class="hero-label">✦ SUA JORNADA CONTINUA</div><h1>${due.length?'Sua memória merece atenção.':studied?'Pronto para aprender mais?':'Seu inglês começa aqui.'}</h1><p>${due.length?`Você tem ${due.length} revisão${due.length>1?'ões':''} programada${due.length>1?'s':''}. Revise primeiro e depois avance para novas frases.`:newDay?'Um passo por dia. Estude 40 frases, escute, pratique e deixe que a revisão espaçada cuide do calendário.':'Você concluiu todos os dias disponíveis! Continue usando a biblioteca e revisando suas frases.'}</p><div class="hero-actions">${due.length?`<button class="btn btn-white" data-action="start-first-review">${ico('repeat')} Começar revisões ${ico('arrow')}</button>`:newDay?`<button class="btn btn-white" data-action="open-day" data-day="${newDay.id}">${ico('book')} Estudar Dia ${newDay.id} ${ico('arrow')}</button>`:`<button class="btn btn-white" data-action="go" data-view="library">Explorar biblioteca ${ico('arrow')}</button>`}<button class="btn btn-ghost-white" data-action="go" data-view="library">Ver todas as frases</button></div></div><div class="hero-deco" aria-hidden="true"><span>40</span></div></section><section class="stats-grid"><div class="stat"><div class="stat-icon lilac">${ico('layers')}</div><div><h3>${studied}</h3><p>Dias estudados</p></div></div><div class="stat"><div class="stat-icon peach">${ico('flame')}</div><div><h3>${streak()}</h3><p>Sequência de dias</p></div></div><div class="stat"><div class="stat-icon mint">${ico('repeat')}</div><div><h3>${totalReviews()}</h3><p>Revisões feitas</p></div></div></section><div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Primeiro, suas revisões</h2><p>Reforce o que aprendeu antes de avançar.</p></div><button class="link-btn" data-action="go" data-view="reviews">Ver todas ${ico('arrow')}</button></div>${due.length?`<div class="review-items">${due.slice(0,4).map(reviewCard).join('')}</div>${due.length>4?`<p class="foot-tip">+ ${due.length-4} revisões aguardando na página Revisões.</p>`:''}`:empty('Tudo em dia!','Nenhuma revisão pendente. Você pode avançar para novas frases ou revisitar a biblioteca.')}</section><section class="panel"><div class="panel-head"><div><h2>Depois, aprenda algo novo</h2><p>Seu próximo bloco de 40 frases.</p></div></div>${newDay?`<div class="learning-card"><div class="tiny">PRÓXIMO CONTEÚDO</div><h3>Dia ${newDay.id}</h3><p>${esc(newDay.title)}<br>${esc(newDay.subtitle)}</p><div class="row"><span>${ico('headphones')} 40 frases com áudio</span><span>${esc(newDay.tag)}</span></div><button class="btn btn-primary" data-action="open-day" data-day="${newDay.id}">Abrir frases ${ico('arrow')}</button></div>`:empty('Conteúdo concluído','Todos os dias da biblioteca já foram estudados. Você ainda pode revisar e praticar livremente.')}<p class="foot-tip">${ico('info')} Você pode acessar qualquer dia livremente, sem bloqueios ou obrigação de seguir a ordem.</p></section></div><section class="voice-home-cta"><span class="voice-home-emblem">${ico('mic')}</span><div><h2>Quer praticar conversação?</h2><p>Entre em histórias com personagens, responda só com a voz e siga caminhos diferentes. Sem API paga.</p></div><button class="btn btn-primary" data-action="go" data-view="voice">Experimentar ${ico('arrow')}</button></section>`;}
  function library(){let filtered=DAYS.filter(d=>state.filter==='all'||(state.filter==='done'?done(d.id):!done(d.id)));if(state.search.trim()){const needle=state.search.trim().toLocaleLowerCase('pt-BR');filtered=filtered.filter(d=>[d.title,d.subtitle,`dia ${d.id}`,...d.phrases.flatMap(p=>[p.en,p.pt])].some(s=>s.toLocaleLowerCase('pt-BR').includes(needle)));}return `<div class="page-header"><div class="eyebrow">TODO O CONTEÚDO, SEM BLOQUEIOS</div><h1 class="title">Sua biblioteca</h1><p class="subtitle">${DAYS.length} dias, ${DAYS.length*40} frases e áudio para ouvir quantas vezes quiser.</p></div><div class="banner">${ico('info')}<div><strong>Liberdade para estudar.</strong><p>Explore qualquer dia agora mesmo. Seu progresso só avança quando você decide marcar um dia como estudado.</p></div></div><div class="section-bar"><div class="filters"><button class="filter ${state.filter==='all'?'active':''}" data-action="filter" data-filter="all">Todos (${DAYS.length})</button><button class="filter ${state.filter==='pending'?'active':''}" data-action="filter" data-filter="pending">A estudar</button><button class="filter ${state.filter==='done'?'active':''}" data-action="filter" data-filter="done">Estudados</button></div><label class="search-wrap">${ico('search')}<input id="library-search" autocomplete="off" type="search" aria-label="Buscar frases ou temas" placeholder="Buscar frase ou tema..." value="${esc(state.search)}"></label></div><div class="library-grid">${filtered.map(d=>`<article class="day-card"><div class="day-card-top"><div class="day-num">${String(d.id).padStart(2,'0')}</div><span class="badge ${done(d.id)?'badge-green':'badge-muted'}">${done(d.id)?'✓ Estudado':'Disponível'}</span></div><h3>${esc(d.title)}</h3><p>${esc(d.subtitle)}</p><div class="day-card-foot"><small>40 frases · ${esc(d.tag)}</small><button class="link-btn" data-action="open-day" data-day="${d.id}">Abrir ${ico('arrow')}</button></div></article>`).join('')||empty('Nenhum resultado','Tente outra palavra ou escolha outro filtro.')}</div>`;}
  function dayPage(){const d=DAYS[state.day-1];if(!d)return homepage();const rec=progress.days[d.id];const currentlyPlaying=state.playAll?`<button class="btn btn-outline" data-action="stop-audio">${ico('stop')} Parar áudio</button>`:`<button class="btn btn-outline" data-action="play-all" data-day="${d.id}">${ico('play')} Ouvir tudo</button><button class="btn btn-primary" data-action="play-repeat" data-day="${d.id}">${ico('repeat')} Ouvir e repetir</button>`;return `<button class="back" data-action="go" data-view="library">${ico('back')} Voltar para biblioteca</button><div class="lesson-header"><div><div class="eyebrow">DIA ${String(d.id).padStart(2,'0')} · ${esc(d.tag)}</div><h1 class="title" style="margin-top:10px">${esc(d.title)}</h1><p class="subtitle">${esc(d.subtitle)}</p><div class="lesson-meta">${ico('book')} 40 frases com tradução e áudio · ${rec?.studiedAt?`Estudado em ${prettyDate(rec.studiedAt)}`:'Aguardando seu estudo'}</div></div><div class="lesson-actions"><button class="btn btn-outline" data-action="voice-start" data-day="${d.id}">${ico('mic')} Conversar por voz</button><button class="btn btn-soft" data-action="practice-free" data-day="${d.id}">${ico('repeat')} Praticar</button></div></div><div class="banner">${ico('volume')}<div><strong>Escute, repita e use as frases em voz alta.</strong><p>Toque no alto-falante para ouvir. Você pode ocultar as traduções para testar a memória.</p></div></div><div class="audio-study-panel ${state.playAll?'is-audio-active':''}"><div class="audio-study-heading"><div><strong>${ico('headphones')} Seu treino de escuta</strong><p>No modo “Ouvir e repetir”, cada frase é seguida por uma pausa para você falar em voz alta.</p></div><div class="audio-study-controls">${currentlyPlaying}</div></div><div class="audio-study-footer"><label for="repeat-pause">${ico('clock')} Pausa para repetir</label><select id="repeat-pause" aria-label="Tempo de pausa para repetir frases"><option value="3" ${progress.pauseSeconds===3?'selected':''}>3 segundos</option><option value="5" ${progress.pauseSeconds===5?'selected':''}>5 segundos</option><option value="8" ${progress.pauseSeconds===8?'selected':''}>8 segundos</option></select><span class="audio-study-status" data-audio-status role="status" aria-live="polite">${esc(state.playAll?state.audioStatus:'Escolha um modo para começar.')}</span></div></div><div class="section-bar"><h2 class="section-title">As 40 frases do dia</h2><div class="pron-toolbar">${pronSelect()}<button class="link-btn" data-action="toggle-all-translations">${state.revealed.size===40?'Ocultar todas':'Mostrar todas as traduções'} ${ico('eye')}</button></div></div><div class="phrases-panel">${d.phrases.map((p,i)=>`<div class="phrase-row ${state.playAll&&state.playing===i?(state.isPause?'is-repeat-pause':'is-playing'): ''}" data-phrase="${i}"><span class="phrase-number">${String(i+1).padStart(2,'0')}</span><div class="phrase-body"><strong>${esc(p.en)}</strong>${state.revealed.has(i)?`<p>${esc(p.pt)}</p>${pronGuide(p.en)}`:`<p class="hidden-translation">Tradução oculta</p>`}</div><div class="phrase-tools"><button class="icon-btn" title="${state.revealed.has(i)?'Ocultar':'Mostrar'} tradução" aria-label="${state.revealed.has(i)?'Ocultar':'Mostrar'} tradução da frase ${i+1}" data-action="reveal" data-index="${i}">${ico(state.revealed.has(i)?'eyeoff':'eye')}</button><button class="icon-btn" title="Ouvir em inglês" aria-label="Ouvir frase ${i+1}" data-action="speak" data-index="${i}">${ico('volume')}</button></div></div>`).join('')}</div><div class="lesson-bottom"><div><strong>${done(d.id)?'Dia já registrado ✓':'Terminou de estudar?'}</strong><p>${done(d.id)?'As revisões de 1, 7, 15 e 30 dias são calculadas automaticamente.':'Marque como estudado somente quando terminar as 40 frases.'}</p></div>${done(d.id)?`<button class="btn btn-outline" data-action="practice-free" data-day="${d.id}">${ico('repeat')} Praticar novamente</button>`:`<button class="btn btn-primary" data-action="ask-complete" data-day="${d.id}">${ico('check')} Concluir Dia ${d.id}</button>`}</div>`;}
  function reviewsPage(){const due=allReviews();const late=due.filter(r=>r.overdue>0),current=due.filter(r=>!r.overdue);return `<div class="page-header"><div class="eyebrow">A CHAVE DA MEMORIZAÇÃO</div><h1 class="title">Suas revisões</h1><p class="subtitle">Cada dia estudado volta para revisão após 1, 7, 15 e 30 dias.</p></div><div class="spaced-grid">${INTERVALS.map(n=>`<div class="interval-card"><strong>+${n}</strong><span>${n===1?'dia':'dias'}</span></div>`).join('')}</div><div class="banner">${ico('calendar')}<div><strong>Seu calendário é personalizado.</strong><p>Os prazos começam no dia em que você conclui cada conjunto. Revisões perdidas ficam pendentes até que você as finalize, sem serem apagadas.</p></div></div>${late.length?`<section class="review-section"><h3>Revisões atrasadas (${late.length})</h3><div class="review-list">${late.map(reviewCard).join('')}</div></section>`:''}<section class="review-section"><h3>Programadas para hoje (${current.length})</h3>${current.length?`<div class="review-list">${current.map(reviewCard).join('')}</div>`:empty('Nenhuma revisão de hoje','Quando chegar a data de uma revisão, ela aparecerá aqui automaticamente.')}</section>${!due.length?`<div class="panel" style="margin-top:19px"><div class="panel-head"><div><h2>Quer praticar mesmo assim?</h2><p>Explore qualquer dia na biblioteca e abra o modo Praticar sem alterar o calendário.</p></div><button class="btn btn-soft btn-small" data-action="go" data-view="library">Ver biblioteca</button></div></div>`:''}`;}
  function startSession(day,offset=null,indices=null){const d=DAYS[day-1];if(!d)return;if(offset!==null){const match=allReviews().some(r=>r.dayId===day&&r.offset===offset);if(!match){toast('Essa revisão não está pendente. Abra o modo Praticar na biblioteca.');return;}}stopAudio();state.session={day,offset,mode:offset!==null?'due':indices?'missed':'free',cards:indices?.length?indices:[...Array(d.phrases.length).keys()],index:0,revealed:false,answers:[]};state.summary=null;state.view='practice';changeHash('#/pratica');render();window.scrollTo(0,0);}
  function practicePage(){const s=state.session;if(!s)return homepage();const d=DAYS[s.day-1],currentIdx=s.cards[s.index],p=d.phrases[currentIdx],percent=s.index/s.cards.length*100;return `<div class="practice-layout"><button class="back" data-action="leave-practice">${ico('back')} Sair da prática</button><div class="page-header"><div class="eyebrow">${s.mode==='due'?`REVISÃO DE +${s.offset} DIAS`:s.mode==='missed'?'TREINO DE REFORÇO':'PRÁTICA LIVRE'} · DIA ${s.day}</div><h1 class="title" style="margin-top:8px">Vamos fixar essas frases?</h1><p class="subtitle">Leia em inglês, tente recordar o significado e depois confira sua resposta.</p><div class="practice-pron-options">${pronSelect()}</div></div><div class="practice-progress-head"><span>Frase ${s.index+1} de ${s.cards.length}</span><span>${Math.round(percent)}% concluído</span></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><section class="flash-card"><span class="flash-tag">INGLÊS · FRASE ${String(currentIdx+1).padStart(2,'0')}</span><div class="flash-text">${esc(p.en)}</div><button class="icon-btn" data-action="speak-practice" title="Ouvir a frase" aria-label="Ouvir a frase em inglês">${ico('volume')}</button>${s.revealed?`<div class="flash-translation">${esc(p.pt)}${pronGuide(p.en)}</div>`:`<div class="flash-hint">Lembre o significado antes de revelar</div>`}</section><div class="flash-controls">${s.revealed?`<button class="btn btn-outline" data-action="answer" data-answer="forgot">${ico('rotate')} Não lembrei</button><button class="btn btn-primary" data-action="answer" data-answer="remembered">${ico('check')} Lembrei</button>`:`<button class="btn btn-primary" data-action="show-practice" style="min-width:220px">${ico('eye')} Mostrar tradução</button>`}</div><p class="practice-note">${s.mode==='due'?'A revisão será registrada automaticamente quando você avaliar todas as frases.':'Este treino é livre e não altera seu calendário de revisões.'}</p></div>`;}
  function summaryPage(){const r=state.summary;if(!r)return homepage();const n=r.answers.filter(a=>a==='remembered').length,missed=r.answers.length-n;return `<div class="success"><div class="success-icon">${ico('checkcircle')}</div><div class="eyebrow">PRÁTICA FINALIZADA</div><h2>Boa sessão de estudo!</h2><p>${r.mode==='due'?`Revisão de ${r.offset} ${r.offset===1?'dia':'dias'} do Dia ${r.day} registrada no seu calendário.`:'Você praticou suas frases sem alterar o calendário.'} Continue revisitando o que ainda está difícil.</p><div class="success-results"><div><strong>${n}</strong><span>Você lembrou</span></div><div><strong>${missed}</strong><span>Para reforçar</span></div></div><div class="success-actions">${missed?`<button class="btn btn-soft" data-action="repeat-missed">${ico('repeat')} Treinar ${missed} frase${missed>1?'s':''}</button>`:''}<button class="btn btn-primary" data-action="go" data-view="home">${ico('home')} Voltar ao início</button></div></div>`;}
  function statsPage(){const studied=studiedCount(),data=activityMap(),day=localDate(),total=totalReviews(),completedCount=studied*40;const max=Math.max(1,...Array.from({length:14},(_,i)=>data[plusDays(day,i-13)]||0));return `<div class="page-header"><div class="eyebrow">CADA DIA CONTA</div><h1 class="title">Meu progresso</h1><p class="subtitle">Uma visão do que você construiu com consistência.</p></div>${cloudAccountPanel()}<div class="stats-grid"><div class="stat"><div class="stat-icon lilac">${ico('book')}</div><div><h3>${completedCount}</h3><p>Frases estudadas</p></div></div><div class="stat"><div class="stat-icon mint">${ico('repeat')}</div><div><h3>${total}</h3><p>Revisões concluídas</p></div></div><div class="stat"><div class="stat-icon peach">${ico('flame')}</div><div><h3>${streak()}</h3><p>Sequência de dias</p></div></div></div><div class="stats-detail-grid"><section class="panel"><div class="panel-head"><div><h2>Atividade nos últimos 14 dias</h2><p>Conjuntos estudados e revisões finalizadas.</p></div></div><div class="chart-bars">${Array.from({length:14},(_,i)=>{const date=plusDays(day,i-13),n=data[date]||0;return `<div class="chart-bar-col" title="${date}: ${n} atividades"><div class="chart-bar ${n?'has':''}" style="height:${Math.max(3,n/max*110)}px"></div><small>${i%2===0?String(parseDate(date).getDate()).padStart(2,'0'):''}</small></div>`;}).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Sua coleção</h2><p>${studied} de ${DAYS.length} dias estudados</p></div></div><div class="mini-progress" style="margin:18px 0 15px;height:11px"><span style="width:${studied/DAYS.length*100}%"></span></div><p class="subtitle" style="margin-top:0">${DAYS.length-studied} dias ainda disponíveis para novos estudos. Todo o material continua acessível.</p><button class="btn btn-soft btn-small" data-action="go" data-view="library" style="margin-top:18px">Explorar frases ${ico('arrow')}</button></section></div><section class="panel settings"><h3>Preferências de áudio e pronúncia</h3><p>As frases são reproduzidas pela voz em inglês disponível no seu dispositivo. A qualidade e a reprodução offline dependem das vozes instaladas.</p><div class="settings-line"><label for="rate" style="font-size:13px;font-weight:700">Velocidade da fala</label><select id="rate"><option value="0.7" ${progress.rate===.7?'selected':''}>Lenta · 0,70×</option><option value="0.88" ${progress.rate===.88?'selected':''}>Aprendiz · 0,88×</option><option value="1" ${progress.rate===1?'selected':''}>Normal · 1,00×</option><option value="1.15" ${progress.rate===1.15?'selected':''}>Rápida · 1,15×</option></select></div><div class="settings-line"><span style="font-size:13px;font-weight:700">Guia de pronúncia</span>${pronSelect('pron-mode-stats')}</div><p class="pron-settings-hint">A escrita simplificada é uma aproximação para brasileiros, não substitui a escuta. IPA segue o inglês americano sintetizado. As dicas só aparecem depois de revelar a tradução ou pedir ajuda.</p></section><section class="panel settings"><h3>Seu progresso é seu</h3><p>O backup manual continua disponível. Com uma conta por e-mail conectada, os estudos e revisões também são sincronizados pela nuvem.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px"><button class="btn btn-outline" data-action="export">${ico('download')} Exportar backup</button><button class="btn btn-outline" data-action="import">${ico('upload')} Importar backup</button></div><input type="file" id="import-file" accept="application/json,.json" style="display:none" aria-label="Selecionar arquivo de backup"></section><section class="panel settings"><h3>Reiniciar progresso</h3><p>${cloud.user?'Para evitar divergências entre aparelhos, saia da conta por e-mail antes de reiniciar o progresso local.':'Apaga apenas os estudos e revisões locais deste navegador. Não apaga dados da conta por e-mail. As 400 frases permanecem disponíveis.'}</p><button class="btn btn-danger" data-action="ask-reset" ${cloud.user?'disabled title="Saia da conta para reiniciar o progresso local"':''} style="margin-top:12px">${ico('lock')} Reiniciar com confirmação</button></section>`;}
  function modalMarkup(){if(state.modal.type==='complete'){return `<div class="modal-overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="stat-icon lilac">${ico('checkcircle')}</div><h2 id="dialog-title">Concluir Dia ${state.modal.day}?</h2><p>Confirme somente se você realmente estudou as 40 frases. A partir de hoje, as revisões serão programadas para daqui a 1, 7, 15 e 30 dias.</p><div class="actions"><button class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="complete" data-day="${state.modal.day}">Sim, estudei as 40 frases</button></div></section></div>`;}return `<div class="modal-overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">Tem certeza que quer reiniciar?</h2><p>Esta ação apaga seu progresso, sequência de estudos e histórico de revisões neste dispositivo. Faça um backup antes se quiser preservar seus dados.</p><p><strong>Digite REINICIAR para confirmar:</strong></p><input class="input" id="reset-confirm-input" type="text" autocomplete="off" placeholder="REINICIAR"><div class="actions"><button class="btn btn-outline" data-action="close-modal">Cancelar</button><button class="btn btn-danger" data-action="confirm-reset" id="reset-confirm-button" disabled>Apagar meu progresso</button></div></section></div>`;}
  function render(){let html;switch(state.view){case 'library':html=library();break;case 'voice':html=voiceHome();break;case 'voice-day':html=voicePage();break;case 'reviews':html=reviewsPage();break;case 'stats':html=statsPage();break;case 'day':html=dayPage();break;case 'practice':html=practicePage();break;case 'summary':html=summaryPage();break;default:html=homepage();}app.innerHTML=layout(html);document.title=`${state.view==='home'?'Hoje':state.view==='library'?'Biblioteca':state.view==='voice'||state.view==='voice-day'?'Conversação':state.view==='reviews'?'Revisões':state.view==='stats'?'Progresso':'Estudar'} · English Daily`;}
  function toast(message){state.toast=message;clearTimeout(toastHandle);const current=app.querySelector('.toast');if(current)current.remove();app.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${esc(message)}</div>`);toastHandle=setTimeout(()=>{state.toast=null;app.querySelector('.toast')?.remove();},3300);}
  function changeHash(hash){if(location.hash!==hash)history.pushState(null,'',hash);}
  function go(view){stopAudio();stopVoice();state.modal=null;state.view=view;state.revealed=new Set();if(view!=='practice')state.session=null;changeHash(`#/${view==='home'?'hoje':view==='library'?'biblioteca':view==='voice'?'conversacao':view==='reviews'?'revisoes':'progresso'}`);render();window.scrollTo(0,0);}
  function openDay(id){if(!DAYS[id-1])return;stopAudio();stopVoice();state.view='day';state.day=id;state.revealed=new Set();state.session=null;changeHash(`#/dia/${id}`);render();window.scrollTo(0,0);}
  function clearAudioTimers(){clearTimeout(audioTimer);clearInterval(audioCountdown);audioTimer=null;audioCountdown=null;}
  function stopAudio(){readingToken++;clearAudioTimers();state.playAll=false;state.playMode=null;state.isPause=false;state.repeatRemaining=0;state.audioStatus='';state.playing=null;if('speechSynthesis'in window)try{speechSynthesis.cancel();}catch{};app.querySelectorAll('.is-playing,.is-repeat-pause').forEach(el=>el.classList.remove('is-playing','is-repeat-pause'));}
  function updateAudioStatus(message){state.audioStatus=message;const el=app.querySelector('[data-audio-status]');if(el)el.textContent=message;}

  function cleanVoiceResources(){

  async function voiceRecord(){

  function voiceRoute(heard){
    const normalized=heard.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").trim();

    if(/^(no\b|nope\b|nah\b|not really\b|never\b|i don't\b|i do not\b|i didn't\b|i did not\b|i can't\b|i cannot\b|i am not\b|i haven't\b|i have not\b)/.test(normalized))return 'no';

  function voiceReaction(current,route,heard,skipped){

      speak('It was great talking with you. See you soon!');return;
    }
    s.index++;s.phase='ready';render();voiceHear(reaction);
  }

  function answer(value){const s=state.session;if(!s||!s.revealed)return;stopAudio();s.answers.push(value);s.index++;s.revealed=false;if(s.index<s.cards.length){render();return;}const missed=s.cards.filter((_,i)=>s.answers[i]==='forgot');state.summary={day:s.day,offset:s.offset,mode:s.mode,answers:[...s.answers],missed};if(s.mode==='due'){const rec=progress.days[s.day];if(rec){rec.reviews=rec.reviews||{};rec.reviews[String(s.offset)]=localDate();persist();syncLocalDay(s.day);}}state.session=null;state.view='summary';changeHash('#/resultado');render();window.scrollTo(0,0);}
  function exportBackup(){const blob=new Blob([JSON.stringify({app:'English Daily',version:1,exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`english-daily-backup-${localDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportado. Guarde o arquivo em local seguro.');}
  function restoreBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(String(reader.result));if(obj.app!=='English Daily'||obj.version!==1||!obj.progress||!obj.progress.days||typeof obj.progress.days!=='object')throw new Error('Formato inválido');const validated={days:{},rate:[.7,.88,1,1.15].includes(Number(obj.progress.rate))?Number(obj.progress.rate):.88,pauseSeconds:[3,5,8].includes(Number(obj.progress.pauseSeconds))?Number(obj.progress.pauseSeconds):5,voiceStats:{},pronMode:PRON_MODES.includes(obj.progress.pronMode)?obj.progress.pronMode:defaultPronMode};for(const [id,rec] of Object.entries(obj.progress.days)){const num=Number(id);if(!Number.isInteger(num)||num<1||num>DAYS.length||!rec||typeof rec!=='object')continue;if(!/^\d{4}-\d{2}-\d{2}$/.test(rec.studiedAt||''))continue;const reviews={};for(const interval of INTERVALS){const val=rec.reviews?.[String(interval)];if(typeof val==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(val))reviews[String(interval)]=val;}validated.days[id]={studiedAt:rec.studiedAt,reviews};}if(obj.progress.voiceStats&&typeof obj.progress.voiceStats==='object'){for(const [id,val] of Object.entries(obj.progress.voiceStats)){if(!DAYS[Number(id)-1])continue;const count=Number(val?.count);if(Number.isSafeInteger(count)&&count>=0&&count<100000)validated.voiceStats[id]={count,lastAt:/^\d{4}-\d{2}-\d{2}$/.test(val.lastAt||'')?val.lastAt:null};}}if(!confirm(cloud.user?'Importar este backup combinará os estudos com sua conta por e-mail (sem apagar revisões já concluídas). Continuar?':'Importar este backup substituirá o progresso local neste navegador. Deseja continuar?'))return;if(cloud.user){for(const [id,rec] of Object.entries(validated.days)){const merged=mergeDay(progress.days[id],rec);if(merged)progress.days[id]=merged;}for(const [id,val] of Object.entries(validated.voiceStats||{})){const old=progress.voiceStats[id];if(!old||val.count>old.count)progress.voiceStats[id]=val;}}else progress=validated;persist();if(cloud.user){for(const id of Object.keys(progress.days))syncLocalDay(id);for(const id of Object.keys(progress.voiceStats))syncVoiceCount(id);}go('stats');toast('Backup importado com sucesso.');}catch{toast('Não foi possível importar. Selecione um backup válido do English Daily.');}};reader.readAsText(file);}
  function handleClick(event){const el=event.target.closest('[data-action]');if(!el||!app.contains(el))return;const action=el.dataset.action,id=Number(el.dataset.day),index=Number(el.dataset.index);switch(action){case 'cloud-signin':cloudSignIn();break;case 'cloud-sync':cloudSync();break;case 'cloud-signout':cloudSignOut();break;case 'voice-start':startVoice(id);break;case 'voice-hear':voiceHear();break;case 'voice-listen':voiceListen();break;case 'voice-record':voiceRecord();break;case 'voice-stop-listening':voiceStopListening();break;case 'voice-stop-recording':voiceStopRecording();break;case 'voice-retry':voiceRetry();break;case 'voice-example':voiceExample();break;case 'voice-help':if(state.voiceSession){state.voiceSession.showHelp=!state.voiceSession.showHelp;render();}break;case 'voice-next':voiceAdvance();break;case 'voice-skip':voiceAdvance(true);break;case 'go':go(el.dataset.view);break;case 'open-day':openDay(id);break;case 'start-first-review':{const r=allReviews()[0];if(r)startSession(r.dayId,r.offset);break;}case 'start-review':startSession(id,Number(el.dataset.offset));break;case 'filter':state.filter=el.dataset.filter;render();break;case 'stop-audio':stopAudio();render();break;case 'speak':speakOne(index);break;case 'play-all':playAll(id);break;case 'play-repeat':playAll(id,0,null,'repeat');break;case 'reveal':state.revealed.has(index)?state.revealed.delete(index):state.revealed.add(index);render();break;case 'toggle-all-translations':state.revealed=state.revealed.size===40?new Set():new Set(Array.from({length:40},(_,i)=>i));render();break;case 'practice-free':startSession(id);break;case 'show-practice':if(state.session){state.session.revealed=true;render();}break;case 'speak-practice':if(state.session)speak(DAYS[state.session.day-1].phrases[state.session.cards[state.session.index]].en);break;case 'answer':answer(el.dataset.answer);break;case 'leave-practice':go('library');break;case 'repeat-missed':if(state.summary?.missed?.length)startSession(state.summary.day,null,state.summary.missed);break;case 'ask-complete':if(!done(id)){state.modal={type:'complete',day:id};render();}break;case 'close-modal':state.modal=null;render();break;case 'complete':if(!done(id)){progress.days[id]={studiedAt:localDate(),reviews:{}};persist();syncLocalDay(id);}state.modal=null;render();toast(`Dia ${id} concluído! Revisões agendadas para +1, +7, +15 e +30 dias.`);break;case 'ask-reset':if(cloud.user){toast('Saia da conta por e-mail antes de reiniciar o progresso local.');break;}state.modal={type:'reset'};render();break;case 'confirm-reset':{const val=app.querySelector('#reset-confirm-input')?.value;if(val==='REINICIAR'){stopAudio();progress={days:{},rate:.88,pauseSeconds:5,voiceStats:{},pronMode:defaultPronMode};persist();state.modal=null;go('home');toast('Progresso reiniciado com sucesso.');}break;}case 'export':exportBackup();break;case 'import':app.querySelector('#import-file')?.click();break;}}
  app.addEventListener('click',handleClick);
  app.addEventListener('input',event=>{if(event.target.id==='library-search'){const inp=event.target,pos=inp.selectionStart||0;state.search=inp.value;render();const next=app.querySelector('#library-search');next?.focus();try{next?.setSelectionRange(pos,pos);}catch{}}if(event.target.id==='reset-confirm-input'){const b=app.querySelector('#reset-confirm-button');if(b)b.disabled=event.target.value!=='REINICIAR';}});
  app.addEventListener('change',event=>{if(event.target.id==='rate'){progress.rate=Number(event.target.value);persist();syncSettings();toast('Velocidade de áudio atualizada.');}if(event.target.id==='repeat-pause'){progress.pauseSeconds=Number(event.target.value);persist();syncSettings();if(state.playAll&&state.playMode==='repeat')updateAudioStatus(`${state.audioStatus} · Nova pausa será usada na próxima frase.`);else toast('Intervalo para repetição atualizado.');}if(['pron-mode','pron-mode-stats'].includes(event.target.id)){progress.pronMode=PRON_MODES.includes(event.target.value)?event.target.value:defaultPronMode;persist();syncSettings();render();}if(event.target.id==='import-file')restoreBackup(event.target.files?.[0]);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}});
  function readRoute(){const str=location.hash.replace(/^#\/?/,'');if(str==='biblioteca')state.view='library';else if(str==='conversacao')state.view='voice';else if(str.startsWith('conversacao/dia/')){const id=Number(str.split('/')[2]);if(CONVERSATIONS[id-1]){if(state.voiceSession?.day===id)state.view='voice-day';else{stopVoice();state.voiceSession=newVoiceSession(id);state.view='voice-day';}}else state.view='voice';}else if(str==='revisoes')state.view='reviews';else if(str==='progresso')state.view='stats';else if(str.startsWith('dia/')){const id=Number(str.split('/')[1]);if(DAYS[id-1]){state.view='day';state.day=id;state.revealed=new Set();}else state.view='home';}else if(str==='pratica'&&state.session)state.view='practice';else if(str==='resultado'&&state.summary)state.view='summary';else state.view='home';render();}
  window.addEventListener('popstate',()=>{stopAudio();if(!location.hash.startsWith('#/conversacao/dia/'))stopVoice();readRoute();});window.addEventListener('hashchange',()=>{stopAudio();if(!location.hash.startsWith('#/conversacao/dia/'))stopVoice();readRoute();});
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
  readRoute();
  initCloud();
  // Teste de saúde sem dependências: abra no console e rode EnglishDailyDebug.summary().
  window.EnglishDailyDebug={summary:()=>({days:DAYS.length,phrases:DAYS.reduce((n,d)=>n+d.phrases.length,0),studied:studiedCount(),pendingReviews:allReviews(),nextDay:nextDay()?.id||null,voiceStats:progress.voiceStats,voicePhase:state.voiceSession?.phase||null,voiceIndex:state.voiceSession?.index??null,voiceRoute:state.voiceSession?.route||null,voiceHeard:state.voiceSession?.lastHeard||null,voicePrompt:state.voiceSession?voiceItem(state.voiceSession).en:null,voiceSupported:Boolean(RecognitionAPI),audioMode:state.playMode,pauseSeconds:progress.pauseSeconds,repeatRemaining:state.repeatRemaining,pronMode:progress.pronMode,pronEntries:Object.keys(PRON_DATA).length,cloudStatus:cloud.status,cloudConfigured:cloud.configured,cloudSignedIn:Boolean(cloud.user)}),mergeDay,diffDay,addDays:plusDays,today:localDate};
})();
</script>
