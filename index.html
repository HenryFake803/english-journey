  'de','do','da','dos','das','em','no','na','nos','nas','para','por','com','e','ou','mas','que','isso','isto','esse','essa',
  'sou','estou','esta','estao','e','era','foi','ser','ter','tenho','tem','pode','posso','podemos','vai','vou'
]);
const CLOZE_LOW_VALUE = new Set([
  'now','today','tomorrow','tonight','later','soon','again','here','there','already','still','really','just','very','too','more','some','so',
  'little','enough','much','many','few','thing','everything','something','nothing','anything','morning','evening'
]);
const FALSE_ING_WORDS = new Set(['everything','something','nothing','anything','thing','morning','evening','spring']);

function lexicalTokens(value) {
  return (String(value || '').toLowerCase().replace(/’/g, "'").match(/[a-z0-9À-ÿ'-]+/g) || []).filter(Boolean);
}

function contentTokens(value, language = 'en') {
  const stop = language === 'pt' ? PT_DISTRACTOR_STOPWORDS : EN_DISTRACTOR_STOPWORDS;
  return lexicalTokens(value).filter(token => !stop.has(token) && token !== 'not' && token !== "n't" && token !== 'nao' && token !== 'não');
}

function jaccard(a, b) {
  const left = new Set(a);
  const right = new Set(b);
  if (!left.size || !right.size) return 0;
  let overlap = 0;
  for (const item of left) if (right.has(item)) overlap++;
  return overlap / (left.size + right.size - overlap);
}

function phrasePolarity(english) {
  const text = String(english || '').toLowerCase().replace(/’/g, "'");
  return /\b(?:not|never|no)\b|(?:don't|doesn't|didn't|can't|couldn't|won't|wouldn't|shouldn't|isn't|aren't|wasn't|weren't|haven't|hasn't)\b/.test(text) ? 'negative' : 'positive';
}

function questionKind(english) {
  const text = String(english || '').trim();
  if (!text.endsWith('?')) return 'statement';
  const words = lexicalTokens(text);
  const first = words[0] || '';
  if (['what','where','when','why','who','which','how'].includes(first)) return `wh:${first}`;
  if (['can','could','do','does','did','are','is','am','will','would','should','have','has'].includes(first)) return `yn:${first}`;
  return 'question';
}

function openingFrame(english) {
  const words = lexicalTokens(english);
  if (!words.length) return '';
  if (words[0] === 'i' && ['do','can','need','want','have','think','feel','like','love','prefer'].includes(words[1])) return words.slice(0, 2).join(' ');
  if (['what','where','when','why','who','which','how','can','could','do','does','did','are','is','will','would','should'].includes(words[0])) return words.slice(0, 2).join(' ');
  return words.slice(0, Math.min(2, words.length)).join(' ');
}

function reusablePatternKey(pattern) {
  if (!pattern || !isReusablePattern(pattern)) return '';
  return normalizeChoice(pattern)
    .replace(/\b(?:he|she|we|they|you|i)\b/g, 'subject')
    .replace(/\b(?:noun|object|activity|place|idea|adjective)\b/g, 'slot');
}

function tooEquivalent(target, candidate) {
  if (normalizeChoice(target.english) === normalizeChoice(candidate.english)) return true;
  if (normalizeChoice(target.portuguese) === normalizeChoice(candidate.portuguese)) return true;

  // Se duas opções dizem praticamente a mesma coisa e têm a mesma polaridade,
  // elas não servem como distrator: viram uma questão ambígua.
  if (phrasePolarity(target.english) === phrasePolarity(candidate.english)) {
    const pt = jaccard(contentTokens(target.portuguese, 'pt'), contentTokens(candidate.portuguese, 'pt'));
    const en = jaccard(contentTokens(target.english, 'en'), contentTokens(candidate.english, 'en'));
    if (pt >= 0.92 && en >= 0.72) return true;
  }
  return false;
}

function distractorScore(target, candidate) {
  if (tooEquivalent(target, candidate)) return -Infinity;
  const targetPattern = reusablePatternKey(target.pattern);
  const candidatePattern = reusablePatternKey(candidate.pattern);
  const targetQuestion = questionKind(target.english);
  const candidateQuestion = questionKind(candidate.english);
  const targetIsQuestion = targetQuestion !== 'statement';
  const candidateIsQuestion = candidateQuestion !== 'statement';
  const engContentSimilarity = jaccard(contentTokens(target.english), contentTokens(candidate.english));
  const ptContentSimilarity = jaccard(contentTokens(target.portuguese, 'pt'), contentTokens(candidate.portuguese, 'pt'));
  const targetWords = lexicalTokens(target.english);
  const candidateWords = lexicalTokens(candidate.english);
  const lengthSimilarity = 1 - Math.min(1, Math.abs(targetWords.length - candidateWords.length) / Math.max(targetWords.length, candidateWords.length, 1));

  let score = 0;
  if (targetPattern && candidatePattern && targetPattern === candidatePattern) score += 9;
  if (target.dayId === candidate.dayId) score += 4;
  if (target.dayId === candidate.dayId && target.block === candidate.block) score += 2;
  if (target.category && candidate.category && target.category === candidate.category) score += 2.5;
  score += engContentSimilarity * 7;
  score += ptContentSimilarity * 5;
  score += lengthSimilarity * 1.5;

  if (targetQuestion === candidateQuestion) score += 3.5;
  else if (targetIsQuestion === candidateIsQuestion) score += 1;
  else score -= 5;

  if (openingFrame(target.english) === openingFrame(candidate.english)) score += 3;

  const samePolarity = phrasePolarity(target.english) === phrasePolarity(candidate.english);
  if (samePolarity) score += 1;
  // Contrastes como “I'm ready / I'm not ready” ou “I know / I don't know”
  // são excelentes distratores quando o conteúdo lexical é o mesmo.
  else if (engContentSimilarity >= 0.45 || ptContentSimilarity >= 0.45) score += 4;

  return score;
}

const DISTRACTOR_RANKING_CACHE = new Map();

function distractorCandidatePool(target) {
  const targetPattern = reusablePatternKey(target.pattern);
  const targetFrame = openingFrame(target.english);
  const targetQuestion = questionKind(target.english);
  const pool = allPhrases.filter(candidate => {
    if (candidate.id === target.id) return false;
    const nearDay = Math.abs(Number(candidate.dayId || 0) - Number(target.dayId || 0)) <= 1;
    const sameDay = candidate.dayId === target.dayId;
    const samePattern = targetPattern && reusablePatternKey(candidate.pattern) === targetPattern;
    const sameFrame = targetFrame && openingFrame(candidate.english) === targetFrame;
    const sameQuestion = targetQuestion !== 'statement' && questionKind(candidate.english) === targetQuestion;
    const sameCategory = target.category && candidate.category === target.category;
    return sameDay || samePattern || sameFrame || sameQuestion || sameCategory || nearDay;
  });
  return pool.length >= 20 ? pool : allPhrases.filter(candidate => candidate.id !== target.id);
}

function rankedDistractorCandidates(target, type, seed) {
  void type;
  let ranked = DISTRACTOR_RANKING_CACHE.get(target.id);
  if (!ranked) {
    ranked = distractorCandidatePool(target)
      .map(candidate => ({ candidate, score: distractorScore(target, candidate) }))
      .filter(item => Number.isFinite(item.score))
      .sort((a, b) => b.score - a.score || pseudo(`${target.id}:${a.candidate.id}`) - pseudo(`${target.id}:${b.candidate.id}`));
    DISTRACTOR_RANKING_CACHE.set(target.id, ranked);
  }

  // Pequena rotação entre candidatos de qualidade semelhante evita que toda revisão
  // mostre exatamente as mesmas três alternativas, sem sacrificar proximidade.
  return ranked
    .slice(0, 24)
    .map(item => ({ ...item, adjusted: item.score + pseudo(`${target.id}:${item.candidate.id}:${seed}`) * 0.22 }))
    .sort((a, b) => b.adjusted - a.adjusted)
    .map(item => item.candidate);
}

function normalizeChoice(value) {
  return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}

function clozeAnswer(text) {
  const words = String(text || '').replace(/[.!?]/g, '').split(/\s+/).filter(Boolean);
  if (!words.length) return '';
  if (words.length <= 2) return words[words.length - 1].replace(/[^A-Za-z'-]/g, '');

  let best = null;
  for (let index = 0; index < words.length; index++) {
    const clean = words[index].replace(/[^A-Za-z'-]/g, '').toLowerCase().replace(/’/g, "'");
    if (!clean) continue;
    let score = 0;
    if (!EN_DISTRACTOR_STOPWORDS.has(clean)) score += 7;
    else score -= 4;
    if (CLOZE_LOW_VALUE.has(clean)) score -= 3;
    if (/ing$/.test(clean) && !FALSE_ING_WORDS.has(clean)) score += 3;
    if (clean.length >= 5) score += 1;
    if (index === words.length - 1) score += 1.5;
    if (index > 0 && index < words.length - 1) score += 0.5;
    if (!best || score > best.score) best = { word: words[index].replace(/[^A-Za-z'-]/g, ''), score, index };
  }

  // Em frases formadas quase só por palavras funcionais (“How are you?”),
  // a lacuna central é menos ambígua do que apagar o WH-word.
  if (!best || best.score <= 0) {
    return words[Math.max(1, words.length - 2)].replace(/[^A-Za-z'-]/g, '');
  }
  return best.word;
}




function clozeSlotType(text) {
  const frame = clozeFrame(text);
  const answer = clozeAnswer(text);
  const answerClass = clozeWordClass(answer);
  if (answerClass === 'ing') return 'ing';
  const prev = frame.prefix[frame.prefix.length - 1] || '';
  if (['a','an','the','some','more','much','many','few','little','enough','my','your','his','her','our','their'].includes(prev)) return 'noun';
  if (['to','can','could','will','would','should','do','does','did',"don't","doesn't","didn't","can't","couldn't","won't","wouldn't","shouldn't"].includes(prev)) return 'verb';
  if (['i','you','he','she','we','they'].includes(prev)) return 'verb';
  if (["i'm",'am','is','are','was','were',"isn't","aren't","wasn't","weren't"].includes(prev)) return 'complement';
  return answerClass === 'function' ? 'function' : 'lexical';
}

function clozeSlotCompatible(target, candidate) {
  if (target === candidate) return true;
  if (target === 'lexical') return ['lexical','noun','complement'].includes(candidate);
  if (target === 'complement') return ['complement','lexical'].includes(candidate);
  return false;
}

function clozeFrame(text) {
  const answer = clozeAnswer(text);
  const answerKey = String(answer || '').toLowerCase().replace(/[^a-z'-]/g, '');
  const words = lexicalTokens(String(text || '').replace(/[.!?]/g, ''));
  const index = words.findIndex(word => word.replace(/[^a-z'-]/g, '') === answerKey);
  if (index < 0) return { prefix: [], suffix: [], index: -1, length: words.length };
  return {
    prefix: words.slice(Math.max(0, index - 3), index),
    suffix: words.slice(index + 1, index + 3),
    index,
    length: words.length
  };
}

function clozeFrameCompatibility(targetText, candidateText) {
  const target = clozeFrame(targetText);
  const candidate = clozeFrame(candidateText);
  if (target.index < 0 || candidate.index < 0) return 0;
  const prefix = jaccard(target.prefix, candidate.prefix);
  const suffix = (!target.suffix.length && !candidate.suffix.length) ? 1 : jaccard(target.suffix, candidate.suffix);
  const targetRatio = target.index / Math.max(1, target.length - 1);
  const candidateRatio = candidate.index / Math.max(1, candidate.length - 1);
  const position = 1 - Math.min(1, Math.abs(targetRatio - candidateRatio));
  // Quando existe texto depois da lacuna, ele é uma restrição gramatical forte:
  // “I ___ so” não deve aceitar verbos que só funcionariam em “I ___ it”.
  if (target.suffix.length && suffix === 0) return prefix * 0.35 + position * 0.15;
  return prefix * 0.62 + suffix * 0.23 + position * 0.15;
}

function clozeWordClass(word) {
  const clean = String(word || '').toLowerCase().replace(/’/g, "'").replace(/[^a-z'-]/g, '');
  if (!clean) return 'empty';
  if (EN_DISTRACTOR_STOPWORDS.has(clean)) return 'function';
  if (/ing$/.test(clean) && !FALSE_ING_WORDS.has(clean)) return 'ing';
  if (/ly$/.test(clean)) return 'adverb';
  return 'lexical';
}

function clozeClassCompatible(targetClass, candidateClass) {
  if (targetClass === 'ing') return candidateClass === 'ing';
  if (targetClass === 'function') return candidateClass === 'function';
  if (targetClass === 'adverb') return ['adverb','lexical'].includes(candidateClass);
  return candidateClass === 'lexical';
}

function clozeIsUseful(text) {
  const answer = clozeAnswer(text);
  const clean = String(answer || '').toLowerCase().replace(/’/g, "'").replace(/[^a-z'-]/g, '');
  return Boolean(clean) && !EN_DISTRACTOR_STOPWORDS.has(clean) && clean.length >= 3;
}

function clozePrompt(phrase) {
  const answer = clozeAnswer(phrase.english);
  return phrase.english.replace(new RegExp(`\\b${escapeRegExp(answer)}\\b`, 'i'), '_____');
}

function escapeRegExp(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function pseudo(text) { let hash = 2166136261; for (const char of String(text)) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619); return (hash >>> 0) / 4294967295; }
function shuffle(items, seed) { return [...items].sort((a, b) => pseudo(a + seed) - pseudo(b + seed)); }

function recoveryItemsFor(phrase, state, failedItem, seed = 0) {
  if (!phrase || !failedItem) return [];
  const failedSkill = skillForType(failedItem.type);
  const forcedType = failedSkill === 'listening' ? 'listening' : failedSkill === 'production' ? 'production' : 'meaning';
  return [
    {
      type: 'recovery',
      phraseId: phrase.id,
      failedSkill,
      title: 'Reforço rápido',
      body: 'Reveja a frase uma vez. Depois vamos pedir que você a recupere novamente, sem ficar repetindo em loop.'
    },
    makeExercise(phrase, state, 3000 + seed, true, forcedType, 'recovery')
  ];
}

function scheduleRecovery(session, state, item, now = new Date()) {
  if (!session || !item?.phraseId || item?.freeReview || ['recovery','exit'].includes(item.reviewKind)) return false;
  session.recoveryScheduled = session.recoveryScheduled && typeof session.recoveryScheduled === 'object' ? session.recoveryScheduled : {};
  if (session.recoveryScheduled[item.phraseId]) return false;
  const phrase = getPhrase(item.phraseId);
  if (!phrase) return false;
  const progress = getPhraseProgress(state, item.phraseId);
  const shouldRecover = Number(progress.consecutiveMistakes || 0) >= 1 || isDifficultPhrase(progress);
  if (!shouldRecover) return false;

  const recoveryItems = recoveryItemsFor(phrase, state, item, session.index + session.items.length);
  if (!recoveryItems.length) return false;
  const insertAt = Math.min(session.items.length, session.index + 4);
  session.items.splice(insertAt, 0, ...recoveryItems);
  session.recoveryScheduled[item.phraseId] = true;
  session.recoveryCount = Number(session.recoveryCount || 0) + 1;
  return true;
}

function buildDifficultPracticeSession(state, now = new Date(), limit = 15) {
  const phrases = difficultPhrases(state).slice(0, limit);
  if (!phrases.length) return null;
  const dayId = nextUnlockedDay(state);
  const items = [checkpoint('hard-practice', 'Treino de dificuldades', `${phrases.length} frases selecionadas pelos seus erros e habilidades mais fracas.`, 'FOCO NAS DIFICULDADES')];
  phrases.forEach((phrase, index) => items.push(makeExercise(phrase, state, 4000 + index, true, recommendedExerciseType(getPhraseProgress(state, phrase.id), now), 'hard')));
  return {
    id: `${todayKey(now)}-hard-${now.getTime()}`,
    dayId,
    startedAt: now.toISOString(),
    studyDate: todayKey(now),
    index: 0,
    correct: 0,
    wrong: 0,
    almost: 0,
    items,
    newCount: 0,
    reviewCount: 0,
    hardCount: phrases.length,
    recoveryCount: 0,
    recovered: 0,
    outcomes: [],
    currentStreak: 0,
    bestStreak: 0,
    xpStart: Number(state.xp || 0),
    achievementIdsStart: unlockedAchievementIds(state, now),
    recoveryScheduled: {},
    goal: 0,
    mode: 'hard-practice',
    daysMissedAtStart: 0,
    dayTotal: curriculum.find(d => d.id === dayId)?.phrases.length || 0,
    startedSeen: 0
  };
}

function recordIntro(state, phraseId, now = new Date()) {
  markStudyActivity(state, now);
  const current = getPhraseProgress(state, phraseId);
  const tomorrow = new Date(now.getTime() + DAY_MS).toISOString();
  const schedule = current.skillSchedule || Object.fromEntries(SKILLS.map(skill => [skill, defaultSkillSchedule(tomorrow)]));
  for (const skill of SKILLS) if (!schedule[skill].dueAt) schedule[skill].dueAt = tomorrow;
  const reviewDays = [...new Set([...(current.reviewDays || []), todayKey(now)])];
  state.phraseProgress[phraseId] = { ...current, seen: true, firstSeenAt: current.firstSeenAt || now.toISOString(), dueAt: tomorrow, skillSchedule: schedule, reviewDays, lastReviewedAt: now.toISOString() };
}

function recordAnswer(state, item, correct, now = new Date()) {
  return recordOutcome(state, item, correct ? 'correct' : 'wrong', now);
}

function recordRecall(state, item, rating, now = new Date(), meta = {}) {
  const outcome = rating === 'remembered' ? 'correct' : rating === 'almost' ? 'almost' : 'wrong';
  return recordOutcome(state, item, outcome, now, meta);
}

function recordOutcome(state, item, outcome, now = new Date(), meta = {}) {
  markStudyActivity(state, now);
  const current = getPhraseProgress(state, item.phraseId);
  const skill = skillForType(item.type);
  const schedule = current.skillSchedule || Object.fromEntries(SKILLS.map(s => [s, defaultSkillSchedule(current.dueAt)]));
  const skillState = { ...defaultSkillSchedule(current.dueAt), ...(schedule[skill] || {}) };
  const dueBefore = skillState.dueAt ? new Date(skillState.dueAt) : null;
  const previousSkillReviewDay = skillState.lastReviewedAt ? dateKeyFromIso(skillState.lastReviewedAt) : null;
  const overdueDays = dueBefore ? Math.max(0, (now - dueBefore) / DAY_MS) : 0;
  let stability = Math.max(0.5, Number(skillState.stabilityDays || 1));
  let difficulty = clamp(Number(skillState.difficulty ?? 0.35), 0.1, 0.95);
  const correct = outcome === 'correct';
  const almost = outcome === 'almost';

  if (correct) {
    const kindFactor = item.reviewKind === 'immediate' ? 1.0 : item.reviewKind === 'recovery' ? 1.12 : item.reviewKind === 'exit' ? 1.18 : item.reviewKind === 'mini' ? 1.45 : item.reviewKind === 'hard' ? 1.65 : item.reviewKind === 'challenge' ? 1.7 : 2.15;
    const latenessBonus = Math.min(0.65, overdueDays * 0.06);
    stability = item.reviewKind === 'immediate'
      ? Math.max(1, stability)
      : Math.min(MAX_INTERVAL_DAYS, Math.max(stability + 0.5, stability * (kindFactor - difficulty * 0.45 + latenessBonus)));
    difficulty = clamp(difficulty - (item.reviewKind === 'immediate' ? 0.01 : 0.045), 0.1, 0.95);
    const countsAsSpacedReview = ['scheduled','practice','hard'].includes(item.reviewKind) && previousSkillReviewDay !== todayKey(now);
    const spacedDays = Array.isArray(skillState.successfulReviewDays) ? [...skillState.successfulReviewDays] : [];
    if (countsAsSpacedReview) spacedDays.push(todayKey(now));
    skillState.successfulReviewDays = [...new Set(spacedDays.filter(isDateKey))].sort().slice(-60);
    skillState.successfulReviews = skillState.successfulReviewDays.length;
  } else if (almost) {
    // "Quase" não é tratado como acerto nem como lapso completo. A memória existe,
    // mas ainda precisa voltar cedo para consolidar produção sem pista.
    stability = Math.max(0.75, stability * 0.82);
    difficulty = clamp(difficulty + 0.035, 0.1, 0.95);
  } else {
    stability = Math.max(0.5, stability * 0.42);
    difficulty = clamp(difficulty + 0.12, 0.1, 0.95);
    skillState.lapses = Number(skillState.lapses || 0) + 1;
  }

  let intervalDays;
  if (!correct) intervalDays = 1;
  else if (item.reviewKind === 'immediate' || item.reviewKind === 'recovery') intervalDays = 1;
  else if (item.reviewKind === 'exit') intervalDays = Math.max(1, Math.min(2, Math.round(stability)));
  else if (item.reviewKind === 'mini') intervalDays = Math.max(2, Math.round(stability));
  else intervalDays = Math.max(2, Math.min(MAX_INTERVAL_DAYS, Math.round(stability)));

  schedule[skill] = {
    ...skillState,
    stabilityDays: Number(stability.toFixed(2)),
    difficulty: Number(difficulty.toFixed(3)),
    lastReviewedAt: now.toISOString(),
    dueAt: new Date(now.getTime() + intervalDays * DAY_MS).toISOString()
  };

  const score = current[skill] || 0;
  const baseGain = item.reviewKind === 'immediate' ? 0.18 : item.reviewKind === 'recovery' ? 0.16 : item.reviewKind === 'exit' ? 0.12 : item.reviewKind === 'mini' ? 0.23 : 0.3;
  const updatedScore = correct
    ? Math.min(1, score + (1 - score) * baseGain)
    : almost
      ? Math.min(1, score + (1 - score) * 0.07)
      : Math.max(0, score * 0.68 - 0.06);
  const reviewDays = [...new Set([...(current.reviewDays || []), todayKey(now)])];

  const calculatedDue = schedule[skill].dueAt;
  let phraseDue = calculatedDue;
  if (correct && ['mini', 'challenge', 'immediate', 'exit'].includes(item.reviewKind) && current.dueAt) {
    phraseDue = new Date(current.dueAt) < new Date(calculatedDue) ? current.dueAt : calculatedDue;
  }
  if (!correct) phraseDue = new Date(now.getTime() + DAY_MS).toISOString();

  // Uma revisão programada conta como um checkpoint da frase. As outras habilidades
  // continuam com memória própria, mas não criam três itens vencidos para a mesma frase.
  if (['scheduled','practice','hard'].includes(item.reviewKind)) {
    for (const otherSkill of SKILLS) {
      const other = schedule[otherSkill] || defaultSkillSchedule();
      if (!other.dueAt || new Date(other.dueAt) <= now) other.dueAt = phraseDue;
      schedule[otherSkill] = other;
    }
  }

  const consecutiveMistakes = correct || almost ? 0 : Number(current.consecutiveMistakes || 0) + 1;
  const consecutiveCorrect = correct ? Number(current.consecutiveCorrect || 0) + 1 : 0;
  const recoveryCount = Number(current.recoveryCount || 0) + (item.reviewKind === 'recovery' ? 1 : 0);
  const recoverySuccesses = Number(current.recoverySuccesses || 0) + (item.reviewKind === 'recovery' && correct ? 1 : 0);
  const nearMisses = Number(current.nearMisses || 0) + (almost ? 1 : 0);
  const hardSince = !correct && !almost && (consecutiveMistakes >= 2 || isDifficultPhrase({ ...current, repetitions: Number(current.repetitions || 0) + 1, mistakes: Number(current.mistakes || 0) + 1, consecutiveMistakes }))
    ? (current.hardSince || todayKey(now))
    : (correct && consecutiveCorrect >= 3 && difficultyScore({ ...current, [skill]: updatedScore, consecutiveMistakes: 0 }) < 0.45 ? null : current.hardSince || null);

  const nearMissRecoveryStreak = current.nearMissRecoveryStreak && typeof current.nearMissRecoveryStreak === 'object'
    ? { ...current.nearMissRecoveryStreak }
    : {};
  nearMissRecoveryStreak[skill] = correct
    ? Math.min(3, Number(nearMissRecoveryStreak[skill] || 0) + 1)
    : 0;

  const previousFocusCounts = current.nearMissFocusCounts && typeof current.nearMissFocusCounts === 'object' ? current.nearMissFocusCounts : {};
  let nearMissFocusCounts = { ...previousFocusCounts };
  let lastNearMissFocus = current.lastNearMissFocus || null;
  if (almost && meta?.nearMissFocus?.id) {
    const focus = { ...meta.nearMissFocus, skill, at: now.toISOString() };
    nearMissFocusCounts[focus.id] = Number(nearMissFocusCounts[focus.id] || 0) + 1;
    lastNearMissFocus = focus;
  } else if (correct && current.lastNearMissFocus?.skill === skill && Number(nearMissRecoveryStreak[skill] || 0) >= 2) {
    lastNearMissFocus = null;
  } else if (!correct && !almost) {
    lastNearMissFocus = null;
  }

  state.phraseProgress[item.phraseId] = {
    ...current,
    seen: true,
    firstSeenAt: current.firstSeenAt || now.toISOString(),
    dueAt: phraseDue,
    repetitions: Number(current.repetitions || 0) + 1,
    mistakes: Number(current.mistakes || 0) + (!correct && !almost ? 1 : 0),
    nearMisses,
    nearMissFocusCounts,
    nearMissHistory: Array.isArray(current.nearMissHistory) ? current.nearMissHistory.slice(-12) : [],
    nearMissRecoveryStreak,
    lastNearMissFocus,
    [skill]: Number(updatedScore.toFixed(3)),
    skillSchedule: schedule,
    reviewDays,
    consecutiveMistakes,
    consecutiveCorrect,
    recoveryCount,
    recoverySuccesses,
    lastOutcome: outcome,
    hardSince,
    lastReviewedAt: now.toISOString()
  };
  state.xp += correct ? 8 : almost ? 4 : 2;
  return state.phraseProgress[item.phraseId];
}

function skillForType(type) {
  if (type === 'listening' || type === 'listening-recall') return 'listening';
  if (type === 'production' || type === 'context' || type === 'cloze' || type === 'recall') return 'production';
  return 'reading';
}


function recordSessionOutcome(session, item, outcome) {
  if (!session || !item || !['correct','almost','wrong'].includes(outcome)) return null;
  if (!Array.isArray(session.outcomes)) session.outcomes = [];
  const skill = item.type === 'listening' || item.type === 'listening-recall' ? 'listening'
    : ['production','context','cloze','recall'].includes(item.type) ? 'production'
      : item.type === 'meaning' ? 'reading' : null;
  const blockNumber = Number(item.blockNumber || activeBlockAt(session, session.index) || 0) || null;
  const entry = { phraseId: item.phraseId || null, type: item.type, reviewKind: item.reviewKind || null, skill, outcome, blockNumber, calibrationLevel: item.calibrationLevel || null };
  session.outcomes.push(entry);
  if (session.outcomes.length > 500) session.outcomes = session.outcomes.slice(-500);

  // V0.6.9 — momentum leve da própria sessão. Não é moeda nem ranking:
  // serve apenas para tornar o feedback imediato mais satisfatório.
  if (outcome === 'correct') {
    session.currentStreak = Number(session.currentStreak || 0) + 1;
    session.bestStreak = Math.max(Number(session.bestStreak || 0), session.currentStreak);
  } else {
    session.currentStreak = 0;
  }
  // V0.9.1: depois de registrar a resposta, ajusta apenas o que ainda não foi visto.
  if (item.reviewKind !== 'exit') {
    try { applyLiveSessionAdaptation(session, state); } catch (error) { console.warn('Adaptação ao vivo ignorada:', error); }
  }
  return entry;
}

function activeBlockAt(session, index) {
  if (!session?.items?.length) return null;
  for (let i = Math.min(index, session.items.length - 1); i >= 0; i--) {
    const item = session.items[i];
    if (Number(item?.blockNumber)) return Number(item.blockNumber);
    if (item?.type === 'checkpoint' && Number(item?.blockNumber)) return Number(item.blockNumber);
  }
  return null;
}

function sessionSkillBreakdown(session) {
  const base = { reading: blankOutcome(), listening: blankOutcome(), production: blankOutcome() };
  for (const entry of session?.outcomes || []) {
    if (!entry?.skill || !base[entry.skill]) continue;
    const bucket = base[entry.skill];
    bucket.attempts++;
    if (entry.outcome === 'correct') bucket.correct++;
    else if (entry.outcome === 'almost') bucket.almost++;
    else if (entry.outcome === 'wrong') bucket.wrong++;
  }
  for (const bucket of Object.values(base)) {
    bucket.score = bucket.attempts ? Math.round((bucket.correct + bucket.almost * 0.5) / bucket.attempts * 100) : null;
  }
  return base;
}

function sessionBlockBreakdown(session, blockNumber) {
  const rows = (session?.outcomes || []).filter(entry => Number(entry?.blockNumber) === Number(blockNumber));
  const result = blankOutcome();
  for (const entry of rows) {
    result.attempts++;
    if (entry.outcome === 'correct') result.correct++;
    else if (entry.outcome === 'almost') result.almost++;
    else if (entry.outcome === 'wrong') result.wrong++;
  }
  result.score = result.attempts ? Math.round((result.correct + result.almost * 0.5) / result.attempts * 100) : null;
  return result;
}

function sessionLearningInsight(session) {
  const skills = sessionSkillBreakdown(session);
  const entries = Object.entries(skills).filter(([, value]) => value.attempts > 0);
  if (!entries.length) return { skill: null, score: null, title: 'Sessão registrada', text: 'O motor já preparou os próximos retornos com base no que você estudou.' };
  const ordered = [...entries].sort((a,b) => a[1].score - b[1].score);
  const [skill, data] = ordered[0];
  const labels = { reading: 'Leitura', listening: 'Listening', production: 'Produção' };
  if (entries.every(([, value]) => value.score >= 85)) {
    return { skill: null, score: Math.round(entries.reduce((sum, [,v]) => sum + v.score, 0) / entries.length), title: 'Desempenho equilibrado', text: 'Você foi bem nas habilidades testadas. O espaçamento pode aumentar gradualmente nas frases mais fortes.' };
  }
  const action = skill === 'listening' ? 'As próximas revisões vão favorecer mais áudio e menos texto.'
    : skill === 'production' ? 'As próximas revisões vão puxar mais recuperação mental e contexto.'
      : 'As próximas revisões vão reforçar reconhecimento de significado antes de aumentar a dificuldade.';
  return { skill, score: data.score, title: `${labels[skill]} pediu mais esforço`, text: action };
}

function blankOutcome() { return { attempts: 0, correct: 0, almost: 0, wrong: 0, score: null }; }

function completeDay(state, session, now = new Date()) {
  // Sessões criadas antes da V0.7.0 não carregam o retrato de conquistas do início.
  // Nesse caso usamos o estado imediatamente anterior à conclusão como baseline,
  // evitando anunciar marcos antigos como se tivessem acabado de ser conquistados.
  const achievementBaseline = Array.isArray(session.achievementIdsStart) ? session.achievementIdsStart : unlockedAchievementIds(state, now);
  markStudyActivity(state, now);
  const day = curriculum.find(item => item.id === session.dayId);
  const practiceOnly = isOptionalPracticeMode(session.mode);
  let allSeen = day?.phrases.every(p => getPhraseProgress(state, p.id).seen) ?? false;
  const plannedWholeDay = !practiceOnly && day && Number(session.startedSeen || 0) + Number(session.newCount || 0) >= Number(session.dayTotal || day.phrases.length);
  if (!allSeen && plannedWholeDay) {
    const introIds = new Set((session.items || []).filter(item => item?.type === 'intro' && item.phraseId).map(item => item.phraseId));
    for (const phrase of day.phrases) {
      if (!getPhraseProgress(state, phrase.id).seen && introIds.has(phrase.id)) recordIntro(state, phrase.id, now);
    }
    allSeen = day.phrases.every(p => getPhraseProgress(state, p.id).seen);
  }
  if (!practiceOnly && allSeen && !state.completedDays.includes(session.dayId)) state.completedDays.push(session.dayId);
  state.completedDays.sort((a, b) => a - b);
  state.xp += practiceOnly ? (session.mode === 'free-review' ? 5 : 10) : allSeen ? 30 : 15;
  const nextSessionBrief = session.mode === 'free-review' ? state.nextSessionBrief : buildNextSessionBrief(state, session, now);
  if (session.mode !== 'free-review') state.nextSessionBrief = nextSessionBrief;
  state.dailyHistory.push({ date: todayKey(now), dayId: session.dayId, correct: session.correct, almost: Number(session.almost || 0), wrong: session.wrong, newIntroduced: session.newCount || 0, reviewCount: Number(session.reviewCount || 0), hardCount: Number(session.hardCount || 0), completedDay: practiceOnly ? false : allSeen, mode: session.mode || 'normal', variationCount: Number(session.variationCount || 0), variationRemembered: Number(session.variationRemembered || 0), skillSummary: sessionSkillBreakdown(session), adaptiveFocus: session.adaptiveFocus || null, adaptiveLoad: session.adaptiveLoad || null, newGoal: Number.isFinite(Number(session.goal)) ? Number(session.goal) : null, newGoalDate: session.studyDate || todayKey(now), closureCount: Number(session.closureCount || 0), closureSummary: sessionClosureSummary(session), nextSessionBrief, completedAt: now.toISOString() });
  state.dailyHistory = state.dailyHistory.slice(-365);
  state.activeSession = null;
  state.longestStreak = Math.max(Number(state.longestStreak || 0), calculateLongestStreak(state.activityDates || []));
  const beforeAchievements = new Set(achievementBaseline);
  const afterAchievements = unlockedAchievementIds(state, now);
  state.recentAchievements = afterAchievements.filter(id => !beforeAchievements.has(id)).slice(0, 4);
  return allSeen;
}

function reviewDaySpan(reviewDays = []) {
  const valid = [...new Set((reviewDays || []).filter(isDateKey))].sort();
  if (valid.length < 2) return 0;
  const toUtc = key => {
    const [y,m,d] = key.split('-').map(Number);
    return Date.UTC(y, m - 1, d);
  };
  return Math.max(0, Math.round((toUtc(valid.at(-1)) - toUtc(valid[0])) / DAY_MS));
}

function masteryEvidence(progress, now = new Date()) {
  const p = progress || {};
  const schedule = p.skillSchedule || {};
  const days = [...new Set((p.reviewDays || []).filter(isDateKey))].sort();
  const spanDays = reviewDaySpan(days);
  const spacedWins = skill => {
    const record = schedule[skill] || {};
    const days = Array.isArray(record.successfulReviewDays) ? [...new Set(record.successfulReviewDays.filter(isDateKey))] : [];
    if (days.length) return days.length;
    return Number(record.successfulReviews || 0) > 0 && record.lastReviewedAt ? 1 : 0;
  };
  const productionWins = spacedWins('production');
  const listeningWins = spacedWins('listening');
  const readingWins = spacedWins('reading');
  const recurringProduction = Boolean(recurringNearMissPattern(p, 'production'));
  const recurringListening = Boolean(recurringNearMissPattern(p, 'listening'));
  const recentFailure = p.lastOutcome === 'wrong' || Number(p.consecutiveMistakes || 0) > 0;
  const hardActive = Boolean(p.hardSince) && isDifficultPhrase(p);
  const overall = mastery(p);

  const gates = {
    overall: overall >= 0.76,
    days: days.length >= 4,
    time: spanDays >= 4,
    reading: Number(p.reading || 0) >= 0.50,
    listening: Number(p.listening || 0) >= 0.62,
    production: Number(p.production || 0) >= 0.62,
    listeningSpaced: listeningWins >= 2,
    productionSpaced: productionWins >= 2,
    broadSpacing: [readingWins, listeningWins, productionWins].filter(v => v >= 1).length >= 2,
    stable: !recurringProduction && !recurringListening && !recentFailure && !hardActive
  };
  return {
    passed: Object.values(gates).every(Boolean),
    gates,
    overall,
    days: days.length,
    spanDays,
    productionWins,
    listeningWins,
    readingWins,
    recurringProduction,
    recurringListening
  };
}

function masteryMissing(progress, now = new Date(), limit = 2) {
  const evidence = masteryEvidence(progress, now);
  const labels = [];
  if (!evidence.gates.days || !evidence.gates.time) labels.push('mais dias de espaçamento');
  if (!evidence.gates.production || !evidence.gates.productionSpaced) labels.push('produção sem pistas');
  if (!evidence.gates.listening || !evidence.gates.listeningSpaced) labels.push('listening espaçado');
  if (!evidence.gates.reading || !evidence.gates.overall) labels.push('memória mais estável');
  if (!evidence.gates.stable) labels.push('resolver dificuldade recorrente');
  return [...new Set(labels)].slice(0, limit);
}

function isMastered(progress, now = new Date()) {
  return masteryEvidence(progress, now).passed;
}

function learningBuckets(state, now = new Date()) {
  const seen = allPhrases.filter(phrase => getPhraseProgress(state, phrase.id).seen);
  let mastered = 0;
  let strong = 0;
  let learning = 0;
  for (const phrase of seen) {
    const progress = getPhraseProgress(state, phrase.id);
    if (isMastered(progress, now)) {
      mastered++;
      continue;
    }
    const spacedDays = new Set(progress.reviewDays || []).size;
    const activeSkillCount = SKILLS.filter(skill => Number(progress[skill] || 0) > 0).length;
    const evidence = masteryEvidence(progress, now);
    const closeToMastery = mastery(progress) >= 0.58 && spacedDays >= 2 && activeSkillCount >= 2 && !evidence.recurringProduction && !evidence.recurringListening;
    if (closeToMastery) strong++;
    else learning++;
  }
  return { studied: seen.length, learning, strong, mastered };
}

function aggregateHistorySkills(entries = []) {
  const out = Object.fromEntries(SKILLS.map(skill => [skill, { attempts: 0, correct: 0, almost: 0, wrong: 0, score: null }]));
  for (const entry of entries) {
    const summary = entry?.skillSummary || {};
    for (const skill of SKILLS) {
      const source = summary[skill];
      if (!source) continue;
      out[skill].attempts += Number(source.attempts || 0);
      out[skill].correct += Number(source.correct || 0);
      out[skill].almost += Number(source.almost || 0);
      out[skill].wrong += Number(source.wrong || 0);
    }
  }
  for (const skill of SKILLS) {
    const bucket = out[skill];
    bucket.score = bucket.attempts
      ? Math.round((bucket.correct + bucket.almost * 0.5) / bucket.attempts * 100)
      : null;
  }
  return out;
}

function historyWindow(state, endKey, days) {
  const keys = Array.from({ length: days }, (_, index) => shiftKey(endKey, index - (days - 1)));
  const set = new Set(keys);
  const history = (state.dailyHistory || []).filter(entry => entry?.date && set.has(entry.date));
  const byDate = new Map(keys.map(key => [key, []]));
  for (const entry of history) byDate.get(entry.date)?.push(entry);
  const dayRows = keys.map(date => {
    const entries = byDate.get(date) || [];
    const correct = entries.reduce((sum, x) => sum + Number(x.correct || 0), 0);
    const almost = entries.reduce((sum, x) => sum + Number(x.almost || 0), 0);
    const wrong = entries.reduce((sum, x) => sum + Number(x.wrong || 0), 0);
    const attempts = correct + almost + wrong;
    return {
      date,
      studied: entries.length > 0,
      sessions: entries.length,
      correct,
      almost,
      wrong,
      attempts,
      score: attempts ? Math.round((correct + almost * 0.5) / attempts * 100) : null,
      newIntroduced: entries.reduce((sum, x) => sum + Number(x.newIntroduced || 0), 0),
      reviews: entries.reduce((sum, x) => sum + Number(x.reviewCount || 0), 0)
    };
  });
  const correct = dayRows.reduce((sum, x) => sum + x.correct, 0);
  const almost = dayRows.reduce((sum, x) => sum + x.almost, 0);
  const wrong = dayRows.reduce((sum, x) => sum + x.wrong, 0);
  const attempts = correct + almost + wrong;
  return {
    days: dayRows,
    studyDays: dayRows.filter(x => x.studied).length,
    sessions: dayRows.reduce((sum, x) => sum + x.sessions, 0),
    newIntroduced: dayRows.reduce((sum, x) => sum + x.newIntroduced, 0),
    reviews: dayRows.reduce((sum, x) => sum + x.reviews, 0),
    attempts,
    correct,
    almost,
    wrong,
    score: attempts ? Math.round((correct + almost * 0.5) / attempts * 100) : null,
    skills: aggregateHistorySkills(history)
  };
}

function weeklyProgress(state, now = new Date()) {
  const today = todayKey(now);
  const current = historyWindow(state, today, 7);
  const previous = historyWindow(state, shiftKey(today, -7), 7);
  const trend = current.score != null && previous.score != null ? current.score - previous.score : null;
  return { ...current, previousScore: previous.score, trend };
}

function coursePhaseProgress(state) {
  return COURSE_PHASES.map(phase => {
    const days = curriculum.filter(day => day.id >= phase.startDay && day.id <= phase.endDay);
    const phrases = days.flatMap(day => day.phrases);
    const seen = phrases.filter(phrase => getPhraseProgress(state, phrase.id).seen);
    const mastered = seen.filter(phrase => isMastered(getPhraseProgress(state, phrase.id))).length;
    const strong = seen.filter(phrase => {
      const progress = getPhraseProgress(state, phrase.id);
      return !isMastered(progress) && mastery(progress) >= 0.55 && new Set(progress.reviewDays || []).size >= 2;
    }).length;
    const avgMastery = seen.length
      ? Math.round(seen.reduce((sum, phrase) => sum + mastery(getPhraseProgress(state, phrase.id)), 0) / seen.length * 100)
      : 0;
    return {
      ...phase,
      days: days.length,
      completedDays: days.filter(day => state.completedDays.includes(day.id)).length,
      total: phrases.length,
      seen: seen.length,
      strong,
      mastered,
      avgMastery
    };
  });
}

function dashboardPriority(state, now = new Date()) {
  const s = stats(state, now);
  if (!s.studied) return { kind: 'start', title: 'Construa a primeira base', text: 'Comece pelo Dia 1. Depois de algumas sessões, o painel passa a separar memória, listening e produção.' };
  if (s.due >= 50) return { kind: 'reviews', title: `${s.due} revisões pedem prioridade`, text: 'Vale reduzir frases novas por enquanto. O motor já vai colocar as revisões vencidas antes do conteúdo novo.' };
  if (s.difficult >= 5) return { kind: 'hard', title: `${s.difficult} frases precisam de reforço`, text: 'Essas frases tiveram lapsos reais. O treino de dificuldades é mais útil agora do que simplesmente adicionar mais conteúdo.' };
  const skills = [
    ['Listening', s.listening, 'ouvir sem depender do texto'],
    ['Produção', s.production, 'recuperar a frase a partir da ideia'],
    ['Leitura', s.reading, 'reconhecer frase e significado']
  ].sort((a, b) => a[1] - b[1]);
  const weakest = skills[0];
  if (weakest[1] + 12 < skills[2][1]) return { kind: 'skill', title: `${weakest[0]} está ficando para trás`, text: `Seu nível atual nessa habilidade é ${weakest[1]}%. As próximas revisões já podem favorecer mais exercícios de ${weakest[2]}.` };
  return { kind: 'balanced', title: 'Base equilibrada no momento', text: 'Não há um gargalo forte agora. Continue aparecendo nos dias seguintes para transformar frases fortes em domínio espaçado.' };
}

function learningDashboard(state, now = new Date()) {
  const s = stats(state, now);
  const buckets = learningBuckets(state, now);
  const week = weeklyProgress(state, now);
  const phases = coursePhaseProgress(state);
  const priority = dashboardPriority(state, now);
  return {
    stats: s,
    buckets,
    week,
    phases,
    priority,
    masteryRate: buckets.studied ? Math.round(buckets.mastered / buckets.studied * 100) : 0,
    strongOrMasteredRate: buckets.studied ? Math.round((buckets.strong + buckets.mastered) / buckets.studied * 100) : 0
  };
}

function stats(state, now = new Date()) {
  const progress = Object.values(state.phraseProgress).filter(p => p.seen).map(p => getPhraseProgress({ phraseProgress: { [p.phraseId]: p } }, p.phraseId));
  const mastered = progress.filter(p => isMastered(p, now)).length;
  const difficult = progress.filter(isDifficultPhrase).length;
  const recovering = progress.filter(p => Number(p.consecutiveMistakes || 0) > 0 || p.lastOutcome === 'wrong').length;
  const avg = key => progress.length ? Math.round(progress.reduce((sum, p) => sum + (p[key] || 0), 0) / progress.length * 100) : 0;
  const calendar = calendarStatus(state, now);
  return {
    studied: progress.length,
    mastered,
    difficult,
    recovering,
    reading: avg('reading'),
    listening: avg('listening'),
    production: avg('production'),
    streak: calendar.currentStreak,
    longestStreak: calendar.longestStreak,
    studiedToday: calendar.studiedToday,
    daysMissed: calendar.daysMissed,
    lastStudyDate: calendar.lastStudyDate,
    due: dueReviews(state, now).length
  };
}

function mastery(progress) { return ((progress.reading || 0) * 0.32 + (progress.listening || 0) * 0.33 + (progress.production || 0) * 0.35); }
function dayProgress(day, state) { const values = day.phrases.map(p => mastery(getPhraseProgress(state, p.id))); return values.length ? Math.round(values.reduce((a, b) => a + b, 0) / values.length * 100) : 0; }
function daySeenCount(day, state) { return day.phrases.filter(p => getPhraseProgress(state, p.id).seen).length; }
function getPhrase(phraseId) { return phraseById[phraseId]; }
function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

let cachedVoice = null;

function scoreVoice(voice) {
  const name = String(voice?.name || '');
  const lang = String(voice?.lang || '');
  let score = 0;
  if (/^en-US$/i.test(lang)) score += 60;
  else if (/^en/i.test(lang)) score += 30;
  if (/natural|neural|premium|enhanced/i.test(name)) score += 55;
  if (/google|microsoft/i.test(name)) score += 28;
  if (/aria|jenny|ava|samantha|allison|siri/i.test(name)) score += 24;
  if (voice?.localService) score += 4;
  return score;
}

function bestEnglishVoice() {
  try {
    if (typeof window === 'undefined' || !('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices?.() || [];
    if (!voices.length) return cachedVoice;
    cachedVoice = [...voices]
      .filter(v => /^en/i.test(String(v.lang || '')))
      .sort((a, b) => scoreVoice(b) - scoreVoice(a))[0] || voices[0] || null;
    return cachedVoice;
  } catch {
    return null;
  }
}

function audioOutputAvailable() {
  // Em testes sem DOM assumimos áudio disponível para não alterar a geração pedagógica.
  // No navegador real, listening só é criado quando a API de fala existe.
  if (typeof window === 'undefined') return true;
  try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; }
  catch { return false; }
}

function voiceLabel() {
  const voice = bestEnglishVoice();
  if (!voice) return 'voz do navegador';
  return `${voice.name}${voice.lang ? ` · ${voice.lang}` : ''}`;
}

function speak(text, options = {}) {
  try {
    if (typeof window === 'undefined' || !('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return false;
    const normalized = typeof options === 'boolean' ? { slow: options } : (options || {});
    const slow = Boolean(normalized.slow);
    const cancel = normalized.cancel !== false;
    if (cancel) window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = slow ? 0.68 : 0.91;
    utterance.pitch = 1;
    utterance.volume = 1;
    const preferred = bestEnglishVoice();
    if (preferred) utterance.voice = preferred;
    window.speechSynthesis.speak(utterance);
    return true;
  } catch (error) {
    console.warn('Speech synthesis indisponível:', error);
    return false;
  }
}

// Alguns navegadores carregam a lista de vozes de forma assíncrona.
try {
  if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
    bestEnglishVoice();
    window.speechSynthesis.addEventListener?.('voiceschanged', () => { cachedVoice = null; bestEnglishVoice(); });
  }
} catch { /* áudio é opcional */ }

function contrastKey(a, b) {

function candidatesForChoice(item, selected) {
  if (!item || !selected) return [];
  if (['meaning', 'listening'].includes(item.type)) {
    return PHRASES_BY_PORTUGUESE.get(selected) || [];
  }
  if (['production', 'context'].includes(item.type)) {
    return PHRASES_BY_ENGLISH.get(selected) || [];
  }
  return [];
}

function selectedPhraseFor(item, target, selected) {
  const matches = candidatesForChoice(item, selected).filter(phrase => phrase.id !== target?.id);
  if (!matches.length) return null;
  // O motor tende a escolher distratores do mesmo dia/bloco. Isso resolve traduções
  // eventualmente repetidas no currículo sem depender de metadados extras no save.
  return matches.find(phrase => phrase.dayId === target.dayId && phrase.block === target.block)
    || matches.find(phrase => phrase.dayId === target.dayId)
    || matches[0];
}

function isQuestion(text) { return String(text || '').trim().endsWith('?'); }
function isNegative(text) {
  const value = String(text || '').toLowerCase().replace(/’/g, "'");
  return /\b(?:not|never|no)\b|(?:don't|doesn't|didn't|can't|couldn't|won't|wouldn't|shouldn't|isn't|aren't|haven't|hasn't)\b/.test(value);
}

function clozeFeedback(target, selected, answer) {
  const sentence = target?.english || '';
  const answerText = String(answer || '');
  const selectedText = String(selected || '');
  const pattern = target?.pattern && !/Frase completa/i.test(target.pattern) ? target.pattern : '';
  const frame = sentence.replace(new RegExp(`\\b${answerText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i'), '_____');
  const detail = pattern
    ? `Aqui o molde é “${pattern}”. “${answerText}” completa naturalmente “${frame}”; “${selectedText}” não expressa a frase-alvo.`
    : `A frase completa é “${sentence}”. Neste contexto, a palavra que completa a ideia é “${answerText}”, não “${selectedText}”.`;
  return { title: 'Olhe para o encaixe', text: detail };
}

function genericContrast(target, selectedPhrase) {
  const targetMeaning = target?.portuguese || '';
  const selectedMeaning = selectedPhrase?.portuguese || '';
  const targetEnglish = target?.english || '';
  const selectedEnglish = selectedPhrase?.english || '';

  if (isQuestion(targetEnglish) && isQuestion(selectedEnglish)) {
    return `“${selectedEnglish}” pergunta “${selectedMeaning}”. Aqui você precisava perguntar “${targetMeaning}”: “${targetEnglish}”.`;
  }
  if (isNegative(targetEnglish) !== isNegative(selectedEnglish)) {
    return `A sua escolha muda a polaridade da ideia: “${selectedEnglish}” = “${selectedMeaning}”; a frase-alvo é “${targetEnglish}” = “${targetMeaning}”.`;
  }
  if (target?.pattern && selectedPhrase?.pattern && target.pattern === selectedPhrase.pattern && !/Frase completa/i.test(target.pattern)) {
    return `As duas usam o mesmo molde (${target.pattern}), mas mudam a mensagem: “${selectedEnglish}” = “${selectedMeaning}”; aqui era “${targetEnglish}” = “${targetMeaning}”.`;
  }
  return `“${selectedEnglish}” significa “${selectedMeaning}”. Aqui a ideia pedida era “${targetMeaning}”, expressa por “${targetEnglish}”.`;
}

function mistakeFeedback(item, targetPhrase, selectedChoice) {
  if (!item || !targetPhrase || selectedChoice == null || selectedChoice === item.answer) return null;

  if (item.type === 'cloze') return clozeFeedback(targetPhrase, selectedChoice, item.answer);

  const selectedPhrase = selectedPhraseFor(item, targetPhrase, selectedChoice);
  if (!selectedPhrase) {
    return {
      title: 'Compare as duas ideias',
      text: `Sua escolha foi “${selectedChoice}”. A resposta correta é “${item.answer}”. Repare no sentido completo da frase, não só em uma palavra parecida.`
    };
  }

  const curated = CURATED_CONTRASTS.get(contrastKey(targetPhrase.english, selectedPhrase.english));
  if (curated) return { title: 'Diferença-chave', text: curated, curated: true, selectedPhraseId: selectedPhrase.id };

  return {
    title: 'Compare o sentido',
    text: genericContrast(targetPhrase, selectedPhrase),
    selectedPhraseId: selectedPhrase.id
  };
}

function hasCuratedContrast(a, b) {
  return CURATED_CONTRASTS.has(contrastKey(a, b));
}

function curatedContrastCount() {
  return CURATED_CONTRASTS.size;
}


const CONTRACTION_RE = /\b(?:I'm|you're|he's|she's|we're|they're|I've|you've|we've|they've|I'll|you'll|he'll|she'll|we'll|they'll|I'd|you'd|he'd|she'd|we'd|they'd|don't|doesn't|didn't|can't|couldn't|won't|wouldn't|shouldn't|isn't|aren't|wasn't|weren't|haven't|hasn't|what's|where's|who's|that's|there's|it's)\b/i;
const QUESTION_START_RE = /^(?:what|where|when|why|who|which|how|can|could|do|does|did|are|is|should|would|have|has)\b/i;
const FOCUS_STOPWORDS = new Set(['i','you','he','she','we','they','it','a','an','the','this','that','my','your','his','her','our','their','to','of','for','in','on','at','by','with','from','and','or','but']);

function englishWords(text) {
  return String(text || '').replace(/[’]/g, "'").match(/[A-Za-z]+(?:['-][A-Za-z]+)*/g) || [];
}

function cleanPattern(pattern) {
  const value = String(pattern || '').trim();
  if (!value || /Frase completa/i.test(value) || /uso frequente/i.test(value)) return '';
  return value;
}

function patternSlotFocus(phrase) {
  const pattern = cleanPattern(phrase?.pattern);
  if (!pattern || !pattern.includes('+')) return null;
  const [rawPrefix, ...rest] = pattern.split('+');
  const prefix = rawPrefix.trim().replace(/[?.!,]/g, '');
  const slot = rest.join('+').trim().toLowerCase();
  const words = englishWords(phrase?.english);
  const prefixWords = englishWords(prefix);
  if (!prefixWords.length || prefixWords.length >= words.length) return null;

  const actualPrefix = words.slice(0, prefixWords.length).join(' ');
  if (normalize(actualPrefix) !== normalize(prefixWords.join(' '))) return null;
  const remainder = words.slice(prefixWords.length).join(' ');
  if (!remainder) return null;

  if (/verb|-ing/.test(slot)) return { id: 'verb', label: 'VERBO-CHAVE', spotlight: remainder.split(' ')[0] };
  if (/noun|complement|idea|adjective/.test(slot)) return { id: 'complement', label: 'COMPLEMENTO', spotlight: remainder };
  if (/so|yet|now|later|time|place/.test(slot)) return { id: 'ending', label: 'FINAL DA FRASE', spotlight: remainder };
  return { id: 'frame', label: 'MOLDE DA FRASE', spotlight: prefixWords.join(' ') };
}

function fallbackKeyword(words) {
  const candidates = words.filter(word => !FOCUS_STOPWORDS.has(normalize(word)) && word.length > 2);
  return candidates.at(-1) || words.at(-1) || '';
}

/**
 * Sugere um foco para um near miss. Como não há digitação/microfone, isto não
 * afirma qual palavra o aluno esqueceu; apenas destaca a parte mais informativa
 * para orientar a próxima tentativa.
 */
function nearMissFocus(phrase, skill = 'production') {
  const english = String(phrase?.english || '').trim();
  const words = englishWords(english);
  const listening = skill === 'listening';
  const contraction = english.match(CONTRACTION_RE)?.[0] || null;

  if (listening && contraction) {
    return {
      id: 'sound', skill: 'listening', label: 'CONTRAÇÃO NO ÁUDIO', spotlight: contraction,
      hint: `Na próxima escuta, tente captar “${contraction}” como um bloco só, sem separar cada palavra.`
    };
  }

  if (QUESTION_START_RE.test(english) && words.length >= 2) {
    const count = Math.min(3, words.length - (words.length > 4 ? 1 : 0));
    const spotlight = words.slice(0, Math.max(2, count)).join(' ');
    return {
      id: 'frame', skill, label: 'COMEÇO DA PERGUNTA', spotlight,
      hint: listening
        ? `Ouça primeiro o bloco “${spotlight}”. Ele revela que tipo de pergunta está vindo.`
        : `Recupere “${spotlight}” como um bloco. Depois complete a ideia sem traduzir palavra por palavra.`
    };
  }

  const slot = patternSlotFocus(phrase);
  if (slot) {
    const hintById = {
      verb: listening ? `Na próxima escuta, procure o verbo “${slot.spotlight}”; ele carrega a ação principal.` : `Fixe o verbo “${slot.spotlight}” dentro do molde antes de completar o restante.`,
      complement: listening ? `Preste atenção ao complemento “${slot.spotlight}”; é ele que diferencia esta frase de outras parecidas.` : `O molde já está aí. Agora prenda o complemento “${slot.spotlight}” como um bloco.`,
      ending: listening ? `O começo é previsível; concentre o ouvido no final “${slot.spotlight}”.` : `Tente recuperar o final “${slot.spotlight}” logo depois do molde inicial.`,
      frame: listening ? `Procure ouvir o molde “${slot.spotlight}” inteiro antes de buscar os detalhes.` : `Comece pelo molde “${slot.spotlight}”; ele abre o caminho para o resto da frase.`
    };
    return { ...slot, skill, hint: hintById[slot.id] };
  }

  if (words.length >= 6) {
    const spotlight = words.slice(-2).join(' ');
    return {
      id: 'ending', skill, label: 'FINAL DA FRASE', spotlight,
      hint: listening
        ? `Você já tem a ideia geral. Na próxima escuta, concentre-se no final “${spotlight}”.`
        : `Na próxima recuperação, tente puxar primeiro o final “${spotlight}” depois de lembrar a ideia.`
    };
  }

  const spotlight = fallbackKeyword(words);
  return {
    id: listening ? 'sound' : 'keyword', skill, label: listening ? 'PALAVRA-CHAVE NO ÁUDIO' : 'PALAVRA-CHAVE', spotlight,
    hint: listening
      ? `Tente reconhecer “${spotlight}” no áudio; essa palavra ajuda a reconstruir a mensagem inteira.`
      : `Use “${spotlight}” como âncora e reconstrua a frase inteira ao redor dela.`
  };
}


function selfReportedNearMissFocus(phrase, skill = 'production', part = 'auto') {
  const english = String(phrase?.english || '').trim();
  const words = englishWords(english);
  const listening = skill === 'listening';
  const suggested = nearMissFocus(phrase, skill);
  if (!words.length || part === 'auto') return { ...suggested, source: 'auto' };

  if (part === 'start') {
    const spotlight = words.slice(0, Math.min(words.length, words.length >= 5 ? 3 : 2)).join(' ');
    return {
      id: 'start', skill, source: 'self-report', label: listening ? 'COMEÇO DO ÁUDIO' : 'COMEÇO DA FRASE', spotlight,
      hint: listening
        ? `Na próxima escuta, agarre primeiro “${spotlight}”. Depois deixe o restante da frase completar a ideia.`
        : `Comece por “${spotlight}” como um bloco. Depois reconstrua o restante sem traduzir palavra por palavra.`
    };
  }

  if (part === 'middle') {
    const contraction = english.match(CONTRACTION_RE)?.[0] || null;
    const slot = patternSlotFocus(phrase);
    const middleIndex = Math.max(0, Math.floor((words.length - 1) / 2));
    const spotlight = listening && contraction
      ? contraction
      : (slot?.spotlight || words.slice(middleIndex, Math.min(words.length, middleIndex + (words.length > 5 ? 2 : 1))).join(' ') || fallbackKeyword(words));
    return {
      id: listening ? 'sound' : 'middle', skill, source: 'self-report', label: listening ? 'SOM / PALAVRA-CHAVE' : 'MEIO / PALAVRA-CHAVE', spotlight,
      hint: listening
        ? `Concentre o ouvido em “${spotlight}”. Reconhecer esse pedaço deve destravar o restante da mensagem.`
        : `Prenda “${spotlight}” como a âncora do meio da frase e reconstrua o que vem antes e depois.`
    };
  }

  if (part === 'end') {
    const spotlight = words.slice(Math.max(0, words.length - (words.length > 5 ? 2 : 1))).join(' ');
    return {
      id: 'ending', skill, source: 'self-report', label: listening ? 'FINAL DO ÁUDIO' : 'FINAL DA FRASE', spotlight,
      hint: listening
        ? `Você já pegou boa parte. Na próxima escuta, espere pelo final “${spotlight}”.`
        : `Recupere o final “${spotlight}” logo depois do começo; isso fecha a frase sem precisar traduzir.`
    };
  }

  return { ...suggested, source: 'auto' };
}

function recurringNearMissPattern(progress, skill = null) {
  if (!progress || typeof progress !== 'object') return null;
  const recovery = progress.nearMissRecoveryStreak && typeof progress.nearMissRecoveryStreak === 'object'
    ? progress.nearMissRecoveryStreak
    : {};
  const history = Array.isArray(progress.nearMissHistory)
    ? progress.nearMissHistory.filter(event => event && event.id && (!skill || event.skill === skill)).slice(-8)
    : [];

  const grouped = new Map();
  history.forEach((event, index) => {
    const eventSkill = event.skill || 'production';
    if (Number(recovery[eventSkill] || 0) >= 2) return;
    const key = `${eventSkill}:${event.id}`;
    const current = grouped.get(key) || { count: 0, score: 0, latest: event };
    current.count += 1;
    current.score += 1 + (index + 1) / Math.max(8, history.length * 2);
    current.latest = event;
    grouped.set(key, current);
  });

  const candidates = [...grouped.values()].filter(item => item.count >= 2).sort((a,b) => b.score - a.score || b.count - a.count);
  if (candidates.length) {
    const best = candidates[0];
    return { ...best.latest, recurring: true, recurrenceCount: best.count };
  }

  // Compatibilidade com saves V0.8.1/V0.8.2, que tinham contagens mas não histórico.
  const last = progress.lastNearMissFocus;
  if (last?.id && (!skill || last.skill === skill) && Number(recovery[last.skill || 'production'] || 0) < 2) {
    const count = Number(progress.nearMissFocusCounts?.[last.id] || 0);
    if (count >= 2) return { ...last, recurring: true, recurrenceCount: count };
  }
  return null;
}

function saveNearMissFocus(state, phraseId, focus, now = new Date()) {
  if (!focus?.id || !phraseId) return null;
  const current = getPhraseProgress(state, phraseId);
  const counts = current.nearMissFocusCounts && typeof current.nearMissFocusCounts === 'object'
    ? { ...current.nearMissFocusCounts }
    : {};
  counts[focus.id] = Number(counts[focus.id] || 0) + 1;
  const stored = { ...focus, at: now.toISOString() };
  const history = [...(Array.isArray(current.nearMissHistory) ? current.nearMissHistory : []), stored].slice(-12);
  const recovery = current.nearMissRecoveryStreak && typeof current.nearMissRecoveryStreak === 'object'
    ? { ...current.nearMissRecoveryStreak }
    : {};
  recovery[stored.skill || 'production'] = 0;
  state.phraseProgress[phraseId] = {
    ...current,
    nearMissFocusCounts: counts,
    nearMissHistory: history,
    nearMissRecoveryStreak: recovery,
    lastNearMissFocus: stored,
    lastOutcome: 'almost'
  };
  return stored;
}

const VALID_ROUTES = new Set(['home','journey','library','stats','achievements','lesson','account']);
function normalizeRoute(value) {
  const candidate = String(value || '').replace('#/', '') || 'home';
  return VALID_ROUTES.has(candidate) ? candidate : 'home';
}

let recallRevealed = false;
let listeningRevealed = false;
let variationRevealed = false;

function restoreTransientSessionUi(session = state.activeSession) {
  feedback = null;
  recallRevealed = false;
  listeningRevealed = false;
  variationRevealed = false;
  if (!session?.items?.length || session.index >= session.items.length) return;
  const item = session.items[session.index];
  const pf = session.pendingFeedback;
  if (pf && pf.index === session.index && Array.isArray(item?.choices)) {
    feedback = { correct: Boolean(pf.correct), choice: pf.choice };
  }
  const rs = session.revealState;
  if (rs && rs.index === session.index && rs.type === item?.type) {
    recallRevealed = item.type === 'recall';
    listeningRevealed = item.type === 'listening-recall';
    variationRevealed = item.type === 'variation';
  }
}

// Um único listener delegado evita botões "mortos" após re-renderizações da sessão.
document.addEventListener('click', handleDocumentClick);

function emergencyPersist(reason) {
  if (!state || typeof state !== 'object') return;
  try { saveState(state, reason); } catch { /* melhor esforço durante saída */ }
}

// pagehide cobre fechamento, refresh e navegação no mobile melhor que beforeunload.
window.addEventListener('pagehide', () => emergencyPersist('pagehide'));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') emergencyPersist('visibility-hidden');
});

window.addEventListener('hashchange', () => {
  route = normalizeRoute(location.hash);
  restoreTransientSessionUi();
  render();
});

function navigate(to) {
  const target = normalizeRoute(to);
  if (!state?.onboardingDone && target !== 'home' && target !== 'account') {
    route = 'home';
    if (location.hash !== '#/home') location.hash = '#/home';
    else render();
    return;
  }
  if (location.hash === `#/${target}`) {
    route = target;
    render();
  } else location.hash = `#/${target}`;
}

function render() {
  const app = document.querySelector('#app');
  if (!app) return;
  try {
    app.innerHTML = shell(content());
    afterRender();
  } catch (error) {
    console.error('Falha ao renderizar:', error);
    interactionError = 'Ocorreu um erro ao montar esta etapa. A sessão foi recuperada com segurança.';
    state.activeSession = null;
    saveState(state);
    route = 'home';
    app.innerHTML = shell(homeView());
  }
}
