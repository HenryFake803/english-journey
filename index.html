<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="English Journey — curso de inglês por frases com revisão adaptativa, listening e produção." />
<meta name="application-name" content="English Journey" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="English Journey" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />


<title>English Journey — V1.2.0</title>
<style>
:root {
  --bg: #08101d;
  --panel: #101b2b;
  --panel-2: #152338;
  --soft: #1b2b43;
  --text: #f7f9fc;
  --muted: #8fa0b8;
  --accent: #71e7a5;
  --accent-2: #b7ffcd;
  --danger: #ff8080;
  --yellow: #ffd778;
  --line: rgba(255,255,255,.08);
  --shadow: 0 22px 50px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: dark; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: radial-gradient(circle at top, #10223b 0, var(--bg) 34rem); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
button, .choice { -webkit-tap-highlight-color: transparent; }
.app-shell { max-width: 740px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 0 18px calc(108px + env(safe-area-inset-bottom)); }
.lesson-shell { max-width: 760px; padding-bottom: 22px; }
.content { min-height: calc(100vh - 110px); min-height: calc(100dvh - 110px); }
.topbar { height: 82px; display: flex; align-items: center; gap: 11px; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #08101d; background: var(--accent); font-weight: 900; }
.topbar div:nth-child(2) { display: grid; }
.topbar b { letter-spacing: -.02em; }
.topbar span { color: var(--muted); font-size: 12px; }
.xp-pill { margin-left: auto; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 800; }
.hero { background: linear-gradient(145deg, rgba(113,231,165,.13), rgba(16,27,43,.78)); border: 1px solid rgba(113,231,165,.18); padding: 27px 23px 23px; border-radius: 28px; box-shadow: var(--shadow); }
.eyebrow, .hero small, .section-head small, .focus-card small, .learn-card > small, .exercise-card > small, .summary > small, .journey-copy > small, .pattern-card small { color: var(--accent); font-size: 11px; letter-spacing: .14em; font-weight: 900; }
h1, h2, h3, p { margin-top: 0; }
.hero h1 { font-size: clamp(27px, 8vw, 44px); line-height: 1.04; letter-spacing: -.045em; margin: 10px 0 12px; }
.hero > p { color: #b4c0d0; font-size: 15px; line-height: 1.55; }
.session-grid { display: grid; grid-template-columns: repeat(3,1fr); margin: 24px 0 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.session-grid div { display: grid; text-align: center; padding: 16px 7px; border-right: 1px solid var(--line); }
.session-grid div:last-child { border-right: 0; }
.session-grid strong { font-size: 23px; }
.session-grid span { font-size: 11px; color: var(--muted); margin-top: 3px; }
.primary, .secondary { border: 0; border-radius: 15px; padding: 13px 18px; font-weight: 900; cursor: pointer; }
.primary { background: var(--accent); color: #07140d; }
.primary.big { width: 100%; min-height: 54px; letter-spacing: .03em; }
.secondary { background: var(--panel-2); border: 1px solid var(--line); }
.secondary.danger { margin-top: 28px; color: var(--danger); width: 100%; }
.streak-card, .focus-card, .pattern-card { background: rgba(16,27,43,.82); border: 1px solid var(--line); border-radius: 20px; padding: 17px; margin-top: 15px; }
.streak-card { display: flex; align-items: center; gap: 12px; }
.streak-icon, .focus-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--panel-2); display: grid; place-items: center; font-size: 20px; }
.streak-card > div:nth-child(2) { display: grid; min-width: 115px; }
.streak-card span { color: var(--muted); font-size: 12px; }
.mini-days { margin-left: auto; display: flex; gap: 5px; }
.mini-days i { width: 9px; height: 22px; border-radius: 99px; background: var(--soft); }
.mini-days i.done { background: var(--accent); }
.section-head { margin-top: 29px; display: flex; align-items: end; justify-content: space-between; gap: 14px; }
.section-head h2 { margin: 5px 0 0; font-size: 21px; }
.section-head button { border: 0; background: transparent; color: var(--accent); font-size: 12px; }
.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 13px; }
.metric { padding: 15px 8px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 17px; display: grid; }
.metric strong { font-size: 21px; }
.metric span { color: var(--muted); font-size: 11px; margin-top: 3px; }
.focus-card { display: flex; gap: 13px; align-items: flex-start; margin-top: 18px; }
.focus-card h3 { font-size: 16px; margin: 4px 0 4px; }
.focus-card p { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0; }
.bottom-nav { position: fixed; bottom: calc(13px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(calc(100% - 28px), 704px); padding: 8px; display: grid; grid-template-columns: repeat(4,1fr); background: rgba(12,21,34,.94); backdrop-filter: blur(15px); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); z-index: 20; }
.nav-item { display: grid; justify-items: center; gap: 2px; background: transparent; border: 0; color: var(--muted); padding: 7px 4px; cursor: pointer; border-radius: 15px; }
.nav-item span { font-size: 18px; }
.nav-item small { font-size: 10px; }
.nav-item.active { color: var(--accent); background: rgba(113,231,165,.08); }
.page-header { min-height: 105px; display: flex; align-items: center; gap: 14px; padding-top: 8px; }
.page-header > button { border: 1px solid var(--line); width: 42px; height: 42px; border-radius: 14px; background: var(--panel); font-size: 26px; }
.page-header h1 { margin: 0 0 4px; font-size: 27px; }
.page-header p { color: var(--muted); font-size: 12px; margin: 0; line-height: 1.35; }
.journey-list { display: grid; gap: 11px; }
.journey-card { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 21px; padding: 17px; }
.journey-card.locked { opacity: .5; }
.day-node { width: 45px; height: 45px; border-radius: 15px; background: var(--soft); flex: 0 0 auto; display: grid; place-items: center; font-weight: 900; }
.day-node.complete { background: var(--accent); color: #07140d; }
.day-node.current { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
.journey-copy { min-width: 0; flex: 1; }
.journey-copy h3 { margin: 3px 0 4px; font-size: 15px; }
.journey-copy p, .progress-label { color: var(--muted); font-size: 11px; }
.journey-copy p { margin-bottom: 10px; }
.progress-track { height: 5px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress-track i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.progress-label { display: block; margin-top: 5px; }
.ghost.round { border: 1px solid var(--line); background: var(--panel-2); width: 38px; height: 38px; border-radius: 999px; font-size: 23px; }
.pattern-card { display: flex; gap: 13px; line-height: 1.45; }
.pattern-card > span { color: var(--yellow); font-size: 23px; }
.pattern-card h3 { font-size: 14px; margin: 4px 0 0; font-weight: 650; }
.pattern-card p { color: var(--muted); font-size: 12px; margin: 5px 0 0; }
.phrase-list { display: grid; gap: 9px; }
.phrase-row { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.phrase-row > div { flex: 1; }
.phrase-row h3 { font-size: 15px; margin: 0 0 3px; }
.phrase-row p { color: #bac6d5; font-size: 12px; margin: 0 0 6px; }
.phrase-row small { color: var(--muted); font-size: 10px; }
.audio-mini { width: 40px; height: 40px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel-2); }
.status-dot { width: 9px; height: 9px; border-radius: 99px; background: #637086; }
.status-dot.learning { background: var(--yellow); }
.status-dot.strong { background: var(--accent); }
.stats-hero { padding: 28px; background: linear-gradient(145deg, rgba(113,231,165,.14), var(--panel)); border: 1px solid rgba(113,231,165,.16); border-radius: 27px; display: grid; justify-items: center; }
.stats-hero strong { font-size: 57px; letter-spacing: -.06em; }
.stats-hero span { font-weight: 800; }
.stats-hero small { color: var(--muted); margin-top: 5px; }
.skill-section { margin-top: 16px; display: grid; gap: 10px; }
.skill-row { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.skill-row h3 { margin: 0 0 3px; font-size: 14px; }
.skill-row p { margin: 0; color: var(--muted); font-size: 10px; }
.skill-row strong { align-self: center; }
.progress-track.full { grid-column: 1 / -1; }
.lesson-top { height: 72px; display: grid; grid-template-columns: 44px 1fr 43px; align-items: center; gap: 12px; }
.lesson-top button { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 24px; }
.lesson-top > span { color: var(--muted); font-size: 11px; text-align: right; }
.lesson-progress { height: 7px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.lesson-progress i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .25s ease; }
.lesson-card-wrap { min-height: calc(100vh - 99px); min-height: calc(100dvh - 99px); display: grid; align-items: center; padding-bottom: 95px; }
.learn-card, .exercise-card { width: 100%; text-align: center; }
.learn-card .audio-main { width: 72px; height: 72px; border: 1px solid rgba(113,231,165,.24); background: rgba(113,231,165,.09); border-radius: 24px; margin: 22px auto 19px; font-size: 27px; }
.learn-card h1 { font-size: clamp(32px, 9vw, 56px); letter-spacing: -.05em; margin-bottom: 9px; }
.learn-card h2 { color: #bac7d7; font-size: 18px; font-weight: 550; }
.context-box { text-align: left; padding: 15px; border-radius: 17px; background: var(--panel); border: 1px solid var(--line); margin: 25px 0 10px; }
.context-box span { color: var(--accent); font-size: 10px; font-weight: 900; text-transform: uppercase; }
.context-box p { margin: 5px 0 0; color: #c2cddd; font-size: 13px; line-height: 1.45; }
.pattern-chip { display: inline-flex; color: var(--yellow); background: rgba(255,215,120,.08); border: 1px solid rgba(255,215,120,.12); border-radius: 999px; padding: 8px 12px; font-size: 11px; margin: 0 0 26px; }
.exercise-card > h2 { font-size: 18px; margin: 7px 0 31px; color: #d3dbe7; }
.prompt-main { font-size: clamp(30px, 8vw, 51px); font-weight: 850; letter-spacing: -.045em; line-height: 1.08; margin: 0 0 32px; }
.prompt-main.pt { font-size: clamp(26px, 7vw, 42px); }
.context-large { padding: 23px; background: var(--panel); border: 1px solid var(--line); border-radius: 23px; font-size: 18px; font-weight: 700; line-height: 1.45; margin-bottom: 25px; }
.listen-button { display: grid; justify-items: center; width: 100%; max-width: 360px; margin: 0 auto 27px; background: linear-gradient(145deg, rgba(113,231,165,.15), var(--panel)); border: 1px solid rgba(113,231,165,.2); border-radius: 24px; padding: 24px; }
.listen-button span { font-size: 31px; }
.listen-button b { margin-top: 8px; }
.listen-button small { color: var(--muted); margin-top: 3px; }
.choices { display: grid; gap: 9px; }
.choice { min-height: 58px; text-align: left; padding: 10px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; gap: 11px; line-height: 1.3; }
.choice span { width: 29px; height: 29px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 900; }
.choice.correct-choice { border-color: rgba(113,231,165,.48); background: rgba(113,231,165,.1); }
.choice.wrong-choice { border-color: rgba(255,128,128,.45); background: rgba(255,128,128,.08); }
.feedback { position: fixed; z-index: 10; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 760px); background: #0d1929; border-top: 1px solid var(--line); padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 15px; box-shadow: 0 -20px 40px rgba(0,0,0,.28); }
.feedback div { flex: 1; }
.feedback strong { font-size: 17px; color: var(--accent); }
.feedback.wrong strong { color: var(--danger); }
.feedback p { color: #b8c5d5; font-size: 11px; margin: 3px 0 0; }
.feedback button { min-width: 120px; }
.summary { padding: 55px 0 30px; text-align: center; }
.summary-badge { width: 74px; height: 74px; border-radius: 24px; margin: 0 auto 18px; display: grid; place-items: center; background: var(--accent); color: #07140d; font-size: 32px; font-weight: 900; }
.summary h1 { font-size: 33px; margin: 6px 0 10px; }
.summary > p { max-width: 530px; margin: 0 auto; color: var(--muted); line-height: 1.55; font-size: 14px; }
.summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin: 25px 0; }
.summary .pattern-card { text-align: left; margin-bottom: 20px; }
.empty { min-height: 70vh; display: grid; align-content: center; justify-items: center; text-align: center; }
.empty > div { font-size: 40px; color: var(--accent); }
.empty h2 { margin: 10px 0 6px; }
.empty p { color: var(--muted); max-width: 420px; }
@media (min-width: 650px) {
  .app-shell { padding-left: 24px; padding-right: 24px; }
  .hero { padding: 36px 34px 30px; }
  .lesson-card-wrap { padding-left: 30px; padding-right: 30px; }
}

/* V0.2 — 40 frases/dia */
.daily-goal { margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line); display: grid; gap: 7px; }
.daily-goal > span { font-size: 12px; font-weight: 800; color: #dfe8f5; }
.daily-goal > div { height: 6px; border-radius: 999px; overflow: hidden; background: var(--soft); }
.daily-goal > div i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
.daily-goal small { color: var(--muted); font-size: 11px; line-height: 1.45; }
.checkpoint-card { width: 100%; max-width: 580px; margin: 0 auto; text-align: center; background: linear-gradient(145deg, rgba(113,231,165,.10), rgba(16,27,43,.95)); border: 1px solid rgba(113,231,165,.18); border-radius: 28px; padding: 34px 24px 24px; box-shadow: var(--shadow); }
.checkpoint-card > small { color: var(--accent); font-size: 11px; letter-spacing: .14em; font-weight: 900; }
.checkpoint-card h1 { margin: 10px 0 10px; font-size: clamp(29px, 8vw, 42px); letter-spacing: -.045em; line-height: 1.05; }
.checkpoint-card p { color: var(--muted); line-height: 1.55; max-width: 440px; margin: 0 auto 22px; }
.checkpoint-icon { width: 68px; height: 68px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 22px; background: var(--accent); color: #07140d; font-size: 24px; font-weight: 950; }
.block-dots { display: flex; justify-content: center; gap: 7px; margin: 2px 0 22px; }
.block-dots i { width: 38px; height: 6px; border-radius: 999px; background: var(--soft); }
.block-dots i.done { background: var(--accent); }

/* V0.4 — calendário real + revisão adaptativa */
.calendar-banner { display:flex; gap:13px; align-items:flex-start; margin:0 0 14px; padding:16px; border-radius:20px; background:rgba(255,215,120,.08); border:1px solid rgba(255,215,120,.16); }
.calendar-banner > div:first-child { width:44px; height:44px; flex:0 0 auto; display:grid; place-items:center; border-radius:14px; background:rgba(255,215,120,.12); font-size:20px; }
.calendar-banner small { color:var(--yellow); font-size:10px; letter-spacing:.13em; font-weight:900; }
.calendar-banner h3 { margin:4px 0 4px; font-size:16px; }
.calendar-banner p { margin:0; color:var(--muted); font-size:12px; line-height:1.45; }
.calendar-banner.recovery { background:rgba(255,128,128,.07); border-color:rgba(255,128,128,.18); }
.calendar-banner.recovery small { color:#ffadad; }
.calendar-banner.calm { background:rgba(113,231,165,.07); border-color:rgba(113,231,165,.15); }
.calendar-banner.calm small { color:var(--accent); }
.calendar-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:13px; }
.calendar-stats > div { display:grid; gap:5px; padding:14px 10px; background:var(--panel); border:1px solid var(--line); border-radius:17px; text-align:center; }
.calendar-stats small { color:var(--muted); font-size:9px; letter-spacing:.08em; font-weight:800; }
.calendar-stats strong { font-size:13px; }
@media (max-width:430px) { .calendar-stats { grid-template-columns:1fr; } }

/* V0.4.1 — proteção de interação nos controles da lição */
.learn-card .primary.big, .checkpoint-card .primary.big { position: relative; z-index: 3; pointer-events: auto; touch-action: manipulation; }
.lesson-card-wrap button { touch-action: manipulation; }

/* V0.4.2 — transição inequívoca entre apresentação e prática */
.lesson-card-wrap > article { animation: lessonCardIn .18s ease-out; }
.exercise-card > small { letter-spacing: .08em; }
@keyframes lessonCardIn { from { opacity:.35; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* V0.4.3 — compatibilidade de armazenamento e estabilidade */
.storage-banner { display:flex; gap:12px; align-items:center; margin:0 0 14px; padding:13px 15px; border-radius:18px; background:rgba(113,231,165,.055); border:1px solid rgba(113,231,165,.12); }
.storage-banner > div:first-child { width:36px; height:36px; flex:0 0 auto; display:grid; place-items:center; border-radius:12px; background:rgba(113,231,165,.1); color:var(--accent); }
.storage-banner small { display:block; color:var(--accent); font-size:9px; letter-spacing:.1em; font-weight:900; }
.storage-banner p { margin:3px 0 0; color:var(--muted); font-size:11px; line-height:1.4; }
button:disabled { cursor:default; }
.lesson-card-wrap .primary.big:active, .feedback .primary:active { transform:scale(.99); }

/* V0.5 — frases difíceis e recuperação sem loop */
.hard-focus-card { display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:center; margin-top:16px; padding:16px; border-radius:20px; background:rgba(255,128,128,.065); border:1px solid rgba(255,128,128,.16); }
.hard-focus-icon { width:44px; height:44px; display:grid; place-items:center; border-radius:14px; background:rgba(255,128,128,.12); color:#ffadad; font-size:20px; font-weight:900; }
.hard-focus-card small { color:#ffadad; font-size:9px; letter-spacing:.11em; font-weight:900; }
.hard-focus-card h3 { margin:3px 0 3px; font-size:15px; }
.hard-focus-card p { margin:0; color:var(--muted); font-size:11px; line-height:1.4; }
.hard-focus-card .ghost { min-width:86px; }
.phrase-row.hard { border-color:rgba(255,128,128,.2); background:linear-gradient(110deg, rgba(255,128,128,.045), var(--panel)); }
.status-dot.hard { background:#ff8f8f; box-shadow:0 0 0 4px rgba(255,128,128,.08); }
.recovery-card { width:100%; max-width:600px; margin:0 auto; text-align:center; }
.recovery-card > small { color:#ffadad; font-size:10px; letter-spacing:.12em; font-weight:900; }
.recovery-symbol { width:66px; height:66px; margin:18px auto; display:grid; place-items:center; border-radius:21px; background:rgba(255,128,128,.1); border:1px solid rgba(255,128,128,.18); color:#ffadad; font-size:29px; font-weight:900; }
.recovery-card h1 { font-size:clamp(31px,8vw,52px); letter-spacing:-.045em; margin:0 0 7px; }
.recovery-card h2 { color:#bac7d7; font-size:18px; font-weight:550; margin:0 0 16px; }
.listen-button.compact { max-width:280px; padding:14px 18px; margin-bottom:14px; grid-template-columns:auto 1fr; justify-items:start; align-items:center; column-gap:10px; }
.listen-button.compact span { grid-row:1; font-size:23px; }
.listen-button.compact b { grid-row:1; margin:0; font-size:12px; }
.recovery-summary { margin:-8px auto 20px; max-width:520px; padding:12px 14px; border-radius:15px; background:rgba(255,215,120,.07); border:1px solid rgba(255,215,120,.12); color:#d6c68f !important; font-size:11px !important; }
@media (max-width:520px) {
  .hard-focus-card { grid-template-columns:auto 1fr; }
  .hard-focus-card .ghost { grid-column:1 / -1; width:100%; }
}
.stats-row.wide { grid-template-columns:repeat(4,1fr); }
@media (max-width:560px) { .stats-row.wide { grid-template-columns:repeat(2,1fr); } }

/* V0.6 — jornada de 30 dias */
.course-overview { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px; margin:0 0 20px; background:linear-gradient(145deg, rgba(113,231,165,.12), var(--panel)); border:1px solid rgba(113,231,165,.18); border-radius:24px; }
.course-overview small, .phase-head small { color:var(--accent); font-weight:900; letter-spacing:.1em; font-size:9px; }
.course-overview h2 { margin:5px 0 3px; font-size:22px; }
.course-overview p { margin:0; color:var(--muted); font-size:12px; }
.course-ring { width:68px; height:68px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; background:var(--soft); border:6px solid rgba(113,231,165,.35); }

/* V0.6.9 — polimento de produto e ritmo da sessão */
.today-card { margin:0 0 14px; padding:28px 24px 22px; border-radius:28px; background:linear-gradient(150deg, rgba(113,231,165,.13), rgba(16,27,43,.96) 46%, var(--panel)); border:1px solid rgba(113,231,165,.18); box-shadow:var(--shadow); }
.today-card-head > div { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.today-card-head small { color:var(--accent); font-size:10px; letter-spacing:.13em; font-weight:900; }
.today-card-head span { color:#d9e4ef; font-size:11px; font-weight:800; }
.today-card h1 { margin:10px 0 8px; font-size:clamp(32px,7vw,48px); letter-spacing:-.05em; line-height:1.02; }
.today-card > p { max-width:570px; margin:0; color:#b9c7d7; line-height:1.5; font-size:13px; }
.today-plan { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 14px; }
.today-plan span { display:inline-flex; align-items:baseline; gap:5px; padding:8px 11px; border-radius:999px; background:rgba(255,255,255,.045); border:1px solid var(--line); color:var(--muted); font-size:10px; }
.today-plan b { color:#eef6ff; font-size:14px; }
.today-cta { margin-top:2px; }
.today-progress { display:grid; gap:7px; margin-top:17px; padding-top:15px; border-top:1px solid var(--line); }
.today-progress > div:first-child { display:flex; justify-content:space-between; align-items:center; color:#dce6f0; font-size:11px; font-weight:800; }
.today-progress > div:first-child b { color:var(--accent); }
.today-progress small { color:var(--muted); font-size:10px; line-height:1.4; }
.home-pulse { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 12px; }
.home-pulse > div { min-width:0; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:8px; align-items:center; padding:12px 13px; border-radius:17px; background:var(--panel); border:1px solid var(--line); }
.home-pulse span { grid-row:1 / 3; font-size:18px; }
.home-pulse strong { font-size:17px; line-height:1; }
.home-pulse small { color:var(--muted); font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.home-focus-card { display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:center; padding:16px; border-radius:20px; background:var(--panel); border:1px solid var(--line); }
.home-focus-icon { width:44px; height:44px; display:grid; place-items:center; border-radius:14px; background:rgba(113,231,165,.08); color:var(--accent); font-size:20px; font-weight:900; }
.home-focus-card small { color:var(--accent); font-size:9px; letter-spacing:.11em; font-weight:900; }
.home-focus-card h3 { margin:4px 0 3px; font-size:15px; }
.home-focus-card p { margin:0; color:var(--muted); font-size:11px; line-height:1.45; }
.lesson-top { grid-template-columns:44px 1fr auto; }
.lesson-right { min-width:52px; display:grid; justify-items:end; gap:4px; }
.lesson-right > span { color:var(--muted); font-size:10px; }
.lesson-streak { display:inline-flex; align-items:center; padding:4px 7px; border-radius:999px; background:rgba(255,215,120,.09); border:1px solid rgba(255,215,120,.16); color:var(--yellow); font-size:10px; animation:streakPulse .22s ease-out; }
.checkpoint-status { display:inline-flex; margin:0 auto 14px; padding:6px 9px; border-radius:999px; background:rgba(113,231,165,.08); border:1px solid rgba(113,231,165,.15); color:var(--accent); font-size:9px; letter-spacing:.09em; font-weight:900; }
.checkpoint-card.block-complete { background:linear-gradient(145deg, rgba(113,231,165,.13), rgba(16,27,43,.96)); }
.feedback { animation:feedbackRise .18s ease-out; }
.feedback-icon { width:42px; height:42px; flex:0 0 auto !important; display:grid; place-items:center; border-radius:14px; background:rgba(113,231,165,.11); color:var(--accent); font-size:20px; font-weight:950; animation:feedbackPop .2s ease-out; }
.feedback.wrong .feedback-icon { background:rgba(255,128,128,.09); color:#ffadad; }
.feedback strong { font-size:16px; }
.session-reward-row { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:-13px 0 22px; }
.session-reward-row span { padding:7px 10px; border-radius:999px; background:rgba(255,255,255,.035); border:1px solid var(--line); color:#c7d4e2; font-size:10px; font-weight:800; }
@keyframes feedbackRise { from { transform:translate(-50%, 10px); opacity:.4; } to { transform:translate(-50%,0); opacity:1; } }
@keyframes feedbackPop { 0% { transform:scale(.76); } 70% { transform:scale(1.08); } 100% { transform:scale(1); } }
@keyframes streakPulse { 0% { transform:scale(.86); } 100% { transform:scale(1); } }
@media (max-width:540px) {
  .today-card { padding:23px 18px 19px; border-radius:24px; }
  .today-card-head > div { align-items:flex-start; }
  .today-card h1 { font-size:34px; }
  .home-pulse > div { grid-template-columns:1fr; grid-template-rows:auto auto auto; justify-items:center; text-align:center; gap:2px; padding:11px 5px; }
  .home-pulse span { grid-row:auto; font-size:16px; }
  .home-pulse strong { font-size:16px; }
  .home-pulse small { width:100%; }
  .home-focus-card { grid-template-columns:auto 1fr; }
  .home-focus-card .ghost { grid-column:1 / -1; width:100%; }
  .feedback { gap:10px; padding-left:14px; padding-right:14px; }
  .feedback-icon { width:36px; height:36px; border-radius:12px; font-size:17px; }
  .feedback button { min-width:105px; }
}
@media (prefers-reduced-motion: reduce) {
  .feedback, .feedback-icon, .lesson-streak { animation:none !important; }
}
.ghost { min-height:40px; padding:9px 13px; border-radius:13px; border:1px solid var(--line); background:rgba(255,255,255,.035); color:#d8e4ef; font-size:10px; font-weight:900; letter-spacing:.04em; cursor:pointer; }
.ghost:hover { border-color:rgba(113,231,165,.28); background:rgba(113,231,165,.065); color:var(--accent); }

/* V0.7.0 — progressão por marcos e conquistas de aprendizado */

.achievement-unlock-banner small, .milestone-strip small, .achievement-overview small, .achievement-hero small, .next-achievement-card small, .achievement-card small { color:var(--yellow); font-size:9px; letter-spacing:.11em; font-weight:900; }

.milestone-strip > span { width:41px; height:41px; display:grid; place-items:center; border-radius:13px; background:rgba(255,215,120,.08); color:var(--yellow); font-size:18px; }

.achievement-overview { margin:14px 0; padding:18px; border-radius:21px; background:var(--panel); border:1px solid var(--line); }
.achievement-overview-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }

.achievement-overview-head p { margin:0; color:var(--muted); font-size:10px; line-height:1.45; max-width:510px; }
.achievement-overview-head > strong { flex:0 0 auto; font-size:24px; color:var(--yellow); }
.achievement-next { display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:center; margin:15px 0 12px; padding:13px; border-radius:16px; background:rgba(255,215,120,.045); border:1px solid rgba(255,215,120,.10); }

.achievement-hero > div:first-child > strong { display:block; margin:6px 0 -3px; font-size:46px; letter-spacing:-.05em; }

.achievement-hero-ring { width:82px; height:82px; flex:0 0 auto; display:grid; place-items:center; border-radius:50%; border:7px solid rgba(255,215,120,.24); background:rgba(255,215,120,.045); }

.next-achievement-card { display:grid; grid-template-columns:auto 1fr; gap:13px; margin:14px 0 6px; padding:17px; border-radius:20px; background:var(--panel); border:1px solid var(--line); }

/* V0.7.1 — jornada por fases e sensação de avanço */
.journey-overview { margin-bottom: 13px; }
.phase-map { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:0 0 22px; }
.phase-map-step { min-width:0; padding:10px 7px; border-radius:15px; border:1px solid var(--line); background:rgba(16,27,43,.72); display:grid; justify-items:center; text-align:center; gap:6px; }
.phase-map-step > span { width:27px; height:27px; display:grid; place-items:center; border-radius:9px; background:var(--soft); color:var(--muted); font-size:10px; font-weight:900; }
.phase-map-step > div { min-width:0; display:grid; gap:2px; }
.phase-map-step small { color:var(--muted); font-size:7px; letter-spacing:.08em; font-weight:900; }
.phase-map-step b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:9px; }
.phase-map-step.complete { border-color:rgba(113,231,165,.14); background:rgba(113,231,165,.045); }
.phase-map-step.complete > span { background:rgba(113,231,165,.16); color:var(--accent); }
.phase-map-step.current { border-color:rgba(113,231,165,.34); background:linear-gradient(145deg,rgba(113,231,165,.1),rgba(16,27,43,.8)); box-shadow:0 12px 30px rgba(0,0,0,.14); }
.phase-map-step.current > span { background:var(--accent); color:#07140d; }
.phase-map-step.current b { color:var(--accent-2); }
.phase-map-step.future { opacity:.48; }

.phase-list { gap:18px; }
.journey-phase { position:relative; gap:12px; padding:18px; border:1px solid var(--line); border-radius:25px; background:rgba(16,27,43,.58); overflow:hidden; }
.journey-phase.current { border-color:rgba(113,231,165,.27); background:linear-gradient(155deg,rgba(113,231,165,.075),rgba(16,27,43,.7) 38%); box-shadow:0 18px 40px rgba(0,0,0,.15); }
.journey-phase.complete { background:rgba(16,27,43,.45); }
.journey-phase.future { opacity:.66; }
.phase-identity { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:13px; }
.phase-symbol { width:44px; height:44px; display:grid; place-items:center; border-radius:14px; background:var(--soft); color:var(--muted); font-size:18px; font-weight:900; }
.journey-phase.current .phase-symbol { background:rgba(113,231,165,.13); color:var(--accent); box-shadow:inset 0 0 0 1px rgba(113,231,165,.18); }
.journey-phase.complete .phase-symbol { background:var(--accent); color:#07140d; }
.phase-identity-copy { min-width:0; }
.phase-identity-copy small { color:var(--accent); font-size:8px; letter-spacing:.11em; font-weight:900; }
.phase-identity-copy h2 { margin:4px 0 2px; font-size:19px; }
.phase-identity-copy p { margin:0; color:var(--muted); font-size:10px; line-height:1.4; }
.phase-status { display:grid; justify-items:end; gap:2px; text-align:right; }
.phase-status strong { font-size:16px; }
.phase-status span { color:var(--muted); font-size:8px; white-space:nowrap; }
.phase-purpose { display:grid; grid-template-columns:1fr 1.25fr; gap:8px; }
.phase-purpose > div { padding:11px 12px; border-radius:15px; background:rgba(255,255,255,.022); border:1px solid rgba(255,255,255,.055); }
.phase-purpose small { display:block; margin-bottom:5px; color:#b6c4d5; font-size:7px; letter-spacing:.1em; font-weight:900; }
.phase-purpose p { margin:0; color:var(--muted); font-size:9px; line-height:1.45; }
.journey-phase.current .phase-purpose > div:last-child { background:rgba(113,231,165,.045); border-color:rgba(113,231,165,.1); }
.phase-progress-track { height:4px; border-radius:99px; overflow:hidden; background:var(--soft); }
.phase-progress-track i { display:block; height:100%; border-radius:inherit; background:var(--accent); }
.journey-phase.future .phase-progress-track i { background:#64758b; }
.journey-phase .journey-list { gap:8px; }
.journey-phase .journey-card { padding:13px 14px; border-radius:17px; background:rgba(8,16,29,.32); }
.journey-card.active-day { border-color:rgba(113,231,165,.26); background:rgba(113,231,165,.045); }
.journey-day-meta { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.journey-day-meta > small { color:var(--accent); font-size:8px; letter-spacing:.1em; font-weight:900; }
.journey-day-meta > span { color:var(--muted); font-size:7px; letter-spacing:.08em; font-weight:900; }
.journey-card.active-day .journey-day-meta > span { color:var(--accent); }

for (const day of curriculum) {
  for (const phrase of day.phrases) {
    const revised = TRANSLATION_REVISIONS[phrase.id];
    if (!revised || revised === phrase.portuguese) continue;
    const previous = phrase.portuguese;
    phrase.portuguese = revised;
    if (typeof phrase.context === 'string' && phrase.context.includes(previous)) {
      phrase.context = phrase.context.replace(previous, revised);
    }
  }
}

function p(id, english, portuguese, context, category, pattern) {
  return { id, english, portuguese, situation: context, context, category, pattern, contextQuality: 'specific', locale: 'en-US' };
}

const allPhrases = curriculum.flatMap(day =>
  day.phrases.map((phrase, index) => ({
    ...phrase,
    dayId: day.id,
    block: Math.floor(index / 10) + 1
  }))
);

const phraseById = Object.fromEntries(allPhrases.map(item => [item.id, item]));


function releaseIntegrityCheck() {
  const issues = [];
  if (curriculum.length !== 30) issues.push(`dias:${curriculum.length}`);
  for (const day of curriculum) {
    if (!Array.isArray(day?.phrases) || day.phrases.length !== 40) issues.push(`dia-${day?.id || '?'}:${day?.phrases?.length || 0}`);
  }
  if (allPhrases.length !== 1200) issues.push(`frases:${allPhrases.length}`);
  const ids = new Set(allPhrases.map(item => item.id));
  const english = new Set(allPhrases.map(item => String(item.english || '').trim().toLowerCase()));
  if (ids.size !== allPhrases.length) issues.push('ids-duplicados');
  if (english.size !== allPhrases.length) issues.push('ingles-duplicado');
  if (Object.keys(phraseById).length !== allPhrases.length) issues.push('indice-de-frases');
  return { ok: issues.length === 0, issues };
}

const RELEASE_INTEGRITY = releaseIntegrityCheck();

  return data?.envelope || envelope;
}

async function updateCloudEnvelope(envelope, expectedRevision) {
  const row = cloudRowFromEnvelope(envelope, cloudRuntime.user.id);
  const { data, error } = await cloudRuntime.client
    .from(CLOUD_TABLE)
    .update(row)
    .eq('user_id', cloudRuntime.user.id)
    .eq('revision', Number(expectedRevision || 0))
    .select('revision,envelope')
    .maybeSingle();
  if (error) throw error;
  return data?.envelope || null;
}

function applyRemoteEnvelope(envelope, reason = 'cloud-restore') {
  const restored = stateFromSyncEnvelope(envelope);
  if (!restored) throw new Error('Não foi possível validar o progresso da nuvem.');
  if (hasMeaningfulProgress(state)) saveProgressCheckpoint('before-cloud-restore', state);
  restored.syncMeta.ownerUserId = cloudRuntime.user?.id || null;
  state = restored;
  restoreTransientSessionUi();
  saveState(state, reason);
  cloudRuntime.conflict = null;
  cloudRuntime.remoteEnvelope = envelope;
  cloudRuntime.status = 'synced';
  cloudRuntime.error = null;
  return state;
}

function forceLocalRevisionAgainst(remoteEnvelope) {
  const remoteRevision = Number(remoteEnvelope?.revision || 0);
  const meta = state.syncMeta = sanitizeSyncMeta(state.syncMeta, state._persistedAt);
  meta.revision = Math.max(Number(meta.revision || 0), remoteRevision) + 1;
  meta.updatedAt = new Date().toISOString();
  meta.lastMutationAt = meta.updatedAt;
  meta.lastMutationReason = 'conflict-use-local';
  meta.lastModifiedByDeviceId = CURRENT_DEVICE_ID;
  meta.lastSyncedRevision = remoteRevision;
  meta.dirty = true;
  meta.status = 'pending';
  meta.fingerprint = syncFingerprint(state);
}

async function pushLocalToCloud({ force = false, skipInitialPrompt = false } = {}) {
  if (!cloudRuntime.client || !cloudRuntime.user?.id) return false;
  if (navigator.onLine === false) { setCloudRuntimeStatus('offline'); return false; }
  if (cloudOwnerConflict() && !force) {
    cloudRuntime.conflict = { type: 'foreign-local', remote: await fetchCloudEnvelope() };
    safeCloudRender();
    return false;
  }

  cloudRuntime.status = 'syncing';
  cloudRuntime.error = null;
  safeCloudRender();
  let remote = await fetchCloudEnvelope();

  if (!remote) {
    if (hasMeaningfulProgress(state) && !skipInitialPrompt && !force) {
      cloudRuntime.conflict = { type: 'initial-upload', remote: null };
      cloudRuntime.status = 'pending';
      safeCloudRender();
      return false;
    }
    bindStateToCloudUser(cloudRuntime.user);
    let envelope = createSyncEnvelope(state);
    try {
      await insertCloudEnvelope(envelope);
    } catch (error) {
      // Outro aparelho pode ter criado a linha entre o SELECT e o INSERT.
      remote = await fetchCloudEnvelope();
      if (!remote) throw error;
      return reconcileWithCloud('insert-race');
    }
    markSyncAccepted(state, envelope.revision);
    state.syncMeta.ownerUserId = cloudRuntime.user.id;
    saveState(state, 'sync-ack');
    cloudRuntime.remoteEnvelope = envelope;
    saveProgressCheckpoint('cloud-synced', state);
    cloudRuntime.status = 'synced';
    cloudRuntime.conflict = null;
    safeCloudRender();
    return true;
  }

  if (force) {
    bindStateToCloudUser(cloudRuntime.user);
    forceLocalRevisionAgainst(remote);
  }

  const local = createSyncEnvelope(state);
  const relation = compareSyncEnvelopes(local, remote);
  if (!force && relation === 'equal') {
    bindStateToCloudUser(cloudRuntime.user);
    markSyncAccepted(state, remote.revision);
    saveState(state, 'sync-ack');
    cloudRuntime.remoteEnvelope = remote;
    cloudRuntime.status = 'synced';
    cloudRuntime.conflict = null;
    safeCloudRender();
    return true;
  }
  if (!force && relation !== 'local-newer') {
    cloudRuntime.conflict = { type: relation, remote };
    cloudRuntime.remoteEnvelope = remote;
    cloudRuntime.status = 'pending';
    safeCloudRender();
    return false;
  }

  const expected = Number(remote.revision || 0);
  const uploaded = await updateCloudEnvelope(createSyncEnvelope(state), expected);
  if (!uploaded) {
    const newest = await fetchCloudEnvelope();
    cloudRuntime.conflict = { type: 'conflict-race', remote: newest };
    cloudRuntime.remoteEnvelope = newest;
    cloudRuntime.status = 'pending';
    safeCloudRender();
    return false;
  }
  markSyncAccepted(state, state.syncMeta.revision);
  state.syncMeta.ownerUserId = cloudRuntime.user.id;
  saveState(state, 'sync-ack');
  saveProgressCheckpoint('cloud-synced', state);
  cloudRuntime.status = 'synced';
  cloudRuntime.conflict = null;
  cloudRuntime.remoteEnvelope = uploaded;
  safeCloudRender();
  return true;
}

async function reconcileWithCloud(trigger = 'manual') {
  if (cloudRuntime.reconcilePromise) return cloudRuntime.reconcilePromise;
  cloudRuntime.reconcilePromise = (async () => {
    if (!cloudRuntime.client || !cloudRuntime.user?.id) return false;
    if (navigator.onLine === false) { setCloudRuntimeStatus('offline'); return false; }
    cloudRuntime.suspendSync = true;
    try {
      cloudRuntime.status = 'syncing';
      cloudRuntime.error = null;
      safeCloudRender();
      const remote = await fetchCloudEnvelope();
      cloudRuntime.remoteEnvelope = remote;
      const local = createSyncEnvelope(state);

      if (cloudOwnerConflict()) {
        cloudRuntime.conflict = { type: 'foreign-local', remote };
        cloudRuntime.status = 'pending';
        return false;
      }

      if (!remote) {
        if (hasMeaningfulProgress(state) || Number(local.revision || 0) > 0) {
          cloudRuntime.conflict = { type: 'initial-upload', remote: null };
          cloudRuntime.status = 'pending';
          return false;
        }
        bindStateToCloudUser(cloudRuntime.user);
        return await pushLocalToCloud({ skipInitialPrompt: true });
      }

      if (!hasMeaningfulProgress(state) && Number(local.revision || 0) === 0) {
        applyRemoteEnvelope(remote, 'cloud-first-device');
        return true;
      }

      const relation = compareSyncEnvelopes(local, remote);
      if (relation === 'equal') {
        bindStateToCloudUser(cloudRuntime.user);
        markSyncAccepted(state, remote.revision);
        saveState(state, 'sync-ack');
        cloudRuntime.conflict = null;
        cloudRuntime.status = 'synced';
        return true;
      }
      if (relation === 'remote-newer') {
        const restoredRemote = stateFromSyncEnvelope(remote);
        if (restoredRemote && progressWouldRegress(restoredRemote, state)) {
          cloudRuntime.conflict = { type: 'remote-regression', remote };
          cloudRuntime.status = 'pending';
          return false;
        }
        applyRemoteEnvelope(remote, 'cloud-newer');
        return true;
      }
      if (relation === 'local-newer') {
        return await pushLocalToCloud({ skipInitialPrompt: true });
      }

      cloudRuntime.conflict = { type: relation, remote };
      cloudRuntime.status = 'pending';
      return false;
    } catch (error) {
      setCloudRuntimeStatus(navigator.onLine === false ? 'offline' : 'error', error);
      return false;
    } finally {
      cloudRuntime.suspendSync = false;
      cloudRuntime.reconcilePromise = null;
      safeCloudRender();
    }
  })();
  return cloudRuntime.reconcilePromise;
}

function scheduleCloudSync(reason = 'local-change') {
  if (!cloudRuntime.configured || !cloudRuntime.initialized || !cloudRuntime.user || cloudRuntime.suspendSync) return;
  if (['sync-ack','cloud-restore','cloud-first-device','cloud-newer','account-bind','cloud-status'].includes(reason)) return;
  if (cloudRuntime.conflict) return;
  if (navigator.onLine === false) { cloudRuntime.status = 'offline'; return; }
  clearTimeout(cloudRuntime.syncTimer);
  cloudRuntime.status = 'pending';
  cloudRuntime.syncTimer = setTimeout(() => reconcileWithCloud(`auto:${reason}`), 850);
}

async function initializeCloud() {
  cloudRuntime.configured = cloudConfigured();
  if (!cloudRuntime.configured) {
    cloudRuntime.status = 'unconfigured';
    cloudRuntime.initialized = true;
    safeCloudRender();
    return;
  }
  if (!globalThis.supabase?.createClient) {
    cloudRuntime.status = 'error';
    cloudRuntime.error = 'A biblioteca de sincronização não pôde ser carregada.';
    cloudRuntime.initialized = true;
    safeCloudRender();
    return;
  }
  try {
    cloudRuntime.client = globalThis.supabase.createClient(CLOUD_CONFIG.url, CLOUD_CONFIG.publishableKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const { data, error } = await cloudRuntime.client.auth.getSession();
    if (error) throw error;
    cloudRuntime.initialized = true;
    await applyCloudSession(data?.session || null, 'INITIAL_SESSION');
    const { data: subscriptionData } = cloudRuntime.client.auth.onAuthStateChange((event, session) => {
      setTimeout(() => applyCloudSession(session, event), 0);
    });
    cloudRuntime.authSubscription = subscriptionData?.subscription || null;
  } catch (error) {
    cloudRuntime.initialized = true;
    setCloudRuntimeStatus('error', error);
  }
}

async function applyCloudSession(session, event = 'AUTH') {
  const previousUserId = cloudRuntime.user?.id || null;
  cloudRuntime.session = session || null;
  cloudRuntime.user = session?.user || null;
  cloudRuntime.message = null;
  cloudRuntime.error = null;
  cloudRuntime.conflict = null;
  if (!cloudRuntime.user) {
    cloudRuntime.status = 'signed-out';
    safeCloudRender();
    return;
  }
  cloudRuntime.status = navigator.onLine === false ? 'offline' : 'pending';
  safeCloudRender();
  if (navigator.onLine !== false && (event !== 'TOKEN_REFRESHED' || previousUserId !== cloudRuntime.user.id)) {
    await reconcileWithCloud(`auth:${event}`);
  }
}

async function cloudSignIn(email, password) {
  if (!cloudRuntime.client) return;
  cloudRuntime.message = null;
  cloudRuntime.error = null;
  const { data, error } = await cloudRuntime.client.auth.signInWithPassword({ email, password });
  if (error) { cloudRuntime.error = error.message; safeCloudRender(); return; }
  cloudRuntime.message = 'Conta conectada. Comparando seu progresso com a nuvem…';
  await applyCloudSession(data?.session || null, 'SIGNED_IN');
}

async function cloudSignUp(email, password) {
  if (!cloudRuntime.client) return;
  cloudRuntime.message = null;
  cloudRuntime.error = null;
  const options = accountRedirectUrl() ? { emailRedirectTo: accountRedirectUrl() } : undefined;
  const { data, error } = await cloudRuntime.client.auth.signUp({ email, password, ...(options ? { options } : {}) });
  if (error) { cloudRuntime.error = error.message; safeCloudRender(); return; }
  if (data?.session) {
    cloudRuntime.message = 'Conta criada e conectada.';
    await applyCloudSession(data.session, 'SIGNED_IN');
  } else {
    cloudRuntime.message = 'Conta criada. Confira seu e-mail para confirmar o cadastro e depois entre normalmente.';
    safeCloudRender();
  }
}

async function cloudGoogleSignIn() {
  if (!GOOGLE_OAUTH_READY) {
    cloudRuntime.error = 'Google Login ainda não foi ativado no backend.';
    safeCloudRender();
    return;
  }
  if (!cloudRuntime.client || !hostedApp()) return;
  const { error } = await cloudRuntime.client.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: accountRedirectUrl() }
  });
  if (error) { cloudRuntime.error = error.message; safeCloudRender(); }
}

async function cloudSignOut() {
  if (!cloudRuntime.client) return;
  clearTimeout(cloudRuntime.syncTimer);
  const { error } = await cloudRuntime.client.auth.signOut();
  if (error) { cloudRuntime.error = error.message; safeCloudRender(); return; }
  cloudRuntime.session = null;
  cloudRuntime.user = null;
  cloudRuntime.conflict = null;
  cloudRuntime.status = 'signed-out';
  cloudRuntime.message = 'Você saiu da conta. A cópia local do progresso foi mantida neste dispositivo.';
  safeCloudRender();
}

async function cloudUseLocal() {
  if (!cloudRuntime.user) return;
  cloudRuntime.suspendSync = true;
  try {
    state.syncMeta.ownerUserId = cloudRuntime.user.id;
    const remote = cloudRuntime.conflict?.remote || await fetchCloudEnvelope();
    cloudRuntime.conflict = null;
    if (remote) forceLocalRevisionAgainst(remote);
    saveState(state, 'conflict-use-local');
    await pushLocalToCloud({ force: Boolean(remote), skipInitialPrompt: true });
    cloudRuntime.message = 'O progresso deste dispositivo foi salvo na sua conta.';
  } catch (error) {
    setCloudRuntimeStatus('error', error);
  } finally {
    cloudRuntime.suspendSync = false;
    safeCloudRender();
  }
}

async function cloudUseRemote() {
  if (!cloudRuntime.user) return;
  try {
    const remote = cloudRuntime.conflict?.remote || await fetchCloudEnvelope();
    if (!remote) throw new Error('Não há progresso na nuvem para restaurar.');
    applyRemoteEnvelope(remote, 'conflict-use-cloud');
    state.syncMeta.ownerUserId = cloudRuntime.user.id;
    saveState(state, 'sync-ack');
    cloudRuntime.message = 'O progresso da nuvem foi carregado neste dispositivo.';
  } catch (error) {
    setCloudRuntimeStatus('error', error);
  } finally { safeCloudRender(); }
}

window.addEventListener('online', () => {
  if (!cloudRuntime.user) return;
  cloudRuntime.status = 'pending';
  safeCloudRender();
  reconcileWithCloud('back-online');
});
window.addEventListener('offline', () => {
  if (!cloudRuntime.user) return;
  cloudRuntime.status = 'offline';
  if (state?.syncMeta) state.syncMeta.status = 'offline';
  safeCloudRender();
});

function validStoredState(value) {
  return Boolean(value && typeof value === 'object' && !Array.isArray(value)
    && (value.version != null || value.phraseProgress || value.completedDays || value.dailyHistory));
}

function storedStateCandidate(kind, key, label, priority = 0) {
  const raw = safeGet(kind, key);
  if (raw == null) return null;
  const parsed = parseState(raw);
  if (!validStoredState(parsed)) return null;
  const savedAt = parsed._persistedAt && Number.isFinite(new Date(parsed._persistedAt).getTime())
    ? new Date(parsed._persistedAt).getTime()
    : 0;
  return { parsed, label, kind, priority, savedAt };
}

function progressEvidence(value) {
  const safe = value && typeof value === 'object' ? value : {};
  const completedDays = Array.isArray(safe.completedDays) ? safe.completedDays.length : 0;
  const seenPhrases = safe.phraseProgress && typeof safe.phraseProgress === 'object'
    ? Object.values(safe.phraseProgress).filter(progress => progress?.seen).length
    : 0;
  const historyEntries = Array.isArray(safe.dailyHistory) ? safe.dailyHistory.length : 0;
  const xp = Number.isFinite(Number(safe.xp)) ? Math.max(0, Number(safe.xp)) : 0;
  const activeIndex = Number.isFinite(Number(safe.activeSession?.index)) ? Math.max(0, Number(safe.activeSession.index)) : 0;
  return { completedDays, seenPhrases, historyEntries, xp, activeIndex };
}

function progressWouldRegress(candidate, current) {
  if (!hasMeaningfulProgress(current)) return false;
  const incoming = progressEvidence(candidate);
  const existing = progressEvidence(current);
  return incoming.completedDays < existing.completedDays
    || incoming.seenPhrases < existing.seenPhrases
    || incoming.historyEntries < existing.historyEntries
    || incoming.xp < existing.xp;
}

function checkpointReasonLabel(reason) {
  return ({
    'day-complete':'Dia concluído',
    'session-pause':'Sessão pausada',
    'before-cloud-restore':'Antes de carregar a nuvem',
    'manual':'Ponto criado manualmente',
    'history-restore':'Restauração anterior',
    'cloud-synced':'Sincronizado com a nuvem'
  })[reason] || 'Ponto seguro';
}

function readProgressCheckpoints() {
  let best = [];
  for (const kind of ['localStorage','sessionStorage']) {
    try {
      const raw = window[kind]?.getItem(CHECKPOINT_HISTORY_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      if (Array.isArray(parsed) && parsed.length > best.length) best = parsed;
    } catch {}
  }
  return best.filter(entry => entry && typeof entry.id === 'string' && entry.state && typeof entry.state === 'object')
    .sort((a,b) => new Date(b.at || 0) - new Date(a.at || 0))
    .slice(0, CHECKPOINT_HISTORY_LIMIT);
}

function persistProgressCheckpoints(entries) {
  const original = Array.isArray(entries) ? entries.slice(0, CHECKPOINT_HISTORY_LIMIT) : [];
  let any = false;
  for (const kind of ['localStorage','sessionStorage']) {
    let list = [...original];
    while (list.length) {
      try {
        const storage = window[kind];
        if (!storage) break;
        storage.setItem(CHECKPOINT_HISTORY_KEY, JSON.stringify(list));
        any = true;
        break;
      } catch {
        list = list.slice(0, -1);
      }
    }
  }
  return any;
}

function saveProgressCheckpoint(reason = 'manual', target = state) {
  if (!target || typeof target !== 'object' || !hasMeaningfulProgress(target)) return false;
  const history = readProgressCheckpoints();
  const fingerprint = syncFingerprint(target);
  if (history[0]?.fingerprint === fingerprint) return true;
  const payload = syncPayload(target);
  const entry = {
    id: randomId('ej-checkpoint'),
    at: new Date().toISOString(),
    reason,
    appVersion: APP_RELEASE.version,
    fingerprint,
    summary: progressEvidence(payload),
    state: payload
  };
  return persistProgressCheckpoints([entry, ...history]);
}

function restoreProgressCheckpoint(idOrEntry) {
  const entry = idOrEntry && typeof idOrEntry === 'object'
    ? idOrEntry
    : readProgressCheckpoints().find(item => item.id === idOrEntry);
  if (!entry) return false;
  const currentMeta = sanitizeSyncMeta(state?.syncMeta, state?._persistedAt);
  const restored = upgradeState(entry.state, { resetSession: false });
  const now = new Date().toISOString();
  restored.syncMeta = newSyncMeta({
    lineageId: currentMeta.lineageId,
    revision: Math.max(Number(currentMeta.revision || 0), Number(currentMeta.lastSyncedRevision || 0)) + 1,
    updatedAt: now,
    lastMutationAt: now,
    lastMutationReason: 'history-restore',
    lastModifiedByDeviceId: CURRENT_DEVICE_ID,
    lastSyncedRevision: Number(currentMeta.lastSyncedRevision || 0),
    lastSyncedAt: currentMeta.lastSyncedAt || null,
    lastSyncedDeviceId: currentMeta.lastSyncedDeviceId || null,
    ownerUserId: currentMeta.ownerUserId || null,
    dirty: true,
    status: currentMeta.lastSyncedRevision ? 'pending' : 'local-only'
  });
  restored.syncMeta.fingerprint = syncFingerprint(restored);

  for (const kind of ['localStorage','sessionStorage']) {
    safeRemove(kind, KEY);
    safeRemove(kind, BACKUP_KEY);
    safeRemove(kind, COMPLETION_GUARD_KEY);
  }
  clearWindowName();
  state = restored;
  restoreTransientSessionUi();
  saveState(state, 'history-restore');
  persistCompletionGuard(state);
  persistenceRecoveryNotice = 'Um ponto seguro anterior foi restaurado por você.';
  if (cloudRuntime.user) {
    cloudRuntime.message = 'Checkpoint restaurado. A alteração será sincronizada como uma nova revisão.';
    scheduleCloudSync('history-restore');
  }
  return true;
}

function comparePersistenceCandidates(a, b) {
  const ae = progressEvidence(a?.parsed);
  const be = progressEvidence(b?.parsed);
  for (const key of ['completedDays','seenPhrases','historyEntries','xp','activeIndex']) {
    if (ae[key] !== be[key]) return be[key] - ae[key];
  }
  return b.savedAt - a.savedAt || b.priority - a.priority;
}

function loadState() {
  const candidates = [
    storedStateCandidate('localStorage', KEY, 'local', 50),
    storedStateCandidate('sessionStorage', KEY, 'session', 40),
    storedStateCandidate('localStorage', COMPLETION_GUARD_KEY, 'completion-guard-local', 35),
    storedStateCandidate('sessionStorage', COMPLETION_GUARD_KEY, 'completion-guard-session', 30),
    storedStateCandidate('localStorage', BACKUP_KEY, 'backup-local', 20),
    storedStateCandidate('sessionStorage', BACKUP_KEY, 'backup-session', 10)
  ].filter(Boolean);

  const tabState = readWindowName();
  if (validStoredState(tabState)) {
    const savedAt = tabState._persistedAt && Number.isFinite(new Date(tabState._persistedAt).getTime())
      ? new Date(tabState._persistedAt).getTime()
      : 0;
    candidates.push({ parsed: tabState, label: 'tab', kind: 'tab', priority: 5, savedAt });
  }

  if (candidates.length) {
    // Se algum fallback contém um save mais novo (por exemplo, localStorage lotou
    // e a sessão continuou no sessionStorage), retomamos o estado mais recente.
    candidates.sort(comparePersistenceCandidates);
    const chosen = candidates[0];
    const state = upgradeState(chosen.parsed);
    memorySnapshot = clone(state);
    storageMode = chosen.kind === 'localStorage' ? 'local' : chosen.kind === 'sessionStorage' ? 'session' : chosen.kind;
    if (chosen.label.startsWith('backup')) {
      persistenceRecoveryNotice = 'Uma cópia de segurança válida foi usada porque o save principal estava indisponível ou inconsistente.';
      saveState(state, 'backup-recovery');
    } else if (chosen.label.startsWith('completion-guard')) {
      persistenceRecoveryNotice = 'O último ponto de conclusão seguro foi recuperado para impedir perda de progresso.';
      saveState(state, 'completion-guard-recovery');
    } else if (chosen.label === 'session' && candidates.some(c => c.label === 'local' && c.savedAt < chosen.savedAt)) {
      persistenceRecoveryNotice = 'O progresso mais recente foi recuperado do armazenamento temporário porque ele estava à frente da cópia local.';
    }
    return state;
  }

  for (const legacyKey of LEGACY_KEYS) {
    const legacy = safeGet('localStorage', legacyKey) ?? safeGet('sessionStorage', legacyKey);
    const parsed = parseState(legacy);
    if (!validStoredState(parsed)) continue;
    const migrated = upgradeState(parsed, { resetSession: true });
    saveState(migrated, 'legacy-migration');
    return migrated;
  }

  const state = freshState();
  memorySnapshot = clone(state);
  return state;
}

function serializeState(state) {
  try { return JSON.stringify(state); }
  catch { return null; }
}

function rawLooksValid(raw) {
  if (typeof raw !== 'string' || !raw) return false;
  return validStoredState(parseState(raw));
}

function writeWithBackup(kind, state, serialized) {
  const storage = (() => { try { return window[kind]; } catch { return null; } })();
  if (!storage || !serialized) return false;
  try {
    const previous = storage.getItem(KEY);
    if (previous && previous !== serialized && rawLooksValid(previous)) {
      try { storage.setItem(BACKUP_KEY, previous); } catch { /* backup é melhor esforço */ }
    }
    storage.setItem(KEY, serialized);
    const written = storage.getItem(KEY);
    return written === serialized && rawLooksValid(written);
  } catch { return false; }
}

function saveState(state, reason = 'interaction') {
  // A normalização pesada acontece ao carregar. Durante a sessão o estado já é
  // controlado pelo app. A V0.9.8 adiciona timestamp, cópia de segurança e verificação.
  const safe = state && typeof state === 'object' ? state : freshState();
  safe.version = 10;
  safe.contentRevision = CONTENT_REVISION;
  safe.translationRevision = TRANSLATION_REVISION;
  touchSyncMeta(safe, reason);
  safe._persistedAt = new Date().toISOString();
  if (safe.activeSession && typeof safe.activeSession === 'object') {
    safe.activeSession.lastSavedAt = safe._persistedAt;
    safe.activeSession.lastSaveReason = reason;
  }
  memorySnapshot = safe;
  const serialized = serializeState(safe);
  if (!serialized) {
    persistenceSaveFailures++;
    storageMode = 'memory';
    return false;
  }

  if (writeWithBackup('localStorage', safe, serialized)) {
    storageMode = 'local';
    persistenceSaveFailures = 0;
    scheduleCloudSync(reason);
    return true;
  }
  if (writeWithBackup('sessionStorage', safe, serialized)) {
    storageMode = 'session';
    persistenceSaveFailures = 0;
    scheduleCloudSync(reason);
    return true;
  }
  if (writeWindowNameSerialized(serialized)) {
    storageMode = 'tab';
    persistenceSaveFailures = 0;
    scheduleCloudSync(reason);
    return true;
  }

  persistenceSaveFailures++;
  storageMode = 'memory';
  scheduleCloudSync(reason);
  return false;
}

function persistCompletionGuard(target) {
  const serialized = serializeState(target);
  if (!serialized || !rawLooksValid(serialized)) return false;
  let persisted = false;
  for (const kind of ['localStorage','sessionStorage']) {
    try {
      const storage = window[kind];
      if (!storage) continue;
      storage.setItem(COMPLETION_GUARD_KEY, serialized);
      if (storage.getItem(COMPLETION_GUARD_KEY) === serialized) persisted = true;
    } catch {}
  }
  return persisted;
}

function hasPersistedDayCompletion(dayId) {
  if (!Number.isInteger(Number(dayId))) return false;
  const candidates = [
    safeGet('localStorage', KEY), safeGet('sessionStorage', KEY),
    safeGet('localStorage', COMPLETION_GUARD_KEY), safeGet('sessionStorage', COMPLETION_GUARD_KEY),
    safeGet('localStorage', BACKUP_KEY), safeGet('sessionStorage', BACKUP_KEY)
  ];
  return candidates.some(raw => {
    const parsed = parseState(raw);
    return validStoredState(parsed) && Array.isArray(parsed.completedDays) && parsed.completedDays.includes(Number(dayId));
  });
}

function resetState() {
  safeRemove('localStorage', KEY);
  safeRemove('sessionStorage', KEY);

  safeRemove('sessionStorage', COMPLETION_GUARD_KEY);
  safeRemove('localStorage', CHECKPOINT_HISTORY_KEY);
  safeRemove('sessionStorage', CHECKPOINT_HISTORY_KEY);
  for (const legacyKey of LEGACY_KEYS) {
    safeRemove('localStorage', legacyKey);

function upgradeState(raw = {}, options = {}) {
  const base = freshState();
  const incomingContentRevision = Number(raw?.contentRevision || 0);
  const incomingTranslationRevision = Number(raw?.translationRevision || 0);
  const state = { ...base, ...(raw && typeof raw === 'object' ? raw : {}), version: 10, contentRevision: CONTENT_REVISION, translationRevision: TRANSLATION_REVISION };
  state.completedDays = Array.isArray(raw?.completedDays) ? [...new Set(raw.completedDays.filter(value => Number.isInteger(value) && value >= 1 && value <= curriculum.length))].sort((a,b)=>a-b) : [];
  state.phraseProgress = raw?.phraseProgress && typeof raw.phraseProgress === 'object' ? raw.phraseProgress : {};
  state.familyTransfers = raw?.familyTransfers && typeof raw.familyTransfers === 'object' ? raw.familyTransfers : {};
  state.dailyHistory = Array.isArray(raw?.dailyHistory) ? raw.dailyHistory.filter(Boolean).slice(-365) : [];

  const legacyDates = state.dailyHistory.map(x => x?.date).filter(Boolean);
  state.activityDates = [...new Set([...(Array.isArray(raw?.activityDates) ? raw.activityDates : []), ...legacyDates].filter(isDateKey))].sort();
  state.lastStudyDate = isDateKey(raw?.lastStudyDate) ? raw.lastStudyDate : state.activityDates.at(-1) || null;
  state.longestStreak = Number.isFinite(Number(raw?.longestStreak)) ? Number(raw.longestStreak) : 0;
  state.xp = Number.isFinite(Number(raw?.xp)) ? Math.max(0, Number(raw.xp)) : 0;
  state.recentAchievements = Array.isArray(raw?.recentAchievements) ? [...new Set(raw.recentAchievements.filter(value => typeof value === 'string'))].slice(0, 4) : [];
  state.nextSessionBrief = sanitizeNextSessionBrief(raw?.nextSessionBrief);
  // Saves de versões anteriores já pertencem a alguém que passou pelo primeiro uso.
  // Só um estado realmente novo começa com onboarding pendente.
  state.onboardingDone = typeof raw?.onboardingDone === 'boolean' ? raw.onboardingDone : true;
  state.settings = { ...base.settings, ...(raw?.settings || {}) };

  for (const [phraseId, progress] of Object.entries(state.phraseProgress)) {
    if (!phraseById[phraseId] || !progress || typeof progress !== 'object') {
      delete state.phraseProgress[phraseId];
      continue;
    }
    const reviewDays = Array.isArray(progress.reviewDays) ? progress.reviewDays.filter(isDateKey) : [];
    const legacyDay = progress.lastReviewedAt ? dateKeyFromIso(progress.lastReviewedAt) : null;
    state.phraseProgress[phraseId] = {
      ...progress,
      phraseId,
      firstSeenAt: progress.firstSeenAt || (reviewDays[0] ? `${reviewDays[0]}T12:00:00` : progress.lastReviewedAt || null),
      reviewDays: [...new Set([...reviewDays, ...(legacyDay ? [legacyDay] : [])])],
      skillSchedule: progress.skillSchedule && typeof progress.skillSchedule === 'object' ? progress.skillSchedule : null,
      consecutiveMistakes: Number(progress.consecutiveMistakes || 0),
      consecutiveCorrect: Number(progress.consecutiveCorrect || 0),
      recoveryCount: Number(progress.recoveryCount || 0),
      recoverySuccesses: Number(progress.recoverySuccesses || 0),
      lastOutcome: progress.lastOutcome || null,
      hardSince: progress.hardSince || null,
      nearMisses: Number(progress.nearMisses || 0),
      nearMissFocusCounts: progress.nearMissFocusCounts && typeof progress.nearMissFocusCounts === 'object' ? progress.nearMissFocusCounts : {},
      nearMissHistory: Array.isArray(progress.nearMissHistory) ? progress.nearMissHistory.filter(event => event && typeof event === 'object' && event.id).slice(-12) : [],
      nearMissRecoveryStreak: progress.nearMissRecoveryStreak && typeof progress.nearMissRecoveryStreak === 'object' ? progress.nearMissRecoveryStreak : {},
      lastNearMissFocus: progress.lastNearMissFocus && typeof progress.lastNearMissFocus === 'object' ? progress.lastNearMissFocus : null
    };
  }

  // V0.7.5 reescreveu 120 conteúdos mantendo os IDs para preservar a jornada.
  // O dia continua concluído, mas uma frase nova não pode herdar "domínio" da frase antiga.
  const contentWasRevised = incomingContentRevision < CONTENT_REVISION;
  const translationWasRevised = incomingTranslationRevision < TRANSLATION_REVISION;
  if (contentWasRevised) {
    const dueNow = new Date().toISOString();
    for (const [phraseId, progress] of Object.entries(state.phraseProgress)) {
      if (!progress?.seen) continue;
      const revisedInV1 = incomingContentRevision < 1 && CONTENT_REVISED_V1_ID.test(phraseId);
      const revisedInV2 = incomingContentRevision < 2 && CONTENT_REVISED_V2_IDS.has(phraseId);
      if (!revisedInV1 && !revisedInV2) continue;
      state.phraseProgress[phraseId] = resetRevisedPhraseProgress(progress, phraseId, dueNow);
    }
  }

  // Sessões de versões antigas são o ponto mais arriscado de migração. Preservamos
  // todo o progresso, mas reconstruímos a sessão para evitar cursores/itens obsoletos.
  // V0.7.7 alterou somente traduções: domínio continua válido, mas uma sessão
  // antiga pode carregar prompts em português já obsoletos e deve ser reconstruída.
  state.activeSession = options.resetSession || contentWasRevised || translationWasRevised ? null : sanitizeSession(raw?.activeSession);
  state.syncMeta = initializeSyncMeta(state, raw?.syncMeta, raw?._persistedAt);
  return state;
}

function sanitizeNextSessionBrief(brief) {
  if (!brief || typeof brief !== 'object') return null;
  const mode = ['review-first','balanced','advance'].includes(brief.mode) ? brief.mode : null;
  const focusSkill = SKILLS.includes(brief.focusSkill) ? brief.focusSkill : null;
  const sourceDate = isDateKey(brief.sourceDate) ? brief.sourceDate : null;
  if (!mode || !focusSkill || !sourceDate) return null;
  const priorityPhraseIds = Array.isArray(brief.priorityPhraseIds)
    ? [...new Set(brief.priorityPhraseIds.filter(id => typeof id === 'string' && phraseById[id]))].slice(0, 3)
    : [];
  return {

    label: typeof brief.label === 'string' ? brief.label.slice(0, 80) : mode === 'review-first' ? 'COMEÇAR REVISANDO' : mode === 'balanced' ? 'EQUILIBRAR PRIMEIRO' : 'PODE AVANÇAR',
    focusSkill,

    reason: typeof brief.reason === 'string' ? brief.reason.slice(0, 280) : '',
    priorityPhraseIds,

    sourceSessionId: typeof brief.sourceSessionId === 'string' ? brief.sourceSessionId.slice(0, 120) : null,
    createdAt: brief.createdAt && Number.isFinite(new Date(brief.createdAt).getTime()) ? new Date(brief.createdAt).toISOString() : null,

function activeNextSessionBrief(appState, now = new Date()) {
  const brief = sanitizeNextSessionBrief(appState?.nextSessionBrief);
  if (!brief) return null;
  const age = daysBetweenKeys(brief.sourceDate, todayKey(now));
  if (age == null || age < 0 || age > 21) return null;
  return brief;
}

function daysBetweenKeys(fromKey, toKey) {
  if (!isDateKey(fromKey) || !isDateKey(toKey)) return null;
  const utc = key => { const [y,m,d] = key.split('-').map(Number); return Date.UTC(y,m-1,d); };
  return Math.round((utc(toKey) - utc(fromKey)) / DAY_MS);
}

function validSessionItem(item) {
  if (!item || typeof item !== 'object') return false;
  const allowed = new Set(['checkpoint','pattern','variation','intro','recovery','meaning','production','listening','listening-recall','context','cloze','recall']);
  const requiresPhrase = new Set(['intro','recovery','meaning','production','listening','listening-recall','context','cloze','recall']);
  if (!allowed.has(item.type)) return false;
  if (requiresPhrase.has(item.type) && (!item.phraseId || !phraseById[item.phraseId])) return false;
  return true;
}

function sanitizeSession(session) {
  if (!session || typeof session !== 'object') return null;
  if (!Array.isArray(session.items) || !Number.isInteger(session.index)) return null;
  if (!Number.isInteger(session.dayId) || !curriculum.some(day => day.id === session.dayId)) return null;
  if (session.index < 0 || session.index > session.items.length) return null;

  // Um item isolado corrompido não deve apagar a sessão inteira. Removemos apenas
  // itens inválidos e recalculamos o cursor para apontar ao mesmo ponto lógico.
  const items = [];
  let index = 0;
  let removed = 0;
  session.items.forEach((item, rawIndex) => {
    if (!validSessionItem(item)) { removed++; return; }
    if (rawIndex < session.index) index++;
    items.push(item);
  });
  if (!items.length) return null;
  index = Math.min(index, items.length);
  const clean = { ...session, items, index };
  if (removed) clean.recoveredInvalidItems = Number(session.recoveredInvalidItems || 0) + removed;

  const pf = session.pendingFeedback;
  clean.pendingFeedback = pf && Number.isInteger(pf.index) && pf.index === index && Array.isArray(items[index]?.choices)
    && typeof pf.correct === 'boolean' && typeof pf.choice === 'string'
      ? { index, correct: pf.correct, choice: pf.choice, at: pf.at || null }
      : null;

  const rs = session.revealState;
  clean.revealState = rs && Number.isInteger(rs.index) && rs.index === index
    && ['recall','listening-recall','variation'].includes(items[index]?.type)
      ? { index, type: items[index].type }
      : null;

  if (clean.pendingNearMiss && (!items[index] || clean.pendingNearMiss.phraseId !== items[index].phraseId)) clean.pendingNearMiss = null;
  return clean;
}

function readPersistent(key) {
  const local = safeGet('localStorage', key);
  if (local != null) { storageMode = 'local'; return local; }
  const session = safeGet('sessionStorage', key);
  if (session != null) { storageMode = 'session'; return session; }
  return null;
}

function safeGet(kind, key) {
  try {
    const storage = window[kind];
    return storage ? storage.getItem(key) : null;
  } catch { return null; }
}

function safeRemove(kind, key) {
  try {
    const storage = window[kind];
    storage?.removeItem(key);
  } catch { /* armazenamento opcional */ }
}

function writeLocal(key, state) { return safeWrite('localStorage', key, state); }
function writeSession(key, state) { return safeWrite('sessionStorage', key, state); }

function safeWrite(kind, key, state) {
  try {
    const storage = window[kind];
    if (!storage) return false;
    storage.setItem(key, JSON.stringify(state));
    return storage.getItem(key) != null;
  } catch { return false; }
}

function readWindowName() {
  try {
    if (typeof window.name !== 'string' || !window.name.startsWith(WINDOW_NAME_PREFIX)) return null;
    storageMode = 'tab';
    return parseState(window.name.slice(WINDOW_NAME_PREFIX.length));
  } catch { return null; }
}

function writeWindowNameSerialized(serialized) {
  try {
    if (!serialized) return false;
    window.name = WINDOW_NAME_PREFIX + serialized;
    return window.name.startsWith(WINDOW_NAME_PREFIX);
  } catch { return false; }
}

function writeWindowName(state) {
  return writeWindowNameSerialized(serializeState(state));
}

function clearWindowName() {
  try {
    if (typeof window.name === 'string' && window.name.startsWith(WINDOW_NAME_PREFIX)) window.name = '';
  } catch { /* opcional */ }
}

function detectStorageMode() {
  const probe = '__ej_probe__';
  try { localStorage.setItem(probe, '1'); localStorage.removeItem(probe); return storageMode = 'local'; } catch {}
  try { sessionStorage.setItem(probe, '1'); sessionStorage.removeItem(probe); return storageMode = 'session'; } catch {}
  try { void window.name; return storageMode = 'tab'; } catch {}
  return storageMode = 'memory';
}

function parseState(value) {
  try { return typeof value === 'string' ? JSON.parse(value) : value; }
  catch { return null; }
}

function clone(value) {
  try { return JSON.parse(JSON.stringify(value)); }
  catch { return freshState(); }
}

function isDateKey(value) { return /^\d{4}-\d{2}-\d{2}$/.test(String(value || '')); }

function dateKeyFromIso(value) {
  try {
    const d = new Date(value);
    if (!Number.isFinite(d.getTime())) return null;
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  } catch { return null; }
}
