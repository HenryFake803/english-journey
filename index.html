  function syncOnboardingInputs() {
    const map = {
      'ob-emoji': 'emoji', 'ob-title': 'title', 'ob-why': 'why', 'ob-success': 'success',
      'ob-one': 'oneThing', 'ob-milestone': 'milestone',
      'ob-milestone-current': 'milestoneCurrent', 'ob-milestone-target': 'milestoneTarget', 'ob-milestone-unit': 'milestoneUnit'
    };
    Object.entries(map).forEach(([id,key]) => {
      const el = document.getElementById(id);
      if (el) state.onboardingDraft[key] = el.value.trim();
    });
  }

  function bindOnboardingEvents() {
    document.querySelectorAll('[data-ob-frequency]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.onboardingDraft.frequency = btn.dataset.obFrequency;
        saveState();
        renderOnboarding();
      });
    });
    document.querySelectorAll('[data-ob-horizon]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.onboardingDraft.focusHorizonDays = Number(btn.dataset.obHorizon);
        saveState();
        renderOnboarding();
      });
    });
    document.querySelector('[data-action="ob-back"]')?.addEventListener('click', () => {
      syncOnboardingInputs();
      state.onboardingStep = Math.max(0, state.onboardingStep - 1);
      saveState();
      renderOnboarding();
    });
    document.querySelector('[data-action="ob-next"]')?.addEventListener('click', () => {
      syncOnboardingInputs();
      const error = document.getElementById('ob-error');
      const step = state.onboardingStep;
      if (step === 0 && !state.onboardingDraft.title) return showInlineError(error, 'Dê um nome ao objetivo antes de continuar.');
      if (step === 2 && !state.onboardingDraft.oneThing) return showInlineError(error, 'Defina a sua Única Coisa antes de continuar.');
      if (step < 5) {
        state.onboardingStep += 1;
        saveState();
        renderOnboarding();
      } else {
        const now = localDateKey();
        const goal = {
          id: uid(), ...state.onboardingDraft,
          milestoneCurrent: parseOptionalNumber(state.onboardingDraft.milestoneCurrent),
          milestoneTarget: parseOptionalNumber(state.onboardingDraft.milestoneTarget),
          milestoneCompletedAt: null,
          milestoneId: state.onboardingDraft.milestone ? `milestone-${uid()}` : null,
          milestoneStartedAt: state.onboardingDraft.milestone ? now : null,
          createdAt: now, updatedAt: now, focusStartedAt: now,
          focusHorizonDays: null,
          focusCommitmentStartedAt: null,
          focusTargetEndAt: null,
          focusCycleMilestoneStartCurrent: null,
          focusCycleMilestoneId: null,
          focusCycleStartSnapshot: null
        };
        setFocusCommitment(goal, Number(state.onboardingDraft.focusHorizonDays), now);
        if (goal.milestoneTarget && !goal.milestone) {
          goal.milestone = 'Meu marco atual';
        }
        if (goal.milestoneTarget && (goal.milestoneCurrent || 0) >= goal.milestoneTarget) {
          goal.milestoneCompletedAt = now;
          recordMilestoneCompletion(goal, now);
        }
        state.goals = [goal];
        state.activeGoalId = goal.id;
        state.focusSelectionPending = false;
        state.onboardingStep = 0;
        state.onboardingDraft = structuredClone(DEFAULT_STATE.onboardingDraft);
        saveState();
        render();
        showToast('Seu foco principal foi criado.');
      }
    });
  }

  function showInlineError(el, message) {
    if (!el) return;
    el.textContent = message;
    el.hidden = false;
  }

  function bindMainEvents() {
    document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      state.detailGoalId = null;
      render();
    }));

    document.querySelectorAll('[data-journey-month]').forEach(btn => btn.addEventListener('click', () => {
      const direction = btn.dataset.journeyMonth;
      const maxOffset = monthDistanceFromCurrent(monthKeyFromDate(dateFromKey(earliestJourneyDate())));
      if (direction === 'older') journeyMonthOffset = Math.min(maxOffset, journeyMonthOffset + 1);
      if (direction === 'newer') journeyMonthOffset = Math.max(0, journeyMonthOffset - 1);
      render();
    }));

    document.querySelectorAll('[data-journey-filter]').forEach(btn => btn.addEventListener('click', () => {
      state.journeyFilter = btn.dataset.journeyFilter || 'all';
      render();
    }));

    document.querySelectorAll('[data-action]').forEach(el => {
      const action = el.dataset.action;
      if (['open-add','toggle-checkin','open-goal','close-detail','edit-goal','make-main','open-defer-goal','confirm-defer-goal','reactivate-goal','open-complete-goal','delete-goal','close-modal','overlay-close','confirm-focus','open-milestone','open-next-milestone','open-review','open-focus-period','choose-another-focus','open-weekly-focus','open-daily-action','export-backup','open-import-backup','confirm-import-backup','open-rollback-backup','confirm-rollback-backup','open-settings','close-settings','open-reset-data','confirm-reset-data','dismiss-insight','back-focus-ritual','confirm-focus-ritual','install-pwa','apply-pwa-update'].includes(action)) {
        el.addEventListener('click', handleAction);
      }
    });

    document.querySelectorAll('[data-focus-reason]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-focus-reason]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.modal.reason = btn.dataset.focusReason;
        const confirm = document.querySelector('[data-action="confirm-focus"]');
        if (confirm) confirm.disabled = !(state.modal.reason && state.modal.horizonSelected);
      });
    });

    document.querySelectorAll('[data-focus-horizon]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-focus-horizon]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.modal.horizonDays = Number(btn.dataset.focusHorizon);
        state.modal.horizonSelected = true;
        const confirm = document.querySelector('[data-action="confirm-focus"]');
        if (confirm) confirm.disabled = !(state.modal.reason && state.modal.horizonSelected);
      });
    });

    document.querySelectorAll('[data-focus-renew]').forEach(btn => {
      btn.addEventListener('click', () => {
        const goal = goalById(state.modal?.goalId);
        if (!goal) return;
        const horizonDays = Number(btn.dataset.focusRenew);
        const cycle = focusCycleInfo(goal);
        const note = String(document.getElementById('cycle-reflection')?.value || state.modal?.note || '').trim();
        state.modal = {
          type: 'focus-ritual', goalId: goal.id, mode: 'renew', horizonDays,
          outcome: cycle?.due ? 'renewed' : (cycle ? 'redefined' : 'completed'), note,
          returnTo: 'focus-period'
        };
        render();
      });
    });

    document.querySelectorAll('[data-review-decision]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-review-decision]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const decision = btn.dataset.reviewDecision;
        const input = document.getElementById('review-decision');
        if (input) input.value = decision;
        const adjust = document.getElementById('review-adjust');
        if (adjust) adjust.hidden = decision !== 'adjust';
        const submit = document.getElementById('review-submit');
        if (submit) submit.disabled = false;
      });
    });

    document.querySelectorAll('[data-setting-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.preferences.theme = btn.dataset.settingTheme || 'system';
        saveState();
        applyPreferences();
        render();
      });
    });

    document.getElementById('setting-date-format')?.addEventListener('change', event => {
      state.preferences.dateFormat = event.target.value === 'numeric' ? 'numeric' : 'written';
      saveState();
      render();
    });

    document.getElementById('setting-week-start')?.addEventListener('change', event => {
      const oldStart = weekStartKey(localDateKey());
      state.preferences.weekStartsOn = event.target.value === 'sunday' ? 'sunday' : 'monday';
      const newStart = weekStartKey(localDateKey());
      if (oldStart !== newStart) {
        state.goals.forEach(goal => {
          const current = state.weeklyFocuses.find(item => item.goalId === goal.id && item.weekStart === oldStart);
          const collision = state.weeklyFocuses.some(item => item.goalId === goal.id && item.weekStart === newStart);
          if (current && !collision) current.weekStart = newStart;
        });
      }
      saveState();
      render();
      showToast('Início da semana atualizado sem perder o foco atual.');
    });

    document.getElementById('goal-form')?.addEventListener('submit', handleGoalSubmit);
    document.getElementById('goal-completion-form')?.addEventListener('submit', handleGoalCompletionSubmit);
    document.getElementById('milestone-form')?.addEventListener('submit', handleMilestoneSubmit);
    document.getElementById('next-milestone-form')?.addEventListener('submit', handleNextMilestoneSubmit);
    document.getElementById('review-form')?.addEventListener('submit', handleReviewSubmit);
    document.getElementById('weekly-focus-form')?.addEventListener('submit', handleWeeklyFocusSubmit);
    document.getElementById('daily-action-form')?.addEventListener('submit', handleDailyActionSubmit);

    const backupInput = document.getElementById('backup-file-input');
    backupInput?.addEventListener('change', event => {
      const file = event.target.files?.[0] || null;
      event.target.value = '';
      if (file) prepareBackupImport(file);
    });

    const importConfirm = document.getElementById('backup-import-confirm');
    importConfirm?.addEventListener('change', () => {
      const submit = document.getElementById('backup-import-submit');
      if (submit) submit.disabled = !importConfirm.checked;
    });


    const resetConfirm = document.getElementById('reset-data-confirm');
    resetConfirm?.addEventListener('input', () => {
      const submit = document.getElementById('reset-data-submit');
      if (submit) submit.disabled = resetConfirm.value.trim().toUpperCase() !== 'APAGAR';
    });
  }

  function handleAction(event) {
    const target = event.currentTarget;
    const action = target.dataset.action;
    if (action === 'overlay-close' && event.target.closest('[data-sheet]')) return;

    if (action === 'dismiss-insight') {
      const goalId = target.dataset.goalId;
      const type = target.dataset.insightType;
      if (goalId && type) {
        if (!state.insightDismissals || typeof state.insightDismissals !== 'object') state.insightDismissals = {};
        state.insightDismissals[insightKey(goalId, type)] = localDateKey();
        state.insightDismissals[insightKey(goalId, 'all')] = localDateKey();
        saveState();
        render();
        showToast('Insight ocultado por enquanto.');
      }
    } else if (action === 'install-pwa') {
      installPwa();
    } else if (action === 'apply-pwa-update') {
      applyPwaUpdate();
    } else if (action === 'open-settings') {
      state.activeTab = 'settings';
      state.detailGoalId = null;
      render();
    } else if (action === 'close-settings') {
      state.activeTab = 'today';
      render();
    } else if (action === 'open-add') {
      state.modal = { type: 'goal', goalId: null };
      render();
    } else if (action === 'toggle-checkin') {
      const id = target.dataset.goalId;
      const map = checkInMap(id);
      const key = localDateKey();
      map[key] = !map[key];
      if (!map[key]) delete map[key];
      const todayAction = currentDailyAction(id, key);
      if (todayAction) todayAction.completedAt = map[key] ? key : null;
      saveState();
      render();
      showToast(map[key] ? 'Feito. O mais importante de hoje está concluído.' : 'Conclusão de hoje desmarcada.');
    } else if (action === 'open-goal') {
      state.detailGoalId = target.dataset.goalId;
      render();
    } else if (action === 'close-detail') {
      state.detailGoalId = null;
      render();
    } else if (action === 'edit-goal') {
      state.modal = { type: 'goal', goalId: target.dataset.goalId };
      render();
    } else if (action === 'open-defer-goal') {
      state.modal = { type: 'defer-goal', goalId: target.dataset.goalId };
      render();
    } else if (action === 'confirm-defer-goal') {
      const result = deferGoal(target.dataset.goalId);
      if (!result) return;
      state.modal = null;
      state.detailGoalId = null;
      state.activeTab = 'life';
      saveState();
      render();
      showToast(result.wasMain && result.remainingGoals ? 'Objetivo guardado. Escolha conscientemente seu próximo foco.' : 'Objetivo movido para Depois. Nada foi apagado.');
    } else if (action === 'reactivate-goal') {
      const result = reactivateGoal(target.dataset.goalId);
      if (!result) return;
      state.detailGoalId = null;
      state.activeTab = 'life';
      saveState();
      render();
      showToast(result.needsFocus ? 'Objetivo reativado. Escolha conscientemente se ele será seu próximo foco.' : 'Objetivo trazido de volta para Ativos.');
    } else if (action === 'open-complete-goal') {
      state.modal = { type: 'complete-goal', goalId: target.dataset.goalId };
      render();
    } else if (action === 'make-main') {
      state.modal = { type: 'focus', goalId: target.dataset.goalId, reason: '', horizonDays: null, horizonSelected: false };
      render();
    } else if (action === 'open-milestone') {
      state.modal = { type: 'milestone', goalId: target.dataset.goalId };
      render();
    } else if (action === 'open-next-milestone') {
      const goal = goalById(target.dataset.goalId);
      if (goal && milestoneProgress(goal)?.complete) recordMilestoneCompletion(goal, goal.milestoneCompletedAt || localDateKey());
      state.modal = { type: 'next-milestone', goalId: target.dataset.goalId };
      saveState();
      render();
    } else if (action === 'open-review') {
      state.modal = { type: 'review', goalId: target.dataset.goalId };
      render();
    } else if (action === 'open-focus-period') {
      state.modal = { type: 'focus-period', goalId: target.dataset.goalId };
      render();
    } else if (action === 'open-weekly-focus') {
      state.modal = { type: 'weekly-focus', goalId: target.dataset.goalId };
      render();
    } else if (action === 'open-daily-action') {
      state.modal = { type: 'daily-action', goalId: target.dataset.goalId };
      render();
    } else if (action === 'export-backup') {
      exportBackup();
    } else if (action === 'open-import-backup') {
      const input = document.getElementById('backup-file-input');
      if (input) input.click();
    } else if (action === 'confirm-import-backup') {
      const checkbox = document.getElementById('backup-import-confirm');
      if (checkbox?.checked) importPreparedBackup();
    } else if (action === 'open-rollback-backup') {
      state.modal = { type: 'backup-rollback' };
      render();
    } else if (action === 'confirm-rollback-backup') {
      restoreSafetyBackup();
    } else if (action === 'open-reset-data') {
      state.modal = { type: 'reset-data' };
      render();
    } else if (action === 'confirm-reset-data') {
      const input = document.getElementById('reset-data-confirm');
      if (input?.value.trim().toUpperCase() !== 'APAGAR') return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(SAFETY_BACKUP_KEY);
      state = structuredClone(DEFAULT_STATE);
      applyPreferences();
      render();
      showToast('Todos os dados locais foram apagados.');
    } else if (action === 'choose-another-focus') {
      const goal = activeGoal();
      const cycle = goal ? focusCycleInfo(goal) : null;
      if (goal && cycle?.due && goal.focusCommitmentStartedAt) {
        const note = String(document.getElementById('cycle-reflection')?.value || '').trim();
        recordFocusCycle(goal, localDateKey(), 'completed', note);
        setFocusCommitment(goal, 0);
        saveState();
      }
      state.modal = null;
      state.detailGoalId = null;
      state.activeTab = 'life';
      render();
    } else if (action === 'confirm-focus') {
      if (!state.modal?.reason || !state.modal?.horizonSelected) return;
      state.modal = {
        type: 'focus-ritual', goalId: target.dataset.goalId, mode: 'switch',
        reason: state.modal.reason, horizonDays: state.modal.horizonDays, returnTo: 'focus'
      };
      render();
    } else if (action === 'back-focus-ritual') {
      const modal = state.modal || {};
      if (modal.returnTo === 'focus') {
        state.modal = { type: 'focus', goalId: modal.goalId, reason: modal.reason || '', horizonDays: modal.horizonDays, horizonSelected: true };
      } else {
        state.modal = { type: 'focus-period', goalId: modal.goalId, note: modal.note || '' };
      }
      render();
    } else if (action === 'confirm-focus-ritual') {
      const modal = state.modal || {};
      const goal = goalById(modal.goalId);
      if (!goal) return;
      if (modal.mode === 'switch') {
        changeFocus(goal.id, modal.reason || 'Decidi redirecionar meu foco', Number(modal.horizonDays) || 0);
      } else {
        const horizonDays = Number(modal.horizonDays) || 0;
        renewFocusCommitment(goal, horizonDays, modal.outcome || 'renewed', modal.note || '');
        state.modal = null;
        saveState();
        render();
        showToast(horizonDays > 0 ? `Ciclo de ${horizonDays} dias iniciado com intenção.` : 'Foco assumido sem prazo definido.');
      }
    } else if (action === 'delete-goal') {
      const id = target.dataset.goalId;
      const goal = goalById(id);
      if (goal && confirm(`Excluir “${goal.title}”? O histórico de check-ins desse objetivo também será removido.`)) {
        const deletingWasActive = state.activeGoalId === id;
        state.goals = state.goals.filter(g => g.id !== id);
        state.laterGoals = (state.laterGoals || []).filter(g => g.id !== id);
        delete state.checkIns[id];
        state.focusHistory = state.focusHistory.filter(h => h.goalId !== id);
        state.focusCycles = state.focusCycles.filter(h => h.goalId !== id);
        state.milestoneHistory = state.milestoneHistory.filter(h => h.goalId !== id);
        state.reviews = state.reviews.filter(r => r.goalId !== id);
        state.weeklyFocuses = state.weeklyFocuses.filter(r => r.goalId !== id);
        state.dailyActions = state.dailyActions.filter(r => r.goalId !== id);
        if (deletingWasActive) {
          state.activeGoalId = null;
          state.focusSelectionPending = state.goals.length > 0;
        }
        state.detailGoalId = null;
        saveState();
        render();
        showToast('Objetivo excluído.');
      }
    } else if (action === 'close-modal' || action === 'overlay-close') {
      state.modal = null;
      render();
    }
  }

  function deferGoal(goalId, today = localDateKey()) {
    const goal = state.goals.find(item => item.id === goalId);
    if (!goal) return null;
    const wasMain = goal.id === state.activeGoalId;
    if (wasMain) {
      if (goal.focusHorizonDays && goal.focusCommitmentStartedAt) recordFocusCycle(goal, today, 'deferred', 'Movido para Depois');
      state.focusHistory.push({ goalId: goal.id, startedAt: goal.focusStartedAt || goal.createdAt || today, endedAt: today, reason: 'Movido para Depois' });
      state.activeGoalId = null;
    }
    const deferredGoal = {
      ...structuredClone(goal), deferredAt: today, deferredReason: 'Importante, mas não é para agora', updatedAt: today,
      focusStartedAt: null, focusHorizonDays: null, focusCommitmentStartedAt: null, focusTargetEndAt: null,
      focusCycleMilestoneStartCurrent: null, focusCycleMilestoneId: null, focusCycleStartSnapshot: null
    };
    state.goals = state.goals.filter(item => item.id !== goal.id);
    state.laterGoals = [...(state.laterGoals || []), deferredGoal];
    if (wasMain) state.focusSelectionPending = state.goals.length > 0;
    else if (!state.activeGoalId && state.goals.length > 0) state.focusSelectionPending = true;
    return { goal: deferredGoal, wasMain, remainingGoals: state.goals.length };
  }

  function reactivateGoal(goalId, today = localDateKey()) {
    const goal = (state.laterGoals || []).find(item => item.id === goalId);
    if (!goal) return null;
    const activeGoal = {
      ...structuredClone(goal), deferredAt: null, deferredReason: '', reactivatedAt: today, updatedAt: today,
      focusStartedAt: null, focusHorizonDays: null, focusCommitmentStartedAt: null, focusTargetEndAt: null,
      focusCycleMilestoneStartCurrent: null, focusCycleMilestoneId: null, focusCycleStartSnapshot: null
    };
    state.laterGoals = (state.laterGoals || []).filter(item => item.id !== goalId);
    state.goals.push(activeGoal);
    const needsFocus = !state.activeGoalId;
    if (needsFocus) state.focusSelectionPending = true;
    return { goal: activeGoal, needsFocus };
  }

  function completeGoal(goalId, reflection, today = localDateKey()) {
    const goal = state.goals.find(item => item.id === goalId) || (state.laterGoals || []).find(item => item.id === goalId);
    if (!goal) return null;
    const note = String(reflection || '').trim();
    if (!note) return null;

    const progress = milestoneProgress(goal);
    if (progress?.complete) recordMilestoneCompletion(goal, goal.milestoneCompletedAt || today);
    const wasMain = goal.id === state.activeGoalId;
    const completionStats = {
      totalDone: totalDone(goal.id),
      bestStreak: bestStreak(goal.id),
      milestones: completedMilestonesForGoal(goal.id).length,
      reviews: goalReviews(goal.id).length
    };

    if (wasMain) {
      if (goal.focusHorizonDays && goal.focusCommitmentStartedAt) recordFocusCycle(goal, today, 'goal-completed', note);
      state.focusHistory.push({
        goalId: goal.id,
        startedAt: goal.focusStartedAt || goal.createdAt || today,
        endedAt: today,
        reason: 'Objetivo concluído'
      });
      state.activeGoalId = null;
      state.focusSelectionPending = true;
    }

    const completedGoal = {
      ...structuredClone(goal),
      completedAt: today,
      completionReflection: note,
      completionStats,
      focusStartedAt: null,
      focusHorizonDays: null,
      focusCommitmentStartedAt: null,
      focusTargetEndAt: null,
      focusCycleMilestoneStartCurrent: null,
      focusCycleMilestoneId: null,
      focusCycleStartSnapshot: null,
      updatedAt: today
    };
    state.goals = state.goals.filter(item => item.id !== goal.id);
    state.laterGoals = (state.laterGoals || []).filter(item => item.id !== goal.id);
    state.completedGoals = [...(state.completedGoals || []), completedGoal];
    if (!state.goals.length) state.focusSelectionPending = false;
    return { goal: completedGoal, wasMain, remainingGoals: state.goals.length };
  }

  function handleGoalCompletionSubmit(event) {
    event.preventDefault();
    const goalId = event.currentTarget.dataset.goalId;
    const form = new FormData(event.currentTarget);
    const reflection = String(form.get('reflection') || '').trim();
    const error = document.getElementById('goal-completion-error');
    if (!reflection) return showInlineError(error, 'Escreva uma reflexão curta para encerrar este capítulo.');
    const result = completeGoal(goalId, reflection);
    if (!result) return;
    state.modal = null;
    state.detailGoalId = null;
    state.activeTab = 'life';
    saveState();
    render();
    showToast(result.wasMain && result.remainingGoals ? 'Capítulo concluído. Escolha conscientemente seu próximo foco.' : 'Objetivo concluído e preservado na sua Jornada.');
  }

  function handleWeeklyFocusSubmit(event) {
    event.preventDefault();
    const goal = goalById(event.currentTarget.dataset.goalId);
    if (!goal || goal.id !== state.activeGoalId) return;
    const form = new FormData(event.currentTarget);
    const text = String(form.get('text') || '').trim();
    const error = document.getElementById('weekly-focus-error');
    if (!text) return showInlineError(error, 'Escolha uma direção para esta semana.');
    const weekStart = weekStartKey(localDateKey());
    let item = currentWeeklyFocus(goal.id);
    if (item) {
      item.text = text;
      item.updatedAt = localDateKey();
    } else {
      item = { id: `week-${uid()}`, goalId: goal.id, weekStart, text, createdAt: localDateKey(), updatedAt: localDateKey() };
      state.weeklyFocuses.push(item);
    }
    state.modal = null;
    saveState();
    render();
    showToast('Uma direção para a semana. Só uma.');
  }

  function handleDailyActionSubmit(event) {
    event.preventDefault();
    const goal = goalById(event.currentTarget.dataset.goalId);
    if (!goal || goal.id !== state.activeGoalId) return;
    const form = new FormData(event.currentTarget);
    const text = String(form.get('text') || '').trim();
    const error = document.getElementById('daily-action-error');
    if (!text) return showInlineError(error, 'Defina uma ação concreta para hoje.');
    const date = localDateKey();
    let item = currentDailyAction(goal.id, date);
    if (item) {
      item.text = text;
      item.updatedAt = date;
    } else {
      item = { id: `day-${uid()}`, goalId: goal.id, date, text, createdAt: date, updatedAt: date, completedAt: isDone(goal.id, date) ? date : null };
      state.dailyActions.push(item);
    }
    state.modal = null;
    saveState();
    render();
    showToast('Ação de hoje definida. Agora basta fazê-la.');
  }

  function handleGoalSubmit(event) {
    event.preventDefault();
    const form = new FormData(event.currentTarget);
    const title = String(form.get('title') || '').trim();
    const oneThing = String(form.get('oneThing') || '').trim();
    const milestone = String(form.get('milestone') || '').trim();
    const currentRaw = String(form.get('milestoneCurrent') || '').trim();
    const targetRaw = String(form.get('milestoneTarget') || '').trim();
    const milestoneCurrent = parseOptionalNumber(currentRaw);
    const milestoneTarget = parseOptionalNumber(targetRaw);
    const error = document.getElementById('goal-form-error');
    if (!title || !oneThing) return showInlineError(error, 'Preencha o objetivo e a sua Única Coisa.');
    if (currentRaw && milestoneCurrent === null) return showInlineError(error, 'O progresso atual precisa ser um número válido.');
    if (targetRaw && (milestoneTarget === null || milestoneTarget <= 0)) return showInlineError(error, 'A meta do marco precisa ser maior que zero.');
    if ((currentRaw || targetRaw) && !milestone) return showInlineError(error, 'Dê um nome ao marco antes de adicionar uma medida.');

    const data = {
      emoji: String(form.get('emoji') || '🎯').trim() || '🎯',
      title,
      why: String(form.get('why') || '').trim(),
      success: String(form.get('success') || '').trim(),
      oneThing,
      milestone,
      milestoneCurrent: milestoneTarget ? (milestoneCurrent ?? 0) : null,
      milestoneTarget: milestoneTarget || null,
      milestoneUnit: String(form.get('milestoneUnit') || '').trim(),
      frequency: String(form.get('frequency') || 'daily')
    };

    const today = localDateKey();
    const id = event.currentTarget.dataset.goalId;
    if (id) {
      const goal = goalById(id);
      const oldProgress = milestoneProgress(goal);
      if (oldProgress?.complete) recordMilestoneCompletion(goal, goal.milestoneCompletedAt || today);
      const milestoneChanged = data.milestone !== goal.milestone || data.milestoneTarget !== goal.milestoneTarget || data.milestoneUnit !== goal.milestoneUnit;
      Object.assign(goal, data, { updatedAt: today });
      if (milestoneChanged) {
        goal.milestoneId = goal.milestone ? `milestone-${uid()}` : null;
        goal.milestoneStartedAt = goal.milestone ? today : null;
        goal.milestoneCompletedAt = null;
      } else if (goal.milestone && !goal.milestoneId) {
        goal.milestoneId = `milestone-${uid()}`;
        goal.milestoneStartedAt = goal.milestoneStartedAt || today;
      }
      const progress = milestoneProgress(goal);
      if (progress?.complete && !goal.milestoneCompletedAt) goal.milestoneCompletedAt = today;
      if (!progress?.complete) goal.milestoneCompletedAt = null;
      if (progress?.complete) recordMilestoneCompletion(goal, goal.milestoneCompletedAt || today);
      state.modal = null;
      saveState();
      render();
      showToast('Objetivo atualizado.');
    } else {
      const goal = { id: uid(), ...data, milestoneCompletedAt: null, milestoneId: data.milestone ? `milestone-${uid()}` : null, milestoneStartedAt: data.milestone ? today : null, createdAt: today, updatedAt: today, focusStartedAt: null, focusHorizonDays: null, focusCommitmentStartedAt: null, focusTargetEndAt: null, focusCycleMilestoneStartCurrent: null, focusCycleMilestoneId: null };
      const progress = milestoneProgress(goal);
      if (progress?.complete) {
        goal.milestoneCompletedAt = today;
        recordMilestoneCompletion(goal, today);
      }
      state.goals.push(goal);
      state.modal = null;
      saveState();
      render();
      showToast('Nova Única Coisa adicionada.');
    }
  }

  function handleMilestoneSubmit(event) {
    event.preventDefault();
    const goal = goalById(event.currentTarget.dataset.goalId);
    if (!goal) return;
    const form = new FormData(event.currentTarget);
    const currentRaw = String(form.get('current') || '').trim();
    const targetRaw = String(form.get('target') || '').trim();
    const current = parseOptionalNumber(currentRaw);
    const target = parseOptionalNumber(targetRaw);
    const error = document.getElementById('milestone-form-error');
    if (currentRaw && current === null) return showInlineError(error, 'Informe um progresso atual válido.');
    if (!targetRaw || target === null || target <= 0) return showInlineError(error, 'Informe uma meta maior que zero.');

    if (!goal.milestoneId) goal.milestoneId = `milestone-${uid()}`;
    if (!goal.milestoneStartedAt) goal.milestoneStartedAt = localDateKey();
    goal.milestoneCurrent = current ?? 0;
    goal.milestoneTarget = target;
    goal.milestoneUnit = String(form.get('unit') || '').trim();
    goal.updatedAt = localDateKey();
    const progress = milestoneProgress(goal);
    if (progress?.complete && !goal.milestoneCompletedAt) goal.milestoneCompletedAt = localDateKey();
    if (!progress?.complete) goal.milestoneCompletedAt = null;
    if (progress?.complete) recordMilestoneCompletion(goal, goal.milestoneCompletedAt || localDateKey());
    state.modal = null;
    saveState();
    render();
    showToast(progress?.complete ? 'Marco alcançado. Ele já entrou na sua Jornada.' : 'Progresso do marco atualizado.');
  }

  function handleNextMilestoneSubmit(event) {
    event.preventDefault();
    const goal = goalById(event.currentTarget.dataset.goalId);
    if (!goal) return;
    const form = new FormData(event.currentTarget);
    const milestone = String(form.get('milestone') || '').trim();
    const currentRaw = String(form.get('current') || '').trim();
    const targetRaw = String(form.get('target') || '').trim();
    const current = parseOptionalNumber(currentRaw);
    const target = parseOptionalNumber(targetRaw);
    const error = document.getElementById('next-milestone-error');
    if (!milestone) return showInlineError(error, 'Dê um nome ao próximo marco.');
    if (currentRaw && current === null) return showInlineError(error, 'Informe um progresso atual válido.');
    if (!targetRaw || target === null || target <= 0) return showInlineError(error, 'Informe uma meta maior que zero.');

    const progress = startNextMilestone(goal, {
      milestone,
      current: current ?? 0,
      target,
      unit: String(form.get('unit') || '').trim()
    });
    state.modal = null;
    saveState();
    render();
    showToast(progress?.complete ? 'Novo marco criado e já alcançado.' : 'Próximo marco definido. Continue uma coisa de cada vez.');
  }
  function handleReviewSubmit(event) {
    event.preventDefault();
    const goal = goalById(event.currentTarget.dataset.goalId);
    if (!goal) return;
    const form = new FormData(event.currentTarget);
    const decision = String(form.get('decision') || '');
    const note = String(form.get('note') || '').trim();
    const error = document.getElementById('review-form-error');
    if (!['keep','adjust','uncertain'].includes(decision)) return showInlineError(error, 'Escolha uma decisão para a próxima semana.');

    const previousOneThing = goal.oneThing;
    let newOneThing = previousOneThing;
    if (decision === 'adjust') {
      newOneThing = String(form.get('newOneThing') || '').trim();
      if (!newOneThing) return showInlineError(error, 'Escreva qual será a nova Única Coisa.');
      goal.oneThing = newOneThing;
      goal.updatedAt = localDateKey();
    }

    const stats = periodStats(goal, 7);
    state.reviews.push({
      id: uid(),
      goalId: goal.id,
      date: localDateKey(),
      decision,
      note,
      previousOneThing,
      newOneThing,
      consistency: stats.percentage,
      done: stats.done,
      expected: stats.expected
    });
    state.modal = null;
    saveState();
    render();
    showToast(decision === 'adjust' ? 'Revisão concluída. Sua Única Coisa foi ajustada.' : 'Revisão concluída. Direção confirmada.');
  }

  function changeFocus(nextGoalId, reason, horizonDays = null) {
    if (nextGoalId === state.activeGoalId) {
      state.modal = null;
      render();
      return;
    }
    const today = localDateKey();
    const current = activeGoal();
    if (current) {
      if (current.focusHorizonDays && current.focusCommitmentStartedAt) recordFocusCycle(current, today, 'switched', reason);
      state.focusHistory.push({
        goalId: current.id,
        startedAt: current.focusStartedAt || current.createdAt || today,
        endedAt: today,
        reason
      });
      current.focusStartedAt = null;
      current.focusHorizonDays = null;
      current.focusCommitmentStartedAt = null;
      current.focusTargetEndAt = null;
      current.focusCycleMilestoneStartCurrent = null;
      current.focusCycleMilestoneId = null;
      current.focusCycleStartSnapshot = null;
    }
    const next = state.goals.find(goal => goal.id === nextGoalId) || null;
    if (next) {
      next.focusStartedAt = today;
      setFocusCommitment(next, horizonDays, today);
      state.activeGoalId = next.id;
      state.focusSelectionPending = false;
    }
    state.modal = null;
    state.detailGoalId = null;
    state.activeTab = 'today';
    saveState();
    render();
    showToast(horizonDays > 0 ? `Novo foco protegido por ${horizonDays} dias.` : 'Seu foco principal mudou conscientemente.');
  }


  if (typeof window !== 'undefined' && window.__UC_TEST_MODE__) {
    window.__UC_TEST__ = {
      getState: () => state,
      saveState,
      milestoneProgress,
      recordMilestoneCompletion,
      startNextMilestone,
      completedMilestonesForGoal,
      journeyEvents,
      renderJourney,
      renderSettings,
      renderToday,
      homeAdaptiveContext,
      adaptiveHomeCue,
      renderLife,
      renderGoalDetail,
      compactRhythmPanel,
      applyPreferences,
      handleNextMilestoneSubmit,
      goalById,
      isCompletedGoal,
      isLaterGoal,
      deferGoal,
      reactivateGoal,
      allGoals,
      handleGoalCompletionSubmit,
      completeGoal,
      focusCycleInfo,
      focusTargetDate,
      periodStatsRange,
      contextualInsight,
      weeklyPlanningPattern,
      monthlySummary,
      monthlySummaryCard,
      focusSegmentsForMonth,
      focusStatsForSegments,
      formatMonthLabel,
      focusCycleSummary,
      setFocusCommitment,
      makeFocusCycleSnapshot,
      focusRitualModal,
      focusModal,
      focusPeriodModal,
      renewFocusCommitment,
      recordFocusCycle,
      changeFocus,
      weekStartKey,
      currentWeeklyFocus,
      currentDailyAction,
      weekRangeLabel,
      handleWeeklyFocusSubmit,
      handleDailyActionSubmit,
      handleAction,
      isDone,
      focusZoomControl,
      normalizeState,
      backupSummary,
      createBackupPayload,
      validateBackupPayload,
      readSafetyBackup,
      importPreparedBackup,
      restoreSafetyBackup,
      isStandaloneMode,
      pwaStatus
    };
  }

  const testMode = typeof window !== 'undefined' && Boolean(window.__UC_TEST_MODE__);

  if (!testMode && window.matchMedia) {
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    const syncSystemTheme = () => {
      if ((state.preferences?.theme || 'system') === 'system') applyPreferences();
    };
    if (themeMedia.addEventListener) themeMedia.addEventListener('change', syncSystemTheme);
    else if (themeMedia.addListener) themeMedia.addListener(syncSystemTheme);
  }

  async function installPwa() {
    if (!deferredInstallPrompt) {
      const status = pwaStatus();
      if (status.key === 'ios') showToast('No Safari, use Compartilhar → Adicionar à Tela de Início.');
      else if (status.key === 'installed') showToast('O Única Coisa já está instalado.');
      else showToast('Use a opção de instalar/adicionar à tela inicial do navegador.');
      return;
    }
    const prompt = deferredInstallPrompt;
    deferredInstallPrompt = null;
    try {
      await prompt.prompt();
      const choice = await prompt.userChoice;
      if (choice?.outcome === 'accepted') showToast('Instalação iniciada.');
      else showToast('Instalação cancelada.');
    } catch {
      showToast('Não foi possível abrir a instalação agora.');
    }
    if (state.activeTab === 'settings') render();
  }

  function markUpdateReady(registration) {
    swRegistration = registration || swRegistration;
    swUpdateReady = Boolean(swRegistration?.waiting);
    if (state.activeTab === 'settings') render();
  }

  async function applyPwaUpdate() {
    if (!swRegistration) {
      showToast('Nenhuma atualização pronta agora.');
      return;
    }
    try {
      if (!swRegistration.waiting) await swRegistration.update();
      const worker = swRegistration.waiting;
      if (!worker) {
        showToast('Você já está com a versão mais recente.');
        return;
      }
      reloadForUpdate = true;
      worker.postMessage({ type: 'SKIP_WAITING' });
      showToast('Aplicando atualização…');
    } catch {
      showToast('Não foi possível aplicar a atualização agora.');
    }
  }

  function setupPwaLifecycle() {
    if (testMode || !('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      if (state.activeTab === 'settings') render();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      if (state.activeTab === 'settings') render();
      showToast('Única Coisa instalado no aparelho.');
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!reloadForUpdate) return;
      reloadForUpdate = false;
      location.reload();
    });

    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        swRegistration = registration;
        if (registration.waiting) markUpdateReady(registration);

        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              markUpdateReady(registration);
            }
          });
        });

        const refreshUpdateState = async () => {
          try {
            await registration.update();
            if (registration.waiting) markUpdateReady(registration);
          } catch {}
        };
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') refreshUpdateState();
        });
      } catch {}
    });
  }

  if (!testMode) setupPwaLifecycle();

  if (!testMode) render();
})();

</script>
